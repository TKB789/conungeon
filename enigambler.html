<style>
/* Layout: a game-show board dropped into a market town. One column: purse strip, then the current place (square, stall, road, duel). Single committed look: stage-blue board, brass numerals. */
:root{
  --night:#0f1638; --panel:#172053; --line:#2c387a; --tile:#1f2f9e; --tile-hi:#2b3fc4;
  --brass:#f3c34b; --brass-ink:#2a1d00; --cream:#f6efdc; --mute:#a7aed6;
  --win:#63d39a; --loss:#ff6b5b;
  --slab:"Alfa Slab One","Rockwell","Georgia",serif;
  --clue:"Libre Baskerville",Georgia,serif;
  --ui:"Figtree","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--night);color:var(--cream)}
body{font-family:var(--ui);font-size:16px;line-height:1.45;padding-inline:16px;padding-block:18px 48px;min-height:100%;
  background-image:radial-gradient(ellipse at 50% 0%,rgba(43,63,196,.45),transparent 65%);background-attachment:fixed}
*{box-sizing:border-box}
#app{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.05}
h1{font-family:var(--slab);font-weight:400;font-size:clamp(48px,13vw,80px);color:var(--brass);text-shadow:0 3px 0 #000a}
h2{font-family:var(--slab);font-weight:400;font-size:28px}
h3{font-size:17px;font-weight:800}
p{margin:0}
.mute{color:var(--mute)}
.lbl{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--mute)}
.money{font-family:var(--slab);color:var(--brass);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.btn{background:var(--brass);color:var(--brass-ink);border:0;border-radius:6px;padding:12px 20px;font-weight:800;font-size:16px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--cream);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px}

/* Purse */
.purse{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.purse .money{font-size:34px;line-height:1;display:flex;align-items:center;gap:8px}
.coin{display:inline-block;width:.72em;height:.72em;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe9a3,var(--brass) 55%,#b8862a);box-shadow:inset 0 0 0 2px #b8862a;vertical-align:-.05em;flex:none}
.tile .coin{width:.6em;height:.6em;margin-right:4px}
.purse .where{text-align:right;min-width:0}
.kit{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;background:var(--night)}
button.chip{border-color:var(--brass);color:var(--brass)}
.flash-loss{animation:fl .5s}.flash-win{animation:fw .5s}
@keyframes fl{30%{background:#5a1f2a}}@keyframes fw{30%{background:#1d4a3a}}

/* Townsfolk */
.folk{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.npc{display:flex;gap:12px;align-items:center;text-align:left;background:var(--night);border:1px solid var(--line);border-radius:8px;padding:12px}
.npc:hover:not(:disabled){border-color:var(--brass)}
.npc:disabled{opacity:.45;cursor:default}
.mono{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--slab);font-size:20px;background:var(--tile);color:var(--brass)}
.npc div{min-width:0;display:flex;flex-direction:column}
.npc small{color:var(--mute);font-size:13px}
.stall{display:grid;gap:8px}
.ware{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ware:last-child{border-bottom:0}
.ware div{min-width:0}

/* Board */
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tile{aspect-ratio:4/3;max-width:100%;background:var(--tile);border:0;border-radius:4px;display:grid;place-items:center;font-family:var(--slab);font-size:clamp(16px,5vw,26px);color:var(--brass);text-shadow:0 2px 0 #0008}
.tile:hover:not(:disabled){background:var(--tile-hi)}
.tile:disabled{background:#141d5a;color:transparent;cursor:default}
.cathead{background:var(--tile);border-radius:4px;padding:10px;text-align:center;font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:14px}

/* Clue */
.clue{background:var(--tile);border-radius:8px;padding:28px 20px;font-family:var(--clue);font-size:clamp(18px,4.6vw,23px);line-height:1.4;text-transform:uppercase;text-align:center;text-shadow:0 2px 0 #0007;text-wrap:balance}
.timer{height:5px;background:var(--night);border-radius:3px;overflow:hidden}
.timer>i{display:block;height:100%;background:var(--brass)}
.answers{display:grid;grid-template-columns:1fr;gap:8px}
.ans{display:flex;gap:10px;align-items:center;text-align:left;background:var(--night);border:1px solid var(--line);border-radius:6px;padding:12px}
.ans:hover:not(:disabled){border-color:var(--brass)}
.ans .k{font-size:12px;color:var(--mute);flex:none}
.ans.right{border-color:var(--win);background:rgba(99,211,154,.14)}
.ans.wrong{border-color:var(--loss);background:rgba(255,107,91,.14)}
.ans.gone{opacity:.25}
.ans:disabled{cursor:default}
.verdict{font-weight:800;font-size:18px}
.good{color:var(--win)}.bad{color:var(--loss)}

/* Map & road */
.districts{display:grid;gap:10px}
.district{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-align:left;background:var(--night);border:1px solid var(--line);border-radius:8px;padding:14px}
.district:hover:not(:disabled){border-color:var(--brass)}
.district:disabled{opacity:.45;cursor:default}
.pips{display:flex;gap:6px;grid-column:1/-1}
.pip{width:22px;height:8px;border-radius:4px;background:var(--line)}
.pip.done{background:var(--win)}.pip.next{background:var(--brass)}.pip.boss{width:34px}
.tag{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.1em}

/* Duel */
.foe{display:flex;gap:14px;align-items:center}
.sigil{flex:none;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-family:var(--slab);font-size:34px;background:radial-gradient(circle,#4a1e2e,var(--night) 72%);border:2px solid var(--loss);color:var(--loss)}
.sigil.boss{border-color:var(--brass);color:var(--brass)}
.foe>div:not(.sigil){flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.bar{height:10px;background:var(--night);border-radius:5px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--loss);transition:width .4s}
.hpline{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:460px){.picks{grid-template-columns:1fr}}
.pick{background:var(--tile);border:0;border-radius:6px;padding:14px 10px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center}
.pick:hover{background:var(--tile-hi)}
.doom{grid-column:1/-1;background:linear-gradient(135deg,#7a1630,#3a0d2a);border:2px solid var(--brass);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;animation:pulse 1.8s ease-in-out infinite}
.doom strong{font-family:var(--slab);font-weight:400;font-size:24px;color:var(--brass);letter-spacing:.02em}
.doom span{font-size:14px}
@keyframes pulse{50%{box-shadow:0 0 22px rgba(243,195,75,.45)}}
.clue.doomed{background:linear-gradient(135deg,#7a1630,#3a0d2a);border:2px solid var(--brass)}
.pick strong{text-transform:uppercase;letter-spacing:.06em;font-size:14px}
.pick .money{font-size:20px}
.wager{display:flex;flex-direction:column;gap:12px}
.wager input[type=range]{width:100%;accent-color:var(--brass)}
.wager .money.big{font-size:44px;line-height:1;display:flex;justify-content:center;align-items:center;gap:10px}
.stakes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stakes div{background:var(--night);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:2px}
.stakes b{font-family:var(--slab);font-weight:400;font-size:20px;font-variant-numeric:tabular-nums}
.log{display:flex;flex-direction:column;gap:3px;font-size:14px;color:var(--mute);padding-inline:4px}
.log p:first-child{color:var(--cream)}
details.notes summary{cursor:pointer;font-weight:800}
.review{display:grid;gap:10px;margin-top:10px}
.review>div{display:grid;gap:2px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.review>div:last-child{border-bottom:0}
.rules{margin:0;padding-left:20px;display:grid;gap:6px;color:var(--mute)}
.rules b{color:var(--cream)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--night);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

.rune{display:inline-block;width:.6em;height:.6em;transform:rotate(45deg);background:linear-gradient(135deg,#d6f2ff,#8f9cff 55%,#5444c4);box-shadow:0 0 8px rgba(143,156,255,.7);flex:none;margin:0 .14em}

.lore .track{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.lore .track i{display:block;height:100%;background:#8f9cff}
.towns{display:flex;flex-wrap:wrap;gap:6px}
.towns button{border:1px solid var(--line);background:var(--night);border-radius:999px;padding:5px 12px;font-size:14px}
.towns button[aria-current="true"]{border-color:var(--brass);color:var(--brass)}
.doom.last{background:linear-gradient(135deg,#2b2a7a,#120f3a);border-color:#8f9cff}
.doom.last strong{color:#c9d1ff}
.memory{font-family:var(--clue);font-size:clamp(18px,4.6vw,22px);line-height:1.5;font-style:italic;text-wrap:pretty}
.jentry{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.jentry:last-child{border-bottom:0}
.jentry div{min-width:0}
.confirm{display:flex;flex-direction:column;gap:8px;background:var(--night);border:1px solid var(--loss);border-radius:8px;padding:12px}
</style>

const MAP=[[/^Science|Mathematics|Gadgets|Computers/,"Science"],[/^History|^Politics/,"History"],[/^Geography/,"Geography"],[/Books|Comics|Manga/,"Literature"],[/^Animals/,"Beasts"],[/^Mythology/,"Mythology"],[/^Sports/,"Sports"],[/Film|Television|Cartoon/,"Screen"],[/Music|Musicals/,"Music"],[/Video Games|Board Games/,"Games"],[/^Art/,"Art"],[/.*/,"General"]];
const schoolOf=c=>MAP.find(([r])=>r.test(c))[1];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function liveFetch(d){
  const wait=LIVE.last+5200-Date.now();if(wait>0)await sleep(wait); // API allows 1 request per 5s
  LIVE.last=Date.now();
  const dn={e:"easy",m:"medium",h:"hard"}[d];
  const r=await fetch(`${API}api.php?amount=50&type=multiple&difficulty=${dn}&encode=url3986${LIVE.token?"&token="+LIVE.token:""}`);
  const j=await r.json();
  if(j.response_code===4&&LIVE.token){await fetch(`${API}api_token.php?command=reset&token=${LIVE.token}`);return}
  if(j.response_code!==0)return;
  const D=decodeURIComponent;
  j.results.forEach(x=>LIVE.pool[d].push([schoolOf(D(x.category)),d,D(x.question),D(x.correct_answer),...x.incorrect_answers.map(D)]));
  LIVE.on=true;if(LIVE.state!=="daily")LIVE.state="live";
}
// questions/index.json lists every saved day; the GitHub Action adds one file per day
async function loadDaily(){
  const r=await fetch("questions/index.json",{cache:"no-cache"});if(!r.ok)return;
  LIVE.days=((await r.json()).days||[]).map(d=>d.date);
  await pickDay();
}
async function pickDay(){
  if(!LIVE.days||!LIVE.days.length)return;
  const date=LIVE.days[Math.floor(Math.random()*LIVE.days.length)];
  const r=await fetch(`questions/${date}.json`);if(!r.ok)return;
  const j=await r.json(), pool={e:[],m:[],h:[]};
  (j.questions||[]).forEach(x=>{if(pool[x[1]])pool[x[1]].push([schoolOf(x[0]),...x.slice(1)])});
  if(!j.questions||!j.questions.length)return;
  LIVE.pool=pool;LIVE.on=true;LIVE.state="daily";LIVE.date=date;LIVE.count=j.questions.length;
}
const rollDay=()=>{if(LIVE.days&&LIVE.days.length>1)pickDay().catch(()=>{})};
async function liveInit(){
  try{await loadDaily()}catch(e){}
  try{
    const r=await fetch(API+"api_token.php?command=request");const j=await r.json();
    LIVE.token=j.token||null;LIVE.last=Date.now();
    if(!LIVE.on)for(const d of "emh")await liveFetch(d);
  }catch(e){}
  if(!LIVE.on)LIVE.state="offline";
  if(!S)render();
}
function statusLine(){
  if(LIVE.state==="daily")return `${(LIVE.days||[]).length} saved days · playing ${LIVE.date} (${LIVE.count} questions)`;
  return {loading:"Gathering questions…",live:"Open Trivia DB · 4,000+ questions",offline:"Offline · built-in question bank"}[LIVE.state];
}
function topUp(){
  if(!LIVE.on||LIVE.busy)return;
  const fresh=a=>a.filter(q=>!S||!S.used[q[2]]).length;
  const d=[..."emh"].find(k=>fresh(LIVE.pool[k])<15);if(!d)return;
  LIVE.busy=true;liveFetch(d).catch(()=>{}).finally(()=>LIVE.busy=false);
}
const allQs=()=>LIVE.pool.e.concat(LIVE.pool.m,LIVE.pool.h,BANK);
function available(){
  const s=new Set();for(const q of allQs())if(!S.used[q[2]])s.add(q[0]);
  if(s.size<3){S.used={};return available()}
  return [...s];
}

const world=()=>CONS.filter(c=>catExists(c.cat)).map(c=>conInfo(c.cat));
function conInfo(id){
  if(id[0]==="u"){
    const i=+id.slice(1), u=S.uncharted[i], k=i+1;
    const foes=[0,1,2].map(j=>{const [n,g]=UN_FOES[(i*3+j)%UN_FOES.length];return [n,g,Math.round(180*(1+.3*k)+j*15)]});
    return {id,cat:u.cat,n:u.n,tier:3+k,foes,boss:["Warden of the "+u.n.split(" ").pop(),"Ψ",300+150*k],ante:15+5*k,travel:15,req:Math.min(10,3+Math.ceil(k/2))};
  }
  const c=CONS.find(x=>x.cat===id), t=TIER[c.tier];
  return {id,cat:c.cat,n:c.n,tier:c.tier,foes:c.foes.map((f,j)=>[f[0],f[1],t.hp[j]]),boss:[...c.boss,t.boss],ante:t.ante,travel:t.travel,req:t.req};
}

let S=null, timerId=null, confirmNew=false;

const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---------- Saving
const SAVE_KEY="enigambler-save";
function save(){try{if(S)localStorage.setItem(SAVE_KEY,JSON.stringify(calm(S)))}catch(e){}}
function loadSave(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");return s&&s.towns?s:null}catch(e){return null}}
function calm(s){const c={...s};if(c.phase==="ask"||c.phase==="result"){if(c.screen==="duel")c.phase="pick";else{c.screen="town";c.phase=null}}return c}

// ---------- Towns
function makeTown(){
  const used=new Set(S.towns.map(t=>t.name));let name,tries=0;
  do{name=pick(TOWN_A)+pick(TOWN_B);tries++}while(used.has(name)&&tries<60);
  const want=shuffle(world().filter(c=>!S.cleared[c.id]).map(c=>c.cat)).slice(0,2);
  const cats=[...new Set([...want,...shuffle(available())])].slice(0,4);
  const names=shuffle(NAMES);
  const folk=cats.map((cat,i)=>({n:`${names[i]} the ${TITLES[cat]||"Sage"}`,m:names[i][0],cat,hi:GREET[cat]||"Answer me this, backwards."}));
  return {name,folk,boards:folk.map(()=>VALUES.map(()=>false))};
}
function arrive(){S.towns.push(makeTown());S.town=S.towns.length-1;return S.towns[S.town]}
const here=()=>S.towns[S.town];

function newGame(){
  rollDay();
  S={screen:"town",runes:START_RUNES,peak:START_RUNES,lore:{},cleared:{},frags:0,revealed:false,uncharted:[],towns:[],town:0,day:1,
     run:null,items:[],used:{},journal:[],right:0,wrong:0,kos:0,learned:0,flash:"",log:[]};
  const t=arrive();
  S.log=[`You wake in ${t.name} with ${fmt(START_RUNES)} and no memory. Something is peculiar here: everyone speaks only in answers.`];
  render();
}

// ---------- Questions (reversed: the clue is the answer, the choices are questions)
const AWKWARD=/which of (these|the following)|the following|\bnot\b|all of the above|none of the above|^(true|false)$/i;
function reverseOf(q,cat){
  const all=allQs(), decoy=x=>x!==q&&x[3]!==q[3]&&x[2]!==q[2]&&!AWKWARD.test(x[2]);
  let dis=shuffle(all.filter(x=>x[0]===cat&&decoy(x))).slice(0,3);
  if(dis.length<3)dis=dis.concat(shuffle(all.filter(x=>x[0]!==cat&&decoy(x))).slice(0,3-dis.length));
  return {cat,d:q[1],text:q[3],right:q[2],opts:shuffle([q[2],...dis.map(x=>x[2])]),removed:[],row:q};
}
function getQuestion(cat,d){
  const fresh=q=>!S.used[q[2]], fits=q=>!AWKWARD.test(q[2])&&!AWKWARD.test(q[3]);
  const all=allQs(), live=all.slice(0,all.length-BANK.length);
  let pool=live.filter(q=>q[0]===cat&&q[1]===d&&fresh(q)&&fits(q));
  if(!pool.length)pool=all.filter(q=>q[0]===cat&&q[1]===d&&fresh(q)&&fits(q));
  if(!pool.length)pool=all.filter(q=>q[0]===cat&&fresh(q)&&fits(q));
  if(!pool.length)pool=all.filter(q=>q[0]===cat&&fresh(q));
  if(!pool.length){all.filter(q=>q[0]===cat).forEach(q=>delete S.used[q[2]]);pool=all.filter(q=>q[0]===cat)}
  const q=pick(pool);S.used[q[2]]=1;topUp();
  return reverseOf(q,cat);
}
function ask(q,ctx){S.q=q;S.ctx=ctx;S.phase="ask";S.tMax=ctx.kind==="town"||ctx.kind==="study"?30:25;S.tLeft=S.tMax;render();startTimer()}
function startTimer(){
  stopTimer();const t0=performance.now(),start=S.tLeft;
  timerId=setInterval(()=>{
    S.tLeft=Math.max(0,start-(performance.now()-t0)/1000);
    const b=$("#tbar"),n=$("#tnum");if(b)b.style.width=(S.tLeft/S.tMax*100)+"%";if(n)n.textContent=Math.ceil(S.tLeft)+"s";
    if(S.tLeft<=0){stopTimer();answer(null)}
  },100);
}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function addLore(cat,n){const before=lvl(cat);S.lore[cat]=(S.lore[cat]||0)+n;const after=lvl(cat);return after>before?` Your ${cat} lore rises to level ${after}.`:""}
function remember(q){if(!S.journal.some(j=>j.row[2]===q.row[2])){S.journal.unshift({row:q.row,cat:q.cat});S.journal=S.journal.slice(0,40)}}

function answer(opt){
  if(S.phase!=="ask")return;
  stopTimer();S.phase="result";S.picked=opt;
  const ok=opt===S.q.right, c=S.ctx, why=opt===null?"Time's up.":"Wrong.";
  if(ok)S.right++;else{S.wrong++;remember(S.q)}
  if(c.kind==="town"){
    here().boards[c.npc][c.i]=true;
    if(ok){S.runes+=c.value;S.flash="win";S.verdict=`Correct. You earn ${fmt(c.value)}.`+addLore(S.q.cat,LORE_GAIN[S.q.d])}
    else S.verdict=`${why} The question was: ${S.q.right} It's in your journal now.`;
  }else if(c.kind==="study"){
    if(ok){S.journal.splice(c.j,1);S.learned++;S.flash="win";S.verdict="You learned it!"+addLore(S.q.cat,2)}
    else S.verdict=`${why} The question was: ${S.q.right} Keep studying.`;
  }else if(c.kind==="eg"){
    const f=S.foe;
    if(ok){f.hp=0;S.flash="win";S.verdict=c.mode==="last"?`The Last Rune blazes. ${f.n} is struck down in one blow.`:`ENIGAMBLE! ${f.n} is struck down in one blow.`}
    else{S.flash="loss";if(c.mode==="last"){S.runes=0;S.verdict=`${why} The question was: ${S.q.right} Your last rune goes dark.`}
      else{S.runes-=c.stake;S.verdict=`${why} The question was: ${S.q.right} You lose your stake of ${fmt(c.stake)}.`}}
  }else{
    const f=S.foe;
    if(ok){const dmg=Math.round(c.wager*MULT[S.q.d]*loreMult(S.q.cat));f.hp=Math.max(0,f.hp-dmg);S.flash="win";S.verdict=`Correct. You hit ${f.n} for ${dmg}.`}
    else{let loss=c.wager;if(S.ward){loss=Math.ceil(loss/2);S.ward=false}S.runes-=loss;S.flash="loss";S.verdict=`${why} The question was: ${S.q.right} ${f.n} drains ${fmt(loss)}.`}
  }
  S.runes=Math.max(0,S.runes);S.peak=Math.max(S.peak,S.runes);S.log.unshift(S.verdict);render();
}
function afterAnswer(){
  const c=S.ctx;
  if(c.kind==="town"){S.screen="npc";S.phase=null;render();return}
  if(c.kind==="study"){S.screen="journal";S.phase=null;render();return}
  if(S.runes<=0){knockout();return}
  const f=S.foe, C=con();
  if(f.hp<=0){
    let bounty=Math.round(f.max*.4/5)*5;
    if(c.kind==="eg"&&c.mode==="last"){S.runes=Math.max(S.runes,START_RUNES);bounty*=3}else if(c.kind==="eg")bounty*=2;
    S.runes+=bounty;S.peak=Math.max(S.peak,S.runes);S.log.unshift(`${f.n} is beaten. Bounty: ${fmt(bounty)}.`);
    if(f.boss){clearCon(C);return}
    S.run.step++;S.screen="road";render();return;
  }
  S.phase="pick";render();
}
function clearCon(C){
  S.cleared[C.id]=true;S.run=null;
  if(C.id[0]==="u")S.uncharted.push(newUncharted());
  const W=world(), done=W.every(c=>S.cleared[c.id]);
  const t=arrive();
  if(C.id[0]!=="u"){S.frags++;S.memory=FRAGMENTS[Math.min(S.frags,FRAGMENTS.length)-1]}else S.memory=null;
  S.log.unshift(`${C.n} is conquered. You climb out near ${t.name}.`);
  if(done&&!S.revealed){S.revealed=true;if(!S.uncharted.length)S.uncharted.push(newUncharted());S.screen="end"}
  else S.screen="fragment";
  render();
}
function newUncharted(){const i=S.uncharted.length, cats=available();return {cat:cats[(i*7+3)%cats.length],n:`The ${UN_A[i%UN_A.length]} ${UN_B[(i*3+1)%UN_B.length]}`}}
function knockout(){
  S.kos++;S.runes=WAKE_RUNES;const lost=S.run?con().n:null;S.run=null;
  const t=arrive();S.screen="ko";
  S.log.unshift(`You black out${lost?` in ${lost}`:""}. You wake in ${t.name} with ${fmt(WAKE_RUNES)}.`);render();
}

// ---------- Places
function takeClue(i){const n=here().folk[S.npc];S.screen="clue";ask(getQuestion(n.cat,VDIFF[i]),{kind:"town",npc:S.npc,i,value:VALUES[i]})}
function study(j){const e=S.journal[j];S.screen="clue";ask(reverseOf(e.row,e.cat),{kind:"study",j})}
const WARES=[
 {id:"hint",n:"Hint Vial",cost:25,d:"Cross out two wrong questions"},
 {id:"ward",n:"Ward Stone",cost:40,d:"Your next wrong answer drains only half the wager"},
 {id:"glass",n:"Sand Glass",cost:15,d:"Add 15 seconds to one clue"}
];
function buy(id){const w=WARES.find(x=>x.id===id);if(S.runes<=w.cost||S.items.length>=MAX_ITEMS)return;S.runes-=w.cost;S.items.push(id);S.log.unshift(`You buy a ${w.n} for ${fmt(w.cost)}.`);render()}
function useItem(i){
  const id=S.items[i];
  if(id==="ward"){if(S.ward)return;S.ward=true;S.log.unshift("The Ward Stone hums in your pocket.")}
  else if(S.phase!=="ask")return;
  else if(id==="hint"){S.q.removed=S.q.opts.filter(o=>o!==S.q.right).slice(0,2);S.log.unshift("The Hint Vial clears away two wrong questions.")}
  else if(id==="glass"){S.tMax+=15;S.tLeft+=15;S.log.unshift("The Sand Glass buys you 15 seconds.")}
  S.items.splice(i,1);render();if(S.phase==="ask")startTimer();
}
function enter(id){
  const C=conInfo(id);
  if(!unlocked(C)||S.cleared[id])return;
  if(!S.run||S.run.id!==id){if(S.runes<=C.travel)return;S.runes-=C.travel;S.run={id,step:0};S.log.unshift(`You spend ${fmt(C.travel)} on supplies and descend into ${C.n}.`)}
  S.screen="road";render();
}
function makeFoe(){const C=con(),boss=S.run.step>=C.foes.length,[n,g,hp]=boss?C.boss:C.foes[S.run.step];return {n,g,hp,max:hp,boss,egUsed:false}}
function fight(){if(!S.run)return;S.foe=makeFoe();S.screen="duel";S.phase="pick";S.log.unshift(`${S.foe.n} rises to meet you.`);render()}
function choosePick(d){S.choice=d;S.phase="wager";const a=Math.min(con().ante,S.runes);S.wager=Math.min(S.runes,Math.max(a,S.wager||a));render()}
function setWager(v){
  const a=Math.min(con().ante,S.runes);S.wager=Math.max(a,Math.min(S.runes,Math.round(v)));
  const big=$("#wbig"),hit=$("#whit"),lose=$("#wlose"),r=$("#wrange");
  if(big)big.innerHTML=rn(S.wager);if(hit)hit.textContent=Math.round(S.wager*MULT[S.choice]*loreMult(con().cat));
  if(lose)lose.textContent=fmt(S.ward?Math.ceil(S.wager/2):S.wager);if(r&&+r.value!==S.wager)r.value=S.wager;
}
function lockIn(){ask(getQuestion(con().cat,S.choice),{kind:"duel",wager:S.wager})}
// The Enigamble: once per fight. Plenty of runes: stake half, clue gets harder the more HP the monster has.
// Below the minimum wager it becomes the Last Rune: stake everything on one hard clue for a triple bounty and a refill.
const egMode=()=>S.runes<con().ante?"last":"normal";
function egDiff(){if(egMode()==="last")return "h";const r=S.foe.hp/con().boss[2];return r>=.6?"h":r>=.3?"m":"e"}
function takeEnigamble(){const mode=egMode(),stake=mode==="last"?S.runes:Math.ceil(S.runes/2);S.foe.egUsed=true;ask(getQuestion(con().cat,egDiff()),{kind:"eg",mode,stake})}

// ---------- Render
function purse(){
  const place={town:here().name,npc:here().name,clue:here().name,journal:here().name,world:"World map",road:S.run?con().n:"",duel:S.run?con().n:"",ko:here().name,fragment:here().name,end:here().name}[S.screen]||"";
  const items=S.items.map((id,i)=>{const w=WARES.find(x=>x.id===id);return `<button class="chip" data-a="item" data-i="${i}" title="${esc(w.d)}">${esc(w.n)}</button>`}).join("");
  return `<div class="purse ${S.flash?"flash-"+S.flash:""}"><div><div class="lbl">Runes</div><div class="money">${rn(S.runes)}</div></div>
    <div class="where"><div class="lbl">Memories ${S.frags} / ${world().length}</div><h3>${esc(place)}</h3></div>
    <div class="kit">${items}${S.ward?`<span class="chip">Ward ready</span>`:""}${!items&&!S.ward?`<span class="mute" style="font-size:13px">Runes are your life and your wager. Run out in a fight and you black out.</span>`:""}</div></div>`;
}
const logView=()=>`<div class="log" aria-live="polite">${S.log.slice(0,4).map(l=>`<p>${esc(l)}</p>`).join("")}</div>`;
function clueView(){
  const q=S.q,done=S.phase==="result",c=S.ctx;
  const head=c.kind==="town"?`${q.cat} · ${fmt(c.value)}`:c.kind==="study"?`Journal · ${q.cat}`:c.kind==="eg"?`${c.mode==="last"?"Last Rune":"Enigamble"} · ${q.cat} · ${DNAME[q.d]} · stake ${fmt(c.stake)}`:`${q.cat} · ${DNAME[q.d]} ×${MULT[q.d]} · wager ${fmt(c.wager)}`;
  return `<div class="row" style="justify-content:space-between"><span class="lbl">${esc(head)}</span><span class="lbl" id="tnum">${done?"":Math.ceil(S.tLeft)+"s"}</span></div>
    ${done?"":`<div class="timer"><i id="tbar" style="width:${S.tLeft/S.tMax*100}%"></i></div>`}
    <p class="lbl">The answer is…</p>
    <div class="clue ${c.kind==="eg"?"doomed":""}">${esc(q.text)}</div>
    <p class="lbl">Pick the question</p>
    <div class="answers">${q.opts.map((o,i)=>{let k="";if(q.removed.includes(o))k="gone";if(done){if(o===q.right)k="right";else if(o===S.picked)k="wrong"}
      return `<button class="ans ${k}" data-a="ans" data-i="${i}" ${done||q.removed.includes(o)?"disabled":""}><span class="k">${i+1}</span><span>${esc(o)}</span></button>`}).join("")}</div>
    ${done?`<p class="verdict ${S.picked===q.right?"good":"bad"}">${esc(S.verdict)}</p><div><button class="btn" id="nextbtn" data-a="after">Continue</button></div>`:""}`;
}
function loreView(){
  const cats=[...new Set([...world().map(c=>c.cat),...Object.keys(S.lore)])];
  return `<div class="lore">${cats.map(cat=>{const p=S.lore[cat]||0,l=lvl(cat),into=l>=10?4:p-l*4;
    return `<div><div class="lv"><strong>${cat}</strong><span class="mute">Lv ${l}</span></div><div class="track"><i style="width:${into/4*100}%"></i></div></div>`}).join("")}</div>`;
}
function render(){
  const app=$("#app");
  if(!S){app.innerHTML=titleView();return}
  let body="";
  const T=here();
  if(S.screen==="town"){
    body=`<section class="panel"><div><p class="lbl">${esc(T.name)} · day ${S.day} · no risk here</p><h2>Who will teach you?</h2><p class="mute">The locals only speak in answers. Find the right question to earn runes and lore.</p></div>
      <div class="folk">${T.folk.map((n,i)=>{const left=T.boards[i].filter(x=>!x).length;
        return `<button class="npc" data-a="npc" data-i="${i}" ${left?"":"disabled"}><span class="mono">${n.m}</span><div><strong>${esc(n.n)}</strong><small>${n.cat} · lore Lv ${lvl(n.cat)} · ${left?left+" clues left":"Done for today"}</small></div></button>`}).join("")}</div></section>
      <section class="panel"><div><p class="lbl">What you know</p><h2>Lore</h2><p class="mute">Lore unlocks each category's conungeon and adds 10% damage per level when you fight with it.</p></div>${loreView()}</section>
      <section class="panel"><div class="row" style="justify-content:space-between"><div style="min-width:0"><p class="lbl">Journal</p><h2>${S.journal.length} clue${S.journal.length===1?"":"s"} to restudy</h2><p class="mute">Get a missed clue right later for bonus lore.</p></div><button class="btn ghost" data-a="journal" ${S.journal.length?"":"disabled"}>Open journal</button></div></section>
      <section class="panel"><div><p class="lbl">Market stall</p><h2>Supplies</h2></div>
      <div class="stall">${WARES.map(w=>`<div class="ware"><div><strong>${w.n}</strong><p class="mute">${w.d}</p></div><button class="btn ghost" data-a="buy" data-id="${w.id}" ${S.runes<=w.cost||S.items.length>=MAX_ITEMS?"disabled":""}>${fmt(w.cost)}</button></div>`).join("")}</div></section>
      <section class="panel"><div class="row" style="justify-content:space-between"><div style="min-width:0"><p class="lbl">The inn</p><h2>Sleep until morning</h2><p class="mute">The locals wake with new clues.</p></div><button class="btn ghost" data-a="sleep">Sleep</button></div>
      <div class="row" style="justify-content:space-between"><div style="min-width:0"><p class="lbl">The road</p><h2>The world map</h2><p class="mute">Travel between towns, or descend into a conungeon.</p></div><button class="btn" data-a="world">Open the map</button></div></section>`;
  }else if(S.screen==="npc"){
    const n=T.folk[S.npc], b=T.boards[S.npc];
    body=`<section class="panel"><div class="row"><span class="mono">${n.m}</span><div style="min-width:0"><h2>${esc(n.n)}</h2><p class="mute">"${esc(n.hi)}"</p></div></div>
      <div class="cathead">${n.cat}</div>
      <div class="board">${VALUES.map((v,i)=>`<button class="tile" data-a="clue" data-i="${i}" ${b[i]?"disabled":""} aria-label="${n.cat} for ${v} runes">${b[i]?"":rn(v)}</button>`).join("")}</div>
      <div><button class="btn ghost" data-a="town">Back to ${esc(T.name)}</button></div></section>`;
  }else if(S.screen==="clue"){
    body=`<section class="panel">${clueView()}</section>`;
  }else if(S.screen==="journal"){
    body=`<section class="panel"><div><p class="lbl">Journal</p><h2>Clues you missed</h2><p class="mute">Restudy one. Get it right and it's learned for good, with 2 bonus lore.</p></div>
      <div>${S.journal.length?S.journal.map((e,j)=>`<div class="jentry"><div><strong>${esc(e.row[3])}</strong><p class="mute">${e.cat} · ${DNAME[e.row[1]]}</p></div><button class="btn ghost" data-a="study" data-i="${j}">Restudy</button></div>`).join(""):`<p class="mute">Nothing left to restudy. You've learned every clue you missed.</p>`}</div>
      <div><button class="btn ghost" data-a="town">Back to ${esc(T.name)}</button></div></section>`;
  }else if(S.screen==="world"){
    const W=world(), un=S.uncharted.map((_,i)=>conInfo("u"+i));
    const row=C=>{const cl=S.cleared[C.id], open=unlocked(C), active=S.run&&S.run.id===C.id, total=C.foes.length+1, step=active?S.run.step:0;
      return `<button class="district" data-a="enter" data-id="${C.id}" ${cl||!open||(!active&&S.runes<=C.travel)?"disabled":""}><div><h3>${esc(C.n)}</h3><span class="mute">${C.cat} · ${cl?"Conquered":open?(active?"In progress":`Supplies ${fmt(C.travel)} · minimum wager ${fmt(C.ante)}`):`Needs ${C.cat} lore Lv ${C.req} (you have ${lvl(C.cat)})`}</span></div>
      <span class="tag ${cl?"good":open?"":"mute"}">${cl?"Cleared":open?"Open":"Locked"}</span>
      <div class="pips">${Array.from({length:total},(_,k)=>`<span class="pip ${k===total-1?"boss":""} ${cl||k<step?"done":k===step&&active?"next":""}"></span>`).join("")}</div></button>`};
    body=`<section class="panel"><div><p class="lbl">Towns you've found</p><h2>Travel</h2></div>
      <div class="towns">${S.towns.map((t,i)=>`<button data-a="goto" data-i="${i}" aria-current="${i===S.town}">${esc(t.name)}</button>`).join("")}</div></section>
      <section class="panel"><div><p class="lbl">${Object.keys(S.cleared).filter(k=>k[0]!=="u").length} of ${W.length} conquered</p><h2>The conungeons of the world</h2><p class="mute">Each one is a single category. Study it on the surface first.</p></div>
      <div class="districts">${W.map(row).join("")}</div>
      ${un.length?`<p class="lbl">Uncharted</p><div class="districts">${un.map(row).join("")}</div>`:""}
      <div><button class="btn ghost" data-a="town">Back to ${esc(T.name)}</button></div></section>`;
  }else if(S.screen==="road"){
    const C=con(), f=makeFoe();
    body=`<section class="panel"><div><p class="lbl">${esc(C.n)} · ${C.cat} · encounter ${S.run.step+1} of ${C.foes.length+1}</p><h2>${f.boss?"The guardian waits":"Something stirs in the dark"}</h2></div>
      <div class="foe"><div class="sigil ${f.boss?"boss":""}" aria-hidden="true">${f.g}</div><div><h3>${esc(f.n)}</h3><span class="mute">${f.max} HP · bounty ${fmt(Math.round(f.max*.4/5)*5)} · minimum wager ${fmt(C.ante)}</span></div></div>
      <div class="row"><button class="btn" data-a="fight">Fight</button><button class="btn ghost" data-a="town">Climb back to ${esc(T.name)}</button></div></section>`;
  }else if(S.screen==="duel"){
    const f=S.foe, C=con();
    let mid="";
    if(S.phase==="pick"){
      const last=egMode()==="last", stake=last?S.runes:Math.ceil(S.runes/2);
      mid=`<p class="lbl">${C.cat} lore Lv ${lvl(C.cat)} adds ×${loreMult(C.cat).toFixed(1)} damage. Pick a difficulty.</p>
      <div class="picks">${["e","m","h"].map(d=>`<button class="pick" data-a="pick" data-d="${d}"><strong>${DNAME[d]}</strong><span class="mute">${C.cat}</span><span class="money">×${(MULT[d]*loreMult(C.cat)).toFixed(1)}</span></button>`).join("")}
      ${f.egUsed?"":last?`<button class="doom last" data-a="eg"><strong>Last Rune</strong><span>You're almost out of runes. Stake everything on one hard, obscure clue. Right: ${esc(f.n)} dies instantly, triple bounty, and your runes refill. Wrong: you black out.</span></button>`
        :`<button class="doom" data-a="eg"><strong>Enigamble</strong><span>Stake half your runes (${fmt(stake)}) on one ${DNAME[egDiff()].toLowerCase()} clue. The more HP ${esc(f.n)} has, the harder it gets. Right: it dies instantly, double bounty. Wrong: the stake is gone.</span></button>`}</div>`;
    }else if(S.phase==="wager"){
      const a=Math.min(C.ante,S.runes), d=S.choice;
      mid=`<div class="wager"><p class="lbl">${C.cat} · ${DNAME[d]} · How many runes will you wager?</p>
        <div class="money big" id="wbig">${rn(S.wager)}</div>
        <input id="wrange" type="range" min="${a}" max="${S.runes}" step="1" value="${S.wager}" aria-label="Wager in runes">
        <div class="row"><button class="btn ghost" data-a="w" data-v="ante">Minimum</button><button class="btn ghost" data-a="w" data-v="half">Half</button><button class="btn ghost" data-a="w" data-v="all">All in</button></div>
        <div class="stakes"><div><span class="lbl">If right</span><b class="good"><span id="whit">${Math.round(S.wager*MULT[d]*loreMult(C.cat))}</span> damage</b></div><div><span class="lbl">If wrong</span><b class="bad">lose <span id="wlose">${fmt(S.ward?Math.ceil(S.wager/2):S.wager)}</span></b></div></div>
        <div class="row"><button class="btn" data-a="lock">Lock it in</button><button class="btn ghost" data-a="repick">Change difficulty</button></div></div>`;
    }else mid=clueView();
    body=`<section class="panel"><div class="foe"><div class="sigil ${f.boss?"boss":""}" aria-hidden="true">${f.g}</div><div><h3>${esc(f.n)}</h3>
      <div class="hpline"><span class="lbl">${esc(C.n)}</span><span class="money" style="font-size:15px">${f.hp} / ${f.max}</span></div>
      <div class="bar"><i style="width:${f.hp/f.max*100}%"></i></div></div></div>${mid}</section>`;
  }else if(S.screen==="ko"){
    body=`<section class="panel"><p class="lbl">You black out</p><h2>You wake somewhere new</h2><p class="mute">The road is a blur. You come to in ${esc(T.name)} with ${fmt(WAKE_RUNES)}. Your lore is still with you. Knowledge is the one thing amnesia can't take.</p><div><button class="btn" data-a="town">Look around ${esc(T.name)}</button></div></section>`;
  }else if(S.screen==="fragment"){
    body=`<section class="panel"><p class="lbl">${S.memory?`A memory returns · ${S.frags} of ${world().length}`:"Uncharted conungeon conquered"}</p>
      ${S.memory?`<p class="memory">"${esc(S.memory)}"</p>`:`<h2>Another uncharted conungeon appears on your map</h2>`}
      <p class="mute">You climb out of the dark near a town you've never seen: ${esc(T.name)}.</p><div><button class="btn" data-a="town">Enter ${esc(T.name)}</button></div></section>`;
  }else if(S.screen==="end"){
    const acc=S.right+S.wrong?Math.round(S.right/(S.right+S.wrong)*100):0;
    body=`<section class="panel"><p class="lbl">Every memory has returned</p><h1 style="font-size:clamp(40px,11vw,64px)">You remember</h1>
      <p class="memory">You were the Enigambler, the one who bet on every answer and never lost. Then you found the Necroracle at the bottom of its crypt, and it offered you one last wager: your memories against its question. You answered, and you were wrong. Now you've won every one of them back, one conungeon at a time.</p>
      <div class="stats"><div><span class="lbl">Accuracy</span><span class="money" style="font-size:22px">${acc}%</span></div><div><span class="lbl">Clues learned</span><span class="money" style="font-size:22px">${S.learned}</span></div><div><span class="lbl">Blackouts</span><span class="money" style="font-size:22px">${S.kos}</span></div></div>
      <p class="mute">Uncharted conungeons have appeared on your map. They never end, and each one is harder than the last.</p>
      <div class="row"><button class="btn" data-a="world">Explore the uncharted</button></div></section>`;
  }
  app.innerHTML=purse()+body+logView();S.flash="";save();
  const nb=$("#nextbtn");if(nb)nb.focus();
  const r=$("#wrange");if(r)r.addEventListener("input",e=>setWager(+e.target.value));
}
function titleView(){
  const saved=loadSave();
  return `<section class="panel" style="padding:28px 22px"><p class="lbl">Conungeon · Wager RPG</p><h1>Enigambler</h1>
    <p>You wake with no memory in a peculiar town. Peculiar, because the townsfolk only speak in answers and wait for you to find the questions. Learn their ways, then wager your runes to conquer every conungeon in the world and win your memories back.</p>
    <ul class="rules">
      <li><b>Everyone speaks in answers:</b> you pick the question that fits.</li>
      <li><b>On the surface,</b> locals teach you for free. Right answers earn runes and lore. Missed clues go in your journal to restudy.</li>
      <li><b>Lore</b> unlocks each category's conungeon and makes your attacks in it stronger.</li>
      <li><b>In a conungeon,</b> wager runes on each clue. Right: the monster takes damage. Wrong: you lose the wager. Run out and you black out, waking in a new town.</li>
      <li><b>The Enigamble:</b> once per fight, stake half your runes to kill the monster instantly. Almost out of runes? It becomes the <b>Last Rune</b>: one hard, obscure clue that can save you.</li>
    </ul>
    <p class="lbl">${statusLine()}</p>
    ${confirmNew?`<div class="confirm"><strong>Forget everything?</strong><p class="mute">Your saved lore, towns and memories will be erased.</p><div class="row"><button class="btn" data-a="newconfirm">Yes, start over</button><button class="btn ghost" data-a="newcancel">Keep my save</button></div></div>`
    :`<div class="row">${saved?`<button class="btn" data-a="continue">Continue · ${saved.frags} memories, ${saved.towns.length} towns</button><button class="btn ghost" data-a="new">New game</button>`:`<button class="btn" data-a="start">Wake up</button>`}</div>`}</section>`;
}

document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a,i=+b.dataset.i;
  if(a==="start"||a==="newconfirm"){confirmNew=false;newGame()}
  else if(a==="new"){confirmNew=true;render()}
  else if(a==="newcancel"){confirmNew=false;render()}
  else if(a==="continue"){S=calm(loadSave());render()}
  else if(a==="town"){S.screen="town";render()}
  else if(a==="npc"){S.npc=i;S.screen="npc";render()}
  else if(a==="clue")takeClue(i);
  else if(a==="ans")answer(S.q.opts[i]);
  else if(a==="after")afterAnswer();
  else if(a==="journal"){S.screen="journal";render()}
  else if(a==="study")study(i);
  else if(a==="buy")buy(b.dataset.id);
  else if(a==="item")useItem(i);
  else if(a==="sleep"){S.day++;here().boards=here().folk.map(()=>VALUES.map(()=>false));S.log.unshift(`Day ${S.day} in ${here().name}. The locals have new clues.`);render();scrollTo({top:0,behavior:"smooth"})}
  else if(a==="world"){S.screen="world";render()}
  else if(a==="goto"){S.town=i;S.screen="town";S.log.unshift(`You walk to ${here().name}.`);render()}
  else if(a==="enter")enter(b.dataset.id);
  else if(a==="fight")fight();
  else if(a==="pick")choosePick(b.dataset.d);
  else if(a==="repick"){S.phase="pick";render()}
  else if(a==="w"){const v=b.dataset.v;setWager(v==="all"?S.runes:v==="half"?Math.round(S.runes/2):0)}
  else if(a==="lock")lockIn();
  else if(a==="eg")takeEnigamble();
});
document.addEventListener("keydown",ev=>{
  if(!S||S.phase!=="ask")return;const n=+ev.key;
  if(n>=1&&n<=4){const o=S.q.opts[n-1];if(!S.q.removed.includes(o))answer(o)}
});
render();
liveInit();
</script>
</body>
</html>
