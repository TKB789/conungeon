name: Daily questions

on:
  schedule:
    - cron: "17 11 * * *"   # every day at 11:17 UTC (4:17 AM Pacific)
  workflow_dispatch:         # adds a "Run workflow" button in the Actions tab
    inputs:
      count:
        description: "How many new questions to add from each source (5000 grabs as many as possible)"
        required: false
        default: "300"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add new questions to the archive
        env:
          COUNT: ${{ github.event.inputs.count || '300' }}
        run: |
          python3 - <<'PY'
          import json, os, glob, time, datetime, urllib.request, urllib.parse

          API = "https://opentdb.com/"
          SET_SIZE = 300                      # questions per saved file
          want = max(1, min(int(os.environ.get("COUNT", "300") or 300), 20000))
          os.makedirs("questions", exist_ok=True)
          today = datetime.date.today().isoformat()

          # Move the old single-file format into the archive, once.
          if os.path.exists("questions.json"):
              old = json.load(open("questions.json", encoding="utf-8"))
              path = f"questions/{old.get('date', 'legacy')}.json"
              if not os.path.exists(path):
                  json.dump(old, open(path, "w", encoding="utf-8"), ensure_ascii=False, separators=(",", ":"))
              os.remove("questions.json")

          # Every question already in the archive, so nothing is ever saved twice.
          seen = set()
          for f in glob.glob("questions/*.json"):
              if os.path.basename(f) == "index.json":
                  continue
              for q in json.load(open(f, encoding="utf-8")).get("questions", []):
                  seen.add(q[2])
          print(f"Archive already holds {len(seen)} questions. Fetching up to {want} new ones.")

          def get(url):
              with urllib.request.urlopen(url, timeout=30) as r:
                  return json.load(r)

          # ---- Source 1: Open Trivia DB (CC BY-SA 4.0). A session token means it never repeats itself.
          def fetch_opentdb(limit):
              out = []
              token = get(API + "api_token.php?command=request").get("token", "")
              done, calls = set(), 0     # difficulties this token has run out of; safety cap
              while len(out) < limit and len(done) < 3 and calls < 400:
                  for d, code in (("easy", "e"), ("medium", "m"), ("hard", "h")):
                      if d in done or len(out) >= limit:
                          continue
                      time.sleep(6)       # the API allows 1 request every 5 seconds
                      calls += 1
                      j = get(f"{API}api.php?amount=50&type=multiple&difficulty={d}&encode=url3986&token={token}")
                      rc = j.get("response_code")
                      if rc in (1, 4):    # 1 = not enough left, 4 = token has seen them all
                          done.add(d)
                          continue
                      if rc != 0:
                          continue
                      for x in j["results"]:
                          U = urllib.parse.unquote
                          q = U(x["question"])
                          if q in seen:
                              continue
                          seen.add(q)
                          out.append([U(x["category"]), code, q, U(x["correct_answer"])] + [U(w) for w in x["incorrect_answers"]])
              return out

          # ---- Source 2: The Trivia API (CC BY-NC 4.0, free for non-commercial use, credit requested).
          # It returns random questions, so stop once several batches in a row bring almost nothing new.
          TTA_CATS = {"music": "Entertainment: Music", "sport_and_leisure": "Sports", "film_and_tv": "Entertainment: Film",
                      "arts_and_literature": "Entertainment: Books", "history": "History", "society_and_culture": "General Knowledge",
                      "science": "Science & Nature", "geography": "Geography", "food_and_drink": "General Knowledge",
                      "general_knowledge": "General Knowledge"}
          def fetch_tta(limit):
              out, dry, calls = [], 0, 0
              while len(out) < limit and dry < 8 and calls < 600:
                  for d, code in (("easy", "e"), ("medium", "m"), ("hard", "h")):
                      if len(out) >= limit:
                          break
                      time.sleep(2)
                      calls += 1
                      batch = get(f"https://the-trivia-api.com/v2/questions?limit=50&difficulties={d}")
                      added = 0
                      for x in batch:
                          if x.get("type", "text_choice") != "text_choice":
                              continue
                          q = (x.get("question") or {}).get("text", "").strip()
                          if not q or q in seen or len(x.get("incorrectAnswers", [])) < 3:
                              continue
                          seen.add(q)
                          added += 1
                          out.append([TTA_CATS.get(x.get("category", ""), "General Knowledge"), code, q, x["correctAnswer"]] + x["incorrectAnswers"][:3])
                      dry = dry + 1 if added < 3 else 0
              return out

          # Save in sets of 300 (a tiny leftover joins the previous set), one file per set.
          def save(rows, prefix, source):
              chunks = [rows[i:i + SET_SIZE] for i in range(0, len(rows), SET_SIZE)]
              if len(chunks) > 1 and len(chunks[-1]) < 20:
                  chunks[-2] += chunks.pop()
              n = 1
              for chunk in chunks:
                  name = lambda k: prefix if k == 1 else f"{prefix}-{k}"
                  while os.path.exists(f"questions/{name(n)}.json"):
                      n += 1
                  json.dump({"date": today, "source": source, "questions": chunk},
                            open(f"questions/{name(n)}.json", "w", encoding="utf-8"), ensure_ascii=False, separators=(",", ":"))
                  print(f"Saved {len(chunk)} questions to questions/{name(n)}.json")

          for label, fetch, prefix, source in (
              ("Open Trivia DB", fetch_opentdb, today, "Open Trivia DB (opentdb.com), CC BY-SA 4.0"),
              ("The Trivia API", fetch_tta, f"{today}-tta", "The Trivia API (the-trivia-api.com), CC BY-NC 4.0"),
          ):
              try:
                  rows = fetch(want)
              except Exception as e:      # one source being down shouldn't stop the other
                  print(f"{label} failed: {e}")
                  rows = []
              save(rows, prefix, source)
              print(f"{label}: {len(rows)} new questions" if rows else f"{label}: no new questions (it may be complete).")

          # Rebuild the list of saved sets that the games read.
          sets = []
          for f in sorted(glob.glob("questions/*.json")):
              name = os.path.basename(f)[:-5]
              if name == "index":
                  continue
              sets.append({"date": name, "count": len(json.load(open(f, encoding="utf-8")).get("questions", []))})
          json.dump({"days": sets, "total": sum(s["count"] for s in sets)}, open("questions/index.json", "w"), separators=(",", ":"))
          print(f"Archive: {len(sets)} sets, {sum(s['count'] for s in sets)} questions")
          PY

      - name: Commit the archive
        run: |
          git config user.name "daily-questions-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Questions $(date -u +%F)"
          git push
