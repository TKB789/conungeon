name: Daily questions

on:
  schedule:
    - cron: "17 11 * * *"   # every day at 11:17 UTC (4:17 AM Pacific)
  workflow_dispatch:         # adds a "Run workflow" button in the Actions tab
    inputs:
      count:
        description: "How many new questions to add (use 5000 to grab everything that's left)"
        required: false
        default: "300"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add new questions to the archive
        env:
          COUNT: ${{ github.event.inputs.count || '300' }}
        run: |
          python3 - <<'PY'
          import json, os, glob, time, datetime, urllib.request, urllib.parse

          API = "https://opentdb.com/"
          SET_SIZE = 300                      # questions per saved file
          want = max(1, min(int(os.environ.get("COUNT", "300") or 300), 20000))
          os.makedirs("questions", exist_ok=True)
          today = datetime.date.today().isoformat()

          # Move the old single-file format into the archive, once.
          if os.path.exists("questions.json"):
              old = json.load(open("questions.json", encoding="utf-8"))
              path = f"questions/{old.get('date', 'legacy')}.json"
              if not os.path.exists(path):
                  json.dump(old, open(path, "w", encoding="utf-8"), ensure_ascii=False, separators=(",", ":"))
              os.remove("questions.json")

          # Every question already in the archive, so nothing is ever saved twice.
          seen = set()
          for f in glob.glob("questions/*.json"):
              if os.path.basename(f) == "index.json":
                  continue
              for q in json.load(open(f, encoding="utf-8")).get("questions", []):
                  seen.add(q[2])
          print(f"Archive already holds {len(seen)} questions. Fetching up to {want} new ones.")

          def get(url):
              with urllib.request.urlopen(url, timeout=30) as r:
                  return json.load(r)

          token = get(API + "api_token.php?command=request").get("token", "")
          new = []
          done = set()   # difficulties this token has run out of
          calls = 0      # safety cap; the API runs out long before this
          while len(new) < want and len(done) < 3 and calls < 400:
              for d, code in (("easy", "e"), ("medium", "m"), ("hard", "h")):
                  if d in done or len(new) >= want:
                      continue
                  time.sleep(6)   # the API allows 1 request every 5 seconds
                  calls += 1
                  j = get(f"{API}api.php?amount=50&type=multiple&difficulty={d}&encode=url3986&token={token}")
                  rc = j.get("response_code")
                  if rc in (1, 4):            # 1 = not enough left, 4 = token has seen them all
                      done.add(d)
                      continue
                  if rc != 0:
                      continue
                  for x in j["results"]:
                      U = urllib.parse.unquote
                      q = U(x["question"])
                      if q in seen:
                          continue
                      seen.add(q)
                      new.append([U(x["category"]), code, q, U(x["correct_answer"])] + [U(w) for w in x["incorrect_answers"]])

          # Save in sets of 300: today, today-2, today-3... A tiny leftover joins the previous set.
          chunks = [new[i:i + SET_SIZE] for i in range(0, len(new), SET_SIZE)]
          if len(chunks) > 1 and len(chunks[-1]) < 20:
              chunks[-2] += chunks.pop()
          n = 1
          for chunk in chunks:
              while os.path.exists(f"questions/{today if n == 1 else f'{today}-{n}'}.json"):
                  n += 1
              name = today if n == 1 else f"{today}-{n}"
              json.dump({"date": today, "source": "Open Trivia DB (opentdb.com), CC BY-SA 4.0", "questions": chunk},
                        open(f"questions/{name}.json", "w", encoding="utf-8"), ensure_ascii=False, separators=(",", ":"))
              print(f"Saved {len(chunk)} questions to questions/{name}.json")
          if not new:
              print("No new questions left in the database. The archive is complete.")

          # Rebuild the list of saved sets that the games read.
          sets = []
          for f in sorted(glob.glob("questions/*.json")):
              name = os.path.basename(f)[:-5]
              if name == "index":
                  continue
              sets.append({"date": name, "count": len(json.load(open(f, encoding="utf-8")).get("questions", []))})
          json.dump({"days": sets, "total": sum(s["count"] for s in sets)}, open("questions/index.json", "w"), separators=(",", ":"))
          print(f"Archive: {len(sets)} sets, {sum(s['count'] for s in sets)} questions")
          PY

      - name: Commit the archive
        run: |
          git config user.name "daily-questions-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Questions $(date -u +%F)"
          git push
