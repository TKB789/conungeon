,"sec":1,"set":2},{"m":"m3","sc":16,"q":"Which degree should the analyst choose?","multi":false,"fixed":false,"opts":[["Degree 3","It has the lowest validation error. Beyond it, validation error rises even though training error keeps falling.",""],["Degree 6","Its low training error comes from overfitting; its validation error is the second worst.","Choosing by training fit."],["Degree 1","It underfits; both errors are high.","Over-preferring simplicity."],["Degree 4","Its validation error is higher than degree 3’s.","Misreading the table."]],"ok":[0],"id":"x-m3-6","seq":68,"sec":1,"set":2},{"m":"m3","sc":16,"q":"Why does training RMSE keep falling all the way to degree 6?","multi":false,"fixed":false,"opts":[["More flexible models can always fit the training data, noise included","Training error rewards flexibility whether or not the patterns are real.",""],["Higher-degree polynomials really are better models of fuel use","Validation error shows they aren’t.","Equating training fit with quality."],["The validation set is too small to show the improvement","That doesn’t explain the training trend.","Wrong diagnosis."],["The training data has little noise, so flexibility keeps helping","Then validation error wouldn’t rise.","Contradicting the evidence."]],"ok":[0],"id":"x-m3-7","seq":69,"sec":1,"set":2},{"m":"m3","sc":16,"q":"Is 4.6 a good estimate of degree 3’s error on brand-new data?","multi":false,"fixed":false,"opts":[["Probably a bit optimistic, since it won a comparison; use a test set","The winner of a comparison tends to have gotten lucky on the validation data.",""],["Yes; each model’s validation error is unbiased, so 4.6 is accurate","It’s unbiased for each model alone, not for the one you picked as best.","Missing selection bias."],["No; the real error will be closer to 4.0, its training error","Training error is the most optimistic of all.","Trusting training fit."],["No; the real error will be closer to 9.5, the simplest model’s","That’s a different model’s error.","Mixing up models."]],"ok":[0],"id":"x-m3-8","seq":70,"sec":1,"set":2},{"m":"m3","sc":16,"q":"The data set has only 60 cars. Which change to the validation approach is most helpful?","multi":false,"fixed":false,"opts":[["Use k-fold cross-validation to use every car more fully","With little data, one fixed split wastes points and depends heavily on which cars landed where.",""],["Put 90% of the data in validation for a precise estimate","That leaves almost nothing to train on.","Overcorrecting."],["Skip validation and pick the degree with lowest training error","That always picks the most overfit model.","Abandoning validation."],["Train and validate on all 60 cars to use every data point","Then validation measures training fit.","Reusing data."]],"ok":[0],"id":"x-m3-9","seq":71,"sec":1,"set":2},{"m":"m4","sc":17,"q":"Which distance matches the <b>robot’s<\/b> travel time?","multi":false,"fixed":true,"opts":[["1-norm (rectilinear)","The moves happen at the same time, so their times don’t add.","Adding simultaneous moves."],["2-norm (Euclidean)","The robot doesn’t travel diagonally in a straight line.","Picking the default distance."],["∞-norm (largest difference)","Both motors run at once, so the trip takes as long as the longer move.",""]],"ok":[2],"id":"x-m4-5","seq":72,"sec":1,"set":2},{"m":"m4","sc":17,"q":"Which distance matches the <b>van’s<\/b> travel?","multi":false,"fixed":true,"opts":[["1-norm (rectilinear)","On a grid, the van covers the full horizontal and full vertical distance: 6 + 8.",""],["2-norm (Euclidean)","It can’t cut diagonally through blocks.","Assuming straight-line travel."],["∞-norm (largest difference)","The two directions happen one after another, not at the same time.","Treating sequential moves as simultaneous."]],"ok":[0],"id":"x-m4-6","seq":73,"sec":1,"set":2},{"m":"m4","sc":17,"q":"For this 6-and-8 trip, how do the three distances compare, and which is the longest?","multi":false,"fixed":false,"opts":[["1-norm (14) ≥ 2-norm (10) ≥ ∞-norm (8); the van’s grid distance is longest","Adding both legs (14) is longest, the straight line (10) is shorter, and the largest single leg (8) is shortest. This ordering holds for any two points.",""],["∞-norm ≥ 2-norm ≥ 1-norm; the robot’s distance is longest, since it’s the “infinity” norm","“∞” refers to the power p, not the size. As p grows, the largest leg dominates and the distance shrinks toward it.","Reading “∞” as “biggest.”"],["All three are equal, since the endpoints are the same","They’re equal only when the points differ in just one direction.","Overgeneralizing a special case."],["The 2-norm is longest, since straight-line distance is the true distance","The straight line is the shortest path in the plane, so it’s never longer than the grid route.","Treating Euclidean as the largest."]],"ok":[0],"id":"x-m4-7","seq":74,"sec":1,"set":2},{"m":"m4","sc":17,"q":"The robot’s lift motor is upgraded to run twice as fast; the aisle motor stays the same. For this 6-and-8 trip, when does the upgrade shorten the trip?","multi":false,"fixed":false,"opts":[["Only if the lift move was the slower of the two","Trip time is the maximum of the two move times, so only speeding up the slower move helps.",""],["Always, by half the time of the lift move","Times don’t add when the moves are simultaneous.","Using the sum instead of the max."],["Never, since only the aisle move limits the trip","The lift matters when it’s the slower move.","Ignoring one dimension."],["Always, by exactly half the total trip time","Only the slower move limits the trip.","Overstating it."]],"ok":[0],"id":"x-m4-8","seq":75,"sec":1,"set":2},{"m":"m4","sc":18,"q":"k-means alternates between two steps until it stops. Which step is the “expectation” step in the EM view of k-means?","multi":false,"fixed":false,"opts":[["Assigning each customer to its nearest current center","The E-step computes cluster memberships given the current centers.",""],["Moving each center to the average of its assigned customers","That’s the maximization step.","Swapping E and M."],["Choosing k","You choose k before the loop starts.","Confusing setup with the loop."],["Scaling the attributes","That’s data prep before clustering.","Confusing prep with the algorithm."]],"ok":[0],"id":"x-m4-9","seq":76,"sec":1,"set":2},{"m":"m4","sc":18,"q":"When does the loop stop?","multi":false,"fixed":false,"opts":[["When no customer changes cluster from one round to the next","Then the centers stop moving too, so further rounds change nothing.",""],["When the total distance reaches 0","That only happens when k equals the number of points.","Expecting a perfect fit."],["When the total distance to centers stops getting smaller, even if some customers are still switching","If customers are still switching clusters, the centers are still moving; the loop continues until assignments settle.","Confusing a slowdown with convergence."],["When it has found the best possible clustering for this k","k-means stops at a local solution; it can’t guarantee the best one, which is why you run several random starts.","Thinking the heuristic is guaranteed optimal."]],"ok":[0],"id":"x-m4-10","seq":77,"sec":1,"set":2},{"m":"m4","sc":18,"q":"The analyst’s manager names the clusters (“bargain hunters,” “loyal regulars,” …), and a teammate then trains an SVM to predict those names for new customers. What happened?","multi":false,"fixed":false,"opts":[["A clustering result became labels for a classifier","Clustering found groups without labels; once named, the groups can serve as labels for classification.",""],["The SVM is now doing clustering instead of classifying","It classifies into labels it was given.","Confusing the two methods."],["The SVM has been turned into an unsupervised method","The SVM still learns from labels it was given; where the labels came from doesn’t change what it does.","Confusing the two methods."],["The SVM will find better clusters than k-means did","It doesn’t find clusters; it learns the given labels.","Misunderstanding the roles."]],"ok":[0],"id":"x-m4-11","seq":78,"sec":1,"set":2},{"m":"m5","sc":19,"q":"Which type of outlier is finding 1?","multi":false,"fixed":false,"opts":[["Collective outlier","No single purchase is unusual; the group of them together is.",""],["Point outlier","Each purchase alone looks ordinary.","Looking for one extreme value."],["Contextual outlier","The issue isn’t a single value in the wrong context but a pattern across many values.","Confusing collective and contextual."],["Not an outlier","The pattern is clearly abnormal.","Missing the pattern."]],"ok":[0],"id":"x-m5-4","seq":79,"sec":2,"set":2},{"m":"m5","sc":19,"q":"Which type of outlier is finding 2?","multi":false,"fixed":false,"opts":[["Contextual outlier","$8,000 is normal in general but abnormal for July.",""],["Point outlier","The value isn’t extreme compared with the whole year.","Ignoring context."],["Collective outlier","It’s a single value, not a group.","Mixing up types."],["Bad data","Nothing suggests an error; it’s just unusual for the season.","Assuming every outlier is an error."]],"ok":[0],"id":"x-m5-5","seq":80,"sec":2,"set":2},{"m":"m5","sc":19,"q":"What’s the best handling of finding 3?","multi":false,"fixed":false,"opts":[["Treat it as bad data: remove or impute the age","No one is 214. It’s an entry error, not a real phenomenon.",""],["Keep it, since outliers should never be removed","Impossible values are errors.","Applying a blanket rule."],["Model very old customers as a separate segment","There are no 214-year-old customers to model.","Treating an error as a real group."],["Delete the whole customer from every table","Usually unnecessary; other fields may be fine.","Overreacting."]],"ok":[0],"id":"x-m5-6","seq":81,"sec":2,"set":2},{"m":"m5","sc":19,"q":"Which of the three is generally hardest to detect, and why?","multi":false,"fixed":false,"opts":[["Finding 1, since each value alone looks normal","Simple value-based checks (box plots, SD rules) can’t see a pattern across many normal values.",""],["Finding 3, since it’s the most extreme value","Extreme values are the easiest to catch.","Reversing difficulty."],["Finding 2, since it’s a very large amount","It’s large but normal for the year, so you need context, which is moderately hard.","Picking the wrong one."],["All equally easy, since a box plot flags them all","A box plot catches only finding 3.","Overtrusting one tool."]],"ok":[0],"id":"x-m5-7","seq":82,"sec":2,"set":2},{"m":"m5","sc":20,"q":"What is the upper limit beyond which points are flagged?","multi":false,"fixed":false,"opts":[["50 minutes","IQR = 32 − 20 = 12, and Q3 + 1.5 × 12 = 32 + 18 = 50.",""],["48 minutes","That’s where the whisker ends (the largest point inside the limit), not the limit itself.","Confusing the whisker end with the fence."],["44 minutes","That uses 1 × IQR instead of 1.5.","Wrong multiplier."],["38 minutes","That adds 1.5 × IQR to the median.","Starting from the wrong quartile."]],"ok":[0],"id":"x-m5-8","seq":83,"sec":2,"set":2},{"m":"m5","sc":20,"q":"Three days are flagged (55, 61, and 90 minutes). The 90 occurred when a technician confirmed the door was left open overnight. What should happen to that point if the goal is to model normal refrigerator performance?","multi":false,"fixed":false,"opts":[["It’s real but not part of normal operations, so it can be excluded","Real but not relevant to the question being asked, as long as you know why it happened.",""],["It must be bad data, so delete it from every analysis","It actually happened; it’s not an error.","Assuming every outlier is an error."],["Keep it, since every real data point belongs in every model","Relevance depends on the question.","Using a blanket rule."],["Replace it with the median, 26, to reduce its influence","That invents a value for a day that really was abnormal.","Imputing a real event away."]],"ok":[0],"id":"x-m5-9","seq":84,"sec":2,"set":2},{"m":"m5","sc":20,"q":"If the pharmacy cared about the risk of spoiled medicine instead, what should happen to the 90-minute day?","multi":false,"fixed":false,"opts":[["Keep it; such events are exactly the risk being studied","When the question is about rare harmful events, those outliers are the signal.",""],["Remove it, since it’s still flagged as an outlier","Whether to keep a point depends on the question, not the label “outlier.”","Treating “outlier” as “remove.”"],["Cap it at 50, the flagging limit, then keep it","That understates the real risk.","Hiding extremes."],["It doesn’t matter, since it’s only one of 365 days","It matters a lot for a risk question.","Ignoring context."]],"ok":[0],"id":"x-m5-10","seq":85,"sec":2,"set":2},{"m":"m6","sc":21,"q":"On the third day, 205 customers come in, above μ. What does that day do to S in this decrease CUSUM?","multi":false,"fixed":false,"opts":[["It reduces S, partly erasing the evidence of a drop","In the decrease CUSUM, μ − xₜ − C = 200 − 205 − 10 is negative, so a good day pulls S down (but never below 0).",""],["Nothing; a decrease CUSUM ignores days above the mean","Days above the mean count against the evidence of a drop; they’re not ignored.","Thinking only one side of the data matters."],["It raises S, since the count is far from μ","The decrease CUSUM measures how far below μ a day is; being above μ works the other way.","Treating any deviation as evidence."],["It resets S to 0, wiping out all evidence of a drop","It lowers S by the shortfall; S hits 0 only if that’s enough to use up all of S.","Overstating the reset."]],"ok":[0],"id":"x-m6-5","seq":86,"sec":2,"set":2},{"m":"m6","sc":21,"q":"Day-to-day counts naturally swing by ±30, and the owner only cares about large, lasting drops. Which adjustment fits?","multi":false,"fixed":false,"opts":[["Raise C (and possibly T) to ignore normal swings","A larger allowance ignores normal variation; a larger threshold demands more total evidence.",""],["Lower C and T so that every dip is caught early","That causes constant false alarms from normal swings.","Maximizing sensitivity."],["Set C = 0 so that every lost customer counts","Then noise builds up into false alarms.","Ignoring noise."],["Switch to an increase CUSUM to track good days","The owner cares about decreases.","Wrong direction."]],"ok":[0],"id":"x-m6-6","seq":87,"sec":2,"set":2},{"m":"m6","sc":21,"q":"The owner wants to show that a new competitor hurt business. After seeing the data, he tries many C and T values and reports the one pair that shows a drop right after the competitor opened. What’s the problem?","multi":false,"fixed":false,"opts":[["Picking settings to fit the desired result is cherry-picking","Results that depend on hand-picked settings aren’t reliable evidence.",""],["Nothing; trying many settings is a thorough analysis","Picking the one that fits your story isn’t thoroughness.","Confusing search with rigor."],["He should have used an increase CUSUM instead","A decrease CUSUM is the right tool for a drop; the problem is how he chose C and T.","Missing the point."],["CUSUM can’t detect drops caused by competitors","It can detect the drop; it can’t prove the cause.","Wrong objection."]],"ok":[0],"id":"x-m6-7","seq":88,"sec":2,"set":2},{"m":"m6","sc":21,"q":"Which data should the owner use to set μ?","multi":false,"fixed":false,"opts":[["A stable period of normal operation before any suspected change","μ should describe “normal,” not include the change you’re trying to detect.",""],["All the data, including the period after the competitor opened","A μ dragged down by the drop makes the drop harder to detect.","Contaminating the baseline."],["The single best week ever","That sets an unrealistically high normal.","Choosing an extreme."],["Whatever value makes the alarm go off soonest","That’s tuning to a conclusion.","Cherry-picking."]],"ok":[0],"id":"x-m6-8","seq":89,"sec":2,"set":2},{"m":"m7","sc":22,"q":"With α = 0.3, yesterday’s baseline was 100 and today’s count is 120. Where does today’s baseline land?","multi":false,"fixed":false,"opts":[["Between 100 and 120, closer to 100","With α = 0.3, 30% of the weight goes to today’s count and 70% to the old baseline: 0.3 × 120 + 0.7 × 100 = 106.",""],["Between 100 and 120, closer to 120","That would need α above 0.5.","Swapping α and 1 − α."],["Exactly 120, since the newest reading is the best information","That’s α = 1, which ignores the history entirely.","Ignoring the old baseline."],["Exactly 100, since one reading isn’t enough to move it","Any α above 0 moves the baseline toward the new reading.","Treating α as 0."]],"ok":[0],"id":"x-m7-8","seq":90,"sec":2,"set":2},{"m":"m7","sc":22,"q":"What will the forecasts for each of the next three days look like?","multi":false,"fixed":false,"opts":[["All three equal to today’s baseline (about 106)","Simple exponential smoothing has no trend or seasonal term, so every future day gets the current baseline.",""],["Rising each day, continuing the jump from 100 toward 120","That assumes a trend, which simple smoothing doesn’t have.","Adding a trend term."],["All three equal to 120, today’s count","The forecast is the smoothed baseline, not the last raw count.","Forecasting with the raw value."],["Drifting back toward 100, since the jump is probably noise","Simple smoothing doesn’t forecast a return; it projects the current baseline flat.","Building in mean reversion."]],"ok":[0],"id":"x-m7-9","seq":91,"sec":2,"set":2},{"m":"m7","sc":22,"q":"Traffic permanently jumps from about 100 to about 150 a day after a news story. How does α affect how quickly the baseline catches up?","multi":false,"fixed":false,"opts":[["A larger α catches up faster but reacts more to noise","A larger α gives new readings more weight, which helps after real shifts and hurts with random spikes.",""],["A smaller α catches up faster, since it’s more stable","A smaller α trusts the old baseline more, so it adapts slowly.","Reversing α."],["α doesn’t affect speed; only the size of the jump does","That’s exactly what α controls.","Ignoring α’s role."],["No α ever fully reaches 150, so the choice doesn’t matter","With any α above 0 it gets there gradually.","Overstating the lag."]],"ok":[0],"id":"x-m7-10","seq":92,"sec":2,"set":2},{"m":"m7","sc":22,"q":"Why is this method called “exponential” smoothing?","multi":false,"fixed":false,"opts":[["A reading’s weight shrinks by (1 − α) each period","Expanding Sₜ gives weights α, α(1 − α), α(1 − α)², …, which decay geometrically (exponentially).",""],["It fits an exponential growth curve to the data","It doesn’t assume growth.","Taking the name literally."],["It raises each reading to the power α before averaging","α is a weight, not an exponent on the data.","Misreading the formula."],["Its forecast errors grow exponentially with the horizon","The name refers to the weights.","Misattributing the name."]],"ok":[0],"id":"x-m7-11","seq":93,"sec":2,"set":2},{"m":"m7","sc":23,"q":"Which smoothing approach fits this series best?","multi":false,"fixed":false,"opts":[["Holt-Winters with a trend and multiplicative seasonality","There’s a trend, a yearly cycle, and seasonal swings that grow with the level.",""],["Holt-Winters with a trend and additive seasonality","Additive seasonality assumes the swings stay the same size.","Missing the growing swings."],["Single exponential smoothing","That has no trend or seasonal terms.","Ignoring visible structure."],["Double (trend) smoothing without seasonality","That misses the yearly cycle.","Ignoring seasonality."]],"ok":[0],"id":"x-m7-12","seq":94,"sec":2,"set":2},{"m":"m7","sc":23,"q":"For this monthly data, what is the season length L?","multi":false,"fixed":false,"opts":[["12","The pattern repeats every 12 months.",""],["4","That’s the number of years shown.","Counting cycles instead of their length."],["48","That’s the total number of months.","Using all the data as one cycle."],["7","That would be a weekly cycle in daily data.","Using the wrong cycle."]],"ok":[0],"id":"x-m7-13","seq":95,"sec":2,"set":2},{"m":"m7","sc":23,"q":"How many years of data are generally needed to estimate the seasonal factors well?","multi":false,"fixed":false,"opts":[["Several full years, since each factor updates once a year","Each seasonal factor gets only one new observation per year.",""],["A single month, since each month has 30 days of data","You can’t see a yearly cycle in one month.","Ignoring the cycle length."],["Exactly one year, since that covers every month once","One year gives each factor a single data point.","Underestimating noise."],["None, since the factors are set by hand before fitting","They’re estimated from the data.","Misunderstanding fitting."]],"ok":[0],"id":"x-m7-14","seq":96,"sec":2,"set":2},{"m":"m7","sc":23,"q":"If the retailer used single exponential smoothing anyway, what would its forecast for the next 12 months look like?","multi":false,"fixed":false,"opts":[["A flat line, missing both the growth and the yearly peaks","Single smoothing has no trend or seasonal terms, so every future month gets the same forecast.",""],["A rising line that continues the trend in the data","That needs a trend term.","Assuming a trend is built in."],["A repeating yearly pattern around the current level","That needs seasonal factors.","Assuming seasonality is built in."],["An exact copy of the last 12 months of sales","Smoothing doesn’t replay past values.","Confusing it with a naive seasonal forecast."]],"ok":[0],"id":"x-m7-15","seq":97,"sec":2,"set":2},{"m":"m8","sc":24,"q":"What does Plot 1 suggest, and what’s the fix?","multi":false,"fixed":false,"opts":[["The relationship is curved; add a squared term (x²)","A U-shape in the residuals means a straight line is systematically wrong at both ends and in the middle.",""],["Unequal spread; apply a Box-Cox transformation","The spread looks steady; the problem is the curve.","Mixing up the two patterns."],["The model fits well, since residuals average to 0","They average to 0 but follow a clear pattern.","Ignoring structure in the residuals."],["There are outliers; remove the points at both ends","The ends follow the curve; they aren’t outliers.","Deleting signal."]],"ok":[0],"id":"x-m8-10","seq":98,"sec":3,"set":2},{"m":"m9","sc":24,"q":"What does Plot 2 suggest, and what’s a common fix?","multi":false,"fixed":false,"opts":[["Unequal spread (heteroscedasticity); try Box-Cox on y","A fan shape means unequal variance, which a variance-stabilizing transformation addresses.",""],["The relationship is curved; add a squared term","There’s no curve, just widening spread.","Mixing up the two patterns."],["The data has a time trend; detrend it first","Nothing here involves time.","Wrong tool."],["Nothing is wrong; residuals average out to 0","A fan shape breaks the constant-variance assumption.","Missing the pattern."]],"ok":[0],"id":"x-m9-6","seq":99,"sec":3,"set":2},{"m":"m8","sc":24,"q":"Select <b>all<\/b> of the models that still count as linear regression.","multi":true,"fixed":true,"opts":[["y = a₀ + a₁x + a₂x²","It’s linear in the coefficients, even though x is squared.",""],["log(y) = a₀ + a₁x₁ + a₂x₂","The response is transformed, but the model is linear in the coefficients.",""],["y = a₀ + a₁x₁ + a₂x₂ + a₃x₁x₂","An interaction is just another term with its own coefficient.",""],["y = a₀ + x^(a₁)","The coefficient is in an exponent, so the model isn’t linear in its coefficients.","Thinking any formula with x counts."]],"ok":[0,1,2],"id":"x-m8-11","seq":100,"sec":3,"set":2},{"m":"mix","sc":25,"q":"Leadership asks, “How much additional sales is each extra $1,000 of advertising associated with, holding price and promotions constant?” Which model is most appropriate?","multi":false,"fixed":true,"opts":[["ARIMA","ARIMA forecasts a series’ future values from its own past values and errors.","Choosing a tool built for a different kind of question."],["CART (classification and regression trees)","CART splits the data into if-then branches to classify or predict; it isn’t the most direct tool for this question.","Choosing a tool built for a different kind of question."],["CUSUM","CUSUM detects when the mean of a process has changed.","Choosing a tool built for a different kind of question."],["Cross-validation","Cross-validation evaluates and compares models; it isn’t a model that answers the question.","Choosing a tool built for a different kind of question."],["Exponential smoothing","Exponential smoothing smooths a time series and forecasts its level, trend, and seasonality.","Choosing a tool built for a different kind of question."],["GARCH","GARCH estimates and forecasts variance (how much values swing), not the value itself.","Choosing a tool built for a different kind of question."],["k-means clustering","k-means finds groups in unlabeled data; it doesn’t predict a response.","Choosing a tool built for a different kind of question."],["k-nearest-neighbor classification","KNN assigns a class from a point’s neighbors.","Choosing a tool built for a different kind of question."],["Linear regression","Regression estimates how the response changes with each predictor while holding the others constant.",""],["Logistic regression","Logistic regression predicts the probability of an outcome from a set of factors.","Choosing a tool built for a different kind of question."],["Principal component analysis","PCA transforms the predictors; it doesn’t make predictions on its own.","Choosing a tool built for a different kind of question."],["Support vector machine","An SVM assigns a class; it doesn’t directly give a probability.","Choosing a tool built for a different kind of question."]],"ok":[8],"id":"x-mix-5","seq":101,"sec":3,"set":2},{"m":"m8","sc":25,"q":"Is that a descriptive or a predictive use of regression?","multi":false,"fixed":false,"opts":[["Descriptive: it explains how the system works","It asks what the relationship is, not what a specific future value will be.",""],["Predictive: it forecasts next week’s sales","The question is about the size of an effect, not a forecast.","Equating any regression with prediction."],["Prescriptive: it decides the ad budget","Deciding the budget would be a further step.","Jumping to the decision."],["Neither; regression can’t answer it","It’s a textbook regression question.","Underrating regression."]],"ok":[0],"id":"x-m8-12","seq":102,"sec":3,"set":2},{"m":"m8","sc":25,"q":"The ad coefficient is 40 (units per $1,000). In practice, ads and promotions usually happen together. What does 40 describe?","multi":false,"fixed":false,"opts":[["The association of ads with sales when promotions (and price) are held fixed","Each coefficient is a “holding the others constant” effect, even if that combination is rare in practice.",""],["The total effect of a typical campaign, including the promotions that come with it","Promotions have their own coefficient.","Ignoring “holding others fixed.”"],["Proof that each $1,000 of ads causes 40 extra sales","Observational data shows association, not proof of cause.","Reading cause into a coefficient."],["Nothing, since the predictors are correlated","Correlated predictors make coefficients less precise, not meaningless.","Overreacting."]],"ok":[0],"id":"x-m8-13","seq":103,"sec":3,"set":2},{"m":"m8","sc":26,"q":"Which version of AIC is recommended here, and why?","multi":false,"fixed":false,"opts":[["AICc, since there are few data points per parameter","AICc adds an extra penalty that matters when n is small compared with k.",""],["Regular AIC, since it works at any data size","With n = 30 and k = 9, AIC under-penalizes complexity.","Ignoring the small-sample issue."],["BIC, since its penalty suits small samples best","BIC is the stricter penalty for large data; AICc is the small-sample fix.","Mixing up the criteria."],["None, since models can’t be compared on 30 points","You can; you just need the correction.","Overstating the limit."]],"ok":[0],"id":"x-m8-14","seq":104,"sec":3,"set":2},{"m":"m8","sc":26,"q":"The AICc correction, 2k(k + 1)/(n − k − 1), is added to AIC. With n = 30, how does it treat the two models?","multi":false,"fixed":false,"opts":[["It penalizes the 9-parameter model much more than the 4-parameter one","The correction grows quickly as k gets closer to n: about 1.6 for k = 4, but 9 for k = 9.",""],["It adds the same amount to both, so the comparison doesn’t change","The correction depends on k, so it widens the gap between them.","Ignoring the formula’s dependence on k."],["It favors the bigger model, since more parameters fit small data better","The correction exists to stop small samples from rewarding extra parameters.","Reversing the purpose."],["It barely matters, since n = 30 counts as large","With k = 9, n − k − 1 is only 20, so the correction is substantial.","Misjudging “small” relative to k."]],"ok":[0],"id":"x-m8-15","seq":105,"sec":3,"set":2},{"m":"m8","sc":26,"q":"In Model 2, one coefficient’s 95% confidence interval is [−0.4, 1.2]. What can you say?","multi":false,"fixed":false,"opts":[["Zero is plausible, so p > 0.05; no clear effect","An interval that includes 0 means the effect isn’t significant at the 5% level.",""],["The effect is 0.4, the distance from 0 to the low end","The interval is a range of plausible values, not a point.","Misreading the interval."],["The effect is positive, since most of the interval is above 0","Zero is still inside the interval.","Eyeballing instead of checking 0."],["The p-value must be below 0.05, since the interval is narrow","An interval containing 0 means it’s above 0.05.","Reversing the link."]],"ok":[0],"id":"x-m8-16","seq":106,"sec":3,"set":2},{"m":"m9","sc":27,"q":"What is the detrended value for 2015, and what does it mean?","multi":false,"fixed":false,"opts":[["−80: gold was $80 below its trend that year","Detrended = 1,160 − 1,240 = −80.",""],["+80: gold was $80 above its trend that year","The actual price is below the trend.","Subtracting in the wrong order."],["−90: gold fell $90 from the previous year","That’s a change between years, which isn’t detrending.","Confusing detrending with differencing."],["1,160: detrending leaves actual prices unchanged","Detrending subtracts the trend.","Misunderstanding detrending."]],"ok":[0],"id":"x-m9-7","seq":107,"sec":3,"set":2},{"m":"m9","sc":27,"q":"If the fitted trend line were steeper, what would happen to the detrended values in the most recent years?","multi":false,"fixed":false,"opts":[["They’d be lower, since more is subtracted","A steeper line rises faster, so later actual prices sit further below it.",""],["They’d be higher, since prices grow faster","More is subtracted, so they go down.","Reversing the effect."],["They’d be unchanged, since prices are the same","The trend value is what’s subtracted, so they change.","Missing the dependence."],["They’d all be 0, since the trend fits better","Only a perfect fit would do that.","Overstating it."]],"ok":[0],"id":"x-m9-8","seq":108,"sec":3,"set":2},{"m":"m9","sc":27,"q":"Why detrend before regressing gold prices on factors like inflation and GDP?","multi":false,"fixed":false,"opts":[["A shared trend can make unrelated factors look predictive","Removing the trend leaves the year-to-year movements the model should explain.",""],["Detrending makes the data normally distributed","That’s not its purpose.","Confusing it with Box-Cox."],["To make the residuals normally distributed","That’s the job of a transformation like Box-Cox; detrending removes a time pattern.","Confusing detrending with Box-Cox."],["Detrending removes outliers from each series","It removes a trend, not outliers.","Wrong purpose."]],"ok":[0],"id":"x-m9-9","seq":109,"sec":3,"set":2},{"m":"m10","sc":46,"q":"For one customer, the model’s log-odds come out to −0.2. Roughly what is that customer’s probability of responding?","multi":false,"fixed":false,"opts":[["A bit under 50%","Log-odds of 0 means even odds (50%). A small negative value means odds slightly below 1, so the probability is slightly below 50% (about 45%).",""],["−20%","Log-odds aren’t probabilities; the logistic form always turns them into a value between 0 and 1.","Reading log-odds as a probability."],["About 20%","A log-odds of −0.2 is close to 0, which is close to 50%, not 20%.","Misreading the scale."],["A bit over 50%","Negative log-odds mean the odds are below 1, so the probability is below 50%.","Getting the sign backward."]],"ok":[0],"id":"x-m10-11","seq":110,"sec":3,"set":2},{"m":"m10","sc":46,"q":"What does the positive coefficient 1.2 on “opened last email” tell you?","multi":false,"fixed":false,"opts":[["Opening goes with a higher response probability, other factors fixed","A positive coefficient raises the linear part, which moves p up the S-curve; p still stays below 1.",""],["Opening raises the response probability by exactly 1.2 points","The coefficient acts on the linear part inside the logistic function, not directly on p.","Reading it as a linear effect on probability."],["Opening raises the probability of responding by 120%","p can’t rise above 1, and the coefficient isn’t a percent change.","Reading it as a percent change."],["Opening causes about 1.2 more purchases per customer","The response is whether a customer responds, and the model shows association, not cause.","Misreading the response."]],"ok":[0],"id":"x-m10-12","seq":111,"sec":3,"set":2},{"m":"m10","sc":46,"q":"Why use logistic regression here rather than linear regression on a 0/1 response?","multi":false,"fixed":false,"opts":[["Linear predictions can fall below 0 or above 1","The logistic form always keeps predictions between 0 and 1.",""],["Linear regression can’t use a 0/1 predictor like “opened email”","It can; yes/no predictors work fine in linear regression. The problem is the 0/1 response.","Confusing a binary predictor with a binary response."],["Logistic regression needs less data than linear regression","Data needs aren’t the reason; the issue is that probabilities must stay between 0 and 1.","Naming the wrong reason."],["Linear regression always overfits binary data","The issue is the output range, not overfitting.","Wrong reason."]],"ok":[0],"id":"x-m10-13","seq":112,"sec":3,"set":2},{"m":"m10","sc":46,"q":"The model’s area under the ROC curve (AUC) is 0.85. What does that mean?","multi":false,"fixed":false,"opts":[["A random responder outscores a random non-responder 85% of the time","AUC measures how well the model ranks positives above negatives, across all cutoffs.",""],["85% of the model’s predictions are correct at the 50% cutoff","That’s accuracy at one cutoff, not AUC.","Mixing up AUC and accuracy."],["85% of the customers it targets will respond to the catalog","AUC isn’t a response rate.","Misreading the measure."],["It’s only slightly better than guessing, which gives 0.8","Guessing gives an AUC of 0.5; 0.85 is good.","Misjudging the scale."]],"ok":[0],"id":"x-m10-14","seq":113,"sec":3,"set":2},{"m":"m10","sc":46,"q":"Mailing a catalog costs $2, and a response is worth $50 in profit. Above what probability should the retailer mail a customer?","multi":false,"fixed":false,"opts":[["4%","Mail when p × 50 > 2, which means p > 0.04.",""],["50%","That ignores the costs and rewards.","Using the default cutoff."],["96%","That reverses the calculation.","Flipping the ratio."],["25%","That’s 50 / 2 turned into a percentage incorrectly.","Arithmetic slip."]],"ok":[0],"id":"x-m10-15","seq":114,"sec":3,"set":2},{"m":"m10","sc":47,"q":"When growing a regression tree, how is each split chosen?","multi":false,"fixed":false,"opts":[["The split that most reduces variance within the branches","For each factor it finds the split with the biggest variance decrease, and makes the best one only if it beats a threshold.",""],["A random factor and split point, chosen each time","Random choices are a forest idea, and even there the best split among the sampled factors is used.","Confusing trees with forests."],["The factor with the largest values or widest range","A factor’s scale or range doesn’t decide splits; variance decrease does.","Confusing scale with usefulness."],["Splits chosen by the analyst, one level at a time","The algorithm chooses the splits.","Misunderstanding who decides."]],"ok":[0],"id":"x-m10-16","seq":115,"sec":4,"set":2},{"m":"m10","sc":47,"q":"As the tree grows deeper, training error keeps falling, but validation error starts rising. What should be done?","multi":false,"fixed":false,"opts":[["Prune branches that don’t help on held-out data","Deep trees overfit. The lecture grows on half the data and removes any split that raises error on the other half.",""],["Keep growing until every leaf holds a single household","That’s maximum overfitting.","Chasing training error."],["Switch to a hard-margin SVM to stop the overfitting","That doesn’t address the tree’s depth.","Wrong fix."],["Ignore validation error, since training error is what counts","Validation error measures performance on new data.","Trusting training fit."]],"ok":[0],"id":"x-m10-17","seq":116,"sec":4,"set":2},{"m":"m10","sc":47,"q":"Why does a random forest consider only a random subset of the factors at each split?","multi":false,"fixed":false,"opts":[["So the trees differ, which makes averaging them more effective","If every tree could use the strongest factor at the top, they’d all look alike.",""],["To make each individual tree as accurate as possible","Individual trees get slightly worse; the ensemble gets better.","Confusing a single tree with the forest."],["To speed up training, with no effect on accuracy","It does speed things up, but the main purpose is making the trees different so averaging helps.","Missing the main reason."],["To make the forest’s predictions easier to explain","Forests are harder to explain.","Reversing the trade-off."]],"ok":[0],"id":"x-m10-18","seq":117,"sec":4,"set":2},{"m":"m10","sc":47,"q":"The forest has 500 trees. How does it predict a household’s usage?","multi":false,"fixed":false,"opts":[["It averages the 500 trees’ predictions","For regression, forests average. For classification, they take a majority vote.",""],["It uses the single best tree","Forests combine all their trees.","Confusing a forest with selection."],["It uses the median of the training data","That ignores the household’s factors.","Ignoring the model."],["It takes a majority vote over usage categories","Voting is for classification; usage is a number.","Mixing up tasks."]],"ok":[0],"id":"x-m10-19","seq":118,"sec":4,"set":2},{"m":"m10","sc":47,"q":"Which is the main <b>disadvantage<\/b> of the random forest compared with a single regression tree?","multi":false,"fixed":false,"opts":[["It’s much harder to explain any single prediction","Hundreds of averaged trees don’t give a single readable rule.",""],["It usually predicts worse than one well-pruned tree","It usually predicts better.","Reversing the trade-off."],["It overfits more, since it has hundreds of trees","Averaging many varied trees usually reduces overfitting.","Thinking more trees means more overfitting."],["It needs more labeled data than a single tree","Both are trained on the same data; the real trade-off is explainability.","Naming the wrong trade-off."]],"ok":[0],"id":"x-m10-20","seq":119,"sec":4,"set":2},{"m":"mix","sc":28,"q":"The company wants to know as soon as a customer’s typical daily spending has <b>shifted upward<\/b> from its usual level. Which model is most appropriate?","multi":false,"fixed":true,"opts":[["ARIMA","ARIMA forecasts a series’ future values from its own past values and errors.","Choosing a tool built for a different kind of question."],["CART (classification and regression trees)","CART splits the data into if-then branches to classify or predict; it isn’t the most direct tool for this question.","Choosing a tool built for a different kind of question."],["CUSUM","CUSUM detects a change in a process’s mean as quickly as the evidence allows.",""],["Cross-validation","Cross-validation evaluates and compares models; it isn’t a model that
