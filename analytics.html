has changed: whether action is needed (maintenance), whether an action had an effect (tax policy), or what has drifted over time (voting). Grouping similar voters is clustering, and predicting next month's value is forecasting.","note":"Change detection uses: do we need to act? did our action work? what has drifted? (Uses range from big long-term changes to short-term ones to small changes vs noise.)","concept":"Uses of change detection","trap":"Select-all: pick every correct choice and only those."},{"m":"m7","sc":17,"q":"In the equations, what is <i>x<sub>t<\/sub><\/i>?","multi":false,"fixed":false,"opts":[["Week of year of day t","",""],["ER admissions on day t","",""],["Average temperature on day t","",""],["Day of week of day t","",""]],"ok":[1],"id":"g-C-1a","seq":0,"sec":2,"set":2,"ex":"x_t is the observed value of the response being smoothed, here daily ER admissions. Temperature is a possible predictor, but exponential smoothing uses only the series' own past values, so it has no role as x_t.","note":"x_t = observed response at time t (never a predictor).","concept":"Holt-Winters: x_t is the response","trap":"Right idea, wrong number or quantity."},{"m":"m7","sc":17,"q":"What value of <i>L<\/i> should the hospital use?","multi":false,"fixed":true,"opts":[["3 (years of data)","",""],["7","",""],["24","",""],["52","",""],["365","",""]],"ok":[1],"id":"g-C-1b","seq":1,"sec":2,"set":2,"ex":"L is the length of one cycle. The question asks about day-of-week patterns in daily data, so one cycle is 7 days. 52 or 365 would be right only for a yearly pattern.","note":"L = number of periods in one cycle (daily data, weekly cycle → L = 7).","concept":"Holt-Winters: cycle length L","trap":"Right idea, wrong number or quantity."},{"m":"m7","sc":17,"q":"After fitting, the seasonal factors <i>C<\/i> are close to 1 for most days, but about 1.2 for Saturdays. What can be concluded?","multi":false,"fixed":false,"opts":[["Saturdays tend to have about 20% more admissions than the baseline.","",""],["Saturdays tend to have about 20% fewer admissions than the baseline.","",""],["Saturdays tend to have about 20% more admissions than the baseline, because people do riskier activities on weekends.","",""],["Saturday admissions have been rising by about 20% per year.","",""],["There is no meaningful day-of-week effect on admissions.","",""]],"ok":[0],"id":"g-C-1c","seq":2,"sec":2,"set":2,"ex":"C > 1 means that period's response is higher than the baseline by that factor, so Saturdays run about 20% above the baseline. The model only describes the pattern and can't say why, so the 'riskier activities' version adds a causal claim the model can't support.","note":"C>1: that season's response is above baseline (×C); C<1: below. The model doesn't show cause.","concept":"Holt-Winters: interpreting C","trap":"Adds a cause the data can't support."},{"m":"m7","sc":17,"q":"Over the 3 years, the fitted values of <i>T<\/i> are consistently slightly negative. What can be concluded?","multi":false,"fixed":false,"opts":[["The Saturday effect is getting weaker over time.","",""],["Daily ER admissions tend to be increasing over time.","",""],["The model has too much randomness to be used.","",""],["Daily ER admissions tend to be decreasing over time.","",""]],"ok":[3],"id":"g-C-1d","seq":3,"sec":2,"set":2,"ex":"T is the trend, meaning the change in the baseline S per period. A negative T means the baseline level of admissions is falling over time. A weakening weekly pattern would appear in C, not in T.","note":"T>0: baseline rising over time; T<0: falling. Seasonal changes show up in C, not T.","concept":"Holt-Winters: interpreting T","trap":"The direction is flipped."},{"m":"m7","sc":17,"q":"An analyst uses the common start values (<i>S<sub>1<\/sub><\/i> = <i>x<sub>1<\/sub><\/i>, <i>T<sub>1<\/sub><\/i> = 0, <i>C<sub>1<\/sub><\/i>…<i>C<sub>L<\/sub><\/i> = 1) but by mistake fixes γ = 0. What happens?","multi":false,"fixed":false,"opts":[["The factors are learned more slowly but still end up near 1.2 for Saturdays.","",""],["The trend T is forced to 0, so the model can only capture seasonality.","",""],["Each C_t equals the latest x_t/S_t, so the factors react fully to each new week.","",""],["Every C stays at 1 forever, so the model never captures the weekly pattern.","",""]],"ok":[3],"id":"g-C-1e","seq":4,"sec":2,"set":2,"ex":"With γ = 0, C_t = C_{t−L}, so every factor stays at its start value of 1, and the x_t/C_{t−L} term never adjusts for the day of the week. Fully reacting to the latest week would need γ = 1. Slow learning would need a small positive γ, not γ = 0.","note":"γ=0 → C never updates (stays at start value, e.g. 1); γ near 1 → C follows latest x/S. Start: S1=x1, T1=0, C=1.","concept":"Holt-Winters: γ and start values","trap":"The direction is flipped."},{"m":"m7","sc":18,"q":"At the end of week 3, what is the forecast for week 5?","multi":false,"fixed":false,"opts":[["105","",""],["90","",""],["100","",""],["110","",""]],"ok":[2],"id":"g-C-2a","seq":0,"sec":2,"set":2,"ex":"S1 = 100, S2 = 0.5(120) + 0.5(100) = 110, S3 = 0.5(90) + 0.5(110) = 100. Single smoothing has no trend term, so every future forecast equals S3 = 100. 90 is the last observation, not the smoothed estimate.","note":"Single ES forecast for every horizon = latest S_t (flat line).","concept":"Single ES: computing S_t and the flat forecast","trap":"Right idea, wrong number or quantity."},{"m":"m7","sc":18,"q":"Using the forecast-error variance formula for simple exponential smoothing from class, σ<sub>k<\/sub><sup>2<\/sup> = σ<sup>2<\/sup>(1 + α<sup>2<\/sup>(k−1)), what is the error variance of the forecast for week 6, made at the end of week 3?","multi":false,"fixed":true,"opts":[["σ²","",""],["1.25σ²","",""],["1.5σ²","",""],["2σ²","",""],["3σ²","",""]],"ok":[2],"id":"g-C-2b","seq":1,"sec":2,"set":2,"ex":"Week 6 is k = 3 periods ahead, so σ²(1 + 0.25·2) = 1.5σ². 1.25σ² would be the 2-week-ahead (week 5) value.","note":"Simple ES k-step error variance σ²(1+α²(k−1)): grows with k.","concept":"Forecast error grows with horizon","trap":"Right idea, wrong number or quantity."},{"m":"m7","sc":18,"q":"Suppose the chain looks at a different product over 3 years: sales rise slowly year over year, peak every December, and bounce up and down from week to week for no clear reason. Which description is correct?","multi":false,"fixed":false,"opts":[["Slow rise = randomness (α); December peak = cycle (C, γ); weekly bounce = trend (T, β)","",""],["Single smoothing handles all three, because α adapts to whatever pattern is present","",""],["Slow rise = seasonality (C, γ); December peak = trend (T, β); weekly bounce = randomness (α)","",""],["Slow rise = trend (T, β); December peak = cycle (C, γ, L = 52); weekly bounce = randomness (α)","",""]],"ok":[3],"id":"g-C-2c","seq":2,"sec":2,"set":2,"ex":"Time series vary through trend (a long-run increase or decrease, handled by T and β), seasonality or cycles (a repeating pattern, handled by C, γ and L = 52 for weekly data with a yearly cycle) and randomness (handled by α's smoothing). Single smoothing has no T or C, so it lags a trend and misses the cycle.","note":"Trend → T, β; seasonality/cycle → C, γ, L; randomness → α smoothing.","concept":"Time-series components","trap":"A neighboring method that sounds right but answers a different question."},{"m":"m7","sc":18,"q":"Select ALL statements that are correct.","multi":true,"fixed":false,"opts":[["The forecast for 2 weeks ahead will always have a larger error than the forecast for 1 week ahead.","",""],["Good values of α (and of β, γ in Holt-Winters) are found by minimizing the sum of squared forecast errors on past data.","",""],["A larger α makes the smoothed series respond more slowly to real changes.","",""],["If seasonal swings grow in proportion to the overall level, a multiplicative seasonal factor fits better than an additive one.","",""],["If most week-to-week fluctuation is random noise, α should be closer to 0.","",""]],"ok":[1,3,4],"id":"g-C-2d","seq":3,"sec":2,"set":2,"ex":"Lots of randomness → α near 0, so the model trusts the baseline more. α, β and γ are fit by minimizing squared error, and proportional swings call for multiplicative seasonality. The variance of the error grows with the horizon, but any single error is not always larger. A larger α responds faster, not slower.","note":"α near 0 = lots of noise (trust the past); fit α,β,γ by min Σ(error²); multiplicative when swings scale with level.","concept":"Exponential smoothing: α, fitting, horizon, additive vs multiplicative","trap":"Select-all: pick every correct choice and only those."},{"m":"m7","sc":19,"q":"The analyst first takes one difference of the data (each month minus the previous month). Which ARIMA term does this set, and why?","multi":false,"fixed":false,"opts":[["d = 1, so the trending series becomes stationary","",""],["q = 1, so one previous forecast error is used","",""],["p = 1, so one previous value is used as a predictor","",""],["d = 1, so the random noise is removed from the series","",""]],"ok":[0],"id":"g-C-3a","seq":0,"sec":2,"set":2,"ex":"d is the order of differencing (the 'I'). Differencing a trending series makes it stationary, with mean and variance roughly constant over time. p is the autoregressive order (past differenced values) and q is the moving-average order (past forecast errors). Differencing removes the trend, not the noise.","note":"ARIMA(p,d,q): d = # differences to make data stationary; p = AR lags of differenced values; q = MA lags of past errors.","concept":"ARIMA: d and stationarity","trap":"A neighboring method that sounds right but answers a different question."},{"m":"m7","sc":19,"q":"The analyst fits ARIMA(0,1,1). A colleague points out that this is equivalent to a simpler, well-known forecasting model. Which one?","multi":false,"fixed":false,"opts":[["A pure AR(1) model","",""],["Simple (single) exponential smoothing","",""],["Holt-Winters triple exponential smoothing","",""],["GARCH(1,1)","",""],["A random walk","",""]],"ok":[1],"id":"g-C-3b","seq":1,"sec":2,"set":2,"ex":"ARIMA(0,1,1), with one difference, no AR terms and one MA term, is simple exponential smoothing. A random walk is ARIMA(0,1,0). Holt-Winters adds trend and seasonal terms that ARIMA(0,1,1) doesn't have.","note":"ARIMA(0,1,1) = simple exponential smoothing; ARIMA(0,1,0) = random walk.","concept":"ARIMA(0,1,1) = simple ES","trap":"A neighboring method that sounds right but answers a different question."},{"m":"m7","sc":19,"q":"A second product launched 15 weeks ago and its weekly sales are spiky. Which approach is more sensible for short-term forecasts?","multi":false,"fixed":false,"opts":[["ARIMA with large d, which removes the spikes and allows long-range forecasting","",""],["ARIMA, because it contains exponential smoothing as a special case and so can't do worse","",""],["GARCH, because spiky data means the variance is what should be forecast","",""],["Exponential smoothing, because ARIMA usually needs about 40 data points and does best on stable data","",""]],"ok":[3],"id":"g-C-3c","seq":2,"sec":2,"set":2,"ex":"A common rule of thumb is that ARIMA needs about 40 past data points and tends to beat exponential smoothing only on stable data. With 15 spiky points, exponential smoothing is the better choice. 'More general can't be worse' sounds reasonable, but too little data overrides it. Both methods are for short-term forecasting.","note":"ARIMA: ~40+ points, stable data, short-term; spiky/short series → exponential smoothing.","concept":"ARIMA data requirements","trap":"Usually true, but the details here override it."},{"m":"m7","sc":20,"q":"Which model is most appropriate for forecasting how variable demand will be in the coming weeks?","multi":false,"fixed":true,"opts":[["ARIMA","",""],["CART","",""],["Cross-validation","",""],["CUSUM","",""],["Exponential smoothing","",""],["GARCH","",""],["k-means clustering","",""],["k-nearest-neighbor classification","",""],["Linear regression","",""],["Logistic regression","",""],["Support vector machine","",""]],"ok":[5],"id":"g-C-4a","seq":0,"sec":3,"set":2,"ex":"GARCH estimates or forecasts the variance of a time series. ARIMA and exponential smoothing forecast the value itself, which the retailer already has. CUSUM detects whether a change has happened. It doesn't forecast variance.","note":"Forecast VARIANCE of a time series → GARCH (investment risk, inventory buffers).","concept":"Model choice: GARCH for variance","trap":"A neighboring method that sounds right but answers a different question."},{"m":"m7","sc":20,"q":"Select ALL statements that correctly describe GARCH.","multi":true,"fixed":false,"opts":[["It uses squared past errors (and past variances) as predictors.","",""],["It estimates or forecasts the variance of the series rather than its value.","",""],["It does not use differencing, unlike ARIMA's d term.","",""],["It requires a cycle length L, like Holt-Winters.","",""],["Its main output is a point forecast of next week's demand.","",""]],"ok":[0,1,2],"id":"g-C-4b","seq":1,"sec":3,"set":2,"ex":"GARCH looks like ARIMA, but it models variance using squared errors and past variances, and it has no differencing term. It doesn't need a cycle length L. Its output is a forecast of variance, not of demand.","note":"GARCH: variance, squared errors, no d. ARIMA: value, raw errors, has d.","concept":"GARCH vs ARIMA","trap":"Select-all: pick every correct choice and only those."},{"m":"m7","sc":20,"q":"How should the retailer use the GARCH variance forecast?","multi":false,"fixed":false,"opts":[["Carry less safety stock in weeks when the forecast variance is higher","",""],["Use it to signal the exact week when average demand shifted","",""],["Carry inventory above the point-estimate demand, with a larger buffer when the forecast variance is higher","",""],["Use it in place of the demand forecast when ordering","",""]],"ok":[2],"id":"g-C-4c","seq":2,"sec":3,"set":2,"ex":"A classic use: predicting the variance of demand tells you how much inventory to carry above the point-estimate expectation, and more variance means more buffer. Carrying less stock when variance is higher reverses this. Detecting a shift in the mean is a job for CUSUM.","note":"Variance forecast → buffer above point estimate (inventory); risk in portfolio optimization.","concept":"Uses of variance forecasts","trap":"The direction is flipped."},{"m":"m8","sc":21,"q":"What does the coefficient 2.0 on <i>stops<\/i> mean?","multi":false,"fixed":false,"opts":[["Each extra stop is associated with about 2 more minutes, because drivers need about 2 minutes to park at each stop.","",""],["Number of stops accounts for about 2% of the variation in delivery time.","",""],["Each extra stop is associated with about 2 more minutes of delivery time, holding the other predictors fixed.","",""],["Each extra stop increases delivery time by about 2%.","",""]],"ok":[2],"id":"g-C-5a","seq":0,"sec":3,"set":2,"ex":"A coefficient is the change in the predicted response per one-unit increase in that predictor, holding the others fixed, in minutes per stop. The parking explanation may sound reasonable, but the regression shows association, not why.","note":"a_j = change in predicted y per unit of x_j, others held fixed (units: y-units per x-unit).","concept":"Regression: coefficient interpretation","trap":"Adds a cause the data can't support."},{"m":"m8","sc":21,"q":"What is the best reading of the weekend p-value of 0.68?","multi":false,"fixed":false,"opts":[["There is an estimated 68% chance the weekend coefficient is really nonzero, so keep it.","",""],["Weekend status explains 68% of the variation in delivery time.","",""],["A coefficient this far from zero would be common even if weekends had no real effect, so there's little evidence it matters. Since p > 0.05, it's a candidate to remove.","",""],["Weekend deliveries are estimated to be about 0.4 minutes faster than weekday ones.","",""]],"ok":[2],"id":"g-C-5b","seq":1,"sec":3,"set":2,"ex":"The p-value is the probability of seeing a coefficient at least this far from zero if the true effect were zero. At 0.68 that's very common, so the data give little evidence of a weekend effect; above the usual 0.05 threshold, the attribute is a candidate for removal. It is not the probability that the coefficient is zero or nonzero. The −0.4-minute reading is a true statement about the coefficient, but it doesn't answer what the p-value means.","note":"p-value = chance of an estimate this extreme if the true effect were 0; p > 0.05 → weak evidence, consider removing.","concept":"Regression: p-values","trap":"A true statement that doesn't answer what was asked."},{"m":"m8","sc":21,"q":"Holding stops and weekend fixed, how much longer is the predicted time for a 6 km delivery in the rain than for the same delivery when it's dry?","multi":false,"fixed":true,"opts":[["1.0 minute","",""],["3.0 minutes","",""],["4.0 minutes","",""],["4.5 minutes","",""],["16.0 minutes","",""]],"ok":[2],"id":"g-C-5c","seq":2,"sec":3,"set":2,"ex":"Rain adds its own coefficient plus the interaction coefficient times distance: 1.0 + 0.5×6 = 4.0 minutes. 3.0 leaves out the rain main effect. The interaction lets the per-km slope differ, at 3.0 per km in rain versus 2.5 when dry, and the model is still linear regression because it is linear in the coefficients.","note":"Interaction x1·x2: effect of x1 depends on x2; still linear (linear in coefficients).","concept":"Regression: interaction terms","trap":"Right idea, wrong number or quantity."},{"m":"m8","sc":21,"q":"The manager asks two questions: (1) \"How much does each extra stop add to delivery time?\" and (2) \"How long will tomorrow's 8 km, 3-stop delivery on a dry weekday take?\" Which is correct?","multi":false,"fixed":false,"opts":[["(1) predictive, from the fitted response; (2) descriptive, from the coefficients, about 36 minutes","",""],["(1) descriptive, from the stops coefficient; (2) predictive, from the fitted response, about 36 minutes","",""],["(1) descriptive, from the stops coefficient; (2) predictive, from the fitted response, about 26 minutes","",""],["(1) descriptive, from the stops coefficient; (2) predictive, from the fitted response, about 41 minutes","",""]],"ok":[1],"id":"g-C-5d","seq":3,"sec":3,"set":2,"ex":"Reading a coefficient answers a descriptive question about how the system works. Plugging values in answers a predictive one: 10 + 2.5×8 + 2.0×3 = 36 minutes on a dry weekday. 26 leaves out the intercept, and 41 wrongly adds the rain terms (1.0 + 0.5×8).","note":"Descriptive = interpret coefficients; predictive = plug in x to get ŷ (include the intercept).","concept":"Regression: descriptive vs predictive use","trap":"Right idea, wrong number or quantity."},{"m":"m8","sc":22,"q":"Based on AIC, which model is preferred, and how likely is Model A to be better, relative to that model?","multi":false,"fixed":false,"opts":[["Model C, since it has the most parameters and the highest likelihood; A is about e⁻¹ as likely","",""],["Model A, since it is the simplest; B is about e⁻² ≈ 14% as likely","",""],["Model B; A is about e⁻² ≈ 14% as likely to be better","",""],["Model B; A is about e⁻⁴ ≈ 2% as likely to be better","",""]],"ok":[2],"id":"g-C-6a","seq":0,"sec":3,"set":2,"ex":"B has the smallest AIC (206). A's relative likelihood is e^((206−210)/2) = e^−2 ≈ 0.135. C fits the training data best (highest L*), but its extra parameters don't make up for that, so its AIC is higher. e^−4 forgets to halve the difference.","note":"Smaller AIC better; relative likelihood of model i = e^((AICmin−AICi)/2).","concept":"AIC comparison and relative likelihood","trap":"The overfit choice looks better on the data it was tuned on."},{"m":"m8","sc":22,"q":"BIC prefers Model A over Model B by 5. Using the common rule of thumb for BIC differences, what can be said?","multi":false,"fixed":true,"opts":[["A is very likely better than B","",""],["A is likely better than B","",""],["A is somewhat likely better than B","",""],["A is only slightly likely better than B","",""]],"ok":[2],"id":"g-C-6b","seq":1,"sec":3,"set":2,"ex":"Common bands: more than 10 = very likely better, 6–10 = likely, 2–6 = somewhat likely, 0–2 = slightly. A difference of 5 falls in 2–6. BIC disagrees with AIC here because its penalty per parameter is ln(1000) ≈ 6.9 rather than 2, so it favors fewer parameters.","note":"BIC diff >10 very likely, 6–10 likely, 2–6 somewhat, 0–2 slightly; BIC penalizes params more (ln n > 2 for n ≥ 8).","concept":"BIC difference bands","trap":"Right idea, wrong number or quantity."},{"m":"m8","sc":22,"q":"The software fit each model by least squares, but AIC and BIC are defined using the maximum likelihood L*. Is that a problem?","multi":false,"fixed":false,"opts":[["Yes. AIC and BIC can only be used with logistic regression.","",""],["Yes. Least squares and maximum likelihood always give different coefficients.","",""],["No. If the errors are independent and normally distributed with mean 0 and constant variance, least squares gives the maximum likelihood fit.","",""],["No. Least squares maximizes R², and R² equals the likelihood.","",""]],"ok":[2],"id":"g-C-6c","seq":2,"sec":3,"set":2,"ex":"Under independent, identically distributed normal errors, maximizing the likelihood is the same as minimizing the sum of squared errors, so least squares gives the maximum likelihood fit. Without that assumption they can differ, but they don't always differ.","note":"With iid normal errors (mean 0, constant σ²), least squares = maximum likelihood.","concept":"Least squares = maximum likelihood","trap":""},{"m":"m8","sc":22,"q":"Suppose Model A (k = 4) had instead been fit to only n = 25 households. Using AICc = AIC + 2k(k+1)/(n−k−1), how does AICc compare with AIC?","multi":false,"fixed":true,"opts":[["AICc = AIC","",""],["AICc = AIC + 0.4","",""],["AICc = AIC + 2","",""],["AICc = AIC + 8","",""],["AICc = AIC + 40","",""]],"ok":[2],"id":"g-C-6d","seq":3,"sec":3,"set":2,"ex":"2·4·5/(25−4−1) = 40/20 = 2. The correction matters when n is small relative to k, and it shrinks toward 0 as n grows. 40 forgets to divide by n−k−1.","note":"AICc = AIC + 2k(k+1)/(n−k−1); use for small n; → AIC as n grows.","concept":"AICc correction","trap":"Right idea, wrong number or quantity."},{"m":"m8","sc":23,"q":"What is the best summary of the notifications result?","multi":false,"fixed":false,"opts":[["p &lt; 0.0001 means the model explains 99.99% of the variation in spending.","",""],["Notifications are a major driver of spending, because p &lt; 0.0001.","",""],["It's statistically significant but practically tiny, about 20 cents a month for a typical user. With 2 million data points, even very small effects become significant.","",""],["The effect is statistically significant, so notifications should stay in the model.","",""]],"ok":[2],"id":"g-C-7a","seq":0,"sec":3,"set":2,"ex":"20 × $0.01 = $0.20 against $50 of spending. With huge data, p-values become tiny even for effects too small to matter, so check the coefficient's practical size. 'Significant, so keep it' is true but misses the point that the effect is negligible.","note":"Huge n → tiny effects significant; check coefficient × typical x vs typical y.","concept":"p-values with huge data; practical significance","trap":"A true statement that doesn't answer what was asked."},{"m":"m8","sc":23,"q":"The product team wants to claim that notifications <i>cause<\/i> spending. Select ALL of the following that are common rules of thumb for claiming causation.","multi":true,"fixed":false,"opts":[["Regressing notifications on spending gives a weaker p-value than regressing spending on notifications.","",""],["The causal idea makes sense.","",""],["The coefficient's p-value is below 0.05.","",""],["There is no outside factor that could be causing the relationship.","",""],["The cause comes before the effect.","",""]],"ok":[1,3,4],"id":"g-C-7b","seq":1,"sec":3,"set":2,"ex":"The three rules: the cause comes first, the idea makes sense, and no outside factor could explain it. Here browsing triggers notifications and also leads to spending, so it is a likely outside factor. In simple regression, reversing x and y gives the same p-value and R², so the model can't show which way cause runs, and significance alone shows only correlation.","note":"3 causation rules: cause before effect, makes sense, no outside factor. Reversing x,y gives the same p/R².","concept":"Causation vs correlation","trap":"Select-all: pick every correct choice and only those."},{"m":"m8","sc":23,"q":"A data scientist then tests 200 randomly generated user attributes, none truly related to spending, one at a time at the 0.05 level. About how many would be expected to appear significant?","multi":false,"fixed":true,"opts":[["0","",""],["1","",""],["10","",""],["20","",""],["190","",""]],"ok":[2],"id":"g-C-7c","seq":2,"sec":3,"set":2,"ex":"200 × 0.05 = 10 false positives expected by chance. This is the multiple-testing problem: with many tests, some unrelated attributes will look significant.","note":"Testing m unrelated attributes at 0.05 → ~0.05·m false 'significant' ones.","concept":"Multiple testing","trap":"Right idea, wrong number or quantity."},{"m":"m8","sc":24,"q":"Regression and SVM both produce a line y = a<sub>0<\/sub> + a<sub>1<\/sub>x<sub>1<\/sub> + … . Which statement is correct?","multi":false,"fixed":false,"opts":[["Regression is affected more by points close to the line; SVM is affected more by far points.","",""],["SVM is affected more by points close to the line (the support vectors); regression is affected more by far points, because errors are squared.","",""],["Neither is affected by far points, because both ignore outliers.","",""],["Both are affected equally by all points, because the formulas look the same.","",""]],"ok":[1],"id":"g-C-8a","seq":0,"sec":4,"set":2,"ex":"The SVM line is set by the support vectors near the margin. Squaring errors in regression gives far points a larger effect. Admit/don't-admit decisions depend on the borderline applicants, while picking a fellowship winner depends on telling apart the top applicants, who are far from the line.","note":"SVM ← near points (support vectors); regression ← far points (squared error).","concept":"Regression vs SVM: near vs far points","trap":"The direction is flipped."},{"m":"m8","sc":24,"q":"The sponsor wants to estimate how much each extra year of work experience is associated with first-year GPA, holding the other applicant factors fixed. Which model is most appropriate?","multi":false,"fixed":true,"opts":[["ARIMA","",""],["CART","",""],["Cross-validation","",""],["CUSUM","",""],["Exponential smoothing","",""],["GARCH","",""],["k-means clustering","",""],["k-nearest-neighbor classification","",""],["Linear regression","",""],["Logistic regression","",""],["Support vector machine","",""]],"ok":[8],"id":"g-C-8b","seq":1,"sec":4,"set":2,"ex":"The question asks for a numeric response and the effect of each factor with the others held fixed, which a linear regression coefficient gives directly. Logistic regression is for probabilities or yes/no responses, and SVM and KNN classify.","note":"Quantify effect of a factor on a numeric response (others fixed) → linear regression.","concept":"Model choice: linear regression","trap":"A neighboring method that sounds right but answers a different question."},{"m":"m8","sc":24,"q":"The first-year GPA model has R² = 0.35. A physics-based model elsewhere in the university has R² = 0.95. What should the committee conclude?","multi":false,"fixed":false,"opts":[["R² = 0.35 means the model's predictions are correct 35% of the time.","",""],["The GPA model is useless, since its R² is below 0.5.","",""],["The GPA model may still be useful. With human behavior, R² around 0.3–0.4 is often a good result.","",""],["Keep adding predictors until R² reaches about 0.9, as in the physics model.","",""]],"ok":[2],"id":"g-C-8c","seq":2,"sec":4,"set":2,"ex":"Human behavior has a lot of variability and many factors, so R² of 0.3–0.4 (sometimes less) can still mean a positive result. Adding predictors never lowers training R², but chasing it just fits noise, and adjusted R² would penalize it.","note":"Human-behavior models: R² 0.3–0.4 can be good; R² = share of variance explained; adjusted R² penalizes extra predictors.","concept":"R² for human behavior","trap":"The overfit choice looks better on the data it was tuned on."},{"m":"m8","sc":24,"q":"Select ALL good ways to check whether work experience has a linear or nonlinear relationship with first-year GPA.","multi":true,"fixed":false,"opts":[["Trust a statistical test's result even if you can't see or explain the pattern it suggests.","",""],["Look at plots and residuals, and if the data are too dense to read, look at subsets of the data.","",""],["A scatterplot of GPA against work experience alone always shows the true shape, even with many other predictors.","",""],["Add an x² term and see whether it helps. The model is still linear regression, because it is linear in the coefficients.","",""],["Think about what the underlying relationship might be, then test that idea.","",""]],"ok":[1,3,4],"id":"g-C-8d","seq":3,"sec":4,"set":2,"ex":"Good practice is to reason about the mechanism, look at plots and residuals (using subsets when the data are dense), and confirm test results by looking at the data. A quadratic term is a valid way to test for curvature. Don't accept a test result you can't make sense of, and remember that with many predictors, others can hide a predictor's relationship.","note":"Check linearity: reason about mechanism + plots/residuals (subsets) + tests, confirming each with the other; x² term still linear regression.","concept":"Checking linearity","trap":"Select-all: pick every correct choice and only those."},{"m":"m9","sc":25,"q":"What is the pattern in the residual plot called, and why does it matter for the regression?","multi":false,"fixed":false,"opts":[["Multicollinearity: age and vehicle value move together, so the coefficients are unstable","",""],["Heteroscedasticity: the large high-end misses dominate the squared-error sum and pull the fit","",""],["A trend: claim sizes rise over time, so the same factor values give different claims in different years","",""],["Overfitting: the model fits the small claims too closely and the large claims too loosely","",""]],"ok":[1],"id":"g-D-1a","seq":0,"sec":4,"set":2,"ex":"Spread that grows with the size of the value is heteroscedasticity, and because least squares sums squared errors, the big errors at the high end drive the fit. A trend is a different problem (a change in level over time), and detrending fixes it, not Box-Cox.","note":"Heteroscedasticity = unequal spread (e.g. bigger at high values); large errors dominate SSE and bias the fit; Box-Cox fixes spread, detrending fixes level.","concept":"Box-Cox: heteroscedasticity","trap":"A neighboring method that sounds right but answers a different question."},{"m":"m9","sc":25,"q":"Software picks λ = 0.5. The regression on t(y) predicts t = 3 for a new driver. What claim size (in $ thousands) should the analyst report?","multi":false,"fixed":false,"opts":[["3","",""],["9","",""],["6.25","",""],["2.5","",""]],"ok":[2],"id":"g-D-1b","seq":1,"sec":4,"set":2,"ex":"Undo the transformation: y = (λt + 1)<sup>1/λ<\/sup> = (0.5·3 + 1)<sup>2<\/sup> = 2.5² = 6.25. Reporting 3 gives the prediction in transformed units; 9 just squares t and skips the −1 and ÷λ steps.","note":"Box-Cox predictions are in transformed units: convert back with y = (λt + 1)^(1/λ) (or e^t if λ = 0).","concept":"Box-Cox: back-transforming predictions","trap":"Right idea, wrong number or quantity."},{"m":"m9","sc":25,"q":"Select ALL steps that are good practice for this Box-Cox transformation.","multi":true,"fixed":false,"opts":[["Check first (e.g. with the Q-Q plot) whether a transformation is needed at all","",""],["Let the software choose λ so that the transformed response is as close to normal as possible","",""],["Apply the transformation to the response, the claim size","",""],["Use it to remove the steady year-over-year rise in claim sizes caused by inflation","",""],["Read the fitted coefficients directly as dollars per unit of each predictor","",""]],"ok":[0,1,2],"id":"g-D-1c","seq":2,"sec":4,"set":2,"ex":"The usual Box-Cox recipe: check normality (Q-Q plot), let software pick λ to make t(y) close to normal, and transform the response. Removing a rise over time is detrending, and the coefficients are now in transformed units, not dollars.","note":"Box-Cox: Q-Q check → software picks λ (t(y) ≈ normal) → model t(y) → transform predictions back.","concept":"Box-Cox: procedure","trap":"Select-all: pick every correct choice and only those."},{"m":"m9","sc":26,"q":"What is the detrended gold price for 2000?","multi":false,"fixed":false,"opts":[["1,000","",""],["800","",""],["−200","",""],["200","",""]],"ok":[3],"id":"g-D-2a","seq":0,"sec":4,"set":2,"ex":"Trend value for 2000 = −45,600 + 23.2 × 2000 = −45,600 + 46,400 = 800, so detrended = actual − trend = 1,000 − 800 = 200. 1,000 is the raw price, 800 is the trend itself, and −200 subtracts in the wrong order.","note":"Detrend: regress the variable on time (y = a0 + a1·t), then detrended value = actual − (a0 + a1·t).","concept":"Detrending: computing a detrended value","trap":"The direction is flipped."},{"m":"m9","sc":26,"q":"Which variables should be detrended before fitting the regression?","multi":false,"fixed":false,"opts":[["Only the gold price, since the response is what the model predicts","",""],["The gold price and the money supply, the variables that trend","",""],["Only the money supply, since predictors cause the response","",""],["All three, including the political-risk index, so the variables match","",""]],"ok":[1],"id":"g-D-2b","seq":1,"sec":4,"set":2,"ex":"Detrend the response and every predictor that has a trend, each by fitting its own line on time and subtracting it; the risk index has no trend, so there is nothing to remove. Detrending only the response leaves the money supply carrying the trend, so the same factor values in, say, 1974 and 2009 still go with very different prices.","note":"Detrend the response AND each trending predictor (separate fit on time for each); leave variables with no trend alone.","concept":"Detrending: which variables","trap":"Usually true, but the details here override it."},{"m":"m9","sc":26,"q":"Select ALL series that are natural candidates for detrending before they are used in a factor-based model (such as regression or SVM) built on data over many years.","multi":true,"fixed":false,"opts":[["World-championship 100-meter dash winning times since 1950","",""],["NFL field-goal success rates from 40–49 yards since 1978","",""],["Annual sales of a company whose revenue has grown every year","",""],["Heights of 500 adults all measured in the same week","",""],["Daily coin-flip results from a fair coin over ten years","",""]],"ok":[0,1,2],"id":"g-D-2c","seq":2,"sec":4,"set":2,"ex":"Human performance against nature (sprint times getting faster, kickers making far more long field goals) and steadily growing sales all trend over time. The heights were all measured at one time, so there is no time dimension, and fair coin flips have no trend.","note":"Detrend any variable that drifts over time (inflation, growth, human performance over the decades) before a factor-based model uses it.","concept":"Detrending: when to use it","trap":"Select-all: pick every correct choice and only those."},{"m":"m9","sc":27,"q":"The realtor wants a two-variable model. Which components should PCA keep?","multi":false,"fixed":false,"opts":[["Components 3 and 4, because their small eigenvalues mean they repeat the least information","",""],["Square footage and distance, because those original predictors are least correlated with each other","",""],["Components 1 and 2, because they have the largest eigenvalues and so the most variance","",""],["Components 2 and 3, because component 1 is mostly the square footage–rooms overlap","",""]],"ok":[2],"id":"g-D-3a","seq":0,"sec":4,"set":2,"ex":"The components are ranked by eigenvalue, which is the variance along that direction, and you keep the first n. Keeping the smallest-eigenvalue components reverses the ranking, and PCA keeps components, not a subset of the original predictors.","note":"Eigenvalue = variance along that component; rank by eigenvalue and keep the first n.","concept":"PCA: choosing components","trap":"The direction is flipped."},{"m":"m9","sc":27,"q":"What do the eigenvalue 0.05 for component 4, and the eigenvectors in general, tell the realtor?","multi":false,"fixed":false,"opts":[["The eigenvectors of XᵀX for the scaled data give the component directions; 0.05 means the data barely vary along component 4","",""],["The eigenvectors of XᵀX for the scaled data give the component directions; 0.05 means component 4 cannot help predict price","",""],["The eigenvectors are the regression coefficients on the original predictors; 0.05 means component 4's coefficient is small","",""],["The eigenvectors are the correlations of each predictor with price; 0.05 means a predictor should be dropped","",""]],"ok":[0],"id":"g-D-3b","seq":1,"sec":4,"set":2,"ex":"PCA's directions are the eigenvectors of XᵀX (scaled data), and each eigenvalue measures the variance along its direction; a tiny one here probably reflects that square footage and rooms almost always move together. It does not prove component 4 is useless for price, because PCA never looks at the response.","note":"PCA directions = eigenvectors of XᵀX (scaled data); eigenvalue ≈ variance along it; PCA ignores the response.","concept":"PCA: eigenvectors and eigenvalues","trap":"Usually true, but the details here override it."},{"m":"m9","sc":27,"q":"What is the implied coefficient on (scaled) square footage in terms of the original predictors?","multi":false,"fixed":false,"opts":[["14","",""],["6","",""],["8","",""],["0.6","",""]],"ok":[2],"id":"g-D-3c","seq":2,"sec":4,"set":2,"ex":"a<sub>j<\/sub> = Σ<sub>k<\/sub> b<sub>k<\/sub> v<sub>jk<\/sub> = 10·0.6 + 4·0.5 = 6 + 2 = 8. 14 adds the regression coefficients without weighting them by the eigenvector entries, and 6 uses only component 1.","note":"Back to original factors: a_j = Σ_k b_k·v_jk (b = coefficient on component k, v_jk = factor j's entry in eigenvector k).","concept":"PCA: converting back to original factors","trap":"Right idea, wrong number or quantity."},{"m":"m9","sc":28,"q":"The lab uses PCA on these two tests and keeps only one component. Which one does PCA recommend?","multi":false,"fixed":false,"opts":[["D2, because PCA picks the direction that best separates red from blue","",""],["D1, because it has the larger variance; PCA does not look at the red/blue labels","",""],["D2, because the smaller-variance direction is always the one carrying class information","",""],["D1, because it separates red from blue better than D2 does","",""]],"ok":[1],"id":"g-D-4a","seq":0,"sec":1,"set":3,"ex":"PCA uses only the predictors, so it ranks D1 first because the data spread most along it, whatever the colors are. If the classes had instead split along D1, PCA's choice would also be the useful one; here the useful direction is D2, the one PCA says to drop.","note":"PCA ranks by predictor variance only; it never sees the response, so it can discard the direction that predicts best.","concept":"PCA ignores the response","trap":""},{"m":"m9","sc":28,"q":"For a separate continuous response, the lab runs one linear regression on all five original tests and another on all five principal components. Which has the higher R²?","multi":false,"fixed":false,"opts":[["The PCA regression, because its predictors are uncorrelated","",""],["The original regression, because PCA loses some of the information","",""],["It depends on how large the first eigenvalue is","",""],["Neither: using all five components gives the same fit and the same R²","",""]],"ok":[3],"id":"g-D-4b","seq":1,"sec":1,"set":3,"ex":"Using all components just rotates the coordinate system; the points stay in the same places relative to each other, so the best-fit model and R² are identical. Information is lost only when you drop components.","note":"Regression on ALL m principal components = same fit and same R² as on the m original predictors (just a rotation).","concept":"PCA: all components give the same R²","trap":"Usually true, but the details here override it."},{"m":"m9","sc":28,"q":"To cut costs, the lab plans to keep only the first principal component of the five tests. Which statement is correct?","multi":false,"fixed":false,"opts":[["The lab can stop running four of the tests, because the model now uses one variable","",""],["The lab must still run all five tests, but the model now works in only one dimension","",""],["The lab must still run all five tests, and the model still works in five dimensions","",""],["The lab can stop running the tests with small entries in the eigenvector, without changing the model","",""]],"ok":[1],"id":"g-D-4c","seq":2,"sec":1,"set":3,"ex":"Each component is a weighted mix of all the original features, so computing it still needs all five tests; but every point is projected onto one direction, so the model is one-dimensional, simpler and less prone to overfitting. PCA does not save data collection.","note":"One PC still needs ALL original features (it's a mix of them), but the data are reduced to one dimension → less overfitting.","concept":"PCA: one component needs all features","trap":"A true statement that doesn't answer what was asked."},{"m":"m9","sc":28,"q":"In a different study, the points lie along a curved, crescent-shaped band rather than a straight cloud. Which approach suits this best?","multi":false,"fixed":false,"opts":[["Kernel PCA, which finds non-linear directions","",""],["Standard PCA, keeping more components","",""],["A Box-Cox transformation of each predictor","",""],["Detrending each predictor before PCA","",""]],"ok":[0],"id":"g-D-4d","seq":3,"sec":1,"set":3,"ex":"Standard PCA finds straight-line directions; for curved structure, kernel PCA is the usual choice. Box-Cox and detrending address spread and drift, not curvature among predictors.","note":"PCA = linear rotation; non-linear structure → kernel PCA.","concept":"Kernel PCA","trap":"A neighboring method that sounds right but answers a different question."},{"m":"m10","sc":29,"q":"Using T1, what does the tree predict for a 20°C Saturday?","multi":false,"fixed":false,"opts":[["150","",""],["60","",""],["97.5","",""],["90","",""]],"ok":[3],"id":"g-D-5a","seq":0,"sec":1,"set":3,"ex":"The day goes to leaf B (warm, weekend), and a leaf predicts the average response of its data points: 90. 150 is the number of days in the leaf, and 97.5 averages the four leaf values, which the tree never does.","note":"Regression tree: follow the branches to a leaf; prediction = the average response of the training points in that leaf.","concept":"Regression tree: leaf prediction","trap":"Right idea, wrong number or quantity."},{"m":"m10","sc":29,"q":"Software fits only a constant in each leaf, y = a<sub>0<\/sub>. Why is that constant the leaf's average?","multi":false,"fixed":false,"opts":[["Minimizing Σ(y<sub>i<\/sub> − a<sub>0<\/sub>)² gives a<sub>0<\/sub> = the mean, exactly like a regression with no predictors","",""],["Minimizing Σ(y<sub>i<\/sub> − a<sub>0<\/sub>)² gives a<sub>0<\/sub> = the median, so one extreme rental day cannot pull the leaf's estimate","",""],["The average is the value that maximizes the variance decrease at the leaf","",""],["The leaf uses the average because every leaf has a different full regression model","",""]],"ok":[0],"id":"g-D-5b","seq":1,"sec":1,"set":3,"ex":"Setting the derivative of Σ(y<sub>i<\/sub> − a<sub>0<\/sub>)² to zero gives a<sub>0<\/sub> = (1/n)Σy<sub>i<\/sub>, which is what a regression with only an intercept and no predictors returns. Trees can fit a different full regression in each branch, but in practice they use this constant because it is much faster.","note":"Leaf model y = a0: minimizing Σ(yi − a0)² → a0 = mean = regression with no predictors.","concept":"Regression tree leaf = no-predictor regression","trap":"A true statement that doesn't answer what was asked."},{"m":"m10","sc":29,"q":"Which tree is better, and why?","multi":false,"fixed":false,"opts":[["T1, because its training error is lower than T2's, so it fits the data better","",""],["T2, because leaf C has only 3 of 400 days, so T1 overfits that split","",""],["T2, because a simpler model is always better than a more complex one","",""],["T1, because it uses more factors to explain rentals","",""]],"ok":[1],"id":"g-D-5c","seq":2,"sec":1,"set":3,"ex":"Leaf C has 3 days, far below the rule of thumb of 5% of the data (20 of 400), so its 200-rental estimate mostly fits random noise. T1's lower training error is true but comes from that overfit leaf, and 'simpler is better' is not the main reason here.","note":"Each leaf should hold ≥ 5% of the data; a tiny leaf lowers training error by overfitting.","concept":"Regression tree: overfit leaf","trap":"The overfit choice looks better on the data it was tuned on."},{"m":"m10","sc":29,"q":"Which describes a standard way to build and check this tree?","multi":false,"fixed":false,"opts":[["Split on a combination of factors at once; keep splitting until every leaf is pure; prune using the same data","",""],["Split one factor at a time at the biggest variance decrease, only if it beats a threshold; then use the other half of the data to remove branches that don't help","",""],["Split one factor at a time at the biggest variance decrease; then use the same half of the data to remove any branches that don't lower the training error there","",""],["Split one factor at a time at random; then keep every branch, since averaging many trees removes overfitting","",""]],"ok":[1],"id":"g-D-5d","seq":3,"sec":1,"set":3,"ex":"Grow on half the data: for each leaf, try each factor and split where the variance decrease is largest, if it exceeds a threshold. Then prune using the other half: remove a branch if it doesn't reduce error on that data. Random splits with no pruning describe a random forest, not a single tree.","note":"Tree: grow on half (one factor at a time, biggest variance decrease > threshold); prune on the other half; leaves ≥ 5% of data.","concept":"Regression tree: branching and pruning","trap":"A neighboring method that sounds right but answers a different question."},{"m":"m10","sc":29,"q":"The company now asks a yes/no question: will rentals exceed 100? In leaf B, 120 of the 150 days exceeded 100. What does leaf B give in (i) a logistic regression tree and (ii) a classification tree?","multi":false,"fixed":false,"opts":[["(i) 90 (ii) yes","",""],["(i) 0.8 (ii) 0.8","",""],["(i) 0.8 (ii) yes","",""],["(i) yes (ii) 0.8","",""]],"ok":[2],"id":"g-D-5e","seq":4,"sec":1,"set":3,"ex":"In the simple version used in practice, a logistic regression tree leaf gives the fraction of its points that are 'yes' (120/150 = 0.8), and a classification tree leaf gives the most common class ('yes'). 90 is the regression-tree average rentals, not a probability.","note":"Leaf answers: regression tree = average; logistic tree = fraction 'yes'; classification tree = most common class; decision tree = the decision.","concept":"Logistic and classification tree leaves","trap":"Right idea, wrong number or quantity."},{"m":"m10","sc":30,"q":"How is each of the forest's 500 trees built?","multi":false,"fixed":false,"opts":[["From a bootstrap sample of the data, choosing each split from a random subset of factors, with no pruning","",""],["From all the data, choosing each split from all the factors, then pruned using the other half of the data","",""],["From a bootstrap sample of the data, choosing each split from all factors, pruned to 5% leaves","",""],["From a random half of the factors fixed for the whole tree, with no pruning","",""]],"ok":[0],"id":"g-D-6a","seq":0,"sec":1,"set":3,"ex":"Random forests add randomness two ways: each tree gets a bootstrap sample (n points drawn with replacement), and each branch chooses from a small random subset of factors. The trees are not pruned, because averaging many different trees is what controls overfitting.","note":"Random forest: bootstrap sample per tree + random factor subset at each branch + no pruning; usually 500–1000 trees.","concept":"Random forest: how trees are built","trap":"A neighboring method that sounds right but answers a different question."},{"m":"m10","sc":30,"q":"How does the forest produce its prediction of ticket sales for a new movie?","multi":false,"fixed":false,"opts":[["It uses the prediction of the one tree with the lowest error","",""],["It takes the most common prediction among the 500 trees","",""],["It averages the 500 trees' predictions","",""],["It uses the leaf average from the first tree built","",""]],"ok":[2],"id":"g-D-6b","seq":1,"sec":1,"set":3,"ex":"For a regression forest, every tree predicts and the forest averages them; for classification, it takes the most common answer (a vote). No single tree is selected, which is why the forest gives no single specific model.","note":"Forest answer: regression = average of the trees; classification = most common vote; no single tree is chosen.","concept":"Random forest: combining trees","trap":"A neighboring method that sounds right but answers a different question."},{"m":"m10","sc":30,"q":"How should the studio read the linear regression's coefficient of 0.25 on star salary?","multi":false,"fixed":false,"opts":[["Each extra $0.25 of salary goes with one more ticket sold","",""],["Each extra $4 of salary goes with about one more ticket sold, other factors held fixed","",""],["Each extra $4 of salary sells one more ticket, because stars draw their fans to the movie","",""],["About 25% of a movie's tickets are sold because of its stars","",""]],"ok":[1],"id":"g-D-6c","seq":2,"sec":1,"set":3,"ex":"A coefficient of 0.25 tickets per dollar means about one extra ticket per $4 of salary, holding the other factors fixed. The version with 'because stars draw their fans' adds a cause that the regression cannot show, and $0.25 per ticket inverts the rate.","note":"Linear coefficient = change in response per unit of the factor, others fixed (0.25 tickets/$ = 1 ticket per $4); it shows association, not cause.","concept":"Explainability: reading a linear coefficient","trap":"Adds a cause the data can't support."},{"m":"m10","sc":30,"q":"An executive asks: 'How much does adding star salary change ticket sales?' Which model answers this most directly?","multi":false,"fixed":false,"opts":[["The random forest, because it has the lowest validation error","",""],["The random forest, because its variable importance gives the effect per dollar","",""],["The regression tree, because it gives a different effect for each kind of movie","",""],["The linear regression, because one coefficient gives the effect per dollar","",""]],"ok":[3],"id":"g-D-6d","seq":3,"sec":1,"set":3,"ex":"Explainability falls from linear regression to tree to forest: the regression gives one clear number, the tree gives several conditional effects (which are harder to act on), and the forest gives only variable importance, not an effect size. The forest's accuracy is real but doesn't answer this question; explainability also helps people adopt a model and is sometimes a legal requirement, as with explaining why a loan was denied.","note":"Explainability: linear regression > tree > forest; a forest gives better estimates but only variable importance; explainability aids adoption and may be legally required.","concept":"Explainability: linear vs tree vs forest","trap":"A true statement that doesn't answer what was asked."},{"m":"m10","sc":31,"q":"What repayment probability does the model give an applicant with an income of $40,000?","multi":false,"fixed":false,"opts":[["0.5","",""],["0","",""],["1","",""],["0.73","",""]],"ok":[0],"id":"g-D-7a","seq":0,"sec":2,"set":3,"ex":"x = 4, so a<sub>0<\/sub> + a<sub>1<\/sub>x = −2 + 0.5·4 = 0, and p = 1/(1 + e<sup>0<\/sup>) = 1/2. The logistic function stays strictly between 0 and 1, approaching 0 as the linear part goes to −∞ and 1 as it goes to +∞.","note":"Logistic: p = 1/(1 + e^−(a0 + Σ aj xj)); linear part 0 → p = 0.5; stays in (0,1), unlike linear regression.","concept":"Logistic regression: formula","trap":"Right idea, wrong number or quantity."},{"m":"m10","sc":31,"q":"The bank approves loans when p ≥ 0.5. It changes the rule to p ≥ 0.7. What happens?","multi":false,"fixed":false,"opts":[["More loans approved, and a larger share of the approved borrowers end up defaulting","",""],["Fewer loans approved, and the model's AUC rises above 0.80 as a result","",""],["Fewer approved: fewer defaulters get loans, but more would-be repayers are turned down","",""],["The same loans approved, because the model's coefficients and probabilities haven't changed","",""]],"ok":[2],"id":"g-D-7b","seq":1,"sec":2,"set":3,"ex":"A higher threshold says 'yes' less often, so fewer false yeses (defaulters approved) and more false nos (good borrowers rejected). It is a move along the same ROC curve; AUC summarizes all thresholds and doesn't change.","note":"Raise threshold → fewer 'yes' → fewer false positives, more false negatives; AUC unchanged (it covers all thresholds).","concept":"Logistic regression: classification threshold","trap":"The direction is flipped."},{"m":"m10","sc":31,"q":"What does the AUC of 0.80 mean?","multi":false,"fixed":false,"opts":[["80% of applicants are classified correctly when the bank uses the 0.5 threshold to decide which loans to approve","",""],["For a random repayer (Joe) and random defaulter (Moe), an 80% chance the repayer gets the higher estimate","",""],["80% of the applicants the model approves (like Joe) will repay, and 20% (like Moe) will default","",""],["The model is 30 percentage points more accurate than a guessing model, whose AUC is 0.5","",""]],"ok":[1],"id":"g-D-7c","seq":2,"sec":2,"set":3,"ex":"AUC (the concordance index) is the probability that a random 'yes' case gets a higher estimate than a random 'no' case; 0.5 means guessing. It is not accuracy at any one threshold, and not the share of approved borrowers who repay.","note":"AUC = P(random 'yes' scored above random 'no') (Joe vs Moe); 0.5 = guessing.","concept":"AUC meaning","trap":"Right idea, wrong number or quantity."},{"m":"m10","sc":31,"q":"Select ALL statements about this model and its evaluation that are correct.","multi":true,"fixed":false,"opts":[["The ROC curve plots sensitivity (true positive rate) against 1 − specificity","",""],["An AUC of 0.5 would mean the model is no better than guessing","",""],["The AUC takes into account that a default costs the bank more than a turned-away good customer","",""],["Unlike linear regression, the logistic coefficients have no closed-form solution and must be found iteratively","",""],["A pseudo R² of 0.35 would mean the model explains 35% of the variance in repayment","",""]],"ok":[0,1,3],"id":"g-D-7d","seq":3,"sec":2,"set":3,"ex":"ROC = sensitivity vs 1 − specificity, AUC 0.5 = guessing, and logistic regression has no closed form (it takes longer to compute). AUC treats both kinds of error alike, so it ignores costs, and pseudo R² does not really measure the fraction of variance explained.","note":"ROC: sensitivity vs 1−specificity; AUC ignores costs ('quick and dirty'); logistic has no closed form; pseudo R² isn't variance explained.","concept":"Logistic regression: ROC, AUC, pseudo R²","trap":"Select-all: pick every correct choice and only those."},{"m":"m10","sc":32,"q":"What are Filter 1's sensitivity and specificity?","multi":false,"fixed":false,"opts":[["Sensitivity 80%, specificity 98%","",""],["Sensitivity 98%, specificity 83%","",""],["Sensitivity 98%, specificity 80%","",""],["Sensitivity 83%, specificity 80%","",""]],"ok":[2],"id":"g-D-8a","seq":0,"sec":2,"set":3,"ex":"Sensitivity = TP/(TP + FN) = 490/500 = 98% (real emails kept), and specificity = TN/(TN + FP) = 400/500 = 80% (spam caught). 83% is 490/590, the share of the inbox that is real, a different quantity.","note":"Sensitivity = TP/(TP+FN); specificity = TN/(TN+FP); positive = the class you call 'yes' (here real email).","concept":"Confusion matrix: sensitivity and specificity","trap":"Right idea, wrong number or quantity."},{"m":"m10","sc":32,"q":"What share of Filter 1's inbox is spam?","multi":false,"fixed":false,"opts":[["About 17%","",""],["20%","",""],["10%","",""],["2%","",""]],"ok":[0],"id":"g-D-8b","seq":1,"sec":2,"set":3,"ex":"The inbox holds everything predicted real: TP + FP = 590, of which FP = 100 are spam, so 100/590 ≈ 17%. 20% is 100/500, the share of spam that gets through (1 − specificity), not the share of the inbox.","note":"Share of inbox that is spam = FP/(TP + FP) (with real = positive).","concept":"Confusion matrix: inbox spam share","trap":"Right idea, wrong number or quantity."},{"m":"m10","sc":32,"q":"Which filter is better?","multi":false,"fixed":false,"opts":[["Filter 2, because it classifies 900 emails correctly versus 890","",""],["Filter 1, because its expected cost is 1.4¢ per email versus 5.2¢","",""],["Filter 2, because only about 10% of its inbox is spam versus 17%","",""],["Filter 1, because its expected cost is 1.4¢ per email versus 2.6¢","",""]],"ok":[1],"id":"g-D-8c","seq":2,"sec":2,"set":3,"ex":"Filter 1: 10 × $1 + 100 × $0.04 = $14 per 1,000 = 1.4¢; Filter 2: 50 × $1 + 50 × $0.04 = $52 = 5.2¢. Filter 2's higher accuracy and cleaner inbox are true, but it trades cheap mistakes for expensive ones.","note":"Expected cost = Σ (count × cost) over the cells; the lowest cost wins even with more mistakes (spam: 1.4¢ vs 5.2¢).","concept":"Valuing a model with costs","trap":"A true statement that doesn't answer what was asked."},{"m":"m10","sc":32,"q":"Suppose the email mix changes to 60% real and 40% spam, with Filter 1's rates unchanged. What is Filter 1's expected cost per email?","multi":false,"fixed":false,"opts":[["1.28¢","",""],["1.4¢","",""],["1.32¢","",""],["1.52¢","",""]],"ok":[3],"id":"g-D-8d","seq":3,"sec":2,"set":3,"ex":"Scale the real row by 60/50 = 1.2 (FN 10 → 12) and the spam row by 40/50 = 0.8 (FP 100 → 80): 12 × $1 + 80 × $0.04 = $12 + $3.20 = $15.20 per 1,000 = 1.52¢. 1.28¢ scales the rows the wrong way, and 1.32¢ scales only the spam row.","note":"New class mix: multiply each actual-class row by (new share ÷ old share), keep the rates, recompute cost (40% spam → 1.52¢).","concept":"Valuing a model: rescaling for a new mix","trap":"The direction is flipped."},{"m":"mix","sc":33,"q":"The agency wants to estimate the <b>probability<\/b> that a given rider will buy a monthly pass next month, based on age, distance and income. Which model is most appropriate?","multi":false,"fixed":true,"opts":[["ARIMA","",""],["CART","",""],["Cross-validation","",""],["CUSUM","",""],["Exponential smoothing","",""],["GARCH","",""],["k-means clustering","",""],["k-nearest-neighbor classification","",""],["Linear regression","",""],["Logistic regression","",""],["Support vector machine","",""]],"ok":[9],"id":"g-D-9a","seq":0,"sec":2,"set":3,"ex":"Logistic regression is the standard model for estimating a probability from a set of factors. SVM and KNN would answer the classification version ('will they buy?'), and linear regression the amount version ('how many rides?').","note":"Classification (yes/no) → SVM/KNN/tree; probability → logistic regression; amount → linear regression.","concept":"Question type: probability → logistic regression","trap":"A neighboring method that sounds right but answers a different question."},{"m":"mix","sc":33,"q":"The agency wants to model the number of riders arriving at a station's turnstiles each 15 minutes, which depends on time of day, day of week and holidays. Which method fits best?","multi":false,"fixed":false,"opts":[["Regression splines (MARS, found in software as 'earth')","",""],["Bayesian regression, combining an expert's prior opinion with the station data","",""],["Poisson regression, with the arrival rate λ a function of the attributes","",""],["KNN regression, averaging the most similar time periods","",""]],"ok":[2],"id":"g-D-9b","seq":1,"sec":2,"set":3,"ex":"Arrival counts follow a Poisson distribution, and Poisson regression lets the rate depend on the attributes, λ(x) (for example, arrivals at an airport security line). Splines (MARS, 'earth' in R) build curves from polynomial pieces joined at knots; they fit flexible curves but are not built around a count (Poisson) response.","note":"Poisson regression: count response (e.g. arrivals); rate λ(x) depends on attributes. Splines/MARS ('earth'): polynomials joined at knots.","concept":"Poisson regression","trap":"A neighboring method that sounds right but answers a different question."},{"m":"mix","sc":33,"q":"For the new express route there are only three weeks of data, but a veteran planner has a well-founded opinion about how distance affects ridership. Which method fits best?","multi":false,"fixed":false,"opts":[["KNN regression, because it needs no formula for how distance relates to ridership","",""],["Bayesian regression, using the planner's opinion as a prior updated by the data","",""],["Regression splines, because three weeks of data can be split into pieces at knots","",""],["Poisson regression, because the three weeks of ridership on the route are counts","",""]],"ok":[1],"id":"g-D-9c","seq":2,"sec":2,"set":3,"ex":"Bayesian regression combines expert opinion (the prior) with data and is most helpful when there is little data, such as estimating a child's adult height from a few measurements plus known population patterns. KNN regression is non-parametric (it averages the k nearest points instead of fitting a formula) and needs plenty of data to have good neighbors.","note":"Bayesian regression: expert prior + data, best with little data. KNN regression: non-parametric, predicts the average of the k nearest points.","concept":"Bayesian vs KNN regression","trap":"A neighboring method that sounds right but answers a different question."},{"m":"mix","sc":33,"q":"The agency's ridership model performs much worse on validation data than on training data. Select ALL reasonable ways to address this.","multi":true,"fixed":false,"opts":[["Simplify the model, e.g. use fewer variables, prune the tree, or use a larger k","",""],["Collect more data, so random patterns have less influence on the fit","",""],["Add more variables so the model fits the training data even more closely","",""],["Use cross-validation to choose how complex the model should be","",""],["Report the training performance instead, since it is the higher number","",""]],"ok":[0,1,3],"id":"g-D-9d","seq":3,"sec":2,"set":3,"ex":"A large training-to-validation drop signals overfitting: the model fits random patterns. Fitting less closely, getting more data, and picking complexity by cross-validation all help; adding variables makes overfitting worse, and training performance is optimistic.","note":"Validation ≪ training → overfit: simplify (fewer variables, prune, larger k), more data, choose complexity by cross-validation.","concept":"Overfitting fixes","trap":"Select-all: pick every correct choice and only those."},{"m":"mix","sc":34,"q":"The hospital wants to estimate, for each patient being discharged today, the <b>probability<\/b> that the patient will be readmitted within 30 days. Which model is most appropriate?","multi":false,"fixed":true,"opts":[["ARIMA","",""],["CART","",""],["Cross-validation","",""],["CUSUM","",""],["Exponential smoothing","",""],["GARCH","",""],["k-means clustering","",""],["k-nearest-neighbor classification","",""],["Linear regression","",""],["Logistic regression","",""],["Support vector machine","",""]],"ok":[9],"id":"g-E-1a","seq":0,"sec":3,"set":3,"ex":"Logistic regression is the standard model for estimating a probability from a set of factors. Linear regression is the tempting near-neighbor, but its output isn't bounded between 0 and 1, so it isn't suited to probabilities.","note":"Probability of a yes/no outcome from factors → logistic regression, not linear.","concept":"Probability from factors → logistic regression","trap":"A neighboring method that sounds right but answers a different question."},{"m":"mix","sc":34,"q":"An administrator asks: <i>\"Out of 100 patients just like this one, how many would we expect to be readmitted within 30 days?\"<\/i> Which type of question is this?","multi":false,"fixed":false,"opts":[["Classification (e.g. SVM or KNN)","",""],["Probability estimation (e.g. logistic regression)","",""],["Amount estimation (e.g. linear regression)","",""],["Clustering (e.g. k-means)","",""]],"ok":[1],"id":"g-E-1b","seq":1,"sec":3,"set":3,"ex":"\"How many out of 100 just like this one\" is the readmission probability times 100, so it is probability estimation. It sounds like a count (amount estimation), but the amount being estimated isn't a property of this patient; it's the chance of a yes/no event.","note":"Will it happen? = classification; what's the chance (or how many out of 100)? = probability; how much? = amount.","concept":"Question types: classification / probability / amount","trap":"A neighboring method that sounds right but answers a different question."},{"m":"mix","sc":34,"q":"The hospital currently calls every patient whose predicted readmission probability is <b>50% or more<\/b>. Given the costs in the scenario, what should it do with the threshold?","multi":false,"fixed":false,"opts":[["Raise it: a higher threshold flags more patients, so more readmissions get caught","",""],["Keep 50%: that threshold maximizes the share of patients classified correctly","",""],["Lower it: a missed readmission costs far more than an unneeded call, so flag more patients","",""],["Lower it: a lower threshold reduces both false positives and false negatives","",""]],"ok":[2],"id":"g-E-1c","seq":2,"sec":3,"set":3,"ex":"A false negative (missed readmission, ~$1,000) costs about 25 times a false positive (an unneeded $40 call), so lowering the threshold to flag more patients trades cheap errors for expensive ones. Raising the threshold flags fewer patients, not more, and moving the threshold always trades one error type for the other rather than cutting both.","note":"Unequal error costs → move the threshold toward the cheaper mistake (costly misses → lower threshold).","concept":"Logistic threshold and unequal costs","trap":"The direction is flipped."},{"m":"mix","sc":34,"q":"Two models are tested on the same 1,000 patients. <table class='dtab'><tr><th><\/th><th>Missed readmissions (FN)<\/th><th>Unneeded calls (FP)<\/th><\/tr><tr><td>Model A<\/td><td>20<\/td><td>100<\/td><\/tr><tr><td>Model B<\/td><td>10<\/td><td>300<\/td><\/tr><\/table> Using $1,000 per FN and $40 per FP, which model should the hospital use?","multi":false,"fixed":false,"opts":[["Model A, because it makes fewer total errors (120 vs. 310)","",""],["Model B, because its total cost is $22,000 vs. $24,000 for A","",""],["Model A, because its total cost is $22,000 vs. $24,000 for B","",""],["Either one, since AUC is the right way to compare them and it includes costs","",""]],"ok":[1],"id":"g-E-1d","seq":3,"sec":3,"set":3,"ex":"A costs 20×$1,000 + 100×$40 = $24,000; B costs 10×$1,000 + 300×$40 = $22,000, so B is cheaper. A really does make fewer errors, but that isn't what matters when errors have unequal costs. AUC ignores costs.","note":"Total cost = Σ(count × cost) over the confusion-matrix cells; fewest errors ≠ cheapest.","concept":"Costed confusion matrix","trap":"A true statement that doesn't answer what was asked."},{"m":"mix","sc":34,"q":"Before fitting a <b>k-nearest-neighbor<\/b> classifier on these factors, which of the following steps are appropriate? <b>Select all that apply.<\/b>","multi":true,"fixed":false,"opts":[["Scale or standardize the predictors so the 0–500 lab value doesn't dominate distances","",""],["Look into the length-of-stay values of 999 (probably a missing-data code) before fitting","",""],["Remove the patient ID number from the predictors","",""],["Box-Cox transform the yes/no readmission response so that it becomes normal","",""],["Use PCA so the hospital no longer has to collect the lab values","",""]],"ok":[0,1,2],"id":"g-E-1e","seq":4,"sec":3,"set":3,"ex":"KNN is distance-based, so unscaled factors are effectively weighted by their units. 999-day stays are almost certainly bad or coded data and need to be looked into, and an ID number is an irrelevant attribute that distorts distances. Box-Cox is meant for a continuous response with unequal variance, not a 0/1 label, and every principal component still needs every original feature.","note":"KNN/k-means: scale, check outliers, drop irrelevant attributes; PCA still needs all original features.","concept":"Data prep for distance-based models","trap":"Select-all: pick every correct choice and only those."},{"m":"mix","sc":35,"q":"Marketing wants to divide customers into 4 groups with similar shopping habits so it can design a different coupon book for each group. Which model is most appropriate?","multi":false,"fixed":true,"opts":[["ARIMA","",""],["CART","",""],["Cross-validation","",""],["CUSUM","",""],["Exponential smoothing","",""],["GARCH","",""],["k-means clustering","",""],["k-nearest-neighbor classification","",""],["Linear regression","",""],["Logistic regression","",""],["Support vector machine","",""]],"ok":[6],"id":"g-E-2a","seq":0,"sec":3,"set":3,"ex":"There are no labels; the goal is to find groups of similar customers, which is clustering, so k-means. k-nearest-neighbor <i>classification<\/i> sounds similar, but it needs known labels to assign a new point to.","note":"No known answer per point + 'find similar groups' → k-means (not KNN).","concept":"Clustering vs classification model","trap":"A neighboring method that sounds right but answers a different question."},{"m":"mix","sc":35,"q":"After the coupon campaign, the chain records for every customer whether they <b>redeemed<\/b> a coupon, and now wants to predict redemption for new customers. How has the problem changed?","multi":false,"fixed":false,"opts":[["It's still clustering, because customers are still being put into groups","",""],["It's now classification: each past customer has a known correct answer, separate from the predictors","",""],["It's now clustering, because \"redeemed\" and \"didn't\" are two groups found from the predictors","",""],["It's now classification, because there are two groups instead of four","",""]],"ok":[1],"id":"g-E-2b","seq":1,"sec":3,"set":3,"ex":"Classification is supervised: each data point has a known correct answer (redeemed or not), and that answer is a different variable from the predictors. It's true that customers are still put into groups, but both methods do that, so it isn't the difference. The number of groups doesn't matter either.","note":"Classification = known answers, separate from the predictors; clustering = groups defined by the predictors themselves.","concept":"Classification vs clustering (supervised vs unsupervised)","trap":"A true statement that doesn't answer what was asked."},{"m":"mix","sc":35,"q":"The chain wants to forecast each store's weekly sales for the next 12 weeks using a model that explicitly estimates a baseline, a trend, and a <b>multiplicative<\/b> seasonal factor for each week of the year. Which model is it describing?","multi":false,"fixed":true,"opts":[["ARIMA","",""],["CART","",""],["Cross-validation","",""],["CUSUM","",""],["Exponential smoothing","",""],["GARCH","",""],["k-means clustering","",""],["k-nearest-neighbor classification","",""],["Linear regression","",""],["Logistic regression","",""],["Support vector machine","",""]],"ok":[4],"id":"g-E-2c","seq":2,"sec":3,"set":3,"ex":"A baseline, trend, and multiplicative seasonal factors are the components of Holt-Winters (triple exponential smoothing), with L = 52 for weekly data. ARIMA can also forecast trended data, but it works by differencing and autoregressive/moving-average terms, not separate baseline, trend, and seasonal factors.","note":"Baseline + trend + seasonal factor (spikes grow with level → multiplicative) = Holt-Winters exponential smoothing.","concept":"Holt-Winters components","trap":"A neighboring method that sounds right but answers a different question."},{"m":"mix","sc":35,"q":"At store 17, managers want to find out as quickly as possible whether the average checkout wait has <b>increased<\/b> since self-checkout was installed, without raising many false alarms. Which model is most appropriate?","multi":false,"fixed":true,"opts":[["ARIMA","",""],["CART","",""],["Cross-validation","",""],["CUSUM","",""],["Exponential smoothing","",""],["GARCH","",""],["k-means clustering","",""],["k-nearest-neighbor classification","",""],["Linear regression","",""],["Logistic regression","",""],["Support vector machine","",""]],"ok":[3],"id":"g-E-2d","seq":3,"sec":3,"set":3,"ex":"Detecting whether, and when, a stable process has shifted is change detection, and CUSUM is the standard model for it. Exponential smoothing would smooth or forecast the wait times, but it doesn't flag a change on its own.","note":"\"Has it changed?\" → CUSUM; \"what will it be?\" → exponential smoothing/ARIMA.","concept":"Change detection vs forecasting","trap":"A neighboring method that sounds right but answers a different question."},{"m":"mix","sc":35,"q":"Which of these questions for the chain is <b>prescriptive<\/b>?","multi":false,"fixed":false,"opts":[["Which products were most often bought together last year?","",""],["What will store 17's sales be next week?","",""],["How many cashiers should each store schedule next week?","",""],["Which customer group spent the most last quarter?","",""]],"ok":[2],"id":"g-E-2e","seq":4,"sec":3,"set":3,"ex":"Prescriptive analytics asks what action to take, such as how many cashiers to schedule. Next week's sales is a predictive question (what will happen), and the other two are descriptive (what happened).","note":"Descriptive = what happened; predictive = what will happen; prescriptive = what should we do.","concept":"Descriptive / predictive / prescriptive","trap":""},{"m":"mix","sc":36,"q":"Which of these models are appropriate for classifying transactions as fraud or not fraud? <b>Select all that apply.<\/b>","multi":true,"fixed":false,"opts":[["CART","",""],["CUSUM","",""],["k-means clustering","",""],["Logistic regression (with a probability threshold)","",""],["Support vector machine","",""]],"ok":[0,3,4],"id":"g-E-3a","seq":0,"sec":3,"set":3,"ex":"CART and SVM classify from a set of factors, and logistic regression classifies by comparing its predicted probability to a threshold. CUSUM detects a change in a time series rather than classifying individual points, and k-means is unsupervised: it ignores the known fraud labels.","note":"Classify from factors: SVM, KNN, CART, logistic + threshold. Not CUSUM (change detection) or k-means (unlabeled).","concept":"Choosing a classifier","trap":"Select-all: pick every correct choice and only those."},{"m":"mix","sc":36,"q":"For the real-time fraud check, the team is choosing between SVM and KNN. Which choice is better, and why?","multi":false,"fixed":false,"opts":[["KNN, because it gives a built-in probability: the share of the k neighbors that are fraud","",""],["SVM, because once fit, scoring a new transaction is one quick formula, while KNN searches the training set","",""],["KNN, because it needs no training step, so it is the faster choice in real time","",""],["SVM, because SVM never misclassifies any of its training points","",""]],"ok":[1],"id":"g-E-3b","seq":1,"sec":3,"set":3,"ex":"KNN has to find the k nearest of 200,000 training points for every new transaction, which is slow at millions per day, while SVM just evaluates its fitted formula. It's true that KNN gives an easy probability estimate, but that doesn't answer the speed requirement.","note":"Many real-time queries + big training set → SVM (KNN must search neighbors for each new point).","concept":"SVM vs KNN computation","trap":"A true statement that doesn't answer what was asked."},{"m":"mix","sc":36,"q":"A data scientist shows that a 500-tree random forest predicts loan defaults noticeably better than the bank's current logistic regression. Given the regulatory requirement, what should the bank do?","multi":false,"fixed":false,"opts":[["Switch to the forest: averaging hundreds of trees makes each denial easier to explain","",""],["Use the forest and send regulators its variable-importance chart as each denial's reason","",""],["Keep an explainable model (logistic or a small tree) for decisions, and use the forest internally","",""],["Use whichever has the higher validation accuracy; accuracy outweighs explainability","",""]],"ok":[2],"id":"g-E-3c","seq":2,"sec":3,"set":3,"ex":"Decisions must be explained case by case, and a logistic regression or a small tree can give a reason for each case. The forest is still useful internally, to see what the explainable model is missing. A forest does report variable importance, but that's an overall ranking across all trees and can't say why this applicant was denied.","note":"If decisions must be explained (legally or to users), prefer logistic/small tree; a forest's importance is aggregate only.","concept":"Explainability vs accuracy","trap":"A true statement that doesn't answer what was asked."},{"m":"mix","sc":36,"q":"Given the regression result about the number of credit cards, what can the bank conclude?","multi":false,"fixed":false,"opts":[["Applicants holding more credit cards tend to default more often","",""],["Applicants holding more cards default more, because extra cards lead them to overspend","",""],["Issuing fewer cards to each customer will reduce the bank's default rate","",""],["Card count has no real relationship with default; the coefficient is noise","",""]],"ok":[0],"id":"g-E-3d","seq":3,"sec":3,"set":3,"ex":"A regression shows an association: applicants with more cards tend to default more. The 'because' option adds a cause the model can't establish (for example, already-struggling borrowers might open more cards), and the 'issue fewer cards' option assumes the same causation.","note":"A significant coefficient shows association, not cause; reject any \"…because\" that the data can't support.","concept":"Correlation vs causation in regression","trap":"Adds a cause the data can't support."},{"m":"mix","sc":37,"q":"Consider three questions about flight 202: (1) Will it leave more than 15 minutes late? (2) What is the probability it leaves more than 15 minutes late? (3) How many minutes late will it leave? Which pairing of question and model fits best?","multi":false,"fixed":false,"opts":[["(1) SVM, (2) logistic regression, (3) linear regression","",""],["(1) logistic regression, (2) linear regression, (3) SVM","",""],["(1) SVM, (2) linear regression, (3) logistic regression","",""],["(1) k-means, (2) logistic regression, (3) linear regression","",""]],"ok":[0],"id":"g-E-4a","seq":0,"sec":4,"set":3,"ex":"Yes/no is classification (SVM or KNN), a probability is estimated with logistic regression, and an amount is estimated with linear regression. The tempting swap gives the probability question to linear regression, whose output isn't bounded between 0 and 1. k-means is unsupervised, so it can't answer a yes/no question about known outcomes.","note":"Classification → SVM/KNN; probability → logistic; amount → linear regression.","concept":"Question types → models","trap":"A neighboring method that sounds right but answers a different question."},{"
