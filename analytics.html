ressions of degree 1 through 6 to predict fuel use from engine size, using a training set, and measures prediction error (RMSE, lower is better) on a separate validation set.\n<table class=\"dtab\"><tr><th>Degree<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><th>6<\/th><\/tr>\n<tr><td>Training RMSE<\/td><td>9.1<\/td><td>6.2<\/td><td>4.0<\/td><td>3.6<\/td><td>3.1<\/td><td>2.5<\/td><\/tr>\n<tr><td>Validation RMSE<\/td><td>9.5<\/td><td>6.8<\/td><td>4.6<\/td><td>4.9<\/td><td>5.8<\/td><td>7.4<\/td><\/tr><\/table>"},"17":{"title":"Distance in the real world","html":"A logistics company needs travel-time estimates for three kinds of vehicles. Each must get from one point to another that differs by 6 units in one direction and 8 units in the other.\n<ul class=\"steps\"><li>A warehouse robot moves along an aisle and raises its lift at the same time; both motors run at the same speed.<\/li><li>A delivery van drives on a rectangular street grid.<\/li><li>A drone flies in a straight line.<\/li><\/ul>"},"18":{"title":"Inside k-means","html":"A marketing analyst runs k-means with k = 5 on 30,000 customers described by scaled annual spend, visits per month, and average basket size."},"19":{"title":"Three kinds of outliers","html":"A bank’s data team reviews three unusual findings:\n<ol class=\"steps\"><li>A customer’s card shows 40 small, ordinary-looking purchases at 40 different gas stations within two hours.<\/li><li>A branch’s daily cash withdrawals are $8,000 on a Tuesday in July; that’s a normal amount for December but far above any other July day.<\/li><li>One account’s age field says 214 years.<\/li><\/ol>"},"20":{"title":"Refrigerator alarms","html":"A hospital pharmacy records, each day, how many minutes its medicine refrigerator was above its safe temperature limit. A box-and-whisker plot of a year of data is below; whiskers extend to the most extreme points within 1.5 × IQR of the box.<svg viewBox=\"0 0 300 110\" width=\"300\" role=\"img\" aria-label=\"Bo ar(--ink)\"/><text x=\"110\" y=\"154\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink)\" >fitted value<\/text><text x=\"14\" y=\"78\" font-size=\"10\" fill=\"var(--ink)\" transform=\"rotate(-90 14 78)\" text-anchor=\"middle\">residual<\/text><text x=\"110\" y=\"12\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--ink)\" font-weight=\"600\">Plot 2<\/text><\/svg><\/div>"},"25":{"title":"Uses of regression","html":"A national coffee chain has five years of weekly data for each store: sales, ad spending, price, local temperature, and promotions."},"26":{"title":"Small data, many parameters","html":"A biotech lab has results from only 30 experiments and is comparing two regression models: Model 1 with 4 parameters and Model 2 with 9 parameters."},"27":{"title":"Detrending gold","html":"An analyst wants to model the yearly price of gold using several economic factors. She first fits a linear trend to gold prices over time and computes detrended values (actual price − fitted trend).\n<table class=\"dtab\"><tr><th>Year<\/th><th>Actual price<\/th><th>Fitted trend<\/th><\/tr><tr><td>2015<\/td><td>1,160<\/td><td>1,240<\/td><\/tr><tr><td>2016<\/td><td>1,250<\/td><td>1,270<\/td><\/tr><tr><td>2017<\/td><td>1,260<\/td><td>1,300<\/td><\/tr><\/table>"},"28":{"title":"Card-fraud analytics","html":"A credit-card company has years of transaction data. Past transactions are labeled “fraud” or “legitimate,” and each has attributes such as amount, merchant type, distance from home, and time since the previous purchase."},"29":{"title":"SVM by the numbers","html":"A hard-margin SVM requires (Σⱼ aⱼxᵢⱼ + a₀)·yᵢ ≥ 1 for every training point, where yᵢ is +1 or −1. A soft-margin SVM allows violations, charging each point an error of max{0, 1 − (Σⱼ aⱼxᵢⱼ + a₀)·yᵢ}. For four points, the value of (Σⱼ aⱼxᵢⱼ + a₀)·yᵢ is:\n<table class=\"dtab\"><tr><th>Point<\/th><th>P<\/th><th>Q<\/th><th>R<\/th><th>S<\/th><\/tr><tr><td>(Σ aⱼxᵢⱼ + a₀)·yᵢ<\/td><td>2.7<\/td><td>1.0<\/td><td>0.4<\/td><td>−0.5<\/td><\/tr><\/table>"},"30":{"title":"Scaling credit scores","html":"A lender’s credit scores range from a minimum of 300 to a maximum of 850 in its training data, with a mean of 700 and a standard deviation of 50."},"31":{"title":"Picking the winner","html":"A team compares 5 SVM models and 5 KNN models for loan default on the same validation set.\n<table class=\"dtab\"><tr><th>Model<\/th><th>SVM-1<\/th><th>SVM-2<\/th><th>SVM-3<\/th><th>SVM-4<\/th><th>SVM-5<\/th><\/tr><tr><td>Validation accuracy (%)<\/td><td>93<\/td><td>88<\/td><td>96<\/td><td>97<\/td><td>95<\/td><\/tr>\n<tr><th>Model<\/th><th>KNN-1<\/th><th>KNN-2<\/th><th>KNN-3<\/th><th>KNN-4<\/th><th>KNN-5<\/th><\/tr><tr><td>Validation accuracy (%)<\/td><td>94<\/td><td>94<\/td><td>90<\/td><td>95<\/td><td>82<\/td><\/tr><\/table>"},"32":{"title":"Cross-validation mechanics","html":"An analyst has 1,000 data points (after setting aside a separate test set) and uses 10-fold cross-validation to compare KNN with k = 3, 5, 7, and 9."},"33":{"title":"Supervised or unsupervised?","html":"A health-insurance analytics team lists projects for next year."},"34":{"title":"How many outliers is normal?","html":"A sensor produces 10,000 readings that are roughly normally distributed. About 95.4% of normal data lies within 2 standard deviations of the mean, and about 99.73% lies within 3."},"35":{"title":"Updating a seasonal factor","html":"A burger chain uses Holt-Winters with multiplicative weekly seasonality on daily sales. The seasonal update is\n<div class=\"eq\">Cₜ = γ·(xₜ / Sₜ) + (1 − γ)·C<sub>t−L<\/sub><\/div>"},"36":{"title":"ARIMA choices","html":"An energy analyst is choosing ARIMA(p, d, q) models for several monthly series."},"37":{"title":"Interactions and logs","html":"A retailer fits two regressions:\n<div class=\"eq\">Model 1: spend = 20 + 3·discount + 4·(discount × member)<br>Model 2: log(salary) = 9.8 + 0.06·(years of education)<\/div>In Model 1, member = 1 for loyalty members and 0 otherwise; discount is in percentage points."},"38":{"title":"Diet study","html":"A nutrition researcher regresses heart-health scores of 5,000 people on how often they eat each of 100 different foods, testing each food’s coefficient at the 0.05 level. Six foods come out significant."},"39":{"title":"Two factors, one component","html":"An analyst runs PCA on two scaled factors and plans to keep only one component for a classifier. The figure shows the data (black and white are the two classes) and the two principal directions, D1 and D2.<svg viewBox=\"0 0 230 220\" width=\"230\" role=\"img\" aria-label=\"PCA directions\"><line x1=\"20\" y1=\"200\" x2=\"220\" y2=\"200\" stroke=\"var(--ink-2)\"/><line x1=\"20\" y1=\"200\" x2=\"20\" y2=\"10\" stroke=\"var(--ink-2)\"/><circle cx=\"107.3\" cy=\"84.8\" r=\"3.6\" fill=\"var(--ink)\"/><circle cx=\"68.8\" cy=\"127.5\" r=\"3.6\" fill=\"var(--ink)\"/><circle cx=\"118.2\" cy=\"123.7\" r=\"3.6\" fill=\"var(--card)\" stroke=\"var(--ink)\" stroke-width=\"1.4\"/><circle cx=\"187.7\" cy=\"22.2\" r=\"3.6\" fill=\"var(--ink)\"/><circle cx=\"106.1\" cy=\"94.5\" r=\"3.6\" fill=\"var(--ink)\"/><circle cx=\"171.2\" cy=\"66.9\" r=\"3.6\" fill=\"var(--card)\" stroke=\"var(--ink)\" stroke-width=\"1.4\"/><circle cx=\"157.5\" cy=\"95.9\" r=\"3.6\" fill=\"var(--card)\" stroke=\"var(--ink)\" stroke-width=\"1.4\"/><circle cx=\"115.3\" cy=\"129.4\" r=\"3.6\" fill=\"var(--card)\" stroke=\"var(--ink)\" stroke-width=\"1.4\"/><circle cx=\"85.8\" cy=\"176.3\" r=\"3.6\" fill=\"var(--card)\" stroke=\"var(--ink)\" stroke-width=\"1.4\"/><circle cx=\"63.8\" cy=\"177.7\" r=\"3.6\" fill=\"var(--card)\" stroke=\"var(--ink)\" stroke-width=\"1.4\"/><circle cx=\"122.1\" cy=\"120.7\" r=\"3.6\" fill=\"var(--card)\" stroke=\"var(--ink)\" stroke-width=\"1.4\"/><circle cx=\"139.9\" cy=\"119.4\" r=\"3.6\" fill=\"var(--card)\" stroke=\"var(--ink)\" stroke-width=\"1.4\"/><circle cx=\"108.6\" cy=\"99.9\" r=\"3.6\" fill=\"var(--ink)\"/><circle cx=\"162.9\" cy=\"88.4\" r=\"3.6\" fill=\"var(--card)\ =\"3\" fill=\"var(--ink)\"/><circle cx=\"127.7\" cy=\"103.9\" r=\"3\" fill=\"var(--ink)\"/><circle cx=\"130.0\" cy=\"102.4\" r=\"3\" fill=\"var(--ink)\"/><circle cx=\"132.3\" cy=\"100.8\" r=\"3\" fill=\"var(--ink)\"/><circle cx=\"134.7\" cy=\"99.0\" r=\"3\" fill=\"var(--ink)\"/><circle cx=\"137.1\" cy=\"97.1\" r=\"3\" fill=\"var(--ink)\"/><circle cx=\"139.6\" cy=\"95.0\" r=\"3\" fill=\"var(--ink)\"/><circle cx=\"142.2\" cy=\"92.6\" r=\"3\" fill=\"var(--ink)\"/><circle cx=\"145.0\" cy=\"90.0\" r=\"3\" fill=\"var(--ink)\"/><circle cx=\"147.9\" cy=\"87.1\" r=\"3\" fill=\"var(--ink)\"/><circle cx=\"151.1\" cy=\"83.7\" r=\"3\" fill=\"var(--ink)\"/><circle cx=\"154.4\" cy=\"79.7\" r=\"3\" fill=\"var(--ink)\"/><circle cx=\"158.2\" cy=\"75.0\" r=\"3\" fill=\"var(--ink)\"/><circle cx=\"162.5\" cy=\"69.1\" r=\"3\" fill=\"var(--ink)\"/><circle cx=\"167.5\" cy=\"61.4\" r=\"3\" fill=\"var(--ink)\"/><circle cx=\"173.7\" cy=\"50.5\" r=\"3\" fill=\"var(--ink)\"/><circle cx=\"182.3\" cy=\"32.6\" r=\"3\" fill=\"var(--ink)\"/><circle cx=\"198.4\" cy=\"18.0\" r=\"3\" fill=\"var(--ink)\"/><text x=\"120\" y=\"196\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink)\" >theoretical normal quantiles<\/text><text x=\"14\" y=\"98\" font-size=\"10\" fill=\"var(--ink)\" transform=\"rotate(-90 14 98)\" text-anchor=\"middle\">sample quantiles<\/text><\/svg>"},"41":{"title":"From model to decision","html":"A grocery delivery service builds a regression to estimate delivery time. For one order, the model predicts 42 minutes. The dispatcher is told to tell the customer “about 45 minutes.”"},"43":{"title":"Monitoring a patient","html":"An ICU monitors each patient’s heart rate every minute. A heart rate that drifts too high <b>or<\/b> too low is dangerous. The team uses CUSUM with the patient’s normal mean μ, an allowance C, and a threshold T."},"44":{"title":"Loan default tree","html":"A bank fits a classification tree (CART) to 400 past loans to predict default. In each leaf, “a out of b” means the leaf contains b training loans, and a of them are classified correctly by the leaf’s answer.<svg viewBox=\"0 0 380 292\" width=\"380\" role=\"img\" aria-label=\"Classification tree\"><line x1=\"170\" y1=\"44\" x2=\"80\" y2=\"90\" stroke=\"var(--ink-2)\" stroke-width=\"1.3\"/><text x=\"117.0\" y=\"67.0\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink-2)\">yes<\/text><line x1=\"170\" y1=\"44\" x2=\"255\" y2=\"90\" stroke=\"var(--ink-2)\" stroke-width=\"1.3\"/><text x=\"220.5\" y=\"67.0\" text-anchor=\"start\" font-size=\"10\" fill=\"var(--ink-2)\">no<\/text><line x1=\"255\" y1=\"124\" x2=\"175\" y2=\"170\" stroke=\"var(--ink-2)\" stroke-width=\"1.3\"/><text x=\"207.0\" y=\"147.0\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink-2)\">yes<\/text><line x1=\"255\" y1=\"124\" x2=\"320\" y2=\"170\" stroke=\"var(--ink-2)\" stroke-width=\"1.3\"/><text x=\"295.5\" y=\"147.0\" text-anchor=\"start\" font-size=\"10\" fill=\"var(--ink-2)\">no<\/text><line x1=\"175\" y1=\"204\" x2=\"110\" y2=\"250\" stroke=\"var(--ink-2)\" stroke-width=\"1.3\"/><text x=\"134.5\" y=\"227.0\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink-2)\">yes<\/text><line x1=\"175\" y1=\"204\" x2=\"235\" y2=\"250\" stroke=\"var(--ink-2)\" stroke-width=\"1.3\"/><text x=\"213.0\" y=\"227.0\" text-anchor=\"start\" font-size=\"10\" fill=\"var(--ink-2)\">no<\/text><rect x=\"95.0\" y=\"10\" width=\"150\" height=\"34\" rx=\"6\" fill=\"var(--card)\" stroke=\"var(--pen)\" stroke-width=\"1.5\"/><text x=\"170\" y=\"31\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--ink)\">Credit score < 640?<\/text><rect x=\"20.0\" y=\"90\" width=\"120\" height=\"34\" rx=\"6\" fill=\"var(--muted-bg)\" stroke=\"var(--ink-2)\" stroke-width=\"1.5\"/><text x=\"80\" y=\"104\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--ink)\">Default<\/text><text x=\"80\" y=\"117\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--ink)\">41 out of 52<\/text><rect x=\"190.0\" y=\"90\" width=\"130\" height=\"34\" rx=\"6\" fill=\"var(--card)\" stroke=\"var(--pen)\" stroke-width=\"1.5\"/><text x=\"255\" y=\"111\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--ink)\">Income < $45K?<\/text><rect x=\"110.0\" y=\"170\" width=\"130\" height=\"34\" rx=\"6\" fill=\"var(--card)\" stroke=\"var(--pen)\" stroke-width=\"1.5\"/><text x=\"175\" y=\"191\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--ink)\">Debt ratio < 0.35?<\/text><rect x=\"265.0\" y=\"170\" width=\"110\" height=\"34\" rx=\"6\" fill=\"var(--muted-bg)\" stroke=\"var(--ink-2)\" stroke-width=\"1.5\"/><text x=\"320\" y=\"184\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--ink)\">Repaid<\/text><text x=\"320\" y=\"197\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--ink)\">290 out of 309<\/text><rect x=\"55.0\" y=\"250\" width=\"110\" height=\"34\" rx=\"6\" fill=\"var(--muted-bg)\" stroke=\"var(--ink-2)\" stroke-width=\"1.5\"/><text x=\"110\" y=\"264\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--ink)\">Repaid<\/text><text x=\"110\" y=\"277\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--ink)\">30 out of 38<\/text><rect x=\"180.0\" y=\"250\" width=\"110\" height=\"34\" rx=\"6\" fill=\"var(--muted-bg)\" stroke=\"var(--ink-2)\" stroke-width=\"1.5\"/><text x=\"235\" y=\"264\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--ink)\">Default<\/text><text x=\"235\" y=\"277\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--ink)\">1 out of 1<\/text><\/svg>"},"45":{"title":"Fraud confusion matrix","html":"A fraud model is tested on 10,000 transactions (100 of them actually fraud):\n<table class=\"dtab\"><tr><th><\/th><th>Predicted fraud<\/th><th>Predicted legitimate<\/th><\/tr><tr><th>Actually fraud<\/th><td>80 (true positives)<\/td><td>20 (false negatives)<\/td><\/tr><tr><th>Actually legitimate<\/th><td>400 (false positives)<\/td><td>9,500 (true negatives)<\/td><\/tr><\/table>"},"46":{"title":"Who will respond?","html":"A retailer fits a logistic regression to predict whether a customer responds to a mailed catalog:\n<div class=\"eq\">log( p / (1 − p) ) = −3 + 0.8·(prior purchases) + 1.2·(opened last email: 1 = yes)<\/div>\nwhere p is the probability of responding."},"47":{"title":"Growing trees and forests","html":"A utility predicts each household’s monthly electricity use from 40 factors (home size, age, appliances, local temperature, …) using regression trees and random forests."},"48":{"title":"Picking a regression type","html":"Beyond linear and logistic regression, a team is considering four other regression approaches: <b>Poisson regression<\/b>, <b>regression splines<\/b>, <b>Bayesian regression<\/b>, and <b>KNN regression<\/b>. For each situation below, choose the best fit."},"49":{"title":"Disease screening","html":"A logistic regression flags patients for a follow-up test for a disease. In a test group of 1,000 patients, 50 have the disease.\n<table class=\"dtab\"><tr><th><\/th><th>Flagged<\/th><th>Not flagged<\/th><\/tr><tr><th>Has disease<\/th><td>45<\/td><td>5<\/td><\/tr><tr><th>Healthy<\/th><td>95<\/td><td>855<\/td><\/tr><\/table>"},"50":{"title":"Which advanced model?","html":"An insurer is choosing models for several projects, using thousands of past claims with about 200 factors each."},"51":{"title":"Two lines, two jobs","html":"A bank uses two models that both look like a line, Σⱼ aⱼxⱼ + a₀:\n<ul class=\"steps\"><li>A <b>soft-margin SVM<\/b> that approves or denies applicants.<\/li><li>A <b>linear regression<\/b> that estimates the dollar loss if a loan defaults.<\/li><\/ul>Applicant data such as income and credit score are measured with some error (self-reported incomes, credit scores that change month to month)."},"52":{"title":"Theme-park forecasting","html":"A theme park wants better forecasts for staffing. Its analytics team reviews the data it has and the forecasting methods it might use."},"53":{"title":"Physics vs. people","html":"Two analysts report their regressions:\n<ul class=\"steps\"><li>A physics lab models how far a spring stretches under different loads: <b>R² = 0.99<\/b>.<\/li><li>A retailer models how much each customer spends from age, income, and visit frequency: <b>R² = 0.30<\/b>.<\/li><\/ul>"},"54":{"title":"Two spam filters","html":"An email provider tests two spam filters on 1,000 emails: 500 real and 500 spam. <b>Real email is the positive class.<\/b> Correct answers cost $0; reading a spam costs $0.05; losing a real email costs $1.\n<table class=\"dtab\"><tr><th><\/th><th>Filter A<\/th><th>Filter B<\/th><\/tr><tr><th>Real kept in inbox<\/th><td>480<\/td><td>495<\/td><\/tr><tr><th>Real sent to junk<\/th><td>20<\/td><td>5<\/td><\/tr><tr><th>Spam let into inbox<\/th><td>100<\/td><td>200<\/td><\/tr><tr><th>Spam sent to junk<\/th><td>400<\/td><td>300<\/td><\/tr><\/table>"},"55":{"title":"Airport security line","html":"An airport wants to predict how many passengers arrive at a security checkpoint in each 15-minute slot, using time of day, day of week and holidays. One new terminal has only three weeks of data."},"56":{"title":"Delivery-time tree","html":"A courier predicts delivery time (minutes) from 12 factors using the lecture’s regression-tree method: grow on half the data by splitting on variance decrease (only if the decrease beats a threshold), keep every leaf to at least 5% of the data, then prune using the other half."},"57":{"title":"Credit union loans","html":"A credit union fits a logistic regression to 5,000 past loans to estimate each applicant’s probability p of repaying. It approves a loan if p ≥ 0.7."}};

function drawCave(cv,t){

  for(let i=0;i<6;i++)P(r()*W,FY+2+r()*4,2,1,"#3f3a4d");
  if(type==="crevasse"){

    P(0,FY-12,W,H-FY+12,"#1a1526");for(let i=0;i<30;i++)P(r()*W,FY-11+r()*18,2+r()*3,1,r()<.5?"#2c2440":"#120e1b");
    let x=cx;for(let y=FY-12;y<H;y++){const w=Math.max(1,Math.round((y-(FY-12))*.55)+(r()<.4?1:0));x+=r()<.5?-1:1;x=Math.max(cx-6,Math.min(cx+6,x));
      P(x-w-1,y,1,1,"#4a3424");P(x-w,y,w*2,1,"#050409");P(x+w,y,1,1,"#3a2a1e")}
    [[cx-16,FY-2,5,2],[cx+11,FY+1,6,3],[cx-22,FY+4,4,2],[cx+18,FY-6,3,2]].forEach(([a,b,w,h])=>{P(a,b,w,h,"#4a3424");P(a,b,w,1,"#6b4c34")});
    if(!still){const p=(t/600)%1;P(cx-1+(seed%3),FY+p*8,1,1,"#6b6386");if(((t/900)%2)<1)P(cx+2,FY+3+((t/120)%4|0),1,1,"#4a3424")}
    return}
  // cave mouth: a rough arch with a lit rim
  const edge={};
  for(let y=top;y<FY;y++){const dy=Math.max(0,top+mw-y),w=Math.round(Math.sqrt(Math.max(0,mw*mw-dy*dy)))+(r()<.3?1:0);edge[y]=w}
  Object.entries(edge).forEach(([y,w])=>{y=+y;P(cx-w-1,y,1,1,"#6b6380");P(cx+w,y,1,1,"#4a4458");P(cx-w,y,w*2,1,"#08070d")});
  const inMouth=(x,y)=>edge[y]!==undefined&&x>=cx-edge[y]&&x<cx+edge[y];
  // soft pixel glow: solid core, checkerboard dither at the edge
  const glow=(gx,gy,rad,col,a,clip)=>{c.fillStyle=col;for(let y=Math.floor(gy-rad);y<=gy+rad;y++)for(let x=Math.floor(gx-rad);x<=gx+rad;x++){

  // stalactites hanging from the top of the mouth
  for(let x=cx-mw+4;x<cx+mw-3;x+=3+(r()*3|0)){const len=1+(r()*4|0),y0=top+Math.max(0,mw-Math.round(Math.sqrt(Math.max(0,mw*mw-(x-cx)*(x-cx)))));for(let k=0;k<len;k++)P(x,y0+k,k<len-1?2:1,1,"#2a2636")}
  // stalagmites on the floor
  for(let x=cx-mw+3;x<cx+mw-2;x+=5+(r()*4|0)){const len=1+(r()*3|0);for(let k=0;k<len;k++)P(x,FY-1-k,k?1:2,1,"#1f1b29")}

    const bx=cx,by=FY-9,br=11;for(let y=-br;y<=br;y++)for(let x=-br-2;x<=br+2;x++){if(x*x/(br+2)**2+y*y/br**2>1||by+y>=FY)continue;P(bx+x,by+y,1,1,y<-4?"#6b6386":x>4?"#3a3150":"#4e4466")}
    P(bx-6,by-8,4,2,"#8a82a6");for(let k=0;k<5;k++)P(bx-12+k*6,FY-1,3,1,"#3d3352");
    if(!still&&((t/700)%3)<.3)P(bx+9,FY-3+((t/100)%3|0),1,1,"#6b6386");return}

  if(type==="fight"){
    if(!blink){P(cx-4,FY-11,2,1,"#ffd25a");P(cx+3,FY-11,2,1,"#ffd25a")}
    P(cx-10,FY-1,4,1,"#cfc4a2");P(cx-9,FY-2,1,1,"#cfc4a2"); // a bone
  }else if(type==="elite"){
    // claw marks and red eyes
    for(let k=0;k<3;k++)for(let y=0;y<6;y++)P(cx+mw+3+k*2+(y>>1),top+6+y,1,1,"#140f1c");
    const pulse=still?.5:(Math.sin(t/300+seed)+1)/2;
    if(!blink){glow(cx-4,FY-12,3.5,"#ff3a2a",.18+.2*pulse,true);glow(cx+4,FY-12,3.5,"#ff3a2a",.18+.2*pulse,true);
      P(cx-5,FY-13,2,2,"#ff5a3a");P(cx+3,FY-13,2,2,"#ff5a3a");P(cx-5,FY-13,1,1,"#ffd0b0");P(cx+3,FY-13,1,1,"#ffd0b0")}
    P(cx-12,FY-3,3,2,"#e8dfc4");P(cx-12,FY-1,1,1,"#e8dfc4");P(cx-10,FY-1,1,1,"#e8dfc4"); // skull
  }else if(type==="rest"){
    // a standing healing stone with a glowing rune
    const p=still?.5:(Math.sin(t/450+seed)+1)/2;
    glow(cx,FY-8,11+(p>.5?1:0),"#4fe3c0",.1+.14*p,true);
    for(let y=-14;y<=0;y++)for(let x=-5;x<=5;x++){if(x*x/20+(y+7)*(y+7)/56>1)continue;P(cx+x,FY-1+y,1,1,y<-10?"#9aa0b8":x>2?"#454a60":x<-2?"#7d8299":"#646a82")}

    const rc=p>.5?"#c8fff0":"#5ef0c8";P(cx-1,FY-12,3,1,rc);P(cx,FY-11,1,6,rc);P(cx-2,FY-9,1,2,rc);P(cx+2,FY-9,1,2,rc);P(cx-1,FY-6,3,1,rc);
    if(!still){const k=(t/300+seed)%8;if(k<1)P(cx-7,FY-10,1,1,"#c8fff0");else if(k<2)P(cx+6,FY-13,1,1,"#c8fff0");else if(k<3)P(cx+5,FY-5,1,1,"#c8fff0")}
  }else if(type==="treasure"){

function offer(){
  if(!S.endless&&allDone()){S.endless={visits:0,right:0,since:Date.now()};S.offer=null}

  const open0=SECS.filter(k=>!secDone(k)),mt=open0.length?open0[0][0]:null,open=open0.filter(k=>k[0]===mt);
  if(S.offer&&S.offer.every(k=>open.includes(k))&&S.offer.length===Math.min(2,open.length))return S.offer;

const SCNS={};SECS.forEach(k=>SCNS[k]=[...new Set(SECQ[k].map(id=>QBY[id].sc))]);

const scnDone=(k,sc)=>scnQs(k,sc).every(id=>S.mastered[id]);
const nextScn=k=>SCNS[k].find(sc=>!scnDone(k,sc));

function startVisit(k){
  const E=!!S.endless,review=!E&&secDone(k);
  const sc=E||review?pick(SCNS[k]):nextScn(k);

  S.visit={k,sc,queue,i:0,right:0,missed:[],review,endless:E,pendant:true,hints:0,gained:0};

function curQ(){return QBY[S.visit.queue[S.visit.i]]}

function ask(){
  const q=curQ(),p=prevQ(),same=p&&p.sc===q.sc;

  S.scnOpen=same?S.scnOpen!==false:true;

}
function startTimer(){stopTimer();let last=Date.now(),n=0;timerId=setInterval(()=>{
  if(!S||S.phase!=="ask"||S.screen!=="battle"){stopTimer();return}
  const now=Date.now(),dt=(now-last)/1000;last=now;
  if(sheet)return; // paused while a sheet is open
  S.tLeft=Math.max(0,S.tLeft-dt);
  if(S.tLeft<=0){
    if(!S.watch){S.watch=true;S.tLeft+=WATCH_T;S.tMax=Math.max(S.tMax,S.tLeft);say(`${ico("pocket","ico sm")} Your pocket watch winds back <span class="good">${WATCH_T}s</span>.`);render();return}
    stopTimer();grade(true);return}
  const b=$("#tbar"),t=$("#tnum");if(b)b.style.width=(S.tLeft/S.tMax*100)+"%";if(t)t.textContent=Math.ceil(S.tLeft)+"s";
  if(++n%10===0)save();
},200)}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}

function choose(i){const q=curQ();if(S.phase!=="ask"||S.gone.includes(i))return;
  if(q.multi){S.sel=S.sel.includes(i)?S.sel.filter(x=>x!==i):[...S.sel,i];render();return}
  S.sel=[i];grade(false)}
function hint(){const q=curQ(),V=S.visit;if(S.phase!=="ask"||V.hints>=cnt("table"))return;
  const w=q.opts.map((_,i)=>i).filter(i=>!q.ok.includes(i)&&!S.gone.includes(i));if(!w.length)return;
  const i=pick(w);S.gone.push(i);S.sel=S.sel.filter(x=>x!==i);V.hints++;render()}
function heal(n){const h=Math.max(0,Math.min(n,S.maxHp-S.hp));S.hp+=h;return h}
function grade(timeout){
  stopTimer();const q=curQ(),V=S.visit,[n]=VIS[V.k];
  S.picked=S.sel.slice();S.phase="result";
  const ok=!timeout&&S.picked.length===q.ok.length&&q.ok.every(i=>S.picked.includes(i));
  const next=QBY[V.queue[V.i+1]];S.carry=next&&next.sc===q.sc?S.tLeft:0;
  S.asked++;
  const right=q.ok.map(i=>`<b>${esc(q.opts[i][0])}</b>`).join(", ");
  if(ok){
    if(V.endless)S.endless.right++;S.correct++;S.streak++;S.bestStreak=Math.max(S.bestStreak,S.streak);V.right++;
    if(!S.mastered[q.id]){S.mastered[q.id]=1;V.gained++}
    const h=heal(rightHeal());
    say(`<span class="good">Right.</span> "${pick(CHEERS)}"${h?` +${h} HP.`:""}${S.carry>0?` ${Math.round(S.carry)}s saved for the next part.`:""}`);
    if(S.streak%3===0){const w=heal(windHeal());if(w)say(`Three in a row: a second wind. +${w} HP.`)}

  }else{
    S.streak=0;if(!V.endless)delete S.mastered[q.id];S.misses[q.id]=(S.misses[q.id]||0)+1;V.missed.push(q.id);S.carry=0;
    const dmg=hitOf(V.k);S.hp-=dmg;S.hitMe=true;

    say(`<span class="bad">${timeout?"Time's up.":"Not quite."}</span> "${pick(QUIPS)}" ${n} hits you for ${dmg}. Answer: ${right}.${trap?`<span class="tipline"><b>The trap</b>${esc(trap)}</span>`:""}`);
    if(S.hp<=0&&V.pendant){V.pendant=false;S.hp=1;say(`${ico("pendant","ico sm")} Your heart pendant flares and keeps you on your feet with 1 HP.`)}
    if(S.hp>0&&S.hp<=S.maxHp*.35&&S.potions>0){S.potions--;const h=heal(pct(POTION));say(`${ico("potion","ico sm")} You gulp a potion without thinking. +${h} HP (${S.potions} left).`)}
  }
  save();render();
}
function nextQ(){
  if(S.hp<=0){S.hp=0;if(S.visit.endless){recordRun();S.screen="final";say(`${VIS[S.visit.k][0]} knocks you out for good. Your run is recorded on the title page.`)}else S.screen="faint";save();render(true);return}

      :done||(!S.asked&&S.screen==="map")?`<button class="btn right" data-a="${done?"newok":"enter"}">${done?"Start a new run":"Enter the Conungeon"}</button>`
      :`<button class="btn ghost" data-a="newrun">New run</button><button class="btn right" data-a="enter">Continue</button>`;
    const info=confirmNewRun?`<p class="pin"><strong>Start over?</strong> Your mastery, loot and max HP will be erased. Past runs stay on the list.</p>`:"";
    return `<footer class="info"><div class="navbox">${nav}</div><div class="infotext">${info}<div class="alog">${S.log.slice(0,8).map(l=>`<p>${l}</p>`).join("")}</div></div></footer>`}
  if(S.screen==="map")nav=`<span class="label">Tap a visitor to begin</span>`;
  else if(S.screen==="battle"){const q=curQ(),V=S.visit;
    if(asking)nav=(q.multi?`<button class="btn right" data-a="submit" ${S.sel.length?"":"disabled"}>Submit</button>`:`<button class="btn right" disabled>Next question</button>`);
    else nav=`<button class="btn right" data-a="next" id="nextbtn">${S.hp<=0?"Fall":V.i+1>=V.queue.length?"Finish visit":"Next question"}</button>`}
  else if(S.screen==="clear")nav=`<button class="btn right" data-a="map">Next visitors</button>`;
  else if(S.screen==="final")nav=`<button class="btn right" data-a="title">Title page</button>`;
  else if(S.screen==="faint")nav=`<button class="btn ghost" data-a="map">‹ Leave</button><button class="btn right" data-a="revive" id="nextbtn">Revive</button>`;
  // while a question is open, the log box folds away to give the question the room
  return `<footer class="info${asking?" slim":logBig?" big":""}"><div class="navbox">${nav}</div>${asking?"":`<div class="infotext"><button class="linkbtn grow" data-a="logsize">${logBig?"▾ Less":"▴ More"}</button><div class="alog">${S.log.slice(0,40).map(l=>`<p>${l}</p>`).join("")}</div></div>`}</footer>`;
}
function render(top){
  const app=$("#app"),old=app.querySelector(".mid"),y=old&&!top?old.scrollTop:0;
  const body=onTitle?titleView():S.screen==="map"?mapView():S.screen==="battle"?battleView():S.screen==="clear"?clearView():S.screen==="final"?finalView():faintView();
  app.className="run"+(onTitle?" titlepage":S.screen==="battle"?" action":"");
  app.innerHTML=(onTitle?"":sheetView()+hud())+`<main class="mid">${body}</main>`+footer();
  const m=app.querySelector(".mid");if(m)m.scrollTop=y;
  const d=app.querySelector("details.scn");if(d)d.addEventListener("toggle",()=>{S.scnOpen=d.open;const t=d.querySelector(".tog");if(t)t.textContent=d.open?"Hide":"Show"});
  drawDoors(performance.now());S.hitMe=S.hitFoe=false;
}
document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-a]");if(!b||b.disabled)return;const a=b.dataset.a;
  if(a==="ans")choose(+b.dataset.i);
  else if(a==="submit"){if(S.sel.length)grade(false)}
  else if(a==="hint")hint();
  else if(a==="next")nextQ();
  else if(a==="visit")startVisit(b.dataset.v);
  else if(a==="loot")takeLoot(b.dataset.v);
  else if(a==="map"||a==="leave"){stopTimer();if(a==="leave"&&S.screen==="battle"){say(`You step away from ${VIS[S.visit.k][0]}. Your mastered answers are saved.`)}S.screen="map";S.visit=null;save();render(true)}
  else if(a==="revive")revive();
  else if(a==="enter"){onTitle=false;render(true);if(S.screen==="battle"&&S.phase==="ask")startTimer()}
  else if(a==="title"){stopTimer();onTitle=true;sheet=null;confirmNewRun=false;render(true)}
  else if(a==="newrun"){confirmNewRun=true;render()}
  else if(a==="newno"){confirmNewRun=false;render()}
  else if(a==="newok"){confirmNewRun=false;stopTimer();S=fresh();save();onTitle=false;render(true)}
  else if(a==="sheet"){sheet=b.dataset.v||null;confirmReset=false;render()}
  else if(a==="logsize"){logBig=!logBig;render()}
  else if(a==="reset"){confirmReset=true;render()}
  else if(a==="resetno"){confirmReset=false;render()}
  else if(a==="resetok"){confirmReset=false;sheet=null;stopTimer();S=fresh();save();render(true)}
});
document.addEventListener("keydown",e=>{if(!S||onTitle||S.screen!=="battle"||sheet)return;const q=curQ();
  if(S.phase==="ask"){const k=L.indexOf(e.key.toUpperCase());if(k>=0&&k<S.order.length)choose(S.order[k]);else if(e.key==="Enter"&&q.multi&&S.sel.length)grade(false)}
  else if(e.key==="Enter"||e.key===" "){e.preventDefault();nextQ()}});
// ---------- cave art for the visitor doors (shared with the Trivia Conungeon)
function useArt(){return false}
function drawDoors(t){document.querySelectorAll("canvas.cave").forEach(cv=>drawCave(cv,t))}
let last=0;function loop(t){if(t-last>80){drawDoors(t);last=t}requestAnimationFrame(loop)}
// ---------- boot: resume mid-question with the time that was left
// If a save from an older version can't be shown, fall back to the map with mastery and loot kept.
S=load()||fresh();
try{if(S.screen==="battle"&&!S.visit)S.screen="map";if(S.screen==="final"&&!S.visit)S.screen="map";render(true);if(!onTitle&&S.screen==="battle"&&S.phase==="ask")startTimer()}
catch(e){stopTimer();onTitle=true;S.screen="map";S.visit=null;sheet=null;try{render(true)}catch(e2){S=fresh();render(true)}}
requestAnimationFrame(loop);
</script></body></html>
