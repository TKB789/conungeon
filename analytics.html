ion predicts the probability of an outcome from a set of factors.","Choosing a tool built for a different kind of question."],["Principal component analysis","PCA transforms the predictors; it doesn’t make predictions on its own.","Choosing a tool built for a different kind of question."],["Support vector machine","An SVM assigns a class; it doesn’t directly give a probability.","Choosing a tool built for a different kind of question."]],"ok":[6],"id":"x-mix-7","seq":122,"sec":1,"set":3},{"m":"m7","sc":28,"q":"Select <b>all<\/b> of the models that could forecast next week’s daily transaction volume, which has a strong weekly pattern and a slow upward trend.","multi":true,"fixed":true,"opts":[["Exponential smoothing (Holt-Winters)","Trend and seasonal terms handle both features.",""],["ARIMA (with suitable differencing)","Differencing can remove the trend and seasonality so the remaining series can be modeled.",""],["GARCH","GARCH forecasts variance, not volume.","Confusing variance with level."],["CUSUM","CUSUM detects changes; it doesn’t forecast.","Mixing up detection and forecasting."],["k-means clustering","Clustering doesn’t forecast.","Wrong tool."]],"ok":[0,1],"id":"x-m7-16","seq":123,"sec":1,"set":3},{"m":"m2","sc":29,"q":"Which point lies exactly on its margin line?","multi":false,"fixed":false,"opts":[["Q","A value of exactly 1 means the point sits on its margin line, so it’s a support vector.",""],["P","2.7 is well past the margin, on the correct side.","Thinking larger means closer."],["R","0.4 is between the boundary and the margin.","Mixing up 0 and 1."],["S","−0.5 is on the wrong side.","Misreading the sign."]],"ok":[0],"id":"x-m2-17","seq":124,"sec":1,"set":3},{"m":"m2","sc":29,"q":"What are the soft-margin errors for points R and S?","multi":false,"fixed":false,"opts":[["R: 0.6. S: 1.5","R: 1 − 0.4 = 0.6. S: 1 − (−0.5) = 1.5. The further a point is on the wrong side, the larger its error.",""],["R: 0. S: 1","R is on the correct side but inside the margin, so it still has some error; S’s error grows with distance.","Thinking errors are just 0 or 1."],["R: 0.4. S: 0.5","The error is 1 minus the value, not the value itself.","Misapplying the formula."],["R: 0. S: 0","Both violate the margin.","Ignoring the margin."]],"ok":[0],"id":"x-m2-18","seq":125,"sec":1,"set":3},{"m":"m2","sc":29,"q":"If Σaⱼ² = 0.25, what is the margin width 2/√(Σaⱼ²)? And what if every coefficient doubled?","multi":false,"fixed":false,"opts":[["4; it would shrink to 2","√0.25 = 0.5, so the width is 2/0.5 = 4. Doubling the coefficients multiplies Σaⱼ² by 4, which halves the margin.",""],["8; it would grow to 16","The square root of 0.25 is 0.5, not 0.25.","Forgetting the root."],["4; it would stay 4","The margin depends on the coefficient sizes.","Ignoring the formula."],["4; it would shrink to 1","Doubling the coefficients halves the margin; it doesn’t quarter it.","Squaring the effect twice."]],"ok":[0],"id":"x-m2-19","seq":126,"sec":1,"set":3},{"m":"m2","sc":30,"q":"With min-max scaling to [0, 1], a score of 740 becomes 0.8. What does 0.8 mean?","multi":false,"fixed":false,"opts":[["740 is 80% of the way from the lowest to the highest score","Min-max scaling measures position within the range, not rank.",""],["The applicant scored higher than 80% of other applicants","That’s a percentile. Min-max says nothing about how many people are below a score.","Confusing range position with rank."],["The applicant has an 80% chance of being approved for a loan","Scaled values aren’t probabilities.","Reading a scaled value as a probability."],["740 is 0.8 standard deviations above the mean score","That’s standardization, a different scaling.","Mixing up the two methods."]],"ok":[0],"id":"x-m2-20","seq":127,"sec":1,"set":3},{"m":"m2","sc":30,"q":"A new applicant has a score of 860, above the training maximum. Using the training min and max, what happens?","multi":false,"fixed":false,"opts":[["The scaled value is slightly above 1 (about 1.02), outside the training range","New data can fall outside [0, 1]. The model sees a value it never saw in training.",""],["It’s capped at exactly 1 automatically","The formula doesn’t cap anything.","Assuming built-in clipping."],["Everyone else’s scaled scores change","They change only if you refit the scaling on the new data.","Mixing up refitting with applying."],["It scales to a negative value, since it’s outside the training range","Above the max gives a value above 1; only values below the min go negative.","Getting the direction wrong."]],"ok":[0],"id":"x-m2-21","seq":128,"sec":1,"set":3},{"m":"m2","sc":30,"q":"With standardization instead, what is a score of 600, and what does it mean?","multi":false,"fixed":false,"opts":[["−2: two standard deviations below the mean","(600 − 700) / 50 = −2.",""],["0.55: the min-max value","That’s a different method.","Mixing the two methods."],["+2: two standard deviations above the mean","600 is below the mean.","Flipping the sign."],["−100: 100 points below the mean","Standardization divides by the SD.","Forgetting to divide."]],"ok":[0],"id":"x-m2-22","seq":129,"sec":1,"set":3},{"m":"m3","sc":31,"q":"The team picks SVM-4 (97%). What accuracy should they expect on new data?","multi":false,"fixed":false,"opts":[["Probably below 97%; check on a separate test set","The top validation score includes some luck from being the best of ten. Test data gives an unbiased estimate.",""],["Exactly 97%, since validation data is held out","The winner’s score is optimistically biased.","Ignoring selection bias."],["Above 97%, since it beat nine other models","Selection pushes the estimate up, not the true accuracy.","Reversing the bias."],["About 92%, the average across all ten models","That mixes in other models’ performance.","Averaging unrelated scores."]],"ok":[0],"id":"x-m3-10","seq":130,"sec":1,"set":3},{"m":"m3","sc":31,"q":"Suppose all ten models truly have 93% accuracy, and SVM-4 scored 97% purely by luck. What does this show?","multi":false,"fixed":false,"opts":[["The top score likely includes some lucky random error","With equally good models, the winner is whichever one got the luckiest split.",""],["SVMs are better than KNN for this problem","Here they’re all equal by assumption.","Reading signal into noise."],["The validation set must have been built incorrectly","Random variation is normal.","Blaming the data."],["Each model’s validation score is biased on its own","Each is unbiased on its own; the bias comes from choosing the max.","Misplacing the bias."]],"ok":[0],"id":"x-m3-11","seq":131,"sec":1,"set":3},{"m":"m3","sc":31,"q":"On the test set, SVM-4 scores 92% and KNN-4 (which was not chosen) scores 94%. Should the team switch to KNN-4?","multi":false,"fixed":false,"opts":[["No; choosing by test score biases the final estimate","The test set’s job is a final, untouched estimate, not another round of selection.",""],["Yes; the test set shows KNN-4 is the better model","Choosing by test score reintroduces selection bias.","Reusing the test set."],["Yes, and report 94% as KNN-4’s expected accuracy","That number would be optimistically biased.","Reporting a selected score."],["No, because test scores are never accurate","They’re accurate when used once.","Overgeneralizing."]],"ok":[0],"id":"x-m3-12","seq":132,"sec":1,"set":3},{"m":"m3","sc":32,"q":"In each fold, how many points does the model train on, and how many are used to validate it?","multi":false,"fixed":false,"opts":[["900 for training, 100 for validation","The data is split into 10 parts of 100. Each fold holds out one part.",""],["100 for training, 900 for validation","That’s reversed.","Flipping the roles."],["1,000 for both training and validation","That’s training error, not cross-validation.","Reusing data."],["500 for each","That would be 2-fold.","Wrong fold size."]],"ok":[0],"id":"x-m3-13","seq":133,"sec":1,"set":3},{"m":"m3","sc":32,"q":"How many times is each data point used for training and for validation?","multi":false,"fixed":false,"opts":[["Training 9 times, validation once","Each point sits in exactly one held-out part, and in the training data of the other 9 folds.",""],["Training once, validation 9 times","That’s reversed.","Flipping the counts."],["Training 10 times, validation 10 times","A point is never used for training and validation in the same fold.","Double counting."],["It varies at random","Every point is held out exactly once.","Misunderstanding the folds."]],"ok":[0],"id":"x-m3-14","seq":134,"sec":1,"set":3},{"m":"m3","sc":32,"q":"How many models are fit in total, including the final model?","multi":false,"fixed":false,"opts":[["41: 10 folds × 4 values of k, plus 1 final refit","Each candidate is fit once per fold. Then the winner is refit on all the data.",""],["4: one model for each value of k","Each candidate is fit once per fold.","Ignoring the folds."],["10: one model for each fold","Every candidate needs its own fold fits.","Ignoring the candidates."],["40, then deploy the best fold’s model","The final model is refit on all the data.","Skipping the refit."]],"ok":[0],"id":"x-m3-15","seq":135,"sec":1,"set":3},{"m":"m3","sc":32,"q":"Only 2% of the points are positive cases. What’s a sensible tweak to the folds?","multi":false,"fixed":false,"opts":[["Stratify the folds so each has about 2% positives","Otherwise some folds might have almost no positives, making their scores unreliable.",""],["Use fewer folds so each has more positives","That helps a little but doesn’t guarantee balance.","A weaker fix."],["Put all the positives in the training folds","Then validation never checks the positives.","Breaking the evaluation."],["Nothing; random folds always balance perfectly","With rare classes they often don’t.","Overtrusting randomness."]],"ok":[0],"id":"x-m3-16","seq":136,"sec":1,"set":3},{"m":"m4","sc":33,"q":"Select <b>all<\/b> of the projects that are supervised learning.","multi":true,"fixed":true,"opts":[["Predict whether a claim is fraudulent, using past claims labeled by investigators","Known labels are what make it supervised.",""],["Find natural groups of members based on how they use care, with no predefined groups","No labels, so it’s unsupervised (clustering).","Confusing clustering with classification."],["Predict next year’s cost for each member, using past members’ actual costs","Regression on a known response is supervised.",""],["Discover which combinations of diagnoses tend to occur together","Discovering structure without a response is unsupervised.","Assuming any analysis is supervised."]],"ok":[0,2],"id":"x-m4-12","seq":137,"sec":2,"set":3},{"m":"m4","sc":33,"q":"The team clusters patients for personalized medicine. What’s the main value of the clusters?","multi":false,"fixed":false,"opts":[["Similar patients’ outcomes can guide care in each group","Clusters group similar patients, so results within a group can be shared.",""],["They tell each patient their exact diagnosis","Clustering doesn’t diagnose.","Overstating clustering."],["They prove which treatment causes recovery","They show similarity, not causation.","Reading cause into groups."],["They replace the need for patient medical data","They’re built from medical data.","Misunderstanding the method."]],"ok":[0],"id":"x-m4-13","seq":138,"sec":2,"set":3},{"m":"m4","sc":33,"q":"The elbow diagram for the patient clusters falls smoothly with no clear bend. How should the team choose k?","multi":false,"fixed":false,"opts":[["Choose based on how many groups clinicians can actually use","When the elbow is unclear, real-world usefulness has to guide k.",""],["Choose the k with the lowest total distance to centers","That always picks the largest k.","Minimizing blindly."],["Conclude the data has no real clusters, and stop","A smooth curve doesn’t prove there are no useful groups.","Overreading the diagram."],["Use cross-validation accuracy to choose the best k","With no labels, there’s no accuracy to cross-validate; clustering has to be judged by usefulness and interpretability.","Treating clustering like classification."]],"ok":[0],"id":"x-m4-14","seq":139,"sec":2,"set":3},{"m":"m5","sc":34,"q":"About how many readings would you expect beyond 3 standard deviations, even if nothing is wrong?","multi":false,"fixed":false,"opts":[["About 27","0.27% of 10,000 ≈ 27.",""],["0, since normal data has no extreme values","Normal data always has some extremes.","Expecting none."],["About 460","That’s the count beyond 2 SDs.","Mixing up the cutoffs."],["About 3","That’s 0.03%, not 0.27%.","Arithmetic slip."]],"ok":[0],"id":"x-m5-11","seq":140,"sec":2,"set":3},{"m":"m5","sc":34,"q":"A colleague switches the rule to flag readings beyond 2 SDs and finds about 460. What should you conclude?","multi":false,"fixed":false,"opts":[["That’s about normal; most are probably ordinary readings","4.6% of 10,000 ≈ 460, so a 2-SD rule flags many perfectly normal points.",""],["The sensor is badly malfunctioning and needs repair","The count matches what normal data predicts.","Treating expected tails as errors."],["All 460 readings should be deleted before modeling","That removes real data.","Deleting by rule."],["The data must not be normally distributed after all","The count is exactly what normal data predicts.","Misreading the evidence."]],"ok":[0],"id":"x-m5-12","seq":141,"sec":2,"set":3},{"m":"m5","sc":34,"q":"Instead, 600 readings fall beyond 3 SDs. What does that suggest?","multi":false,"fixed":false,"opts":[["Far more extremes than a normal distribution predicts: heavy tails, or a real problem worth investigating","600 vs. an expected ~27 is a big gap. Either the data isn’t normal or something is generating extreme values.",""],["Nothing unusual; 600 is close to 27","It’s more than 20 times what you’d expect.","Ignoring the size of the gap."],["The sensor is perfect","Extra extremes point the other way.","Misreading."],["Switch to a 2-SD rule","That flags even more points and doesn’t explain anything.","Changing the rule instead of investigating."]],"ok":[0],"id":"x-m5-13","seq":142,"sec":2,"set":3},{"m":"m7","sc":35,"q":"This Saturday, sales were 1.5 times the baseline. Last Saturday’s factor was 1.3, and γ = 0.2. Where does the new Saturday factor land?","multi":false,"fixed":false,"opts":[["A little above 1.3, moving only slightly toward 1.5","With γ = 0.2, the new factor is 20% today’s ratio and 80% the old factor: 0.2 × 1.5 + 0.8 × 1.3 = 1.34.",""],["1.5, since this week’s data is the most current","That’s γ = 1, which throws away the history.","Ignoring the old factor."],["Exactly 1.3, since one week isn’t enough to change a seasonal factor","Any γ above 0 moves it at least a little.","Treating γ as 0."],["Between 1.3 and 1.5, closer to 1.5","That would need γ above 0.5.","Swapping γ and 1 − γ."]],"ok":[0],"id":"x-m7-17","seq":143,"sec":2,"set":3},{"m":"m7","sc":35,"q":"What happens if γ = 0?","multi":false,"fixed":false,"opts":[["The seasonal factors never change from their starting values","With γ = 0, Cₜ always equals C<sub>t−L<\/sub>.",""],["The model ends up with no seasonality at all","The initial factors are still used; they just never update.","Confusing “frozen” with “none.”"],["The baseline stops updating along with the factors","The baseline is controlled by α.","Confusing parameters."],["The factors react instantly to each new week’s data","That’s γ = 1.","Reversing γ."]],"ok":[0],"id":"x-m7-18","seq":144,"sec":2,"set":3},{"m":"m7","sc":35,"q":"Every day’s sales rise by 10% for a month, but the weekly pattern keeps the same shape. In a multiplicative model, what happens to the seasonal factors?","multi":false,"fixed":false,"opts":[["They stay about the same; the baseline rises","Multiplicative factors are ratios to the baseline, so a uniform rise shows up in S, not C.",""],["They all rise by about 10%","The baseline absorbs the uniform increase.","Putting the change in the wrong component."],["They all fall to make room for the trend","Nothing pushes them down.","Wrong direction."],["Only the weekend factors rise","The shape is unchanged.","Misreading the scenario."]],"ok":[0],"id":"x-m7-19","seq":145,"sec":2,"set":3},{"m":"m7","sc":36,"q":"Which ARIMA model is equivalent to basic (single) exponential smoothing?","multi":false,"fixed":false,"opts":[["ARIMA(0, 1, 1)","One difference plus one moving-average term reproduces simple exponential smoothing.",""],["ARIMA(0, 1, 0)","That’s a random walk: the forecast is the last value.","Mixing up the special cases."],["ARIMA(1, 0, 0)","That’s a simple autoregression on one lag.","Mixing up the special cases."],["ARIMA(0, 0, 0)","That’s just a constant mean plus noise.","Mixing up the special cases."]],"ok":[0],"id":"x-m7-20","seq":146,"sec":2,"set":3},{"m":"m7","sc":36,"q":"Which series is most likely already stationary (d = 0)?","multi":false,"fixed":false,"opts":[["Forecast errors of a well-calibrated model","Their mean and variance should stay constant over time.",""],["A city’s population over 30 years","It has a trend.","Ignoring the trend."],["Monthly ice-cream sales over a decade","They have strong seasonality.","Ignoring seasonality."],["A stock’s daily closing price","Prices wander like a random walk.","Ignoring the drift."]],"ok":[0],"id":"x-m7-21","seq":147,"sec":2,"set":3},{"m":"m7","sc":36,"q":"The analyst differences a series that was already stationary. What’s the likely effect?","multi":false,"fixed":false,"opts":[["It adds unnecessary noise and structure, which can hurt the forecasts","Over-differencing creates artificial patterns that the model then has to fit.",""],["Nothing; extra differencing is harmless","It changes the series and usually adds noise.","Assuming it’s free."],["It makes the series stationary twice over, which improves the fit","There’s no benefit to removing a trend that isn’t there; the extra differencing just adds noise.","Assuming more differencing is safer."],["It turns the series into a trend","Differencing removes trends; it doesn’t create them.","Reversing the effect."]],"ok":[0],"id":"x-m7-22","seq":148,"sec":2,"set":3},{"m":"m7","sc":36,"q":"One series has only 18 monthly observations and a few spikes. Which approach is generally more sensible?","multi":false,"fixed":false,"opts":[["Exponential smoothing; ARIMA typically needs about 40+ points","With short, noisy data, a simpler model is less likely to overfit.",""],["ARIMA, since it generally forecasts better than smoothing","More parameters need more data.","Assuming more complexity always wins."],["GARCH, since the spikes make the data noisy","GARCH models variance, not the level.","Confusing noise with variance forecasting."],["None; 18 points is too few for any forecast","Simple methods still work.","Overstating the limit."]],"ok":[0],"id":"x-m7-23","seq":149,"sec":2,"set":3},{"m":"m8","sc":37,"q":"In Model 1, how much does a 1-point bigger discount change predicted spend for a non-member, and for a member?","multi":false,"fixed":false,"opts":[["Non-member: +3. Member: +7","The discount’s effect is 3 + 4 × member, so 3 when member = 0 and 7 when member = 1.",""],["+3 for both","That ignores the interaction term.","Dropping the interaction."],["Non-member: +3. Member: +4","The member effect adds to the base 3.","Using the interaction term alone."],["+7 for both","Non-members don’t get the interaction.","Applying the interaction to everyone."]],"ok":[0],"id":"x-m8-17","seq":150,"sec":2,"set":3},{"m":"m8","sc":37,"q":"In Model 2, what does one more year of education do to predicted salary?","multi":false,"fixed":false,"opts":[["Raises it by roughly 6% (a multiplier of e^0.06)","Adding 0.06 on the log scale multiplies salary by e^0.06.",""],["Adds $0.06 to salary per year","That’s the change in log(salary), not salary.","Forgetting the transform."],["Adds $6,000 to salary per year","A log model gives percentage effects.","Treating it as linear in dollars."],["Multiplies salary by 0.06 per year","That would cut salary by 94%.","Wrong operation."]],"ok":[0],"id":"x-m8-18","seq":151,"sec":2,"set":3},{"m":"m8","sc":37,"q":"Why might the analyst have used log(salary) as the response?","multi":false,"fixed":false,"opts":[["Salaries are skewed, and effects likely act in percentages","Logs reduce skew and turn multiplicative effects into additive ones.",""],["To make the coefficient on education easier to compute","The software computes coefficients either way; the log is about the data’s shape and the kind of effect.","Confusing modeling choices with computation."],["To reduce the size of education’s effect on salary","A log changes the scale on which effects are measured, not their strength.","Thinking transforms shrink effects."],["To make the p-values of the coefficients smaller","That’s not a reason to transform.","Gaming significance."]],"ok":[0],"id":"x-m8-19","seq":152,"sec":2,"set":3},{"m":"m8","sc":38,"q":"If none of the 100 foods truly mattered, about how many would you still expect to look significant?","multi":false,"fixed":false,"opts":[["About 5","5% of 100 tests give false positives by chance.",""],["0","Chance alone produces some small p-values.","Ignoring false positives."],["About 50","That would be a 50% false-positive rate.","Arithmetic slip."],["Exactly 6","The expected number under no effects is 5.","Confusing what was observed with what’s expected."]],"ok":[0],"id":"x-m8-20","seq":153,"sec":3,"set":3},{"m":"m8","sc":38,"q":"Given that, how should the six significant foods be viewed?","multi":false,"fixed":false,"opts":[["As candidates to retest, since some may be flukes","With many tests, a handful of “significant” results is expected by chance alone.",""],["As proven to affect heart health","Multiple testing makes some of them likely flukes.","Trusting each p-value in isolation."],["As definitely all false positives","Some could be real; you need new data to tell.","Overcorrecting."],["As reliable, given the large sample size","A large sample doesn’t fix multiple testing.","Confusing n with validity."]],"ok":[0],"id":"x-m8-21","seq":154,"sec":3,"set":3},{"m":"m8","sc":38,"q":"One food, walnuts, is significant. Select <b>all<\/b> of the findings that would strengthen a causal claim that walnuts improve heart health.","multi":true,"fixed":true,"opts":[["Heart health improved after people started eating walnuts, not before","The cause must come before the effect.",""],["There’s a plausible biological mechanism for the effect","A sensible “why” supports causation.",""],["The effect remains after controlling for exercise, income, and overall diet quality","Ruling out confounders removes alternative explanations.",""],["The p-value is extremely small","A small p-value shows association, not causation.","Equating significance with cause."]],"ok":[0,1,2],"id":"x-m8-22","seq":155,"sec":3,"set":3},{"m":"m9","sc":39,"q":"Why is D1 the first principal component?","multi":false,"fixed":false,"opts":[["It’s the direction of greatest variation in the data","PCA orders directions by variance, and D1 runs along the long axis of the cloud.",""],["It’s the direction that best separates the two classes","PCA doesn’t look at the classes at all.","Thinking PCA is supervised."],["It’s parallel to factor 1, the first variable","It’s diagonal, a combination of both factors.","Confusing components with factors."],["It’s the shortest direction across the data cloud","That’s the last component.","Reversing the order."]],"ok":[0],"id":"x-m9-10","seq":156,"sec":3,"set":3},{"m":"m9","sc":39,"q":"If the analyst keeps only D1, what happens to the classifier?","multi":false,"fixed":false,"opts":[["It does poorly; the classes differ only along D2","High variance isn’t the same as usefulness for the response.",""],["It does better, since D1 holds the most information","It holds the most variance, but not the class information.","Equating variance with usefulness."],["Nothing changes, since PCA keeps all the information","Dropping D2 loses information.","Thinking reduction is free."],["It’s fine, since PCA automatically keeps D2 instead","PCA always keeps components in order of variance.","Thinking PCA adapts to the classes."]],"ok":[0],"id":"x-m9-11","seq":157,"sec":3,"set":3},{"m":"m9","sc":39,"q":"Given this risk, why use PCA at all?","multi":false,"fixed":false,"opts":[["It often helps, but check it against validation data","It’s a tool, not a guarantee. Compare models with and without it.",""],["It always improves prediction","This example shows it doesn’t.","Overtrusting PCA."],["It always keeps the components that separate the classes best","It keeps the highest-variance components, which this example shows aren’t always the most useful.","Thinking PCA is supervised."],["It turns unlabeled data into labeled data","It doesn’t create labels.","Misunderstanding PCA."]],"ok":[0],"id":"x-m9-12","seq":158,"sec":3,"set":3},{"m":"m9","sc":39,"q":"For a square matrix A, what does it mean for v to be an eigenvector with eigenvalue λ?","multi":false,"fixed":false,"opts":[["A·v = λ·v: A only stretches v, without turning it","That’s the definition used to find the principal directions.",""],["A·v = 0: A sends v to zero","That only describes eigenvalue 0.","Special case only."],["v is the largest column of A","Eigenvectors aren’t columns of A.","Misunderstanding the term."],["A·λ = v: λ is transformed by A","The roles are wrong.","Mixing up the equation."]],"ok":[0],"id":"x-m9-13","seq":159,"sec":3,"set":3},{"m":"m9","sc":40,"q":"What does this Q-Q plot show?","multi":false,"fixed":false,"opts":[["Right skew: the largest values sit far above the line","Points bend upward at the top, meaning bigger extremes than a normal distribution would have.",""],["The response is normal, since most points are near the line","The points curve away from the line.","Misreading the plot."],["The response has a linear trend over time","A Q-Q plot doesn’t involve time.","Confusing plot types."],["Left skew: the smallest values sit far below the line","The long tail is on the high end.","Flipping the direction."]],"ok":[0],"id":"x-m9-14","seq":160,"sec":3,"set":3},{"m":"m9","sc":40,"q":"The analyst applies a Box-Cox transformation. Who chooses λ, and what will it likely be?","multi":false,"fixed":false,"opts":[["Software picks λ; likely below 1 (e.g., log or square root)","λ below 1 compresses large values more than small ones, reducing right skew.",""],["The analyst picks λ, and λ = 1 is the standard choice","λ = 1 changes nothing; software optimizes λ.","Misunderstanding who picks."],["Software picks λ, and for right skew it will be above 1","λ above 1 would make right skew worse.","Reversing the direction."],["No λ is needed, since Box-Cox is always a log transform","λ is the transformation’s parameter.","Missing the idea."]],"ok":[0],"id":"x-m9-15","seq":161,"sec":3,"set":3},{"m":"m9","sc":40,"q":"Some claims in the data are exactly $0. Why is that a problem for Box-Cox?","multi":false,"fixed":false,"opts":[["Box-Cox needs positive values, so zeros must be handled first","The transformation, including the log case, is defined only for positive numbers.",""],["It isn’t a problem; Box-Cox works on any value","Logs and fractional powers of 0 or negatives fail.","Missing the domain restriction."],["Zeros force λ to equal 0, so it becomes a log transform","λ is chosen by fit, not by the values.","Confusing ideas."],["Zeros must always be deleted before any modeling","Shifting is often better than deleting.","Using a blanket rule."]],"ok":[0],"id":"x-m9-16","seq":162,"sec":3,"set":3},{"m":"m1","sc":41,"q":"Which step of the modeling cycle (real situation → math model → analysis → real-world answer) is “tell the customer 45 minutes”?","multi":false,"fixed":false,"opts":[["Turning the analysis into a real-world answer","The model’s 42 minutes is translated into a practical decision with a buffer.",""],["Building the mathematical model of the situation","The model was already built.","Wrong stage."],["Running the analysis on the mathematical model","The analysis produced the 42.","Wrong stage."],["Describing the real situation that needs a decision","That comes first.","Wrong stage."]],"ok":[0],"id":"x-m1-3","seq":163,"sec":3,"set":3},{"m":"m1","sc":41,"q":"A consultant’s report for this service says only “we used a regression model.” Why can’t the client reproduce the estimates from that?","multi":false,"fixed":false,"opts":[["“Model” could mean the method, structure, or fitted numbers","Reproducing the estimates requires the actual predictors and fitted numbers.",""],["Regression models can’t be reproduced by anyone else","They can, with the details.","Overstating it."],["The client needs the consultant’s exact software","Any software works with the specification.","Wrong barrier."],["Regression gives different results each time it runs","Least squares gives the same answer on the same data.","Misunderstanding regression."]],"ok":[0],"id":"x-m1-4","seq":164,"sec":3,"set":3},{"m":"m6","sc":43,"q":"How should CUSUM be set up for this patient?","multi":false,"fixed":false,"opts":[["Run an increase CUSUM and a decrease CUSUM side by side","Both directions matter, so each gets its own running sum with the floor at 0.",""],["Run only an increase CUSUM, since high heart rates are more common","A dangerous drop would go unnoticed.","Watching only one direction."],["Use one sum of raw deviations from μ, without the max with 0","Highs and lows would cancel out, hiding a real drift.","Letting directions cancel."],["Set C = 0 so that any change is caught","That causes constant false alarms from normal variation.","Ignoring noise."]],"ok":[0],"id":"x-m6-9","seq":165,"sec":3,"set":3},{"m":"m6","sc":43,"q":"In the increase CUSUM, a reading comes in above μ but below μ + C. What happens to Sₜ?","multi":false,"fixed":false,"opts":[["It goes down (or stays at 0), since xₜ − μ − C is negative","Readings only add to the sum when they exceed μ + C, so a mildly high reading is treated as normal.",""],["It goes up, since the reading is above the mean","The allowance C must be exceeded first.","Ignoring C."],["It resets to 0 immediately, whatever its current value","It only drops by the shortfall; it hits 0 only if that’s enough.","Overstating the reset."],["The alarm goes off","A single mild reading can’t push the sum up.","Overreacting."]],"ok":[0],"id":"x-m6-10","seq":166,"sec":3,"set":3},{"m":"m10","sc":48,"q":"A call center wants to predict the <b>number of calls arriving<\/b> each hour from day, time, and promotions.","multi":false,"fixed":true,"opts":[["Poisson regression","Poisson regression models counts of events (like arrivals per hour), which are whole numbers and can’t be negative.","Matching the situation to the wrong regression type."],["Regression splines","Splines fit separate polynomial pieces joined at “knots,” so the relationship can bend or change slope at certain points.","Matching the situation to the wrong regression type."],["Bayesian regression","Bayesian regression combines a prior belief (for example, from experts or similar products) with the data, which helps when data is scarce.","Matching the situation to the wrong regression type."],["KNN regression","KNN regression predicts by averaging the responses of the most similar past data points.","Matching the situation to the wrong regression type."]],"ok":[0],"id":"x-m10-21","seq":167,"sec":3,"set":3},{"m":"m10","sc":48,"q":"Energy use falls as temperature rises up to about 65°F, then rises again as air conditioning kicks in.","multi":false,"fixed":true,"opts":[["Poisson regression","Poisson regression models counts of events (like arrivals per hour), which are whole numbers and can’t be negative.","Matching the situation to the wrong regression type."],["Regression splines","Splines fit separate polynomial pieces joined at “knots,” so the relationship can bend or change slope at certain points.","Matching the situation to the wrong regression type."],["Bayesian regression","Bayesian regression combines a prior belief (for example, from experts or similar products) with the data, which helps when data is scarce.","Matching the situation to the wrong regression type."],["KNN regression","KNN regression predicts by averaging the responses of the most similar past data points.","Matching the situation to the wrong regression type."]],"ok":[1],"id":"x-m10-22","seq":168,"sec":3,"set":3},{"m":"m10","sc":48,"q":"A new drink has only 6 weeks of sales, but experts have a good sense of its likely effect from similar launches.","multi":false,"fixed":true,"opts":[["Poisson regression","Poisson regression models counts of events (like arrivals per hour), which are whole numbers and can’t be negative.","Matching the situation to the wrong regression type."],["Regression splines","Splines fit separate polynomial pieces joined at “knots,” so the relationship can bend or change slope at certain points.","Matching the situation to the wrong regression type."],["Bayesian regression","Bayesian regression combines a prior belief (for example, from experts or similar products) with the data, which helps when data is scarce.","Matching the situation to the wrong regression type."],["KNN regression","KNN regression predicts by averaging the responses of the most similar past data points.","Matching the situation to the wrong regression type."]],"ok":[2],"id":"x-m10-23","seq":169,"sec":3,"set":3},{"m":"m10","sc":48,"q":"An appraiser wants to estimate a home’s value as the average sale price of the 5 most similar recently sold homes.","multi":false,"fixed":true,"opts":[["Poisson regression","Poisson regression models counts of events (like arrivals per hour), which are whole numbers and can’t be negative.","Matching the situation to the wrong regression type."],["Regression splines","Splines fit separate polynomial pieces joined at “knots,” so the relationship can bend or change slope at certain points.","Matching the situation to the wrong regression type."],["Bayesian regression","Bayesian regression combines a prior belief (for example, from experts or similar products) with the data, which helps when data is scarce.","Matching the situation to the wrong regression type."],["KNN regression","KNN regression predicts by averaging the responses of the most similar past data points.","Matching the situation to the wrong regression type."]],"ok":[3],"id":"x-m10-24","seq":170,"sec":3,"set":3},{"m":"m10","sc":49,"q":"What share of healthy patients are correctly <b>not<\/b> flagged (the specificity)?","multi":false,"fixed":false,"opts":[["90%","855 / (855 + 95) = 855 / 950 = 0.90.",""],["95%","That’s 45 / 50: the share of diseased patients caught (sensitivity).","Mixing up sensitivity and specificity."],["32%","That’s 45 / 140: the share of flagged patients who are sick.","Wrong denominator."],["85.5%","That’s 855 / 1,000.","Using all patients as the denominator."]],"ok":[0],"id":"x-m10-25","seq":171,"sec":4,"set":3},{"m":"m10","sc":49,"q":"Of the patients who are flagged, what share actually have the disease, and why is it so low?","multi":false,"fixed":false,"opts":[["About a third; the disease is rare, so false alarms outnumber cases","45 / (45 + 95) ≈ 0.32. Out of 950 healthy patients, 95 false alarms outnumber the 45 true cases.",""],["95%, the same as the share of sick patients caught","Sensitivity uses the sick patients as the denominator, not the flagged ones.","Mixing up the denominators."],["About a third, which shows the model is useless","It catches 90% of cases; the low share comes from rarity.","Blaming the model for the base rate."],["About 4.5%, the share of all patients who were flagged sick","That’s 45 / 1,000.","Wrong denominator."]],"ok":[0],"id":"x-m10-26","seq":172,"sec":4,"set":3},{"m":"m10","sc":49,"q":"Missing the disease is very dangerous, while a follow-up test is cheap and safe. How should the probability cutoff change?","multi":false,"fixed":false,"opts":[["Lower it, so fewer cases are missed","When false negatives are costly, accept more false positives.",""],["Raise it, to cut unnecessary follow-ups","That increases the dangerous error.","Protecting the cheap error."],["Keep 50%, since it’s the standard cutoff","50% assumes equal costs.","Using a default blindly."],["Leave it; the cutoff doesn’t affect misses","It directly trades misses for false alarms.","Ignoring the cutoff."]],"ok":[0],"id":"x-m10-27","seq":173,"sec":4,"set":3},{"m":"m10","sc":49,"q":"In the model, the coefficient on hours of exercise per week is −0.15. What does that mean?","multi":false,"fixed":false,"opts":[["More exercise goes with lower odds of disease, other factors fixed","A negative coefficient lowers the linear part, so the estimated probability goes down as exercise goes up.",""],["Each hour of exercise lowers the probability by 15 percentage points","Coefficients act inside the logistic function, not directly on probability.","Reading it as linear."],["Exercise prevents the disease, since the coefficient is significant","That’s a causal claim the model can’t make.","Reading cause into a coefficient."],["Exercise raises the odds of the disease, since the term is subtracted","A negative sign lowers them.","Flipping the sign."]],"ok":[0],"id":"x-m10-28","seq":174,"sec":4,"set":3},{"m":"mix","sc":50,"q":"For an internal fraud score where prediction accuracy matters most and no explanation is needed, which model is most appropriate?","multi":false,"fixed":false,"opts":[["Random forest","Forests usually predict very well with many factors, at the cost of explainability, which isn’t needed here.",""],["A single small classification tree","It’s easier to explain but usually less accurate.","Prioritizing the wrong goal."],["k-means clustering","It ignores the fraud labels.","Confusing clustering with classification."],["Exponential smoothing","It forecasts a time series.","Wrong tool."]],"ok":[0],"id":"x-mix-8","seq":175,"sec":4,"set":3},{"m":"mix","sc":50,"q":"For premium decisions that must be explained to customers and regulators, which models are most appropriate? Select <b>all<\/b> that apply.","multi":true,"fixed":true,"opts":[["Logistic or linear regression","Coefficients show how each factor affects the result.",""],["A single, pruned CART tree","Its if-then path explains each decision.",""],["A random forest of 1,000 trees","Too many averaged trees to give a readable explanation.","Ignoring explainability."],["A 1-nearest-neighbor model","“You resemble one past customer” is a weak and unstable explanation.","Mistaking similarity for explanation."]],"ok":[0,1],"id":"x-mix-9","seq":176,"sec":4,"set":3},{"m":"m10","sc":50,"q":"A regression tree for claim size ends with a leaf containing 3 of the 6,000 claims, and that leaf predicts its 3 claims perfectly. What should the insurer do?","multi":false,"fixed":false,"opts":[["Prune it or require larger leaves; it’s fitting noise","Tiny leaves overfit. Perfect accuracy on 3 points tells you nothing about new claims.",""],["Keep it, since it predicts its claims perfectly","Its accuracy is on its own training points.","Trusting training fit."],["Split it further, to make its predictions even better","That makes overfitting worse.","Going the wrong way."],["Delete the 3 claims, since they distort the tree","They may be real; the issue is the tree’s structure.","Deleting data to fix a model."]],"ok":[0],"id":"x-m10-29","seq":177,"sec":4,"set":3},{"m":"m10","sc":50,"q":"Each tree in a random forest is trained on a bootstrap sample. What is that?","multi":false,"fixed":false,"opts":[["A same-size sample drawn with replacement","Different bootstrap samples make the trees differ, which is what lets averaging help.",""],["The first 10% of the rows in the data","Bootstrap samples are random, not the first rows.","Misunderstanding the term."],["The full data set, unchanged, for every tree","Then the trees would differ only through factor sampling.","Missing the resampling."],["A random half of the data, drawn without replacement","Bootstrap samples are drawn with replacement and are the same size as the data.","Confusing bootstrapping with subsampling."]],"ok":[0],"id":"x-m10-30","seq":178,"sec":4,"set":3},{"m":"m10","sc":50,"q":"Why might an analyst still check a forest’s “variable importance” scores?","multi":false,"fixed":false,"opts":[["They roughly show which factors drive predictions","Importance scores summarize how much each factor helps across the trees, though not how it affects a single prediction.",""],["They prove which factors cause fraud","They measure predictive usefulness, not cause.","Reading cause into importance."],["They give each factor’s exact coefficient","Forests don’t have coefficients.","Confusing forests with regression."],["They’re required for the forest to predict","Prediction doesn’t require them.","Misunderstanding the tool."]],"ok":[0],"id":"x-m10-31","seq":179,"sec":4,"set":3},{"m":"m10","sc":54,"q":"With real email as positive, which cell is a spam that lands in the inbox?","multi":false,"fixed":false,"opts":[["A false positive","The model said “real” (positive), and it was wrong.",""],["A false negative","A false negative is a real email the model sent to junk.","Swapping the two errors."],["A true negative","A true negative is spam correctly sent to junk.","Misreading “negative.”"],["A true positive","A true positive is real email correctly kept.","Misreading “true.”"]],"ok":[0],"id":"x-m10-32","seq":180,"sec":4,"set":1},{"m":"m10","sc":54,"q":"About what share of Filter A’s inbox is spam?","multi":false,"fixed":false,"opts":[["About 1 in 6: 100 of 580","The inbox holds everything called real: 480 + 100 = 580, and 100 of them are spam.",""],["20%: 100 of 500","That’s the share of spam let through, not the share of the inbox.","Using the wrong denominator."],["10%: 100 of 1,000","Junk-folder email isn’t in the inbox.","Using all email."],["4%: 20 of 500","That’s the share of real email lost.","Mixing up the two measures."]],"ok":[0],"id":"x-m10-33","seq":181,"sec":4,"set":1},{"m":"m10","sc":54,"q":"Compared with Filter A, what are Filter B’s sensitivity and specificity?","multi":false,"fixed":false,"opts":[["Higher sensitivity (99% vs. 96%), lower specificity (60% vs. 80%)","Sensitivity = real kept / all real; specificity = spam caught / all spam.",""],["Lower sensitivity, higher specificity","B keeps more real email and catches less spam.","Reversing the pair."],["Both higher, since B loses fewer real emails","B lets twice as much spam through, so specificity falls.","Looking at one row only."],["Both lower, since B makes more mistakes overall","B loses fewer real emails, so sensitivity rises.","Looking at the total only."]],"ok":[0],"id":"x-m10-34","seq":182,"sec":4,"set":1},{"m":"m10","sc":54,"q":"Which filter costs less on these 1,000 emails?","multi":false,"fixed":false,"opts":[["B: $15 vs. $25 for A","A: 20 × $1 + 100 × $0.05 = $25. B: 5 × $1 + 200 × $0.05 = $15. B is cheaper even though it gets fewer emails right (795 vs. 880).",""],["A, since it classifies more emails correctly","Accuracy counts every mistake the same; A makes more of the expensive one.","Choosing by accuracy."],["A, since its inbox has less spam","Less spam read saves only 5¢ per message.","Weighing only the cheap mistake."],["They cost the same","A costs $25 and B costs $15.","Arithmetic slip."]],"ok":[0],"id":"x-m10-35","seq":183,"sec":4,"set":1},{"m":"m10","sc":54,"q":"Suppose losing a real email cost only $0.10, about as much as reading two spams. Which filter would cost less then?","multi":false,"fixed":false,"opts":[["A: $7 vs. $10.50","A: 20 × 0.10 + 100 × 0.05 = $7. B: 5 × 0.10 + 200 × 0.05 = $10.50. When the two mistakes cost about the same, letting in less spam wins.",""],["B, since it still loses fewer real emails","Losing real email is now cheap, and B lets in twice as much spam.","Keeping the old conclusion."],["B, since the cheaper model never changes with costs","The best model depends on what each mistake costs.","Treating the ranking as fixed."],["Neither; the confusion matrix must be rebuilt first","The counts stay the same; only the costs change.","Recomputing the wrong thing."]],"ok":[0],"id":"x-m10-36","seq":184,"sec":4,"set":1},{"m":"m10","sc":54,"q":"In practice, 80% of incoming email is spam, not 50%. How should the provider recompute each filter’s cost?","multi":false,"fixed":false,"opts":[["Scale the real-email row by 20/50 and the spam row by 80/50, then recost","The filter’s rates stay the same, but how often each mistake happens changes with the mix.",""],["Retrain both filters on a new 80/20 test set before comparing","The rates measured on the test set still apply; rescaling the rows is enough.","Thinking the matrix can’t be reused."],["Scale the inbox column by 80/50 and the junk column by 20/50","The rows (the true classes) change with the mix, not the columns.","Scaling the wrong direction."],["Nothing changes, since sensitivity and specificity don’t depend on the mix","The rates don’t, but the counts and costs do.","Ignoring the class mix."]],"ok":[0],"id":"x-m10-37","seq":185,"sec":4,"set":1},{"m":"m10","sc":54,"q":"After rescaling to 80% spam (back at $1 per lost real email), A costs $16 and B costs $18. What does this show?","multi":false,"fixed":false,"opts":[["The best filter can change with the class mix, not just with the costs","More spam makes letting spam through more frequent, so A’s stricter filtering now pays off.",""],["The earlier calculation at 50% spam was wrong","It was right for a 50/50 mix.","Doubting the method."],["A has become more accurate on spam","A’s rates haven’t changed; the mix has.","Confusing rates with counts."],["Costs only matter when both filters make the same number of mistakes","Costs matter most when the mistakes differ in kind.","Misreading the point."]],"ok":[0],"id":"x-m10-38","seq":186,"sec":4,"set":1},{"m":"m10","sc":55,"q":"The response is a count of arrivals whose typical level changes with the time of day. Which approach did the lecture use for exactly this?","multi":false,"fixed":false,"opts":[["Poisson regression, estimating the arrival rate λ(x) as a function of the factors","The response follows a Poisson distribution, and its rate depends on the factors.",""],["A Poisson model with one fixed λ for every slot","The arrival rate changes with time, so λ must depend on the factors.","Ignoring the factors."],["Logistic regression on whether anyone arrives","That loses the count.","Turning a count into a yes/no."],["A classification tree with “busy” and “quiet” leaves","That also throws away the count.","Turning a count into classes."]],"ok":[0],"id":"x-m10-39","seq":187,"sec":4,"set":1},{"m":"m10","sc":55,"q":"Arrivals rise steeply in the early morning, flatten at midday and rise again in the evening. An analyst fits different polynomials to different parts of the day, joined smoothly. What is this, and why the smooth joins?","multi":false,"fixed":false,"opts":[["A regression spline; nearby times on either side of a join shouldn’t get very different predictions","Splines fit different functions to different parts of the data with smooth connections (MARS, or “Earth,” is one implementation).",""],["A regression spline; the joins make the pieces into one polynomial","The pieces stay different polynomials; only the connections are smooth.","Misreading the smoothness."],["A regression tree; each leaf is a polynomial","A tree jumps between leaves rather than joining smoothly.","Mixing up trees and splines."],["KNN regression; the joins are the k nearest points","KNN uses no fitted pieces at all.","Mixing up methods."]],"ok":[0],"id":"x-m10-40","seq":188,"sec":4,"set":1},{"m":"m10","sc":55,"q":"For the new terminal, planners are confident from other terminals that each coefficient lies in a known range. Which approach uses this, and why here?","multi":false,"fixed":false,"opts":[["Bayesian regression; expert opinion helps most when there isn’t much data","A starting distribution for the coefficients is updated with the three weeks of data using Bayes’ theorem.",""],["Bayesian regression; it ignores the data until enough is collected","It combines the prior and the data from the start.","Misunderstanding the update."],["Poisson regression; the planners’ ranges become λ","λ is the arrival rate, not the planners’ view of the coefficients.","Mixing up methods."],["KNN regression; the other terminals are the nearest neighbors","KNN can’t use a stated range for coefficients.","Mixing up methods."]],"ok":[0],"id":"x-m10-41","seq":189,"sec":4,"set":1},{"m":"m10","sc":55,"q":"A year later the new terminal has plenty of data. What happens to the planners’ starting estimate in the Bayesian model?","multi":false,"fixed":false,"opts":[["The data outweighs it more and more, so estimates move toward what the data says","The prior matters most when data is scarce.",""],["It matters more and more, since it has been confirmed for a year","More data shifts weight to the data.","Reversing the update."],["It must be deleted before the model can use the new data","The update with Bayes’ theorem handles it automatically.","Misunderstanding the method."],["It replaces the data, since experts are more reliable","The method combines the two.","Misunderstanding the method."]],"ok":[0],"id":"x-m10-42","seq":190,"sec":4,"set":1},{"m":"m10","sc":55,"q":"Another analyst predicts each slot as the average arrivals of the 10 most similar past slots. Why does the lecture call this kind of method non-parametric?","multi":false,"fixed":false,"opts":[["It doesn’t estimate a prediction function; it just averages nearby data","KNN regression fits no formula with coefficients.",""],["It uses no data from the past","It uses past slots directly.","Misreading the term."],["The number 10 isn’t a parameter of any kind","k is a setting you choose; the point is that there is no fitted formula.","Confusing a setting with a model form."],["It predicts a class rather than a number","Averaging gives a number.","Mixing up regression and classification."]],"ok":[0],"id":"x-m10-43","seq":191,"sec":4,"set":1},{"m":"m10","sc":56,"q":"In the simple version used in practice, what does each leaf predict for a delivery that reaches it?","multi":false,"fixed":false,"opts":[["The average delivery time of that leaf’s data points","With only a constant term a₀, the best fit is the leaf’s mean response.",""],["A full 12-factor regression fit to that leaf’s data","Deep leaves have few points, so full regressions overfit, and there would be many to compute.","Missing the simplification."],["The most common delivery time in the leaf","That’s the classification-tree idea; delivery time is a number.","Mixing up tree types."],["The average delivery time over all the data","Each leaf predicts from its own data points.","Ignoring the split."]],"ok":[0],"id":"x-m10-44","seq":192,"sec":4,"set":2},{"m":"m10","sc":56,"q":"At a leaf, how does the method choose the next split?","multi":false,"fixed":false,"opts":[["For each factor, find the split with the biggest variance decrease; make the best one if it beats the threshold","Splits make each branch’s delivery times more alike.",""],["Split on the factor with the widest range, at its midpoint","Range doesn’t decide splits; variance decrease does.","Inventing a criterion."],["Split on a random factor, as in a random forest","A single tree uses the best factor.","Mixing up trees and forests."],["Split on the factor that most improves the other half of the data","The other half is used later, for pruning.","Mixing up growing and pruning."]],"ok":[0],"id":"x-m10-45","seq":193,"sec":4,"set":2},{"m":"m10","sc":56,"q":"A candidate split would cut variance a lot, but one side would hold only 1% of the data. What should happen?","multi":false,"fixed":false,"opts":[["Reject it: one side has too few data points","A tiny leaf likely fits random effects; the rule of thumb is at least 5% per leaf.",""],["Accept it, since the variance decrease is large","A large decrease on very few points is likely overfitting.","Trusting the gain alone."],["Accept it, then let the random forest fix it","A single tree must stand on its own.","Deferring the problem."],["Move data from the larger side to balance the branches","Data points can’t be reassigned.","Inventing a fix."]],"ok":[0],"id":"x-m10-46","seq":194,"sec":4,"set":2},{"m":"m10","sc":56,"q":"Why is the tree pruned using the other half of the data rather than the half it was grown on?","multi":false,"fixed":false,"opts":[["Splits were chosen to fit the growing half, so only fresh data shows if they really help","A split that raises error on the other half is removed.",""],["The growing half has been used up and can’t be reused","Data isn’t used up; the point is an honest check.","Misunderstanding the reason."],["The other half has more data points","The halves are the same size.","Inventing a reason."],["To estimate each leaf’s average more precisely","Pruning tests branches; it doesn’t re-estimate leaves.","Misreading the step."]],"ok":[0],"id":"x-m10-47","seq":195,"sec":4,"set":2},{"m":"m10","sc":56,"q":"The courier raises the threshold a split’s variance decrease must beat. What happens to the tree?","multi":false,"fixed":false,"opts":[["Fewer splits pass: a smaller tree that overfits less but may miss real patterns","The threshold guards against splits that only fit random effects.",""],["More splits pass, giving a deeper tree","A higher bar lets fewer through.","Reversing the effect."],["Nothing changes until pruning","The threshold acts while growing.","Misplacing the step."],["Every leaf ends up with exactly 5% of the data","The 5% rule is a minimum, not a target.","Mixing up the two rules."]],"ok":[0],"id":"x-m10-48","seq":196,"sec":4,"set":2},{"m":"m10","sc":56,"q":"A dispatcher wants a branch on (distance × number of stops) ≥ 50. Why does common practice branch on one factor at a time?","multi":false,"fixed":false,"opts":[["There’s no good algorithm for finding good combinations of factors","Combinations can make sense, but searching for them well isn’t practical.",""],["A branch on two factors can’t lower variance","It can; the problem is finding good ones.","Overstating the limit."],["Products of factors can’t be computed for delivery data","They can be computed.","Inventing a limit."],["Combined factors always overfit","The issue is search, not guaranteed overfitting.","Overstating the risk."]],"ok":[0],"id":"x-m10-49","seq":197,"sec":4,"set":2},{"m":"m10","sc":56,"q":"The courier then builds a random forest of 500 trees. Which part of the single-tree method do the forest’s trees skip, and what can’t the forest give?","multi":false,"fixed":false,"opts":[["Pruning; a specific model, such as “the model for downtown deliveries”","Averaging different trees handles overfitting, but no single tree’s model is the forest’s answer.",""],["Variance-based splitting; any variable importance","Each tree still splits on the best factor in its random subset, and forests do report importance.","Misreading the method."],["Bootstrap sampling; an average prediction","Bootstrapping is added, not skipped, and averaging is how it predicts.","Reversing the method."],["Leaf averages; a prediction for new deliveries","Leaves still average, and the forest predicts by averaging trees.","Misreading the method."]],"ok":[0],"id":"x-m10-50","seq":198,"sec":4,"set":2},{"m":"m10","sc":57,"q":"The software reports a pseudo R² of 0.30. What can the analyst say?","multi":false,"fixed":false,"opts":[["It’s useful for comparing models, but it isn’t the fraction of variance explained","Logistic regression has no R² with the linear-regression meaning.",""],["The model explains 30% of the variation in repayment","That’s the linear-regression meaning, which pseudo R² doesn’t have.","Carrying R² over."],["30% of the loans are classified correctly","It isn’t an accuracy.","Misreading the measure."],["The model is useless, since 0.30 is low","Pseudo R² can’t be judged like linear R².","Misjudging the scale."]],"ok":[0],"id":"x-m10-51","seq":199,"sec":4,"set":3},{"m":"m10","sc":57,"q":"Fitting took noticeably longer than a linear regression on the same data. Why?","multi":false,"fixed":false,"opts":[["Logistic regression has no closed-form solution","The coefficients must be found by a search, although it’s still fast.",""],["The 0.7 threshold has to be fitted with the coefficients","The threshold is chosen afterward.","Mixing up fitting and classifying."],["Logistic regression always uses every possible interaction","Interactions are optional, as in linear regression.","Inventing a requirement."],["It fits a separate model for each applicant","One model is fit to all the loans.","Misunderstanding the model."]],"ok":[0],"id":"x-m10-52","seq":200,"sec":4,"set":3},{"m":"m10","sc":57,"q":"The analyst draws an ROC curve. What does each point on it represent?","multi":false,"fixed":false,"opts":[["One threshold: its sensitivity against 1 − specificity","Moving to lower thresholds goes up and to the right.",""],["One applicant: their p against their actual outcome","The curve summarizes thresholds, not applicants.","Misreading the chart."],["One predictor: its coefficient against its p-value","Neither axis is about predictors.","Mixing up charts."],["One model: its accuracy against its pseudo R²","Each curve is one model; each point is a threshold.","Mixing up the levels."]],"ok":[0],"id":"x-m10-53","seq":201,"sec":4,"set":3},{"m":"m10","sc":57,"q":"A competing model has an AUC of 0.5. What does that mean?","multi":false,"fixed":false,"opts":[["It ranks a random repayer above a random defaulter only half the time: no better than guessing","AUC is the chance a random “yes” is scored above a random “no.”",""],["It classifies half the loans correctly at a 0.5 threshold","AUC isn’t accuracy at one threshold.","Mixing up AUC and accuracy."],["It approves half of all applicants","AUC isn’t an approval rate.","Misreading the measure."],["It is perfect, since 0.5 is the middle of the 0–1 range","A perfect model has AUC 1.","Misjudging the scale."]],"ok":[0],"id":"x-m10-54","seq":202,"sec":4,"set":3},{"m":"m10","sc":57,"q":"Model A has AUC 0.82 and model B 0.78. A bad loan costs far more than turning down a good applicant. How should the credit union choose?","multi":false,"fixed":false,"opts":[["Cost each model’s confusion matrix at the threshold it would use and compare","AUC doesn’t distinguish false negatives from false positives.",""],["Pick A, since a higher AUC always means more value","AUC is a quick estimate that ignores the cost of each mistake.","Choosing by AUC alone."],["Pick whichever has the higher pseudo R²","That also ignores what the mistakes cost.","Choosing by a quality score."],["Average the two models’ AUCs","That doesn’t choose a model.","Misusing the measure."]],"ok":[0],"id":"x-m10-55","seq":203,"sec":4,"set":3},{"m":"m10","sc":57,"q":"A random forest predicts repayment better, but regulators require the credit union to explain each declined loan. What does the lecture say about this trade-off?","multi":false,"fixed":false,"opts":[["Explainability is sometimes a legal requirement, which can outweigh better predictions","The right trade-off depends on the model’s use and who decides, not just accuracy.",""],["Better predictions always win; regulators accept accuracy","A model that can’t legally be used has no value for the decision.","Ignoring adoption and law."],["The forest’s variable importance explains each decision","Importance shows overall usefulness, not how one loan was decided.","Overreading importance."],["A forest is as explainable as a logistic regression","It is much harder to explain.","Misjudging explainability."]],"ok":[0],"id":"x-m10-56","seq":204,"sec":4,"set":3},{"m":"m2","sc":51,"q":"Why is it valuable that the SVM chooses the boundary with the <b>widest<\/b> margin?","multi":false,"fixed":false,"opts":[["Small measurement errors in an applicant’s data are less likely to flip their classification","A wide buffer means a point has to move a long way to cross the boundary, so noisy values for new applicants are less likely to land on the wrong side.",""],["It makes the SVM classify every training applicant correctly","A soft margin deliberately allows some training errors; the width is about robustness, not perfect fit.","Equating margin width with training accuracy."],["It lets the SVM give each applicant a probability of default","An SVM gives a class (and a distance from the line), not a probability.","Confusing SVM with logistic regression."],["It makes the boundary depend equally on every applicant","The boundary depends only on the points near the margin (the support vectors).","Thinking all points shape the SVM."]],"ok":[0],"id":"x-m2-23","seq":205,"sec":4,"set":1},{"m":"m8","sc":51,"q":"Which data points matter most to each model?","multi":false,"fixed":false,"opts":[["SVM: points near the boundary. Regression: all points, and far-off points most of all","The SVM is set by its support vectors. Least squares squares every error, so points far from the line pull hardest.",""],["Both depend mostly on points near the line","Regression uses every point and is pulled most by large errors.","Assuming the two models work alike."],["SVM: points far from the boundary. Regression: points near the line","That’s reversed for both models.","Reversing which points matter."],["Both weight every point equally","The SVM ignores points away from the margin, and regression weights big errors more.","Missing how each fit works."]],"ok":[0],"id":"x-m8-23","seq":206,"sec":4,"set":1},{"m":"m2","sc":51,"q":"Approved applicants turn out to form several separate pockets scattered among denied applicants. Which classifier is likely to do better, and why?","multi":false,"fixed":false,"opts":[["KNN, since it classifies by local neighbors and can follow scattered pockets","KNN’s boundary can bend around each pocket. A single straight SVM line can’t separate several pockets (without a kernel).",""],["The linear SVM, since a wider margin handles any class shape","No straight line, however wide its margin, can wrap around separate pockets.","Overrating the margin."],["Both equally, since they use the same attributes","Same inputs, very different boundary shapes.","Ignoring how the boundary is formed."],["The linear SVM, since KNN can’t handle more than two classes","KNN handles any number of classes, and there are only two here.","Inventing a limit."]],"ok":[0],"id":"x-m2-24","seq":207,"sec":4,"set":1},{"m":"m2","sc":51,"q":"The bank wants a rough sense of how confident each classification is. What can each model offer?","multi":false,"fixed":false,"opts":[["KNN: the share of neighbors that agree. SVM: how far the applicant is from the boundary","Five of five neighbors agreeing, or a point far from the line, suggests a confident call; a 3–2 vote or a point near the line, a borderline one.",""],["Neither offers anything beyond the predicted class","Both give a natural measure of how borderline a case is.","Overlooking the outputs."],["Both give exact probabilities of default","Neither is a probability model; these are rough confidence signals.","Overstating the outputs."],["Only the SVM, since KNN has no boundary","KNN’s neighbor vote is itself a confidence measure.","Missing KNN’s vote share."]],"ok":[0],"id":"x-m2-25","seq":208,"sec":4,"set":1},{"m":"m7","sc":52,"q":"Select <b>all<\/b> of the data sets that are time-series data.","multi":true,"fixed":true,"opts":[["Daily attendance for the last three years","The same quantity measured repeatedly over time.",""],["A satisfaction survey of 5,000 visitors taken on one day","A snapshot of many visitors at one time is cross-sectional.","Treating any large data set as a time series."],["A ride’s wait time recorded every 15 minutes","Regular measurements of one quantity over time.",""],["This year’s ticket prices at 30 different parks","Many parks at one point in time: cross-sectional.","Confusing “many values” with “over time.”"],["Hourly temperature at the park entrance","A single quantity tracked over time.",""]],"ok":[0,2,4],"id":"x-m7-24","seq":209,"sec":4,"set":2},{"m":"m7","sc":52,"q":"Why can’t the team treat daily attendance like a random sample of independent days?","multi":false,"fixed":false,"opts":[["Nearby days are related (trend, season, and day-of-week effects), so the values aren’t independent","Time-series values carry information about their neighbors, which is exactly what smoothing and ARIMA exploit, and why random validation splits leak.",""],["Attendance values are categorical, not numeric","They’re counts, which are quantitative.","Misjudging the data type."],["There are too few days for any analysis","Three years of daily data is plenty.","Inventing a limit."],["Random samples can only be drawn from survey data","Sampling isn’t the issue; dependence between days is.","Missing the real issue."]],"ok":[0],"id":"x-m7-25","seq":210,"sec":4,"set":2},{"m":"m7","sc":52,"q":"A Holt-Winters model forecasts next week’s attendance well. Why should the team be much more cautious about its forecast for 6 months from now?","multi":false,"fixed":false,"opts":[["It assumes today’s trend and seasonal pattern continue, and errors grow the further out it projects","With no new data to correct it, any drift in the trend or season compounds over months.",""],["Holt-Winters can only forecast one period ahead","It can forecast further; it just gets less reliable.","Inventing a limit."],["The seasonal factors expire after one week","They persist until updated; the issue is whether the pattern still holds.","Misunderstanding the factors."],["It doesn’t need extra caution, since the model fit well this week","A good short-term fit doesn’t guarantee long-term accuracy.","Generalizing from short-term fit."]],"ok":[0],"id":"x-m7-26","seq":211,"sec":4,"set":2},{"m":"m7","sc":52,"q":"How far ahead is simple exponential smoothing (no trend or season) generally useful?","multi":false,"fixed":false,"opts":[["Roughly one period ahead; beyond that, its flat forecast is just the current level","With no trend or seasonal terms, every future forecast equals today’s baseline, which is a reasonable guess only for the near term.",""],["Any distance, since the forecast never changes","A constant forecast isn’t the same as an accurate one.","Mistaking stability for accuracy."],["About one full season ahead","It has no seasonal terms, so it can’t anticipate a season.","Assuming built-in seasonality."],["It can’t forecast at all; it only smooths past data","Its forecast is the current baseline.","Underrating the method."]],"ok":[0],"id":"x-m7-27","seq":212,"sec":4,"set":2},{"m":"m8","sc":53,"q":"Why is such a big difference in R² expected?","multi":false,"fixed":false,"opts":[["Physical systems follow consistent laws; spending depends on many unmeasured personal factors","Human behavior is noisy and influenced by things the data doesn’t capture, so lower R² is normal there.",""],["The retail analyst must have made a modeling error","A low R² is typical for human behavior; it doesn’t signal an error.","Assuming low R² means a mistake."],["The physics data set must be much larger","R² measures explained variation, not data size.","Confusing R² with sample size."],["Spending can’t be modeled with regression","It can; the response is just harder to explain fully.","Overgeneralizing."]],"ok":[0],"id":"x-m8-24","seq":213,"sec":4,"set":3},{"m":"m8","sc":53,"q":"The retail manager says, “An R² of 0.30 means the model is useless.” What’s the best response?","multi":false,"fixed":false,"opts":[["Not necessarily: it may still beat having no model and show which factors matter","Judge the model against the alternatives and the decision it supports, not against a physics-level R².",""],["Agree; anything under 0.5 should be discarded","There’s no universal cutoff; usefulness depends on the context.","Applying a fixed threshold."],["Add predictors until R² reaches 0.9","Chasing R² with extra predictors leads to overfitting.","Optimizing the wrong target."],["R² doesn’t matter for any regression","It does matter; it just has to be read in context.","Overcorrecting."]],"ok":[0],"id":"x-m8-25","seq":214,"sec":4,"set":3},{"m":"m8","sc":53,"q":"If the spring model had an R² of only 0.6, what would that most likely suggest?","multi":false,"fixed":false,"opts":[["Something is off: measurement problems or a missing factor, since physical relationships are usually tight","For a well-understood physical system, much unexplained variation is a warning sign.",""],["Nothing; 0.6 is good for any model","What counts as good depends on the system being modeled.","Ignoring context."],["The spring is behaving like a human","Springs don’t have preferences; look for a data or model problem.","Missing the point."],["R² of 0.6 proves the relationship is nonlinear","It might be, but low R² alone doesn’t prove that.","Over-reading one number."]],"ok":[0],"id":"x-m8-26","seq":215,"sec":4,"set":3},{"m":"m2","sc":53,"q":"The retailer also wants to use KNN on its customers. Which attribute is the best candidate for min-max scaling to 0–1 rather than standardization?","multi":false,"fixed":false,"opts":[["Satisfaction rating on a fixed 1–5 scale","It has natural, known bounds, so min-max maps it cleanly onto 0–1.",""],["Annual income, which has no upper limit and a few very large values","Unbounded, skewed values make min-max fragile: one extreme sets the max and squeezes everyone else.","Ignoring how extremes affect min-max."],["Total lifetime spend, which keeps growing for loyal customers","Its maximum keeps changing as new data arrives, so min-max bounds won’t hold.","Ignoring unstable bounds."],["Number of store visits, which a few customers make hundreds of times","Heavy outliers make standardization the safer choice.","Ignoring outliers."]],"ok":[0],"id":"x-m2-26","seq":216,"sec":4,"set":3}];

nk)\" stroke-width=\"1.5\"/><circle cx=\"157.0\" cy=\"130.0\" r=\"4.5\" fill=\"var(--card)\" stroke=\"var(--ink)\" stroke-width=\"1.5\"/><circle cx=\"121.0\" cy=\"181.0\" r=\"4.5\" fill=\"var(--card)\" stroke=\"var(--ink)\" stroke-width=\"1.5\"/><\/svg><\/div>"},"2":{"title":"Hospital readmissions","html":"A hospital wants to reduce 30-day readmissions. It has records of past discharged patients (age, diagnosis, length of stay, number of prior visits, and so on), each labeled with whether the patient was readmitted within 30 days."},"3":{"title":"Delivery depots","html":"A delivery company clusters 2,400 customer addresses (latitude and longitude) with k-means to choose locations for new depots, one at each cluster center. The elbow diagram is below. Each delivery van can only cover addresses within about 15 miles of its depot; with k = 3, several clusters have customers more than 25 miles from their center, while with k = 4 nearly every customer is within 15 miles.<svg viewBox=\"0 0 270 205\" width=\"270\" role=\"img\" aria-label=\"Elbow diagram\"><line x1=\"40\" y1=\"170\" x2=\"255\" y2=\"170\" stroke=\"var(--ink-2)\"/><line x1=\"40\" y1=\"170\" x2=\"40\" y2=\"20\" stroke=\"var(--ink-2)\"/><text x=\"40\" y=\"184\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink-2)\">1<\/text><text x=\"70\" y=\"184\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink-2)\">2<\/text><text x=\"100\" y=\"184\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink-2)\">3<\/text><text x=\"130\" y=\"184\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink-2)\">4<\/text><text x=\"160\" y=\"184\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink-2)\">5<\/text><text x=\"190\" y=\"184\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink-2)\">6<\/text><text x=\"220\" y=\"184\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink-2)\">7<\/text><text x=\"250\" y=\"184\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink-2)\">8<\/text><text x=\"34\" y=\"173.0\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink-2)\">0<\/text><text x=\"34\" y=\"103.0\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink-2)\">50<\/text><text x=\"34\" y=\"33.0\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink-2)\">100<\/text><polyline fill=\"none\" stroke=\"var(--pen)\" stroke-width=\"2\" points=\"40,30.0 70,93.0 100,125.2 130,132.2 160,136.4 190,139.2 220,141.3 250,142.7\"/><circle cx=\"40\" cy=\"30.0\" r=\"3.5\" fill=\"var(--pen)\"/><circle cx=\"70\" cy=\"93.0\" r=\"3.5\" fill=\"var(--pen)\"/><circle cx=\"100\" cy=\"125.2\" r=\"3.5\" fill=\"var(--pen)\"/><circle cx=\"130\" cy=\"132.2\" r=\"3.5\" fill=\"var(--pen)\"/><circle cx=\"160\" cy=\"136.4\" r=\"3.5\" fill=\"var(--pen)\"/><circle cx=\"190\" cy=\"139.2\" r=\"3.5\" fill=\"var(--pen)\"/><circle cx=\"220\" cy=\"141.3\" r=\"3.5\" fill=\"var(--pen)\"/><circle cx=\"250\" cy=\"142.7\" r=\"3.5\" fill=\"var(--pen)\"/><text x=\"148\" y=\"200\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--ink)\">k (number of depots)<\/text><text x=\"12\" y=\"95\" font-size=\"11\" fill=\"var(--ink)\" transform=\"rotate(-90 12 95)\" text-anchor=\"middle\">total distance<\/text><\/svg>"},"4":{"title":"Call-center handle times","html":"Recall triple exponential smoothing (Holt-Winters, multiplicative seasonality):\n<div class=\"eq\">Sₜ = α·xₜ / C<sub>t−L<\/sub> + (1 − α)(Sₜ₋₁ + Tₜ₋₁)<br>Tₜ = β(Sₜ − Sₜ₋₁) + (1 − β)Tₜ₋₁<br>Cₜ = γ·xₜ / Sₜ + (1 − γ)C<sub>t−L<\/sub><\/div>\nA call center records every call: the hour of day it started (0–23), the day of the week, and its handle time in minutes. It averages the handle times for each day, giving one value per day for the last two years, and fits triple exponential smoothing to see whether handle time has patterns by <b>day of the week<\/b>.\n<table class=\"dtab\"><tr><th>Date<\/th><th>Day of week<\/th><th>Calls<\/th><th>Avg handle time (min)<\/th><\/tr><tr><td>Mar 3<\/td><td>Mon<\/td><td>1,240<\/td><td>11.8<\/td><\/tr><tr><td>Mar 4<\/td><td>Tue<\/td><td>1,105<\/td><td>9.6<\/td><\/tr><tr><td>Mar 5<\/td><td>Wed<\/td><td>1,090<\/td><td>9.4<\/td><\/tr><tr><td colspan=\"4\">…<\/td><\/tr><\/table>"},"5":{"title":"Pump vibration","html":"A water utility monitors a pump’s vibration level every hour. Its normal mean is μ = 50. The utility runs an increase CUSUM:\n<div class=\"eq\">Sₜ = max{0, Sₜ₋₁ + (xₜ − μ − C)}, alarm when Sₜ ≥ T<\/div>with C = 2 and T = 10, starting from S₀ = 0."},"6":{"title":"Home-price regression","html":"A real-estate firm fits a linear regression to 1,200 recent sales. The response is sale price in thousands of dollars.\n<table class=\"dtab\"><tr><th>Predictor<\/th><th>Coefficient<\/th><th>p-value<\/th><\/tr>\n<tr><td>Intercept<\/td><td>42.0<\/td><td>&lt; 0.001<\/td><\/tr>\n<tr><td>Square feet (per 100 sq ft)<\/td><td>9.5<\/td><td>&lt; 0.001<\/td><\/tr>\n<tr><td>Bedrooms<\/td><td>−6.2<\/td><td>0.004<\/td><\/tr>\n<tr><td>Age of home (years)<\/td><td>−0.8<\/td><td>0.010<\/td><\/tr>\n<tr><td>Pool (1 = yes, 0 = no)<\/td><td>4.1<\/td><td>0.30<\/td><\/tr>\n<tr><td>Miles to downtown<\/td><td>−3.0<\/td><td>&lt; 0.001<\/td><\/tr><\/table>\nR² = 0.78, adjusted R² = 0.77."},"7":{"title":"Choosing among models","html":"On the same 50,000-row data set, an analyst fits three regression models:\n<table class=\"dtab\"><tr><th>Model<\/th><th>Predictors<\/th><th>AIC<\/th><\/tr><tr><td>A<\/td><td>5<\/td><td>812<\/td><\/tr><tr><td>B<\/td><td>8<\/td><td>808<\/td><\/tr><tr><td>C<\/td><td>12<\/td><td>815<\/td><\/tr><\/table>"},"8":{"title":"A validation process","html":"An analyst building a churn classifier on 10,000 customers does the following:\n<ol class=\"steps\"><li>Standardizes every attribute using the mean and SD of all 10,000 rows.<\/li><li>Randomly splits the data 70% training / 15% validation / 15% test.<\/li><li>Trains 20 different models and picks the one with the best validation accuracy (91%).<\/li><li>Runs that model on the test set: 88%.<\/li><li>Tries three more tweaks, checks each on the test set, and keeps the best one (90%).<\/li><li>Reports 90% as the expected accuracy.<\/li><\/ol>"},"9":{"title":"Medicine delivery times","html":"A distributor wants a regression model to estimate delivery time for medicine shipments. A box-and-whisker plot of 4,000 past delivery times flags 14 points beyond the whiskers. On investigation, 3 have negative delivery times (data-entry errors), and 11 are real shipments delayed by major storms, which hit the region a few times a year."},"10":{"title":"Salary model with PCA","html":"An HR team wants to predict employee salary using three predictors: age, years of experience, and years since highest degree. In their data, the three predictors are highly correlated with each other."},"11":{"title":"Loan approval SVM","html":"A bank fits a soft-margin SVM to approve or reject loan applicants, after scaling every attribute to 0–1. The classifier is\n<div class=\"eq\">1.9·(credit score) + 1.4·(income) − 1.1·(debt ratio) + 0.03·(years at address) + a₀<\/div>\nApplicants with a value above 0 are approved."},"12":{"title":"Commodity prices","html":"An analyst studies the monthly price of copper over 25 years. The price has a steady upward trend, with calm stretches and turbulent stretches."},"13":{"title":"Types of analytics questions","html":"A grocery chain’s leadership asks three questions:<ol class=\"steps\"><li>“What were the top-selling products in each store last quarter?”<\/li><li>“How many customers will visit each store next Saturday?”<\/li><li>“How many cashiers should each store schedule on Saturday to keep waits under 5 minutes at minimum cost?”<\/li><\/ol>"},"14":{"title":"Spam filter","html":"An email provider is building a classifier to label incoming email as spam or not spam. For each past email it has these attributes, plus a label saying whether a user marked it as spam:\n<ul class=\"steps\"><li>Sender’s email domain (gmail.com, company.com, …)<\/li><li>Number of links in the message<\/li><li>Contains the word “free” (yes/no)<\/li><li>Message length in characters<\/li><li>Language of the message (English, Spanish, other)<\/li><\/ul>About 3% of past emails are spam."},"15":{"title":"Nearest neighbors","html":"The figure shows scaled training data (black and white points) and a new point (★) to classify with KNN. The inner dashed circle contains the new point’s single nearest neighbor; the outer dashed circle contains its 5 nearest neighbors.<svg viewBox=\"0 0 230 232\" width=\"230\" role=\"img\" aria-label=\"Nearest neighbors of a new point\"><line x1=\"34\" y1=\"196\" x2=\"220\" y2=\"196\" stroke=\"var(--ink-2)\"/><line x1=\"34\" y1=\"196\" x2=\"34\" y2=\"20\" stroke=\"var(--ink-2)\"/><text x=\"34\" y=\"210\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink-2)\" >0<\/text><text x=\"64\" y=\"210\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink-2)\" >1<\/text><text x=\"26\" y=\"169\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink-2)\" >1<\/text><text x=\"94\" y=\"210\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink-2)\" >2<\/text><text x=\"26\" y=\"139\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink-2)\" >2<\/text><text x=\"124\" y=\"210\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink-2)\" >3<\/text><text x=\"26\" y=\"109\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink-2)\" >3<\/text><text x=\"154\" y=\"210\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink-2)\" >4<\/text><text x=\"26\" y=\"79\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink-2)\" >4<\/text><text x=\"184\" y=\"210\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink-2)\" >5<\/text><text x=\"26\" y=\"49\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink-2)\" >5<\/text><text x=\"214\" y=\"210\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink-2)\" >6<\/text><text x=\"26\" y=\"19\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--ink-2)\" >6<\/text><text x=\"127\" y=\"226\" text-anchor=\"middle\" font-size=\"11\" fi
