m":"mix","sc":37,"q":"The operations team wants to estimate a flight's delay in minutes from weather and time of day, and to report <b>how many extra minutes each additional inch of rain adds<\/b>. Which model is most appropriate?","multi":false,"fixed":true,"opts":[["ARIMA","",""],["CART","",""],["Cross-validation","",""],["CUSUM","",""],["Exponential smoothing","",""],["GARCH","",""],["k-means clustering","",""],["k-nearest-neighbor classification","",""],["Linear regression","",""],["Logistic regression","",""],["Support vector machine","",""]],"ok":[8],"id":"g-E-4b","seq":1,"sec":4,"set":3,"ex":"Estimating an amount from factors, with a single interpretable coefficient per factor (minutes per inch of rain), is linear regression. Logistic regression estimates the probability of a yes/no outcome, not a number of minutes.","note":"How much + effect per unit of a factor → linear regression (coefficient = change in response per unit).","concept":"Amount estimation with interpretable coefficients","trap":"A neighboring method that sounds right but answers a different question."},{"m":"mix","sc":37,"q":"Given the residual pattern described in the scenario, what data preparation is most appropriate for the delay-minutes regression?","multi":false,"fixed":false,"opts":[["Detrend the delay minutes over the 8 years","",""],["Box-Cox transform the delay-minutes response","",""],["Scale all predictors to the interval [0, 1]","",""],["Replace the predictors with their principal components","",""]],"ok":[1],"id":"g-E-4c","seq":2,"sec":4,"set":3,"ex":"Spread that grows with the size of the value is heteroscedasticity, and Box-Cox transforms the response to make its variance more even. Scaling the predictors is good practice for distance-based models, but it doesn't change the residual spread. Detrending deals with trend over time, not unequal variance.","note":"Residuals fan out (heteroscedasticity) → Box-Cox the response (λ<1 shrinks large values).","concept":"Box-Cox for unequal variance","trap":"A true statement that doesn't answer what was asked."},{"m":"mix","sc":37,"q":"To predict late departures, analysts fit 12 candidate models on training data and picked the one with the best <b>validation<\/b> accuracy (84%). On the <b>test<\/b> set it scores 80%. What should they report as the chosen model's expected accuracy?","multi":false,"fixed":false,"opts":[["84%, since validation data was used to choose the model, so it's more reliable","",""],["80%: the best of 12 on validation likely got a random boost there, so test is fairer","",""],["80%, because the 4-point drop shows the model was overfit to the test data","",""],["Whichever model scores best on the test set, after switching to that model","",""]],"ok":[1],"id":"g-E-4d","seq":3,"sec":4,"set":3,"ex":"Choosing the top performer among several close models favors one that got lucky on the validation data, so its validation score is optimistic, and the untouched test set gives the unbiased estimate. Switching to the best model on the test set would turn the test data into validation data and leave no unbiased estimate.","note":"Validation picks the model (optimistic); test estimates its quality; don't re-pick on test.","concept":"Validation vs test","trap":""},{"m":"mix","sc":37,"q":"For daily passengers, the airline wants a forecasting model that <b>differences<\/b> the series to remove the non-stationary level and then uses autoregressive and moving-average terms. Which model is it describing?","multi":false,"fixed":true,"opts":[["ARIMA","",""],["CART","",""],["Cross-validation","",""],["CUSUM","",""],["Exponential smoothing","",""],["GARCH","",""],["k-means clustering","",""],["k-nearest-neighbor classification","",""],["Linear regression","",""],["Logistic regression","",""],["Support vector machine","",""]],"ok":[0],"id":"g-E-4e","seq":4,"sec":4,"set":3,"ex":"Differencing (d), autoregression (p), and moving average (q) are the three parts of ARIMA(p,d,q). Exponential smoothing is related (ARIMA(0,1,1) is basic exponential smoothing), but it isn't built from explicit differencing plus AR and MA terms. GARCH forecasts variance and uses no differencing.","note":"ARIMA = differencing + AR + MA; GARCH = variance, no differencing.","concept":"ARIMA components","trap":"A neighboring method that sounds right but answers a different question."},{"m":"mix","sc":38,"q":"What should the utility do with the data-center and smelter usage values in the power-plant analysis?","multi":false,"fixed":false,"opts":[["Remove them, because extreme outliers distort the fitted model","",""],["Keep them: they're real data and directly relevant to how much power is needed","",""],["Replace them with the average usage so the data set stays representative","",""],["Remove them, but only after documenting why they were removed","",""]],"ok":[1],"id":"g-E-5a","seq":0,"sec":4,"set":3,"ex":"These are correct readings that matter directly for total capacity, so they should be kept. Removing extreme points is often reasonable (and should be documented), but that applies to bad data or real data that's irrelevant to the question, and neither is the case here.","note":"Bad data → remove; real but irrelevant → may remove (document); real and relevant → keep.","concept":"Outliers: bad / real-irrelevant / real-relevant","trap":"Usually true, but the details here override it."},{"m":"mix","sc":38,"q":"A CUSUM on transformer temperature with <b>C = 0<\/b> keeps raising false alarms because of normal minute-to-minute variation. An engineer proposes keeping C = 0 and making T very large. What's the better approach?","multi":false,"fixed":false,"opts":[["Lower T, so that the CUSUM total needs less evidence before signaling","",""],["Keep C = 0 with a huge T; that removes false alarms with no downside","",""],["Raise C to absorb the natural variation and keep T moderate, so real jumps are caught fast","",""],["Set C = 0 and update μ to the latest readings so the baseline keeps up with the data","",""]],"ok":[2],"id":"g-E-5b","seq":1,"sec":4,"set":3,"ex":"C handles natural variation: with C = 0, a few random above-average readings add up to a false alarm. A huge T would cut false alarms but delay detection of a real, fast change. Lowering T would cause even more false alarms, and updating μ as data arrives would hide the very change CUSUM is supposed to catch.","note":"High noise → raise C; larger T = fewer false alarms but slower detection; don't keep updating μ.","concept":"CUSUM C and T","trap":"The direction is flipped."},{"m":"mix","sc":38,"q":"To regress household usage on the 40 correlated characteristics, an analyst uses the first 5 principal components. Which statements are true? <b>Select all that apply.<\/b>","multi":true,"fixed":false,"opts":[["The utility still has to collect all 40 characteristics for every household","",""],["The principal components are uncorrelated, which removes the collinearity problem","",""],["A regression on all 40 components would have the same R² as one on the original 40","",""],["The first 5 components are guaranteed to be the most predictive of usage","",""],["PCA should be run on the unscaled characteristics so that units carry meaning","",""]],"ok":[0,1,2],"id":"g-E-5c","seq":2,"sec":4,"set":3,"ex":"Each component is a mix of all original features, so all 40 must still be collected. Components are uncorrelated by construction, and using all 40 only rotates the axes, so the fit and R² are unchanged. PCA ranks components by variance in the predictors, not by how well they predict the response, and unscaled data lets large-unit variables dominate.","note":"PCA: uncorrelated components; all PCs = same fit; top PCs ≠ most predictive; scale first; still need all features.","concept":"PCA properties","trap":"Select-all: pick every correct choice and only those."},{"m":"mix","sc":38,"q":"Which of these are <b>clustering<\/b> (not classification) questions? <b>Select all that apply.<\/b>","multi":true,"fixed":false,"opts":[["Group households into 5 usage profiles for new rate plans, with no predefined types","",""],["Predict whether a household is tampering with its meter, using past confirmed cases","",""],["Find groups of transformers whose daily load patterns look alike","",""],["Predict whether a new customer will pay late, from past customers' payment records","",""],["Place 4 repair depots near the centers of groups of past outage locations","",""]],"ok":[0,2,4],"id":"g-E-5d","seq":3,"sec":4,"set":3,"ex":"Profiles, similar transformers, and depot locations all ask which points are similar to each other, with no known correct answer, so they're clustering. Tampering and late payment have known past answers (labels) that are separate from the predictors, so they're classification.","note":"\"Is it this or that?\" with known labels → classification; \"which are similar?\" → clustering.","concept":"Classification vs clustering","trap":"Select-all: pick every correct choice and only those."},{"m":"mix","sc":38,"q":"Using the 300 pilot households, analysts want to compare SVM and KNN (with several values of k) for predicting which households will enroll in a demand-response program. They want every household to be used for both fitting and validating. Which item on the list should they use to make the comparison?","multi":false,"fixed":true,"opts":[["ARIMA","",""],["CART","",""],["Cross-validation","",""],["CUSUM","",""],["Exponential smoothing","",""],["GARCH","",""],["k-means clustering","",""],["k-nearest-neighbor classification","",""],["Linear regression","",""],["Logistic regression","",""],["Support vector machine","",""]],"ok":[2],"id":"g-E-5e","seq":4,"sec":4,"set":3,"ex":"With little data, k-fold cross-validation uses every point for both training and validation and averages the results, so it gives a better basis for choosing a model and its parameters. SVM and KNN are the models being compared, not the method for comparing them.","note":"Small data, choosing among models/parameters → k-fold cross-validation (each point validates once).","concept":"k-fold cross-validation","trap":"A true statement that doesn't answer what was asked."},{"m":"mix","sc":39,"q":"To use all 30 years of prospect data in a model that predicts starter status, what should the team do with college 3-point percentage?","multi":false,"fixed":false,"opts":[["Box-Cox transform it so that it becomes normally distributed","",""],["Detrend it, for example by measuring each value relative to its year's typical level","",""],["Drop the older seasons, treating them as outliers","",""],["Scale it to [0, 1] across all years so it's comparable to the other factors","",""]],"ok":[1],"id":"g-E-6a","seq":0,"sec":4,"set":3,"ex":"Shooting has improved over time, so a 35% shooter in 1995 isn't the same as one today. Detrending (for example, fitting the trend over time and using the difference from it) puts all years on the same footing. Scaling to [0, 1] across all years only changes units and leaves the trend in place.","note":"Human performance trends over time (100 m dash, kicking, 3-pt%) → detrend the factor before pooling years.","concept":"Detrending factors","trap":"A true statement that doesn't answer what was asked."},{"m":"mix","sc":39,"q":"For contract value, the team wants to forecast how <b>variable<\/b> each veteran's game-to-game scoring will be next season, knowing that a player's variability changes over time. Which model is most appropriate?","multi":false,"fixed":true,"opts":[["ARIMA","",""],["CART","",""],["Cross-validation","",""],["CUSUM","",""],["Exponential smoothing","",""],["GARCH","",""],["k-means clustering","",""],["k-nearest-neighbor classification","",""],["Linear regression","",""],["Logistic regression","",""],["Support vector machine","",""]],"ok":[5],"id":"g-E-6b","seq":1,"sec":4,"set":3,"ex":"GARCH forecasts the variance of a time series that changes over time. ARIMA, its near neighbor, forecasts the value itself, and both players have the same expected scoring.","note":"Forecast variance/volatility over time → GARCH (ARIMA forecasts the value).","concept":"Forecasting variance","trap":"A neighboring method that sounds right but answers a different question."},{"m":"mix","sc":39,"q":"A scaled KNN model with k = 7 finds that all 7 of a prospect's nearest past prospects became starters. What's the best interpretation?","multi":false,"fixed":false,"opts":[["The prospect is certain to become a starter, since KNN gives probability 7/7 = 1","",""],["KNN's estimate is 7/7, but such estimates are unreliable at the extremes, so it's not truly 100%","",""],["Switch to k = 1, since a single nearest neighbor gives a more reliable probability","",""],["KNN can only output a class, so no probability can be read from the neighbors","",""]],"ok":[1],"id":"g-E-6c","seq":2,"sec":4,"set":3,"ex":"KNN does give a built-in probability (neighbors in a class ÷ k), but it's unreliable at the extremes: having all 7 neighbors in one class doesn't make it 100% likely. k = 1 would be noisier, not more reliable.","note":"KNN probability ≈ (# neighbors in class)/k; shaky at the extremes (7/7 ≠ certainty).","concept":"KNN probability estimates","trap":"The overfit choice looks better on the data it was tuned on."},{"m":"mix","sc":39,"q":"An analyst's classification tree correctly classifies 97% of the 400 training prospects; one of its leaves holds just 2 prospects. A logistic regression with a threshold gets 88% right on the same data. What's the best assessment?","multi":false,"fixed":false,"opts":[["The tree, because it misclassifies far fewer of the training prospects","",""],["The logistic model, because simpler models are always better","",""],["The tree's 97% is likely inflated by overfitting (a leaf holding 0.5% of the data); compare both models on validation data","",""],["The tree, because it can use interactions between factors that logistic regression cannot","",""]],"ok":[2],"id":"g-E-6d","seq":3,"sec":4,"set":3,"ex":"A 2-prospect leaf is 0.5% of the data, far below the rule of thumb of at least 5% (20 prospects), so the tree is probably fitting random patterns, and both models should be compared on data they weren't fit to. The tree really does have fewer training errors, but that's the overfitting talking. \"Simpler is always better\" isn't the reason here.","note":"Leaf ≥ 5% of data; training accuracy overstates quality; compare on validation.","concept":"Overfitting a tree; training vs validation accuracy","trap":"The overfit choice looks better on the data it was tuned on."}];
const SCN={"1":{"title":"Bike-share questions and what 'model' means","html":"A city bike-share company asks its analytics team three questions:<br><b>Q1.<\/b> Which stations had the most rentals last summer, and which stations had similar usage patterns?<br><b>Q2.<\/b> How many bikes will be rented at Station 12 next Saturday?<br><b>Q3.<\/b> With 6 overnight trucks, how should bikes be moved between stations to minimize the number of empty stations at 8 a.m.?"},"2":{"title":"Streaming subscriber data","html":"A streaming service has this data on past subscribers:<table class='dtab'><tr><th>Column<\/th><th>Example value<\/th><\/tr><tr><td>Zip code<\/td><td>30332<\/td><\/tr><tr><td>Plan<\/td><td>Basic / Standard / Premium<\/td><\/tr><tr><td>Age<\/td><td>34<\/td><\/tr><tr><td>Monthly hours watched<\/td><td>41.5<\/td><\/tr><tr><td>Renewed? (coded 1/0)<\/td><td>1<\/td><\/tr><tr><td>Written review<\/td><td>&quot;Great shows but the app keeps freezing…&quot;<\/td><\/tr><tr><td>Hours watched in each of the last 52 weeks<\/td><td>12, 9, 14, 0, …<\/td><\/tr><\/table>"},"3":{"title":"Reading a fitted SVM","html":"A soft-margin SVM on two predictors gives the classifier <b>3x<sub>1<\/sub> + 4x<sub>2<\/sub> − 10 = 0<\/b>, predicting y = +1 when 3x<sub>1<\/sub> + 4x<sub>2<\/sub> − 10 ≥ 0 and y = −1 otherwise. Five training points:<table class='dtab'><tr><th>Point<\/th><th>x<sub>1<\/sub><\/th><th>x<sub>2<\/sub><\/th><th>True y<\/th><\/tr><tr><td>P1<\/td><td>3<\/td><td>1<\/td><td>+1<\/td><\/tr><tr><td>P2<\/td><td>1<\/td><td>2<\/td><td>+1<\/td><\/tr><tr><td>P3<\/td><td>3<\/td><td>0<\/td><td>−1<\/td><\/tr><tr><td>P4<\/td><td>0<\/td><td>1<\/td><td>−1<\/td><\/tr><tr><td>P5<\/td><td>2<\/td><td>2<\/td><td>−1<\/td><\/tr><\/table>"},"4":{"title":"Loan SVM: costs, importance, kernels","html":"A bank fits a soft-margin SVM to approve (+1) or reject (−1) loans. All predictors were <b>scaled to [0,1]<\/b> first. Fitted coefficients: credit score 1.6, debt-to-income ratio −1.1, years at current address 0.01; intercept a<sub>0<\/sub> = 0.3."},"5":{"title":"Scaling or standardizing admissions data","html":"A university builds a model with these attributes:<table class='dtab'><tr><th>Attribute<\/th><th>Range / distribution<\/th><\/tr><tr><td>SAT score<\/td><td>400–1600, many near the top<\/td><\/tr><tr><td>Photo pixel color (RGB)<\/td><td>0–255<\/td><\/tr><tr><td>Predicted graduation probability<\/td><td>0–1<\/td><\/tr><tr><td>Distance from home (km)<\/td><td>no upper bound, roughly bell-shaped after log<\/td><\/tr><tr><td>Family income<\/td><td>mean $60k, std. dev. $20k, roughly normal, plus a few multi-millionaires<\/td><\/tr><\/table>"},"6":{"title":"KNN fraud screening","html":"A card issuer classifies transactions as <b>fraud<\/b> or <b>legit<\/b> with k-nearest-neighbor classification on two predictors: purchase amount and distance from the cardholder's home. Only about 1% of past transactions are fraud. Nearest neighbors of a new transaction (distances after scaling):<table class='dtab'><tr><th>Rank<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><th>6<\/th><th>7<\/th><\/tr><tr><td>Class<\/td><td>Fraud<\/td><td>Legit<\/td><td>Legit<\/td><td>Fraud<\/td><td>Fraud<\/td><td>Fraud<\/td><td>Fraud<\/td><\/tr><tr><td>Distance<\/td><td>1<\/td><td>2<\/td><td>4<\/td><td>4<\/td><td>5<\/td><td>5<\/td><td>6<\/td><\/tr><\/table>"},"7":{"title":"Choosing among six loan models","html":"Dana built six candidate classifiers on a training set and scored each on a separate validation set:<table class='dtab'><tr><th>Model<\/th><th>Training accuracy<\/th><th>Validation accuracy<\/th><\/tr><tr><td>SVM, λ = 0.1<\/td><td>0.90<\/td><td>0.84<\/td><\/tr><tr><td>SVM, λ = 1<\/td><td>0.93<\/td><td>0.85<\/td><\/tr><tr><td>SVM, λ = 10<\/td><td>0.88<\/td><td>0.83<\/td><\/tr><tr><td>KNN, k = 1<\/td><td>1.00<\/td><td>0.78<\/td><\/tr><tr><td>KNN, k = 5<\/td><td>0.91<\/td><td>0.86<\/td><\/tr><tr><td>KNN, k = 15<\/td><td>0.87<\/td><td>0.85<\/td><\/tr><\/table>"},"8":{"title":"Splitting bakery sales data","html":"A bakery chain has 3 years of <b>weekday<\/b> (Mon–Fri) daily sales, in date order, and wants to compare two forecasting models, A and B, and then report how good the chosen one is."},"9":{"title":"Hospital logistics: which distance?","html":"A county hospital network works on a city laid out in a rectangular street grid (coordinates in km). Ambulance <b>Station A<\/b> is at (0, 0) and <b>Station B<\/b> is at (9, 4). A household <b>H<\/b> is at (3, 4).<table class='dtab'><tr><th>Pair<\/th><th>East-west gap<\/th><th>North-south gap<\/th><\/tr><tr><td>H to Station A<\/td><td>3<\/td><td>4<\/td><\/tr><tr><td>H to Station B<\/td><td>6<\/td><td>0<\/td><\/tr><\/table>Inside the hospital, a pharmacy robot travels along a shelf aisle and raises its arm to the right shelf height."},"10":{"title":"Library branches: running k-means","html":"A city plans new library branches and runs k-means (k = 2, Euclidean distance) on the home locations of library-card holders. Partway through the algorithm, the most recent assignment step left these points in each cluster (coordinates in km):<table class='dtab'><tr><th>Cluster<\/th><th>Points currently assigned<\/th><\/tr><tr><td>1<\/td><td>(0, 0), (2, 0), (4, 6)<\/td><\/tr><tr><td>2<\/td><td>(10, 10), (12, 10)<\/td><\/tr><\/table>"},"11":{"title":"Retail segments: choosing k","html":"A retailer clusters 20,000 customers using two attributes: <b>annual spend<\/b> ($200 to $20,000) and <b>store visits per year<\/b> (1 to 50). After scaling the data, it runs k-means for k = 1 to 6:<table class='dtab'><tr><th>k<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><th>6<\/th><\/tr><tr><td>Total distance to centers<\/td><td>1000<\/td><td>600<\/td><td>350<\/td><td>300<\/td><td>270<\/td><td>250<\/td><\/tr><\/table>"},"12":{"title":"Delivery times: spotting outliers","html":"A meal-delivery company draws a box-and-whisker plot of order delivery times (minutes). The box runs from the 25th percentile (40) to the 75th percentile (50), with the median at 45. The analyst chose to draw the whiskers out to the <b>10th percentile (35)<\/b> and the <b>90th percentile (60)<\/b>. Among the recorded times are 20, 38, 58, 62 and 95 minutes."},"13":{"title":"Three outliers, three decisions","html":"Three analysts each find one outlier in their data:<table class='dtab'><tr><th>Case<\/th><th>Question being studied<\/th><th>The outlier<\/th><\/tr><tr><td>1<\/td><td>Survey on credit scores (normally 300–850)<\/td><td>One response lists a credit score of 85,000; the respondent entered their income in the credit-score box<\/td><\/tr><tr><td>2<\/td><td>How many drive-through lanes a fast-food store needs<\/td><td>One week of sales spiked to a very high level when a counter-protest to a boycott brought in huge crowds<\/td><\/tr><tr><td>3<\/td><td>Whether the state needs a new power plant<\/td><td>A few manufacturers with power-intensive machinery and AI server farms use far more power per customer than anyone else<\/td><\/tr><\/table>"},"14":{"title":"Ferry crossings: two models","html":"A ferry operator predicts crossing times. Most crossings take about 2 hours, but roughly 1 in 10 is disrupted by storms and takes 8–14 hours. The operator has weather forecasts, season, and sea-state data for every past crossing, and knows which crossings were disrupted. Instead of one model, an analyst proposes modeling the disruptions separately from normal crossings."},"15":{"title":"Call center: running CUSUM","html":"A call center watches for an <b>increase<\/b> in daily average hold time (minutes) using S<sub>t<\/sub> = max{0, S<sub>t−1<\/sub> + (x<sub>t<\/sub> − μ − C)}, with S<sub>0<\/sub> = 0, μ = 10, C = 1 and T = 6. A change is declared when S<sub>t<\/sub> ≥ T.<table class='dtab'><tr><th>Day t<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><th>6<\/th><\/tr><tr><td>x<sub>t<\/sub><\/td><td>11<\/td><td>9<\/td><td>12<\/td><td>13<\/td><td>14<\/td><td>12<\/td><\/tr><\/table>"},"16":{"title":"Watching a deployed credit model","html":"A bank deployed a loan-default classification model three years ago. Each month it measures the model's accuracy x<sub>t<\/sub> (percent of loans classified correctly). During a stable first year accuracy averaged μ = 92%. The bank wants to use CUSUM to detect whether accuracy has <b>decreased<\/b>."},"17":{"title":"Holt-Winters on emergency-room admissions","html":"A hospital has 3 years of daily data and wants to use triple exponential smoothing (Holt-Winters, multiplicative seasonality) to see whether ER admissions follow a pattern by <b>day of the week<\/b>:<br><i>S<sub>t<\/sub><\/i> = α·<i>x<sub>t<\/sub><\/i>/<i>C<sub>t−L<\/sub><\/i> + (1−α)(<i>S<sub>t−1<\/sub><\/i> + <i>T<sub>t−1<\/sub><\/i>)<br><i>T<sub>t<\/sub><\/i> = β(<i>S<sub>t<\/sub><\/i> − <i>S<sub>t−1<\/sub><\/i>) + (1−β)<i>T<sub>t−1<\/sub><\/i><br><i>C<sub>t<\/sub><\/i> = γ·<i>x<sub>t<\/sub><\/i>/<i>S<sub>t<\/sub><\/i> + (1−γ)<i>C<sub>t−L<\/sub><\/i><table class='dtab'><tr><th>Date<\/th><th>Day of week<\/th><th>Week of year<\/th><th>Average temperature (°F)<\/th><th>ER admissions<\/th><\/tr><tr><td>Mar 3<\/td><td>Mon<\/td><td>10<\/td><td>41<\/td><td>212<\/td><\/tr><tr><td>Mar 4<\/td><td>Tue<\/td><td>10<\/td><td>45<\/td><td>188<\/td><\/tr><tr><td>Mar 5<\/td><td>Wed<\/td><td>10<\/td><td>52<\/td><td>191<\/td><\/tr><tr><td>…<\/td><td>…<\/td><td>…<\/td><td>…<\/td><td>…<\/td><\/tr><\/table>"},"18":{"title":"Smoothing weekly sales of a staple product","html":"A grocery chain smooths weekly sales of a staple product (no trend or seasonality) with single exponential smoothing, <i>S<sub>t<\/sub><\/i> = α<i>x<sub>t<\/sub><\/i> + (1−α)<i>S<sub>t−1<\/sub><\/i>, using α = 0.5 and the start value <i>S<sub>1<\/sub><\/i> = <i>x<sub>1<\/sub><\/i>.<table class='dtab'><tr><th>Week t<\/th><th>1<\/th><th>2<\/th><th>3<\/th><\/tr><tr><td>Sales x<sub>t<\/sub><\/td><td>100<\/td><td>120<\/td><td>90<\/td><\/tr><\/table>"},"19":{"title":"ARIMA for monthly subscriber growth","html":"A streaming service has 72 months of new-subscriber counts. The series rises steadily, has little seasonality, and has few peaks, valleys or outliers. An analyst wants a short-term forecast for the next 2–3 months."},"20":{"title":"Forecasting demand variability for safety stock","html":"An online retailer already forecasts average weekly demand for a popular item well, from 4 years of weekly data. What the operations team does not know is how much demand will vary around that forecast in the coming weeks: some periods are calm and others are volatile. They want to use that information to set safety stock. (A similar need arises for an investment team that measures risk as the variance of returns.)"},"21":{"title":"Regression of delivery times","html":"A courier fits a linear regression of delivery time (minutes) on 100 past deliveries. Predictors: distance (km), number of stops, weekend (1 = weekend, 0 = weekday), rain (1 = raining, 0 = dry), and the product rain×distance.<table class='dtab'><tr><th>Term<\/th><th>Coefficient<\/th><th>p-value<\/th><\/tr><tr><td>Intercept<\/td><td>10.0<\/td><td>&lt;0.001<\/td><\/tr><tr><td>distance<\/td><td>2.5<\/td><td>&lt;0.001<\/td><\/tr><tr><td>stops<\/td><td>2.0<\/td><td>0.003<\/td><\/tr><tr><td>weekend<\/td><td>−0.4<\/td><td>0.68<\/td><\/tr><tr><td>rain<\/td><td>1.0<\/td><td>0.04<\/td><\/tr><tr><td>rain×distance<\/td><td>0.5<\/td><td>0.01<\/td><\/tr><\/table>R² = 0.71, adjusted R² = 0.69"},"22":{"title":"Choosing among energy-use models with AIC and BIC","html":"An energy company fits three regression models of household energy use on n = 1,000 households.<table class='dtab'><tr><th>Model<\/th><th>Parameters k<\/th><th>AIC<\/th><th>BIC<\/th><\/tr><tr><td>A<\/td><td>4<\/td><td>210<\/td><td>230<\/td><\/tr><tr><td>B<\/td><td>6<\/td><td>206<\/td><td>235<\/td><\/tr><tr><td>C<\/td><td>10<\/td><td>208<\/td><td>257<\/td><\/tr><\/table>Recall AIC = 2k − 2 ln L*, BIC = k ln n − 2 ln L*, and relative likelihood = e<sup>(AIC<sub>min<\/sub> − AIC<sub>i<\/sub>)/2<\/sup>."},"23":{"title":"Push notifications and spending in 2 million users","html":"A mobile app regresses each user's monthly spending ($) on the number of push notifications the user received that month, using 2,000,000 users. Notifications are sent automatically when a user browses items. The coefficient on notifications is $0.01 per notification with p &lt; 0.0001. A typical user receives 20 notifications a month and spends $50. R² = 0.04."},"24":{"title":"Admissions models: SVM, regression and R²","html":"A graduate program's admissions committee is exploring models built on past applicants (test scores, GPA, work experience, essays). One decision is classification: admit or don't admit. Separately, a corporate sponsor funds a fellowship for the applicant expected to have the most success, measured by first-year GPA."},"25":{"title":"Insurance claims that fan out","html":"An insurer regresses the size of each car-insurance claim (in $ thousands, always positive) on the driver's age and the vehicle's value. In the residual plot, the misses are small for small predicted claims and several times larger for large predicted claims, so the points form a widening fan. A Q-Q plot of the response bends away from the straight line. The analyst considers a Box-Cox transformation <b>t(y) = (y<sup>λ<\/sup> − 1) / λ<\/b>."},"26":{"title":"Detrending gold prices","html":"An analyst builds a regression that estimates the end-of-year price of gold (1975–2015) from two predictors: the U.S. money supply, which has risen steadily over the whole period, and an annual political-risk index, which goes up and down with no trend. A line fitted to price against year gives <b>trend price ≈ −45,600 + 23.2 × year<\/b>. Suppose the actual price in the year 2000 was 1,000."},"27":{"title":"PCA on house predictors","html":"A realtor predicts house price from four scaled predictors: square footage, number of rooms, distance to downtown, and age. Square footage and number of rooms have correlation 0.95. PCA on the scaled data gives these eigenvalues:<table class='dtab'><tr><th>Component<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><\/tr><tr><td>Eigenvalue<\/td><td>2.9<\/td><td>0.8<\/td><td>0.25<\/td><td>0.05<\/td><\/tr><\/table>The realtor then regresses price on components 1 and 2 and gets <b>price = 50 + 10·z<sub>1<\/sub> + 4·z<sub>2<\/sub><\/b>. The eigenvector entries for square footage are v<sub>sqft,1<\/sub> = 0.6 and v<sub>sqft,2<\/sub> = 0.5."},"28":{"title":"What PCA can and can't do","html":"A lab classifies blood samples as healthy (blue) or diseased (red) from five test measurements. In a two-test view, the points form a long, thin cloud tilted at 45°. The long direction is D1 and the short direction, at right angles to it, is D2. All red points lie on one side of the D1 axis and all blue points on the other side, so moving along D2 separates the classes, while moving along D1 does not."},"29":{"title":"Bike-rental regression tree","html":"A bike-share company fits a regression tree to 400 days of data to predict daily rentals (Tree T1). Leaves show the number of days and the average rentals:<table class='dtab'><tr><th>Leaf<\/th><th>Path<\/th><th>Days<\/th><th>Average rentals<\/th><\/tr><tr><td>A<\/td><td>Temp ≤ 15°C<\/td><td>120<\/td><td>40<\/td><\/tr><tr><td>B<\/td><td>Temp &gt; 15°C, weekend<\/td><td>150<\/td><td>90<\/td><\/tr><tr><td>C<\/td><td>Temp &gt; 15°C, weekday, public holiday<\/td><td>3<\/td><td>200<\/td><\/tr><tr><td>D<\/td><td>Temp &gt; 15°C, weekday, not a holiday<\/td><td>127<\/td><td>60<\/td><\/tr><\/table>Tree T2 is the same, except the weekday branch is not split on holiday (one leaf of 130 days). T1 has a slightly lower training error than T2."},"30":{"title":"Forests, trees and movie tickets","html":"A studio predicts a movie's ticket sales. It has three models: a linear regression, a single regression tree, and a random forest of 500 trees. The linear regression's coefficient on the top four stars' total salary (in dollars) is <b>0.25<\/b>. The regression tree says salary's effect is 1/3 ticket per dollar if there are 5 or fewer similar movies; otherwise 1/2 if rated R; otherwise 1/6 if 97+ days remain; otherwise 0. The random forest has the lowest validation error of the three."},"31":{"title":"Loan repayment probability","html":"A bank estimates the probability that an applicant repays a loan with logistic regression: <b>p = 1 / (1 + e<sup>−(a<sub>0<\/sub> + a<sub>1<\/sub>x)<\/sup>)<\/b>, with a<sub>0<\/sub> = −2, a<sub>1<\/sub> = 0.5, and x = income in $10,000s. On validation data the model's ROC curve has an area under the curve (AUC) of 0.80. Among past applicants, Joe repaid his loan and Moe did not."},"32":{"title":"Pricing a spam filter","html":"A spam filter is tested on 1,000 emails, half real and half spam. <b>Real email is the positive class.<\/b><table class='dtab'><tr><th>Filter 1<\/th><th>Model: real (inbox)<\/th><th>Model: spam (filtered)<\/th><\/tr><tr><td>Actually real<\/td><td>TP = 490<\/td><td>FN = 10<\/td><\/tr><tr><td>Actually spam<\/td><td>FP = 100<\/td><td>TN = 400<\/td><\/tr><\/table>Costs: a correct answer costs $0; reading a spam message in the inbox costs $0.04; losing a real email to the spam folder costs $1. A stricter Filter 2 gives TP = 450, FN = 50, FP = 50, TN = 450."},"33":{"title":"A transit agency's modeling questions","html":"A city transit agency has several questions. It has years of rider data (age, distance from home to the nearest station, income, past ridership), counts of riders arriving at each station, and a brand-new express route with only three weeks of data."},"34":{"title":"Hospital readmissions","html":"A hospital has records for 4,000 past patients. For each: age, length of stay (days), number of prior admissions, two lab values (one ranges 0–500 mg/dL, the other is a ratio between 0 and 1), the patient ID number, and whether the patient was <b>readmitted within 30 days<\/b> (yes/no). A handful of patients have a length of stay recorded as <b>999<\/b>. A nurse follow-up call after discharge costs about <b>$40<\/b>; a readmission that could have been prevented costs about <b>$1,000<\/b>."},"35":{"title":"Grocery chain analytics","html":"A grocery chain with 60 stores has loyalty-card data on 200,000 customers: monthly spend ($0–$2,000), visits per month (0–30), and share of purchases that are organic (0–1). No customer \"types\" are recorded. It also has 6 years of <b>weekly<\/b> sales for each store, which rise steadily and spike every holiday season, with bigger spikes in years when sales are higher overall. At store 17, which just added self-checkout, the daily average checkout wait has been steady at about 4 minutes for two years."},"36":{"title":"Bank: fraud and lending","html":"A bank has 200,000 past card transactions, each labeled fraud or not fraud, with factors such as amount, distance from the cardholder's home, minutes since the previous transaction, and merchant category. New transactions (millions a day) must be approved or blocked in real time. Separately, the bank's lending division must give regulators and applicants a <b>specific reason for each denied loan<\/b>. A regression on past loans found that the number of credit cards an applicant holds has a positive, significant coefficient on default."},"37":{"title":"Airline delays and demand","html":"An airline has 8 years of data for one route: daily passengers (a weekly cycle on top of a steadily rising, non-stationary level), and for each flight its departure delay in minutes, inches of rain, wind speed, time of day, and whether it left more than 15 minutes late. Most delays are a few minutes but some last hours, and in plots of residuals against predicted delay, the spread is much larger for flights with larger predicted delays."},"38":{"title":"Electric utility planning","html":"A state electric utility is deciding whether a new power plant is needed. It has hourly usage for 50,000 customers. A few customers (AI data centers and an aluminum smelter) use 200 times the average. Each household also has 40 recorded characteristics (square footage, rooms, bedrooms, bathrooms, windows, …), many of them strongly correlated. A substation transformer reports its temperature every minute; readings naturally bounce around a lot. A smart-thermostat pilot includes only 300 households."},"39":{"title":"Basketball front office","html":"A professional basketball team has 30 years of draft-prospect data: college 3-point percentage, height, age, and college minutes, plus whether each of the 400 prospects became a starter (yes/no). League-wide 3-point percentage has risen steadily over those 30 years. The team is also negotiating with two veterans who have the same average points per game, and it has each player's game-by-game scoring for the last several seasons."}};

const scnQs=(k,sc)=>SECQ[k].filter(id=>QBY[id].sc===sc);
const scnDone=(k,sc)=>scnQs(k,sc).every(id=>S.mastered[id]);
const nextScn=k=>SCNS[k].find(sc=>!scnDone(k,sc));
const scnLeft=k=>SCNS[k].filter(sc=>!scnDone(k,sc)).length;
function startVisit(k){
  const E=!!S.endless,review=!E&&secDone(k);
  const sc=E||review?pick(SCNS[k]):nextScn(k);
  const queue=E||review?scnQs(k,sc):scnQs(k,sc).filter(id=>!S.mastered[id]);
  S.visit={k,sc,queue,i:0,right:0,missed:[],review,endless:E,pendant:true,hints:0,gained:0};
  S.screen="battle";S.carry=0;S.visits++;sheet=null;
  const [n]=VIS[k];
  const st=SCN[sc]?SCN[sc].title:"";
  if(E)say(`${n} slams the table: "${esc(st)}", ${queue.length} questions. No revives now.`);else say(review?`${n} is back for a review: "${esc(st)}", ${queue.length} questions.`:`${n} pulls up a chair with "${esc(st)}": ${queue.length} question${queue.length===1?"":"s"}${queue.length<scnQs(k,sc).length?`, the ones you haven't mastered yet`:""}.`);
  ask();
}
function curQ(){return QBY[S.visit.queue[S.visit.i]]}
function prevQ(){return S.visit.i>0?QBY[S.visit.queue[S.visit.i-1]]:null}
function ask(){
  const q=curQ(),p=prevQ(),same=p&&p.sc===q.sc;
  S.order=q.fixed?q.opts.map((_,i)=>i):shuffle(q.opts.map((_,i)=>i));
  S.sel=[];S.picked=[];S.gone=[];S.phase="ask";S.watch=false;
  const carry=same?Math.min(CARRY_MAX,S.carry||0):0;
  S.base=same?BASE_T:BASE_T+READ_T;S.carryIn=carry;S.tMax=S.base+carry;S.tLeft=S.tMax;
  // the scenario stays open for every related part; it only stays hidden if you hid it during this scenario
  S.scnOpen=same?S.scnOpen!==false:true;
  if(carry)say(`<span class="good">+${Math.round(carry)}s</span> carried over from the last part of this scenario.`);
  save();render(true);startTimer();
}
function startTimer(){stopTimer();let last=Date.now(),n=0;timerId=setInterval(()=>{
  if(!S||S.phase!=="ask"||S.screen!=="battle"){stopTimer();return}
  const now=Date.now(),dt=(now-last)/1000;last=now;
  if(sheet)return; // paused while a sheet is open
  S.tLeft=Math.max(0,S.tLeft-dt);
  if(S.tLeft<=0){
    stopTimer();grade(true);return}
  const b=$("#tbar"),t=$("#tnum");if(b)b.style.width=(S.tLeft/S.tMax*100)+"%";if(t)t.textContent=Math.ceil(S.tLeft)+"s";
  if(++n%10===0)save();
},200)}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}

function choose(i){const q=curQ();if(S.phase!=="ask"||S.gone.includes(i))return;
  if(q.multi){S.sel=S.sel.includes(i)?S.sel.filter(x=>x!==i):[...S.sel,i];render();return}
  S.sel=[i];grade(false)}
function hint(){const q=curQ(),V=S.visit;if(S.phase!=="ask"||V.hints>=cnt("table"))return;
  const w=q.opts.map((_,i)=>i).filter(i=>!q.ok.includes(i)&&!S.gone.includes(i));if(!w.length)return;
  const i=pick(w);S.gone.push(i);S.sel=S.sel.filter(x=>x!==i);V.hints++;render()}
function heal(n){const h=Math.max(0,Math.min(n,S.maxHp-S.hp));S.hp+=h;return h}
function grade(timeout){
  stopTimer();const q=curQ(),V=S.visit,[n]=VIS[V.k];
  S.picked=S.sel.slice();S.phase="result";
  const ok=!timeout&&S.picked.length===q.ok.length&&q.ok.every(i=>S.picked.includes(i));
  const next=QBY[V.queue[V.i+1]];S.carry=next&&next.sc===q.sc?S.tLeft:0;
  S.asked++;
  const right=q.ok.map(i=>`<b>${q.opts[i][0]}</b>`).join(", ");
  if(ok){
    if(V.endless)S.endless.right++;S.correct++;S.streak++;S.bestStreak=Math.max(S.bestStreak,S.streak);V.right++;
    if(!S.mastered[q.id]){S.mastered[q.id]=1;V.gained++}
    const h=heal(rightHeal());
    say(`<span class="good">Right.</span> "${pick(CHEERS)}"${h?` +${h} HP.`:""}${S.carry>0?` ${Math.round(S.carry)}s saved for the next part.`:""}`);
    if(S.streak%3===0){const w=heal(windHeal());if(w)say(`Three in a row: a second wind. +${w} HP.`)}
  }else{
    S.streak=0;if(!V.endless)delete S.mastered[q.id];S.misses[q.id]=(S.misses[q.id]||0)+1;V.missed.push(q.id);S.carry=0;
    const dmg=S.wards>0?0:hitOf(V.k);if(dmg){S.hp-=dmg;S.hitMe=true}else S.wards--;
    const wrongPick=S.picked.find(i=>!q.ok.includes(i)),trap=q.trap||(wrongPick!=null&&q.opts[wrongPick][2]);
    say(`<span class="bad">${timeout?"Time's up.":"Not quite."}</span> "${pick(QUIPS)}" ${dmg?`${n} hits you for ${dmg}.`:`${ico("ward","ico sm")} Your Ward Rune absorbs ${n}'s blow${S.wards?` (${S.wards} left)`:""}.`} Answer: ${right}.${trap?`<span class="tipline"><b>The trap</b>${esc(trap)}</span>`:""}`);
    if(S.hp<=0&&V.pendant){V.pendant=false;S.hp=1;say(`${ico("pendant","ico sm")} Your heart pendant flares and keeps you on your feet with 1 HP.`)}
    if(S.hp>0&&S.hp<=S.maxHp*.35&&S.potions>0){S.potions--;const h=heal(pct(POTION));say(`${ico("potion","ico sm")} You gulp a potion without thinking. +${h} HP (${S.potions} left).`)}
  }
  save();render();
}
function nextQ(){
  if(S.hp<=0){S.hp=0;if(S.visit.endless){recordRun();S.screen="final";say(`${VIS[S.visit.k][0]} knocks you out for good. Your run is recorded on the title page.`)}else S.screen="faint";save();render(true);return}
  const V=S.visit;V.i++;
  if(V.i>=V.queue.length){finishVisit();return}
  ask();
}
function finishVisit(){
  const V=S.visit,[n]=VIS[V.k];S.screen="clear";S.carry=0;S.offer=null;
  let grow=0;for(let j=0;j<V.gained;j++){const d=Math.max(1,Math.round(S.maxHp*.01));S.maxHp+=d;grow+=d}V.grow=grow;
  if(V.endless)S.endless.visits++;
  const h=heal(Math.ceil(S.maxHp*.5));
  if(!S.endless&&allDone()){S.endless={visits:0,right:0,since:Date.now()};S.hp=S.maxHp;say(`<span class="good">Every round is mastered!</span> The whole bar goes quiet. Now the endless challenge begins: random visitors, random questions, and harder hits as you go. Revives are over; fall now and your run ends.`)}
  say(`${V.missed.length?`${n} leaves, muttering about ${V.missed.length} answer${V.missed.length===1?"":"s"}. They'll be back.`:`${n} is satisfied${secDone(V.k)?" and tips their hat. Round mastered!":"."}`}${grow?` +${grow} max HP for what you mastered.`:""} Resting heals ${h} HP.`);
  // Like the Trivia Conungeon: after a visit, a healing stone and a reliquary sometimes open up as side rooms.
  // Pick one; the pair won't return until you've finished another visit.
  S.side=Math.random()<SIDE_CHANCE;
  {const pool=[shuffle(LOOT.filter(l=>!l.item&&cnt(l.id)<l.max))[0],pick(LOOT.filter(l=>l.item))].filter(Boolean);V.loot=pool.length?pick(pool).id:null;V.took=false}
  save();render(true);
}
function openSide(t){if(!S.side)return;
  if(t==="rest"){S.side=false;const h=heal(Math.ceil(S.maxHp*STONE_HEAL));say(`The healing stone hums. You recover ${h} HP.`);save();render(true);return}
  const relics=shuffle(LOOT.filter(l=>!l.item&&cnt(l.id)<l.max)).slice(0,2),items=shuffle(LOOT.filter(l=>l.item&&itemOK(l))).slice(0,1);
  S.reliq=relics.concat(items).slice(0,3).map(l=>l.id);S.screen="reliq";render(true)}
function takeLoot(id){if(S.screen!=="reliq")return;S.side=false;S.reliq=null;S.screen="map";grant(id);save();render(true)}
// A visitor's parting gift: one random relic or item, by luck (an item can arrive when your pack is already full)
function takeDrop(){const V=S.visit;if(S.screen!=="clear"||!V||!V.loot||V.took)return;const l=LOOT.find(x=>x.id===V.loot);if(l.item&&!itemOK(l))return;V.took=true;grant(l.id);save();render(true)}
function grant(id){const l=LOOT.find(x=>x.id===id);

  else if(l.item){S.potions=Math.min(POTION_MAX,S.potions+2);say(`${ico("potion","ico sm")} You take two potions (${S.potions} in your pack).`)}
  else{S.relics.push(id);if(id==="tome"){const g=pct(cnt("tome")<=5?.15:.05);S.maxHp+=g;heal(g)}say(`${ico(id,"ico sm")} You take the ${l.n}${cnt(id)>1?` (×${cnt(id)})`:""}. ${l.d}`)}}
function revive(){S.revives++;S.hp=S.maxHp;S.screen="battle";S.visit.pendant=true;say(`You come to on the floor. A kind bartender helps you up: revive #${S.revives}, full health. The visitor is still waiting.`);nextQ()}

  return `<section class="room title"><p class="label">Expert level · Analytics &amp; modeling</p><h1 class="tagline">The Analytics Conungeon</h1>
    <p class="muted">Twelve visitors, one for each round of the three practice sets, have pulled up chairs. Master every question to satisfy them all. Until you do, you can revive as often as you need. Once everything is mastered, the endless challenge begins, and one fall ends your run.</p>
    ${fresh0?"":`<div class="stats"><div><span class="label">Mastered</span><span class="num">${tm}/${MQ.length}</span></div><div><span class="label">${S.endless?"Endless cleared":"Rounds"}</span><span class="num">${S.endless?S.endless.visits:`${SECS.filter(secDone).length}/12`}</span></div><div><span class="label">Revives</span><span class="num">${S.revives}</span></div></div>`}
    <details class="past"><summary><span>Past runs</span><span class="muted">${runs.length?runs.length:"none yet"}</span></summary>${runs.length?`<ol class="floors runs">${runs.map((r,i)=>`<li><span class="num">${runs.length-i}</span><span>${fmtD(r.end)} · cleared ${r.visits} endless visitor${r.visits===1?"":"s"}, ${r.right} right<br><span class="muted small">Accuracy ${r.asked?Math.round(r.correct/r.asked*100):0}% · best streak ${r.best} · ${r.revives} revive${r.revives===1?"":"s"} while learning · max HP ${r.maxHp} · ended by ${esc(r.by)}</span></span></li>`).join("")}</ol>`:`<p class="muted small">Runs are recorded when the endless challenge finally knocks you out.</p>`}</details>
  </section>`;
}
function sheetView(){
  if(!sheet)return "";
  const acc=S.asked?Math.round(S.correct/S.asked*100):0,V=S.screen==="battle"?S.visit:null;
  const weak=Object.entries(S.misses).filter(([id])=>!S.mastered[id]).map(([id,n])=>({q:QBY[id],n})).filter(x=>x.q).sort((a,b)=>b.n-a.n).slice(0,8);
  const rel=LOOT.filter(l=>!l.item&&cnt(l.id)).map(l=>`<li>${ico(l.id)}<div><strong>${esc(l.n)}${cnt(l.id)>1?` ×${cnt(l.id)}`:""}</strong><span class="muted">${esc(l.d)}</span></div></li>`).join("");
  const busy=S.screen==="battle";
  return `<div class="overlay" role="dialog"><div class="sheet"><div class="sheethead"><h2>Your study</h2><button class="linkbtn closex" data-a="sheet" data-v="" aria-label="Close">✕ Close</button></div>
    <div class="stats"><div><span class="label">Mastered</span><span class="num">${totalM()}/${MQ.length}</span></div><div><span class="label">Accuracy</span><span class="num">${acc}%</span></div><div><span class="label">Streak</span><span class="num">${S.streak} <small class="muted">best ${S.bestStreak}</small></span></div></div>
    <p class="label">Expert gear · always on</p>
    <ul class="rlist"><li>${ico("pendant")}<div><strong>Heart pendant${V&&!V.pendant?" · used":""}</strong><span class="muted">Once per visitor, survive a knockout with 1 HP.</span></div></li>
      <li>${ico("pocket")}<div><strong>Exam clock</strong><span class="muted">90 seconds per question, plus 60 seconds to read a scenario's first question. Nothing adds time, but unused time carries to the next question in the same scenario, like budgeting time on a real test.</span></div></li>      <li>${ico("potion")}<div><strong>Potions × ${S.potions}</strong><span class="muted">Found in reliquaries. You drink one automatically when your health falls below a third. Each heals ${Math.round(POTION*100)}% of your max HP.</span></div></li>      <li>${ico("ward")}<div><strong>Ward Runes × ${S.wards||0}</strong><span class="muted">Found in reliquaries. Each blocks one wrong-answer hit completely; your health bar glows while one is ready. Hold up to ${WARD_MAX}.</span></div></li>
      <li>${ico("heart")}<div><strong>Health ${Math.max(0,S.hp)}/${S.maxHp}</strong><span class="muted">Right answers heal ${rightHeal()} HP (${Math.round((HEAL_RIGHT+.01*cnt("ember"))*100)}% of max); three in a row heals ${windHeal()} more (${Math.round((SECOND_WIND+.1*cnt("ink"))*100)}%). Wrong answers hit for ${Math.round(HIT[1]*100)}–${Math.round(HIT[3]*100)}% of max HP, by set${cnt("plate")?`, ${cnt("plate")*10}% softer with Iron Plate`:""}. Each newly mastered question adds 1% max HP. Revives: ${S.revives}.</span></div></li></ul>
    <p class="label">Loot</p>${rel?`<ul class="rlist">${rel}</ul>`:`<p class="muted small">Nothing yet. Every visitor leaves something behind when they go.</p>`}
    <p class="label">All rounds${busy?"":" · tap one to face it"}</p><div class="seclist">${SECS.map((k,i)=>`<button class="secrow${secDone(k)?" good":""}" data-a="visit" data-v="${k}" ${busy?"disabled":""}><span class="num">${k[0]}·${k[2]}</span><span class="nm">${esc(VIS[k][0])}</span><span class="muted">${mCount(k)}/${SECQ[k].length}</span></button>`).join("")}</div>
    ${weak.length?`<p class="label">Missed most, not yet mastered</p><div class="review">${weak.map(x=>`<div><p>${x.q.q}</p><p class="good">${x.q.ok.map(i=>x.q.opts[i][0]).join("; ")}</p><p class="muted small">Missed ${x.n}×</p></div>`).join("")}</div>`:""}
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${confirmReset?`<span class="muted">Erase all mastery and loot?</span><button class="btn" data-a="resetok">Erase</button><button class="btn ghost" data-a="resetno">Keep</button>`:`<button class="btn ghost" data-a="reset">Reset progress</button><button class="btn ghost" data-a="title">Title page</button><a class="btn ghost" href="index.html">Trivia Conungeon</a>`}</div>
  </div></div>`;
}
function footer(){
  let nav="";const asking=!onTitle&&S.screen==="battle"&&S.phase==="ask";
  if(onTitle){const done=S.screen==="final";
    nav=confirmNewRun?`<button class="btn ghost" data-a="newno">Keep it</button><button class="btn right" data-a="newok">Erase and start</button>`
      :done||(!S.asked&&S.screen==="map")?`<button class="btn right" data-a="${done?"newok":"enter"}">${done?"Start a new run":"Enter the Conungeon"}</button>`
      :`<button class="btn ghost" data-a="newrun">New run</button><button class="btn right" data-a="enter">Continue</button>`;
    const info=confirmNewRun?`<p class="pin"><strong>Start over?</strong> Your mastery, loot and max HP will be erased. Past runs stay on the list.</p>`:"";
    return `<footer class="info"><div class="navbox">${nav}</div><div class="infotext">${info}<div class="alog">${S.log.slice(0,8).map(l=>`<p>${l}</p>`).join("")}</div></div></footer>`}
  if(S.screen==="map")nav=`<span class="label">Tap a visitor to begin</span>`;
  else if(S.screen==="battle"){const q=curQ(),V=S.visit;
    if(asking)nav=(q.multi?`<button class="btn right" data-a="submit" ${S.sel.length?"":"disabled"}>Submit</button>`:`<button class="btn right" disabled>Next question</button>`);
    else nav=`<button class="btn right" data-a="next" id="nextbtn">${S.hp<=0?"Fall":V.i+1>=V.queue.length?"Finish visit":"Next question"}</button>`}
  else if(S.screen==="clear"){const V=S.visit,l=V&&V.loot&&!V.took&&LOOT.find(x=>x.id===V.loot);
    nav=l&&!(l.item&&!itemOK(l))?`<button class="btn" data-a="drop" id="nextbtn">Take it</button><button class="btn ghost right" data-a="map">Leave it</button>`:`<button class="btn right" data-a="map">Next visitors</button>`}
  else if(S.screen==="reliq")nav=`<button class="btn ghost" data-a="leavereliq">Not now</button>`;
  else if(S.screen==="final")nav=`<button class="btn right" data-a="title">Title page</button>`;
  else if(S.screen==="faint")nav=`<button class="btn ghost" data-a="map">‹ Leave</button><button class="btn right" data-a="revive" id="nextbtn">Revive</button>`;
  // while a question is open, the log box folds away to give the question the room
  return `<footer class="info${asking?" slim":logBig?" big":""}"><div class="navbox">${nav}</div>${asking?"":`<div class="infotext"><button class="linkbtn grow" data-a="logsize">${logBig?"▾ Less":"▴ More"}</button><div class="alog">${S.log.slice(0,40).map(l=>`<p>${l}</p>`).join("")}</div></div>`}</footer>`;
}
function render(top){
  const app=$("#app"),old=app.querySelector(".mid"),y=old&&!top?old.scrollTop:0;
  const body=onTitle?titleView():S.screen==="map"?mapView():S.screen==="battle"?battleView():S.screen==="clear"?clearView():S.screen==="reliq"?reliqView():S.screen==="final"?finalView():faintView();
  app.className="run"+(onTitle?" titlepage":S.screen==="battle"?" action":"");
  app.innerHTML=(onTitle?"":sheetView()+hud())+`<main class="mid">${body}</main>`+footer();
  const m=app.querySelector(".mid");if(m)m.scrollTop=y;
  const d=app.querySelector("details.scn");if(d)d.addEventListener("toggle",()=>{S.scnOpen=d.open;const t=d.querySelector(".tog");if(t)t.textContent=d.open?"Hide":"Show"});
  drawDoors(performance.now());S.hitMe=S.hitFoe=false;
}
document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-a]");if(!b||b.disabled)return;const a=b.dataset.a;
  if(a==="ans")choose(+b.dataset.i);
  else if(a==="submit"){if(S.sel.length)grade(false)}
  else if(a==="hint")hint();
  else if(a==="next")nextQ();
  else if(a==="visit")startVisit(b.dataset.v);
  else if(a==="loot")takeLoot(b.dataset.v);
  else if(a==="drop")takeDrop();
  else if(a==="side")openSide(b.dataset.v);
  else if(a==="leavereliq"){S.screen="map";S.reliq=null;render(true)}
  else if(a==="map"||a==="leave"){stopTimer();if(a==="leave"&&S.screen==="battle"){say(`You step away from ${VIS[S.visit.k][0]}. Your mastered answers are saved.`)}S.screen="map";S.visit=null;save();render(true)}
  else if(a==="revive")revive();
  else if(a==="enter"){onTitle=false;render(true);if(S.screen==="battle"&&S.phase==="ask")startTimer()}
  else if(a==="title"){stopTimer();onTitle=true;sheet=null;confirmNewRun=false;render(true)}
  else if(a==="newrun"){confirmNewRun=true;render()}
  else if(a==="newno"){confirmNewRun=false;render()}
  else if(a==="newok"){confirmNewRun=false;stopTimer();S=fresh();save();onTitle=false;render(true)}
  else if(a==="sheet"){sheet=b.dataset.v||null;confirmReset=false;render()}
  else if(a==="logsize"){logBig=!logBig;render()}
  else if(a==="reset"){confirmReset=true;render()}
  else if(a==="resetno"){confirmReset=false;render()}
  else if(a==="resetok"){confirmReset=false;sheet=null;stopTimer();S=fresh();save();render(true)}
});
document.addEventListener("keydown",e=>{if(!S||onTitle||S.screen!=="battle"||sheet)return;const q=curQ();
  if(S.phase==="ask"){const k=L.indexOf(e.key.toUpperCase());if(k>=0&&k<S.order.length)choose(S.order[k]);else if(e.key==="Enter"&&q.multi&&S.sel.length)grade(false)}
  else if(e.key==="Enter"||e.key===" "){e.preventDefault();nextQ()}});
// ---------- cave art for the visitor doors (shared with the Trivia Conungeon)
function useArt(){return false}
function drawDoors(t){document.querySelectorAll("canvas.cave").forEach(cv=>drawCave(cv,t))}
let last=0;function loop(t){if(t-last>80){drawDoors(t);last=t}requestAnimationFrame(loop)}
// ---------- boot: resume mid-question with the time that was left
// If a save from an older version can't be shown, fall back to the map with mastery and loot kept.
S=load()||fresh();
try{if(S.screen==="battle"&&!S.visit)S.screen="map";if(S.screen==="final"&&!S.visit)S.screen="map";render(true);if(!onTitle&&S.screen==="battle"&&S.phase==="ask")startTimer()}
catch(e){stopTimer();onTitle=true;S.screen="map";S.visit=null;sheet=null;try{render(true)}catch(e2){S=fresh();render(true)}}
requestAnimationFrame(loop);
</script></body></html>
