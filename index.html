<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conungeon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@600;800&family=Alegreya+Sans:wght@400;500;700&family=Martian+Mono:wght@400;600&display=swap">
<style>
/* Layout: one narrow column like a dungeon ledger — HUD strip, then the current room, then the battle log. Single committed dark look (torchlit stone). */
:root{
  --stone:#191d1a; --slab:#232925; --slab-2:#2d342f; --line:#3d463f;
  --parch:#ebe1c8; --dim:#a39c88; --torch:#e3a548; --torch-ink:#2a1b06;
  --blood:#cf5444; --mana:#6cbcae; --gold:#d8c06a;
  --display:"Grenze Gotisch","Palatino Linotype",Georgia,serif;
  --body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --mono:"Martian Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{background:var(--stone);color:var(--parch)}
body{font-family:var(--body);font-size:17px;line-height:1.45;padding-inline:16px;padding-block:20px 48px;
  background-image:radial-gradient(ellipse at 50% -10%,rgba(227,165,72,.14),transparent 60%);background-attachment:fixed;min-height:100%}
*{box-sizing:border-box}
#app{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--display);font-weight:800;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1}
h1{font-size:clamp(52px,14vw,84px);color:var(--torch);text-shadow:0 0 28px rgba(227,165,72,.35)}
h2{font-size:34px}
p{margin:0}
.muted{color:var(--dim)}
.label{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--torch);outline-offset:2px}
.btn{background:var(--torch);color:var(--torch-ink);border:0;border-radius:6px;padding:12px 20px;font-weight:700;font-size:17px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--parch);border:1px solid var(--line)}

/* HUD */
.hud{display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:center;background:var(--slab);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.bar{height:10px;background:var(--slab-2);border-radius:5px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--blood);transition:width .35s}
.hpline{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;gap:8px}
.floor{text-align:right}
.floor b{font-family:var(--display);font-size:30px;color:var(--torch);font-weight:800}
.kit{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:14px;background:var(--stone)}
.chip.item{border-color:var(--mana);color:var(--mana)}
button.chip.item:hover{background:var(--slab-2)}
.chip.relic{border-color:#6a5a33;color:var(--gold)}

/* Rooms */
.room{background:var(--slab);border:1px solid var(--line);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:14px}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.door{background:var(--stone);border:1px solid var(--line);border-radius:60px 60px 6px 6px;padding:26px 12px 16px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;transition:border-color .15s,transform .15s}
.door:hover{border-color:var(--torch);transform:translateY(-2px)}
.door .glyph{font-family:var(--mono);font-size:30px;color:var(--torch)}
.door.elite .glyph{color:var(--blood)} .door.rest .glyph{color:var(--mana)} .door.treasure .glyph{color:var(--gold)}
.door strong{font-size:18px}
.door small{color:var(--dim);font-size:14px}

/* Battle */
.foe{display:flex;gap:16px;align-items:center}
.sigil{flex:none;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:40px;font-weight:600;color:var(--blood);background:radial-gradient(circle,#3a2320,var(--stone) 70%);border:1px solid #5a302a}
.sigil.boss{color:var(--torch);border-color:var(--torch)}
.foe-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.foe-name{font-family:var(--display);font-size:28px;font-weight:600;line-height:1}
.traits{display:flex;flex-wrap:wrap;gap:6px;font-size:13px}
.weak{color:var(--mana)} .resist{color:var(--dim)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cat{background:var(--stone);border:1px solid var(--line);border-radius:6px;padding:12px 8px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center}
.cat:hover{border-color:var(--torch)}
.cat .m{font-family:var(--mono);font-size:12px}
.cat.w{border-color:var(--mana)} .cat.w .m{color:var(--mana)}
.cat.r .m{color:var(--dim)}
.q{font-size:20px;font-weight:500;text-wrap:pretty}
.timer{height:4px;background:var(--slab-2);border-radius:2px;overflow:hidden}
.timer>i{display:block;height:100%;background:var(--torch)}
.answers{display:grid;gap:8px}
.ans{display:flex;gap:12px;align-items:center;text-align:left;background:var(--stone);border:1px solid var(--line);border-radius:6px;padding:12px 14px;font-size:17px}
.ans:hover:not(:disabled){border-color:var(--torch)}
.ans .k{font-family:var(--mono);font-size:12px;color:var(--dim);flex:none;width:18px}
.ans.right{border-color:var(--mana);background:rgba(108,188,174,.12)}
.ans.wrong{border-color:var(--blood);background:rgba(207,84,68,.12)}
.ans.gone{opacity:.25}
.ans:disabled{cursor:default}
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.log{display:flex;flex-direction:column;gap:4px;font-size:15px;color:var(--dim);padding-inline:4px}
.log p:first-child{color:var(--parch)}
.good{color:var(--mana)!important} .bad{color:var(--blood)!important}

/* Rewards */
.rewards{display:grid;gap:10px}
.reward{text-align:left;background:var(--stone);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:2px}
.reward:hover{border-color:var(--gold)}
.reward strong{color:var(--gold)} .reward.it strong{color:var(--mana)}
.title{align-items:flex-start;padding:28px 22px}
.rules{display:grid;gap:8px;margin:0;padding-left:20px;color:var(--dim)}
.rules b{color:var(--parch);font-weight:500}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--stone);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:2px}
.stats .num{font-size:22px}
.review{display:grid;gap:10px}
.review>div{display:grid;gap:2px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.review>div:last-child{border-bottom:0;padding-bottom:0}
@media (max-width:420px){.cats{grid-template-columns:1fr}.cat{flex-direction:row;justify-content:space-between}}
.floors{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:2px;font-size:15px}
.floors li{display:grid;grid-template-columns:2.4em 1fr;gap:8px;padding:4px 0;border-bottom:1px dotted var(--line)}
.floors li:last-child{border-bottom:0}
.floors .num{color:var(--torch);text-align:right}
.floors li.end span:last-child{color:var(--blood)}
.past{width:100%;display:flex;flex-direction:column;gap:6px}
.past details{background:var(--stone);border:1px solid var(--line);border-radius:6px;padding:8px 12px}
.past summary{cursor:pointer;display:flex;gap:10px;flex-wrap:wrap;font-size:15px}
.past summary span:first-child{font-family:var(--mono);font-size:12px;color:var(--dim);align-self:center}
.past summary .muted{margin-left:auto}
.scene{display:block;width:100%;height:auto;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges;background:#1d1838;border:4px solid #05040a;box-shadow:0 6px 0 #0008}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

// ---------- Live questions from Open Trivia DB (CC BY-SA 4.0). Falls back to BANK when offline.
const API="https://opentdb.com/";
const LIVE={pool:{e:[],m:[],h:[]},token:null,on:false,busy:false,last:0,state:"loading"};
const MAP=[[/^Science|Mathematics|Gadgets|Computers/,"Science"],[/^History|^Politics/,"History"],[/^Geography/,"Geography"],[/Books|Comics|Manga/,"Literature"],[/^Animals/,"Beasts"],[/^Mythology/,"Mythology"],[/^Sports/,"Sports"],[/Film|Television|Cartoon/,"Film & TV"],[/Music|Musicals/,"Music"],[/Video Games|Board Games/,"Games"],[/^Art/,"Art"],[/.*/,"General"]];
const schoolOf=c=>MAP.find(([r])=>r.test(c))[1];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function liveFetch(d){
  const wait=LIVE.last+5200-Date.now();if(wait>0)await sleep(wait); // API allows 1 request per 5s
  LIVE.last=Date.now();
  const dn={e:"easy",m:"medium",h:"hard"}[d];
  const r=await fetch(`${API}api.php?amount=50&type=multiple&difficulty=${dn}&encode=url3986${LIVE.token?"&token="+LIVE.token:""}`);
  const j=await r.json();
  if(j.response_code===4&&LIVE.token){await fetch(`${API}api_token.php?command=reset&token=${LIVE.token}`);return}
  if(j.response_code!==0)return;
  const D=decodeURIComponent;
  j.results.forEach(x=>LIVE.pool[d].push([schoolOf(D(x.category)),d,D(x.question),D(x.correct_answer),...x.incorrect_answers.map(D)]));
  LIVE.on=true;if(LIVE.state!=="daily")LIVE.state="live";
}
// questions/index.json lists every saved day; the GitHub Action adds one file per day
async function loadDaily(){
  const r=await fetch("questions/index.json",{cache:"no-cache"});if(!r.ok)return;
  LIVE.days=((await r.json()).days||[]).map(d=>d.date);
  await pickDay();
}
// Load every saved set at once (about 1 MB when the archive is complete), so every game can draw from all of it.
async function pickDay(){
  if(!LIVE.days||!LIVE.days.length||LIVE.full)return;
  const files=await Promise.all(LIVE.days.map(name=>fetch(`questions/${name}.json`).then(r=>r.ok?r.json():null).catch(()=>null)));
  const pool={e:[],m:[],h:[]};let n=0;
  files.forEach(j=>(j&&j.questions||[]).forEach(x=>{if(pool[x[1]]){pool[x[1]].push([schoolOf(x[0]),...x.slice(1)]);n++}}));
  if(!n)return;
  LIVE.pool=pool;LIVE.on=true;LIVE.state="daily";LIVE.count=n;LIVE.full=true;
}
const rollDay=()=>{if(LIVE.days&&LIVE.days.length&&!LIVE.full)pickDay().catch(()=>{})};
async function liveInit(){
  try{await loadDaily()}catch(e){}
  try{
    const r=await fetch(API+"api_token.php?command=request");const j=await r.json();
    LIVE.token=j.token||null;LIVE.last=Date.now();
    if(!LIVE.on)for(const d of "emh")await liveFetch(d);
  }catch(e){}
  if(!LIVE.on)LIVE.state="offline";
  if(!S)render();
}
function statusLine(){
  if(LIVE.state==="daily")return `Full archive loaded · ${LIVE.count.toLocaleString("en-US")} questions`;
  return {loading:"Gathering questions…",live:"Open Trivia DB · 4,000+ questions",offline:"Offline · built-in question bank"}[LIVE.state];
}
function topUp(){
  if(!LIVE.on||LIVE.busy)return;
  const fresh=a=>a.filter(q=>!S||!S.used[q[2]]).length;
  const d=[..."emh"].find(k=>fresh(LIVE.pool[k])<15);if(!d)return;
  LIVE.busy=true;liveFetch(d).catch(()=>{}).finally(()=>LIVE.busy=false);
}
// The built-in bank is only a fallback: once a real archive is loaded, its tiny extra categories would repeat fast.
const liveQs=()=>LIVE.pool.e.concat(LIVE.pool.m,LIVE.pool.h);
const allQs=()=>{const l=liveQs();return l.length>=300?l:l.concat(BANK)};
function available(){
  const s=new Set();for(const q of allQs())if(!S.used[q[2]])s.add(q[0]);
  if(s.size<3){S.used={};return available()}
  return [...s];
}

// ---------- Content
// Monsters come in tiers; deeper floors bring new ones. [name, glyph, what it does when you answer wrong]
const TIERS=[
 [["Cave Rat","r","nips at your ankles"],["Goblin Sneak","g","jabs you with a rusty fork"],["Skeleton","s","rattles a bony fist into your ribs"],["Bog Slime","j","swallows one of your boots"],["Kobold Archer","k","looses an arrow"]],
 [["Cultist","c","chants a hex at you"],["Ghoul","Z","rakes you with its claws"],["Gargoyle","G","drops on you from the ceiling"],["Mimic","m","was a chest. It bites"],["Lantern Wisp","w","leads you face-first into a wall"]],
 [["Wraith","W","drains a little of your warmth"],["Minotaur","M","charges straight through you"],["Basilisk","B","holds your gaze one second too long"],["Banshee","b","wails the right answer, too late"],["Cursed Armor","A","clanks down on you, empty and angry"]],
 [["Bone Scholar","S","corrects you, painfully"],["Gorgon","N","turns your foot to stone for a moment"],["Ink Golem","I","smothers you in footnotes"],["Chimera","C","bites with all three heads"],["Shade","h","steps out of your own shadow"],["Candle Imp","i","singes your eyebrows"]]
];
const FINAL=13;
const tierFor=f=>f<=4?0:f<=8?1:f<=12?2:3;
const BOSSES={5:["The Librarian Lich","L","hurls a very heavy tome"],10:["Wyrm of a Thousand Riddles","D","breathes riddle-fire"],13:["The Necroracle","Ø","foretold that wrong answer, and punishes it"]};
const DEEP_BOSSES=[["The Bone Archivist","B","files you under Wrong"],["Hollow Oracle","O","foresaw that. It still hurts"],["Sphinx of Ash","X","pounces. Wrong answers are its favorite meal"],["Keeper of Lost Names","K","forgets your name, and some of your HP"]];
// Bosses on floors 5, 10 and 13, then every 5 floors past 13
const isBoss=f=>f===5||f===10||f===FINAL||(f>FINAL&&(f-FINAL)%5===0);
const bossFor=f=>BOSSES[f]||DEEP_BOSSES[((f-FINAL)/5-1)%DEEP_BOSSES.length];
const RELICS=[
 {id:"quill",n:"Sharp Quill",d:"+3 damage on every hit"},
 {id:"tome",n:"Thick Tome",d:"+10 max HP and heal 10"},
 {id:"coin",n:"Lucky Coin",d:"Your first wrong answer each fight deals no damage"},
 {id:"owl",n:"Owl Feather",d:"+6 seconds on every question"},
 {id:"ink",n:"Vampiric Ink",d:"Heal 2 HP on each correct answer"},
 {id:"ember",n:"Ember Gem",d:"Critical window grows from 6 to 10 seconds"},
 {id:"lens",n:"Scholar's Lens",d:"Weakness hits deal ×2.5 instead of ×2"},
 {id:"plate",n:"Iron Plate",d:"Take 2 less damage from every hit"}
];
const ITEMS=[
 {id:"potion",n:"Healing Draught",d:"Heal 12 HP",bt:false},
 {id:"halve",n:"Scroll of Halving",d:"Remove two wrong answers",bt:true},
 {id:"glass",n:"Hourglass",d:"Add 15 seconds to the current question",bt:true},
 {id:"ward",n:"Ward Rune",d:"Block the next hit completely",bt:false}
];
const BASE_TIME=20, MAX_ITEMS=4;

// ---------- State
let S, timerId=null;
const $=s=>document.querySelector(s);
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const has=id=>S.relics.includes(id);
function loadBest(){try{return +localStorage.getItem("rc-best")||0}catch(e){return 0}}
function saveBest(v){try{localStorage.setItem("rc-best",v)}catch(e){}}

function newRun(){
  rollDay();
  S={screen:"map",floor:1,hp:30,maxHp:30,power:6,relics:[],items:["potion"],used:{},ward:false,
     correct:0,asked:0,streak:0,bestStreak:0,missed:[],endless:false,floorLog:[],floorEvent:"",runId:Date.now(),log:["You descend into the crypt. Torchlight flickers on the stairs."],best:loadBest()};
  S.doors=makeDoors();render();
}
function makeDoors(){
  if(isBoss(S.floor)) return [{t:"boss"}];
  const pool=["fight","fight","fight","elite","rest","treasure"];
  if(S.floor===1) return [{t:"fight"},{t:"fight"}];
  const d=new Set();while(d.size<3)d.add(pick(pool));return [...d].map(t=>({t}));
}

// ---------- Questions
function diffFor(){
  const f=S.floor, e=S.enemy;
  let i=f<=4?0:f<=9?1:2;
  if(e&&(e.elite||e.boss))i=Math.min(2,i+1);
  if(Math.random()<.25)i=Math.max(0,i-1);
  return "emh"[i];
}
// Questions you've already seen are remembered across runs (in this browser), so a new run
// after dying deals new ones. Once a category runs dry, its seen questions are allowed again.
const SEEN_KEY="conungeon-seen";
let SEEN=(()=>{try{return new Set(JSON.parse(localStorage.getItem(SEEN_KEY)||"[]"))}catch(e){return new Set()}})();
function markSeen(t){SEEN.add(t);try{localStorage.setItem(SEEN_KEY,JSON.stringify([...SEEN].slice(-8000)))}catch(e){}}
function getQuestion(cat){
  const d=diffFor();
  const all=allQs(), live=liveQs();
  const unseen=q=>!S.used[q[2]]&&!SEEN.has(q[2]), fresh=q=>!S.used[q[2]];
  let pool=live.filter(q=>q[0]===cat&&q[1]===d&&unseen(q));
  if(!pool.length)pool=all.filter(q=>q[0]===cat&&q[1]===d&&unseen(q));
  if(!pool.length)pool=all.filter(q=>q[0]===cat&&unseen(q));
  if(!pool.length){all.filter(q=>q[0]===cat).forEach(q=>SEEN.delete(q[2]));pool=all.filter(q=>q[0]===cat&&q[1]===d&&fresh(q));}
  if(!pool.length)pool=all.filter(q=>q[0]===cat&&fresh(q));
  if(!pool.length){all.filter(q=>q[0]===cat).forEach(q=>delete S.used[q[2]]);pool=all.filter(q=>q[0]===cat);}
  const q=pick(pool);S.used[q[2]]=1;markSeen(q[2]);
  return {cat,d:q[1],text:q[2],right:q[3],opts:shuffle(q.slice(3)),removed:[]};
}

// ---------- Rooms
function enterDoor(i){
  const t=S.doors[i].t;
  if(t==="rest"){S.floorEvent="Rested at a campfire";const h=Math.ceil(S.maxHp*.4);S.hp=Math.min(S.maxHp,S.hp+h);S.log.unshift(`You rest by a cold hearth and recover ${h} HP.`);S.screen="rest";render();return}
  if(t==="treasure"){S.floorEvent="Opened a reliquary";S.rewardOpts=offerRewards(2,true);S.screen="reward";S.rewardTitle="A dusty reliquary";S.rewardNote="Choose one relic to keep.";render();return}
  startFight(t);
}
function startFight(t){
  const f=S.floor, boss=t==="boss", elite=t==="elite";
  const tier=tierFor(f), mix=tier===3&&Math.random()<.4?TIERS[2]:TIERS[tier];
  const [n,g,hit]=boss?bossFor(f):pick(mix);
  let hp=10+f*5, atk=2+Math.ceil(f*.9);
  if(elite){hp=Math.round(hp*1.5);atk+=2}
  if(boss){hp=f===5?60:f===10?120:60+f*8;atk+=3}
  const cats=shuffle(available());
  S.enemy={n:(elite?"Elite ":"")+n,g,hit,hp,max:hp,atk,elite,boss,weak:cats[0],resist:cats[1],coinUsed:false};
  S.screen="battle";S.phase="choose";S.offer=shuffle(available()).slice(0,3);
  if(!S.offer.includes(S.enemy.weak)&&Math.random()<.5)S.offer[0]=S.enemy.weak;
  S.offer=shuffle(S.offer);
  S.log.unshift(`${S.enemy.n} ${S.enemy.boss?"rises to guard the floor":"blocks the way"}.`);render();
}
function chooseCat(c){topUp();S.q=getQuestion(c);S.phase="ask";S.tMax=BASE_TIME+(has("owl")?6:0);S.tLeft=S.tMax;render();startTimer()}
function startTimer(){
  stopTimer();const t0=performance.now(),start=S.tLeft;
  timerId=setInterval(()=>{
    S.tLeft=Math.max(0,start-(performance.now()-t0)/1000);
    const bar=$("#tbar"),num=$("#tnum");
    if(bar)bar.style.width=(S.tLeft/S.tMax*100)+"%";
    if(num)num.textContent=Math.ceil(S.tLeft)+"s";
    if(S.tLeft<=0){stopTimer();answer(null)}
  },100);
}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}

function answer(opt){
  if(S.phase!=="ask")return;
  stopTimer();S.phase="result";S.asked++;S.picked=opt;
  const e=S.enemy, ok=opt===S.q.right, elapsed=S.tMax-S.tLeft;
  if(ok){
    S.correct++;S.streak++;S.bestStreak=Math.max(S.bestStreak,S.streak);
    let dmg=S.power+(has("quill")?3:0), notes=[];
    if(S.q.cat===e.weak){dmg*=has("lens")?2.5:2;notes.push("weakness")}
    else if(S.q.cat===e.resist){dmg*=.5;notes.push("resisted")}
    if(elapsed<=(has("ember")?10:6)){dmg*=1.5;notes.push("critical")}
    if(S.streak>=3){dmg+=3;notes.push(`streak ${S.streak}`)}
    dmg=Math.round(dmg);e.hp=Math.max(0,e.hp-dmg);
    if(has("ink"))S.hp=Math.min(S.maxHp,S.hp+2);
    S.log.unshift(`<span class="good">Correct.</span> You strike for ${dmg}${notes.length?" ("+notes.join(", ")+")":""}.`);
    S.hitFoe=true;
  }else{
    S.streak=0;S.missed.push({q:S.q.text,a:S.q.right});
    const why=opt===null?"Time runs out.":"Wrong.";
    if(S.ward){S.ward=false;S.log.unshift(`<span class="bad">${why}</span> Your Ward Rune absorbs the blow. The answer was ${esc(S.q.right)}.`)}
    else if(has("coin")&&!e.coinUsed){e.coinUsed=true;S.log.unshift(`<span class="bad">${why}</span> The Lucky Coin spins and the blow misses. The answer was ${esc(S.q.right)}.`)}
    else{const dmg=Math.max(1,e.atk-(has("plate")?2:0));S.hp=Math.max(0,S.hp-dmg);S.killer=e.n;S.log.unshift(`<span class="bad">${why}</span> ${esc(e.n)} ${esc(e.hit)}. −${dmg} HP. The answer was ${esc(S.q.right)}.`);S.hitMe=true}
  }
  render();
}
function nextTurn(){
  const e=S.enemy;
  if(S.hp<=0){endRun(false);return}
  if(e.hp<=0){
    S.log.unshift(`${esc(e.n)} falls. You grow wiser: +1 power.`);S.power++;
    S.floorEvent=`Defeated ${e.n.replace(/^Elite /,"")}${e.boss?" (boss)":e.elite?" (elite)":""}`;
    if(e.boss&&S.floor===FINAL&&!S.endless){endRun(true);return}
    S.rewardOpts=offerRewards(3,false);S.rewardTitle="Spoils";S.rewardNote="Take one.";S.screen="reward";render();return;
  }
  S.phase="choose";
  let o=shuffle(available()).slice(0,3);
  if(!o.includes(e.weak)&&Math.random()<.4)o[0]=e.weak;
  S.offer=shuffle(o);render();
}
function offerRewards(n,relicOnly){
  const relics=shuffle(RELICS.filter(r=>!has(r.id))).map(r=>({...r,kind:"relic"}));
  const items=shuffle(ITEMS).map(i=>({...i,kind:"item"}));
  if(relicOnly)return relics.length?relics.slice(0,n):items.slice(0,n);
  const out=[];if(relics.length&&Math.random()<.6)out.push(relics[0]);
  return out.concat(items).slice(0,n);
}
function takeReward(i){
  const r=S.rewardOpts[i];
  if(r.kind==="relic"){S.relics.push(r.id);if(r.id==="tome"){S.maxHp+=10;S.hp+=10}S.log.unshift(`You claim the ${r.n}.`)}
  else{if(S.items.length<MAX_ITEMS){S.items.push(r.id);S.log.unshift(`You pocket a ${r.n}.`)}else S.log.unshift(`Your pack is full. You leave the ${r.n}.`)}
  S.floorEvent+=` · took ${r.n}`;
  advance();
}
// ---------- Run log: one line per floor cleared, plus saved history of past runs
function advance(){S.floorLog.push({f:S.floor,t:S.floorEvent||"Passed through"});S.floorEvent="";S.floor++;S.doors=makeDoors();S.screen="map";render()}
function useItem(i){
  const id=S.items[i];
  if(id==="potion"){if(S.hp>=S.maxHp)return;S.hp=Math.min(S.maxHp,S.hp+12);S.log.unshift("You drink a Healing Draught. +12 HP.")}
  else if(id==="ward"){if(S.ward)return;S.ward=true;S.log.unshift("A Ward Rune glows around you.")}
  else if(id==="halve"){if(S.screen!=="battle"||S.phase!=="ask")return;S.q.removed=S.q.opts.filter(o=>o!==S.q.right).slice(0,2);S.log.unshift("The scroll burns away two lies.")}
  else if(id==="glass"){if(S.screen!=="battle"||S.phase!=="ask")return;S.tMax+=15;S.tLeft+=15;startTimer();S.log.unshift("Sand flows backward. +15 seconds.")}
  S.items.splice(i,1);render();if(S.phase==="ask"&&S.screen==="battle")startTimer();
}
const RUNS_KEY="conungeon-runs";
function loadRuns(){try{return JSON.parse(localStorage.getItem(RUNS_KEY)||"[]")}catch(e){return []}}
function recordRun(win){
  const acc=S.asked?Math.round(S.correct/S.asked*100):0;
  const last={f:S.floor,t:win?"Silenced the Necroracle":`Fell to ${S.killer||"the dark"}`,end:true};
  const run={id:S.runId,date:new Date().toISOString().slice(0,10),floor:S.floor,won:win||S.endless,cleared:S.floorLog.length,acc,streak:S.bestStreak,log:[...S.floorLog,last]};
  const runs=loadRuns().filter(r=>r.id!==run.id);runs.unshift(run);
  try{localStorage.setItem(RUNS_KEY,JSON.stringify(runs.slice(0,25)))}catch(e){}
}
function floorList(log){return `<ol class="floors">${log.map(x=>`<li class="${x.end?"end":""}"><span class="num">${x.f}</span><span>${esc(x.t)}</span></li>`).join("")}</ol>`}
function endRun(win){
  stopTimer();S.screen=win?"win":"dead";recordRun(win);
  const reached=S.floor;if(reached>S.best){S.best=reached;saveBest(reached)}render();
}

// ---------- Render
const ROOM={fight:["x","Monster","A foe for your wits"],elite:["X","Elite","Harder questions, better spoils"],rest:["~","Campfire","Heal 40% of max HP"],treasure:["$","Reliquary","Claim a relic"],boss:["&","Boss","Guardian of the floor"]};
function hud(){
  const items=S.items.map((id,i)=>{const it=ITEMS.find(x=>x.id===id);return `<button class="chip item" data-a="item" data-i="${i}" title="${esc(it.d)}">${esc(it.n)}</button>`}).join("");
  const relics=S.relics.map(id=>{const r=RELICS.find(x=>x.id===id);return `<span class="chip relic" title="${esc(r.d)}">${esc(r.n)}</span>`}).join("");
  return `<div class="hud${S.hitMe?" shake":""}">
    <div><div class="hpline"><span class="label">Health${S.ward?" · warded":""}</span><span class="num">${S.hp} / ${S.maxHp}</span></div>
      <div class="bar"><i style="width:${S.hp/S.maxHp*100}%"></i></div>
      <div class="label" style="margin-top:6px">Power ${S.power} · Streak ${S.streak}</div></div>
    <div class="floor"><div class="label">Floor</div><b>${S.floor}</b>${S.endless?"":`<span class="muted num"> /${FINAL}</span>`}</div>
    ${items||relics?`<div class="kit">${items}${relics}</div>`:`<div class="kit"><span class="muted" style="font-size:14px">No items or relics yet</span></div>`}
  </div>`;
}
function logView(){return `<div class="log" aria-live="polite">${S.log.slice(0,5).map(l=>`<p>${l}</p>`).join("")}</div>`}

function render(){
  const app=$("#app");
  if(!S){app.innerHTML=titleView();frame(performance.now());return}
  let body="";
  if(S.screen==="map"){
    body=`<section class="room"><div><p class="label">Floor ${S.floor}</p><h2>${isBoss(S.floor)?"A great door stands alone":"Choose a passage"}</h2></div>
      <div class="doors">${S.doors.map((d,i)=>{const [g,n,s]=ROOM[d.t];return `<button class="door ${d.t}" data-a="door" data-i="${i}"><span class="glyph">${g}</span><strong>${n}</strong><small>${s}</small></button>`}).join("")}</div></section>`;
  }else if(S.screen==="rest"){
    body=`<section class="room"><p class="label">Campfire</p><h2>You catch your breath</h2><p class="muted">Health restored. The stairs lead down.</p><div><button class="btn" data-a="advance">Descend to floor ${S.floor+1}</button></div></section>`;
  }else if(S.screen==="reward"){
    body=`<section class="room"><p class="label">${esc(S.rewardNote)}</p><h2>${esc(S.rewardTitle)}</h2>
      <div class="rewards">${S.rewardOpts.map((r,i)=>`<button class="reward ${r.kind==="item"?"it":""}" data-a="reward" data-i="${i}"><span class="label">${r.kind==="relic"?"Relic · passive":"Item · single use"}</span><strong>${esc(r.n)}</strong><span class="muted">${esc(r.d)}</span></button>`).join("")}</div>
      <div><button class="btn ghost" data-a="advance">Take nothing</button></div></section>`;
  }else if(S.screen==="battle"){
    const e=S.enemy;
    let mid="";
    if(S.phase==="choose"){
      mid=`<p class="label">Choose your attack school</p><div class="cats">${S.offer.map(c=>{const w=c===e.weak,r=c===e.resist;return `<button class="cat ${w?"w":r?"r":""}" data-a="cat" data-c="${c}"><strong>${c}</strong><span class="m">${w?(has("lens")?"×2.5":"×2")+" weak":r?"×0.5 resist":"×1"}</span></button>`}).join("")}</div>`;
    }else{
      const q=S.q, done=S.phase==="result";
      mid=`<div class="meta"><span class="label">${q.cat} · ${{e:"easy",m:"medium",h:"hard"}[q.d]}</span><span class="label num" id="tnum">${done?"":Math.ceil(S.tLeft)+"s"}</span></div>
        ${done?"":`<div class="timer"><i id="tbar" style="width:${S.tLeft/S.tMax*100}%"></i></div>`}
        <p class="q">${esc(q.text)}</p>
        <div class="answers">${q.opts.map((o,i)=>{let c="";if(q.removed.includes(o))c="gone";if(done){if(o===q.right)c="right";else if(o===S.picked)c="wrong"}
          return `<button class="ans ${c}" data-a="ans" data-i="${i}" ${done||q.removed.includes(o)?"disabled":""}><span class="k">${i+1}</span><span>${esc(o)}</span></button>`}).join("")}</div>
        ${done?`<div><button class="btn" data-a="next" id="nextbtn">${S.hp<=0?"Fall":e.hp<=0?"Claim victory":"Continue"}</button></div>`:""}`;
    }
    body=`<section class="room">
      <div class="foe${S.hitFoe?" shake":""}"><div class="sigil ${e.boss?"boss":""}" aria-hidden="true">${e.g}</div>
        <div class="foe-body"><div class="foe-name">${esc(e.n)}</div>
          <div class="hpline" style="margin:0"><span class="label">Hits for ${Math.max(1,e.atk-(has("plate")?2:0))}</span><span class="num">${e.hp} / ${e.max}</span></div>
          <div class="bar"><i style="width:${e.hp/e.max*100}%"></i></div>
          <div class="traits"><span class="weak">Weak to ${e.weak}</span><span class="resist">· Resists ${e.resist}</span></div></div></div>
      ${mid}</section>`;
  }else{
    const win=S.screen==="win", acc=S.asked?Math.round(S.correct/S.asked*100):0;
    body=`<section class="room title"><p class="label">${win?"The crypt is silent":"Your torch goes out"}</p><h2>${win?"The Necroracle is silenced":`Fallen on floor ${S.floor}`}</h2>
      <p class="muted">${win?"The dead oracle has no more questions. Below its throne, the crypt keeps going: endless floors, stranger monsters, a boss every five.":`Slain by ${esc(S.killer||"the dark")}. The crypt keeps your bones and your unanswered questions.`}</p>
      <div class="stats" style="width:100%"><div><span class="label">Accuracy</span><span class="num">${acc}%</span></div><div><span class="label">Best streak</span><span class="num">${S.bestStreak}</span></div><div><span class="label">Deepest</span><span class="num">${S.best}</span></div></div>
      <div style="width:100%"><p class="label">This descent · ${S.floorLog.length} floor${S.floorLog.length===1?"":"s"} cleared</p>${floorList([...S.floorLog,{f:S.floor,t:win?"Silenced the Necroracle":`Fell to ${S.killer||"the dark"}`,end:true}])}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">${win?`<button class="btn" data-a="endless">Keep descending</button><button class="btn ghost" data-a="start">Start over</button>`:`<button class="btn" data-a="start">Descend again</button>`}</div></section>
      ${S.missed.length?`<section class="room"><div><p class="label">Study these</p><h2>What you missed</h2></div><div class="review">${S.missed.slice(-15).reverse().map(m=>`<div><p>${esc(m.q)}</p><p class="good">${esc(m.a)}</p></div>`).join("")}</div></section>`:""}`;
  }
  app.innerHTML=`<header><p class="label">Conungeon</p></header>`+hud()+body+logView();
  S.hitFoe=S.hitMe=false;
  const nb=$("#nextbtn");if(nb)nb.focus();
}
// ---------- Pixel scene on the title screen, drawn at 192×108 and scaled up crisp
let g=null;
const W=192,H=108,GROUND=92;
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
const px=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x|0,y|0,w|0,h|0)};
let seed=7;const rand=()=>(seed=(seed*16807)%2147483647)/2147483647;
const stars=Array.from({length:46},()=>({x:rand()*W|0,y:rand()*58|0,p:rand()*6.28}));
const GHOST=["..xxxxx..",".xxxxxxx.","xxoxxxoxx","xxoxxxoxx","xxxxxxxxx","xxxx.xxxx","xxxxxxxxx","xx.xxx.xx","x...x...x"];
const ghosts=[{x:40,y:46,v:.12,ph:0},{x:110,y:36,v:.08,ph:2},{x:-20,y:56,v:.16,ph:4}];
function sprite(rows,x,y,c,alpha){
  g.globalAlpha=alpha;
  rows.forEach((r,j)=>[...r].forEach((ch,i)=>{if(ch==="x")px(x+i,y+j,1,1,c);else if(ch==="o")px(x+i,y+j,1,1,"#1d1838")}));
  g.globalAlpha=1;
}
function sky(){
  const bands=["#0d0b1a","#120f22","#17132b","#1d1838","#251d44","#30234f","#3d2a56"];
  bands.forEach((c,i)=>px(0,i*11,W,12,c));
  // dither between bands
  for(let i=1;i<bands.length;i++)for(let x=(i%2);x<W;x+=2)px(x,i*11,1,1,bands[i-1]);
}
function moon(){
  const cx=150,cy=20,r=9;
  for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++)if(x*x+y*y<=r*r)px(cx+x,cy+y,1,1,"#efe6c8");
  [[-3,-2,2],[2,3,3],[4,-4,1]].forEach(([x,y,s])=>px(cx+x,cy+y,s,s,"#cfc4a2"));
}
function hills(){
  for(let x=0;x<W;x++){const h=70+Math.round(Math.sin(x/17)*4+Math.sin(x/7)*2);px(x,h,1,GROUND-h,"#211a35")}
}
function town(t){
  const D="#0e0b18";
  // saloon with false front and swinging sign
  px(4,62,40,30,D);px(8,56,32,6,D);px(14,52,20,4,D);
  px(10,72,6,8,"#1d1730");px(30,72,6,8,"#1d1730"); // dark windows
  const lit=Math.sin(t/700)>-.3; if(lit)px(31,73,4,6,"#f2b33d"); // one window still lit
  px(20,80,8,12,"#05040a"); // door
  px(16,64,16,5,"#3c2516");px(17,65,14,3,"#5a3a24"); // sign plank
  // shack, crooked
  px(48,74,18,18,D);for(let i=0;i<10;i++)px(48+i,74-i*.5,18-i*2,1,D);px(54,80,5,7,"#1d1730");
  // water tower
  px(72,52,16,12,D);px(70,50,20,3,D);px(73,64,2,28,D);px(85,64,2,28,D);px(75,74,10,1,D);
  // fence
  for(let x=92;x<124;x+=5)px(x,84,2,8,D);px(92,86,32,1,D);
}
function gate(t){
  const S="#3f3a4d",L="#2a2636",H="#575069";
  px(132,54,52,38,S);
  for(let y=54;y<GROUND;y+=5){const off=((y-54)/5)%2?0:4;for(let x=132+off;x<184;x+=8)px(x,y,1,5,L);px(132,y,52,1,L)}
  px(132,54,52,1,H);
  // arched doorway
  const cx=158;for(let y=62;y<GROUND;y++){const dy=Math.max(0,70-y),w=Math.round(Math.sqrt(Math.max(0,81-dy*dy)));px(cx-w,y,w*2,1,"#05040a")}
  // keystone and battlements
  px(155,59,6,3,H);for(let x=132;x<184;x+=8)px(x,50,5,4,S);
  // torches
  [[138,68],[176,68]].forEach(([x,y],k)=>{
    px(x,y,2,7,"#3c2516");
    const f=still?1:(Math.sin(t/90+k*2)+Math.sin(t/37+k))*.5;
    px(x-1,y-4,4,4,"#ff6a2b");px(x,y-5-(f>0?1:0),2,3,"#ffb03b");px(x,y-3,2,1,"#fff2b0");
    g.globalAlpha=.10+.04*f;for(let r=8;r>2;r-=2)px(x-r+1,y-r-2,r*2,r*2,"#ffb03b");g.globalAlpha=1;
  });
}
function ground(t){
  px(0,GROUND,W,H-GROUND,"#1a1526");for(let x=0;x<W;x+=2)px(x+(x%4?1:0),GROUND,1,1,"#2a2238");
  for(let x=3;x<W;x+=11)px(x,GROUND+4+(x%3),2,1,"#2a2238");
  // tumbleweed
  if(!still){const p=(t/40)%(W*3);if(p<W+10){const x=p-6,b=Math.abs(Math.sin(p/6))*3;px(x,GROUND-4-b,4,4,"#6b5a3a");px(x+1,GROUND-5-b,2,1,"#6b5a3a");px(x+1,GROUND-3-b,1,1,"#4a3d27")}}
}
function frame(t){
  const cv=document.getElementById("scene");if(!cv){g=null;return}g=cv.getContext("2d");
  sky();
  stars.forEach(s=>{const on=still||Math.sin(t/600+s.p)>-.4;if(on)px(s.x,s.y,1,1,Math.sin(t/900+s.p)>.6?"#ffffff":"#b9b0d6")});
  moon();hills();town(t);gate(t);ground(t);
  ghosts.forEach(o=>{
    const x=still?o.x:((o.x+t*o.v/16)%(W+30))-15, y=o.y+(still?0:Math.round(Math.sin(t/500+o.ph)*2));
    sprite(GHOST,x,y,"#cfe0ff",.78);
  });
}
let last=0;
function loop(t){if(t-last>80){frame(t);last=t}requestAnimationFrame(loop)}
if(!still)requestAnimationFrame(loop);

function pastRuns(){
  const runs=loadRuns().slice(0,5);if(!runs.length)return "";
  return `<div class="past"><p class="label">Past descents</p>${runs.map(r=>`<details><summary><span>${r.date}</span><span>${r.won?"Beat the Necroracle":`Fell on floor ${r.floor}`}${r.won&&r.floor>FINAL?`, then reached floor ${r.floor}`:""}</span><span class="muted">${r.acc}%</span></summary>${floorList(r.log)}</details>`).join("")}</div>`;
}
function titleView(){
  const best=loadBest();
  return `<section class="room title"><canvas class="scene" id="scene" width="192" height="108" role="img" aria-label="Pixel art: a ghost town at night with ghosts drifting past, and a stone dungeon gate lit by two torches"></canvas>
    <p class="label">A riddle roguelike</p><h1>Conungeon</h1>
    <p>Thirteen floors down, a dead oracle called the Necroracle waits with one last question. Answer trivia to fight your way to it, then deeper forever. Get one wrong, and the crypt strikes back.</p>
    <ul class="rules">
      <li><b>Pick an attack school</b> each turn. Hitting a foe's weakness doubles damage.</li>
      <li><b>Answer in 6 seconds</b> for a critical hit. Three correct in a row adds a streak bonus.</li>
      <li><b>Questions get harder</b> the deeper you go, and new monsters appear. The Librarian Lich waits on floor 5, the Wyrm on floor 10, and the Necroracle on unlucky floor 13.</li>
      <li><b>Collect relics and items</b> between fights. Keys 1–4 answer questions.</li>
    </ul>
    ${pastRuns()}
    <p class="label">${statusLine()}${best?` · Deepest floor ${best}`:""}</p>
    <p class="muted" style="font-size:14px">Questions from <a href="https://opentdb.com" style="color:inherit">Open Trivia DB</a> (CC BY-SA 4.0).</p>
    <button class="btn" data-a="start">Enter the Conungeon</button></section>`;
}

document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a,i=+b.dataset.i;
  if(a==="start")newRun();
  else if(a==="door")enterDoor(i);
  else if(a==="cat")chooseCat(b.dataset.c);
  else if(a==="ans")answer(S.q.opts[i]);
  else if(a==="next")nextTurn();
  else if(a==="reward")takeReward(i);
  else if(a==="advance")advance();
  else if(a==="endless"){S.endless=true;S.log.unshift("You step past the Necroracle's empty throne. The stairs keep going down.");S.rewardOpts=offerRewards(3,false);S.rewardTitle="The Necroracle's offerings";S.rewardNote="Take one.";S.screen="reward";render()}
  else if(a==="item")useItem(i);
});
document.addEventListener("keydown",ev=>{
  if(!S||S.screen!=="battle")return;
  const n=+ev.key;
  if(S.phase==="ask"&&n>=1&&n<=4){const o=S.q.opts[n-1];if(!S.q.removed.includes(o))answer(o)}
  else if(S.phase==="choose"&&n>=1&&n<=3)chooseCat(S.offer[n-1]);
});

render();
liveInit();
</script>
</body>
</html>
