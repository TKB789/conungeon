const HAZARD={
  boulder:{title:"A boulder blocks the way",text:"Loose rock has buried the way in. Moving it will cost you some strength either way. Answer correctly to shift it carefully. Answer wrong and it rolls back onto you.",ok:.05,bad:.25,killer:"a falling boulder",okLine:"You heave the boulder aside. Your arms ache.",badLine:"The boulder slips and pins you."},
  crevasse:{title:"The ground splits open",text:"A crevasse tears open in front of you. Answer correctly to leap across. Answer wrong and you fall in, climbing out battered.",ok:0,bad:.2,killer:"a crevasse",okLine:"You leap the crevasse and land clean.",badLine:"You fall into the crevasse and claw your way back out."}
};
const depths=()=>S.floor>GOAL;
function startHazard(i,kind){S.hzDoor=i;S.hz=kind;S.screen="hazard";S.q=getQuestion(pick(available()),"h");S.phase="ask";S.tMax=BASE_TIME+6*cnt("owl");S.tLeft=S.tMax;render();startTimer()}
function hazardAnswer(opt){
  if(S.phase!=="ask")return;stopTimer();S.phase="result";S.picked=opt;S.asked++;
  if(S.q.tip)S.log.unshift(tipLine(S.q));
  const H=HAZARD[S.hz],ok=opt===S.q.right;if(ok)S.correct++;else S.missed.push({q:S.q.text,a:S.q.right});
  const dmg=Math.ceil(S.maxHp*(ok?H.ok:H.bad));S.hp=Math.max(0,S.hp-dmg);if(!ok)S.killer=H.killer;faintGuard();
  S.hzNote=(S.hz==="boulder"?"Moved a boulder":ok?"Leapt a crevasse":"Fell into a crevasse")+(dmg?` (−${dmg} HP)`:"");
  S.log.unshift(`${ok?`<span class="good">Correct.</span> ${H.okLine}`:`<span class="bad">${opt===null?"Time's up.":"Wrong."}</span> ${H.badLine}`}${dmg?` −${dmg} HP.`:""}`);render();
}
function hazardNext(){if(S.hp<=0){endRun(false);return}S.hzDone=true;enterDoor(S.hzDoor)}
function enterDoor(i){
  const t=S.doors[i].t;
  if(depths()&&!S.hzDone){if(t==="rest"||t==="treasure"){startHazard(i,"boulder");return}if(Math.random()<.35){startHazard(i,"crevasse");return}}
  S.hzDone=false;
  if(t==="rest"){S.screen="rest";render();return}
  if(t==="treasure"){S.floorEvent="Opened a reliquary";S.rewardOpts=offerRewards(2,true);S.screen="reward";S.rewardTitle="A dusty reliquary";S.rewardNote="Choose one relic to keep.";render();return}
  startFight(t);
}
function startFight(t){
  const f=S.floor, boss=t==="boss", elite=t==="elite", optional=boss&&S.doors.some(d=>d.t==="boss"&&d.opt);
  const tier=tierFor(f), mix=tier===3&&Math.random()<.4?TIERS[2]:TIERS[tier];
  const [n,g,hit]=boss?bossFor(f):pick(mix);
  // Monsters keep getting tougher the deeper you go, so every run has a natural limit.
  let hp=10+f*6+Math.floor(f*f/4), atk=2+Math.ceil(f*1.1)+Math.floor(f*f/35);
  atk=Math.round(atk*ANGER*(1+Math.max(0,Math.min(f,GOAL)-10)/RAMP)); // visitors get angrier the deeper you go
  if(f>GOAL){const k=1+(f-GOAL)*.03;hp=Math.round(hp*k);atk=Math.round(atk*k)}
  if(elite){hp=Math.round(hp*1.5);atk+=2}
  if(boss){hp=Math.round(hp*(1.35+Math.min(.85,Math.max(0,(f-10)*.05))));atk+=3}
  const cats=shuffle(available());
  S.enemy={n:(elite?"Rowdy ":"")+n,g,hit,hp,max:hp,atk,elite,boss,weak:cats[0],resist:cats[1],coins:0,optional};
  S.screen="battle";S.phase="choose";S.offer=shuffle(available()).slice(0,3);
  if(!S.offer.includes(S.enemy.weak)&&Math.random()<.5)S.offer[0]=S.enemy.weak;
  S.offer=shuffle(S.offer);

  S.log.unshift(d.inside?(mid?`You're back at the table on floor ${S.floor}. The question is still waiting, and so is the clock.`:`You pick up where you left off on floor ${S.floor}.`):"You return to base camp. The scholars wave you back over.");
  render();if(mid)startTimer();window.scrollTo&&scrollTo({top:0})}
function endRun(win){
  stopTimer();S.screen=win?"win":"dead";recordRun(win);clearSave();
  const reached=S.floor;if(reached>S.best){S.best=reached;saveBest(reached)}render();
}

// ---------- Pixel tents at base camp (64×44)
function shade(hex,k){const n=parseInt(hex.slice(1),16),f=v=>Math.max(0,Math.min(255,Math.round(v*k)));return "#"+[(n>>16)&255,(n>>8)&255,n&255].map(f).map(v=>v.toString(16).padStart(2,"0")).join("")}
function drawTent(cv,t){

  const W=64,H=44,GY=35,cx=32,T=still?0:t;

  P(0,0,W,H,"#120e1c");for(let i=0;i<10;i++)P(r()*W,r()*14,1,1,"#4a4266");
  for(let x=0;x<W;x++){const h=3+Math.round(Math.sin(x/6+seed)*2+r()*1.5);P(x,0,1,h,"#2a2238")}
  P(0,GY,W,H-GY,"#1d1826");for(let x=0;x<W;x+=3)P(x+(r()*2|0),GY,1,1,"#2c2440");
  const glow=(gx,gy,rad,col,a)=>{c.fillStyle=col;for(let y=Math.floor(gy-rad);y<=gy+rad;y++)for(let x=Math.floor(gx-rad);x<=gx+rad;x++){const d=Math.hypot(x-gx,y-gy);if(d>rad)continue;
    if(d<rad*.5){c.globalAlpha=a;c.fillRect(x,y,1,1)}else if((x+y)%2===0){c.globalAlpha=a*.6;c.fillRect(x,y,1,1)}}c.globalAlpha=1};
  const shop=kind==="shop", base=shop?"#b8473a":(cv.dataset.color||"#3f7f6a");
  const top=7,half=21;
  // tent body: lit left slope, shaded right slope, stripes for the merchant
  for(let y=top;y<GY;y++){const w=Math.round((y-top)/(GY-top)*half);
    for(let x=cx-w;x<cx+w;x++){let col=x<cx?base:shade(base,.72);if(shop&&((x-cx+40)>>2)%2)col=x<cx?"#e8dcc0":"#b9ad92";P(x,y,1,1,col)}
    P(cx-w-1,y,1,1,shade(base,.5));P(cx+w,y,1,1,shade(base,.45))}
  // open flap with warm light inside
  for(let y=top+9;y<GY;y++){const w=Math.round((y-top-9)/(GY-top-9)*7);P(cx-w,y,w*2,1,"#2a1709")}
  const f=still?0:Math.sin(T/140+seed)+Math.sin(T/53);
  glow(cx,GY-6,8+(f>0?1:0),"#ffb03b",.18);
  P(cx-2,top-4,1,5,"#5a3a24");P(cx-1,top-4,4,2,shop?"#ffd25a":shade(base,1.35)); // pole and pennant
  if(!shop){
    P(cx-1,GY-12,2,1,"#5a3a24");P(cx-1,GY-11,2,3,"#ffd25a");P(cx-1,GY-10,1,1,"#fff2b0"); // lantern
    P(cx-4,GY-3,8,2,"#e8dcc0");P(cx,GY-3,1,2,"#a39a7e");P(cx-4,GY-1,8,1,"#5a3a24"); // open book on a crate
  }else{

    P(cx-14,GY-4,11,4,"#5a3a24");P(cx-14,GY-4,11,1,"#78502f");
    [["#e0473b",cx-13],["#4b7bff",cx-10],["#3fc77a",cx-7]].forEach(([col,x],k)=>{P(x,GY-8,2,4,col);P(x,GY-9,2,1,"#9d93b8");if(!still&&((T/300+k)%4)<1)P(x,GY-8,1,1,"#ffffff")});
    [["#6b3f8c",0],["#2f6f8c",1],["#8c6b2f",2]].forEach(([col,k])=>{P(cx+4,GY-2-k*2,9-k,2,col);P(cx+4,GY-2-k*2,1,2,"#e8dcc0")});

  // small campfire beside teacher tents
  if(!shop){const fx=cx+half+4;P(fx-2,GY-1,5,1,"#5a3a24");P(fx-1,GY-3-(f>0?1:0),3,2,"#ff6a2b");P(fx,GY-4-(f>.8?1:0),1,1,"#ffd25a");glow(fx,GY-3,4,"#ff9a3a",.15)}

// ---------- The Trivial Relic (32×32): a spinning Möbius ring of shifting prismatic light, like a portal
function drawRelic(cv,t){
  const c=cv.getContext("2d"),T=still?0:t,N=32;c.clearRect(0,0,N,N);
  const bob=still?0:Math.sin(T/700)*.8,spin=still?.5:Math.sin(T/3000)*.9,hue0=still?0:(T/25)%360,tilt=.55;
  // portal glow in the middle of the ring
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const d=Math.hypot(x-15.5,(y-15.5-bob)/.85);if(d<8&&(x+y)%2===0){c.globalAlpha=.22*(1-d/9);c.fillStyle=`hsl(${(hue0+180+d*20)%360},90%,65%)`;c.fillRect(x,y,1,1)}}c.globalAlpha=1;
  // the Möbius strip, sampled finely and z-buffered into 32×32 pixels
  const zb=new Float32Array(N*N).fill(-1e9),col=new Array(N*N),R=9.5,Wd=5;
  for(let i=0;i<420;i++){const u=i/420*Math.PI*2;
    for(let j=-6;j<=6;j++){const v=j/6*Wd,cu=Math.cos(u/2);
      let x=(R+v*cu)*Math.cos(u),y=(R+v*cu)*Math.sin(u),z=v*Math.sin(u/2);
      // tip the ring back a little, then turn it slowly about the vertical axis so the twist rolls into view
      const y1=y*Math.cos(tilt)-z*Math.sin(tilt),z1=y*Math.sin(tilt)+z*Math.cos(tilt);
      const xr=x*Math.cos(spin)+z1*Math.sin(spin),sz=-x*Math.sin(spin)+z1*Math.cos(spin),sy=y1;
      const px=Math.round(15.5+xr),py=Math.round(15.5+sy+bob);if(px<0||py<0||px>=N||py>=N)continue;
      const k=py*N+px;if(sz<=zb[k])continue;zb[k]=sz;
      const edge=Math.abs(j)===6,light=Math.max(0,Math.min(1,.55+sz/18));
      col[k]=edge?`hsl(${(hue0+u*57.3)%360},70%,${18+light*20}%)`:`hsl(${(hue0+u*57.3+j*6)%360},95%,${38+light*36}%)`}}
  for(let k=0;k<N*N;k++)if(col[k]){c.fillStyle=col[k];c.fillRect(k%N,(k/N)|0,1,1)}
  // sparkles drifting through the portal
  for(let k=0;k<4;k++){const a=(T/1100)+k*1.57,r=3+((T/400+k*1.3)%4);const x=Math.round(15.5+Math.cos(a)*r),y=Math.round(15.5+Math.sin(a)*r*.8+bob);c.fillStyle=k%2?"#ffffff":`hsl(${(hue0+k*90)%360},100%,80%)`;c.fillRect(x,y,1,1)}
}
function drawRelics(t){if(!document.querySelectorAll)return;document.querySelectorAll("canvas.relicart").forEach(cv=>drawRelic(cv,t))}

  for(let y=-br;y<=br;y++)for(let x=-br-2;x<=br+2;x++){if(x*x/(br+2)**2+y*y/br**2>1||by+y>=37)continue;P(bx+x,by+y,1,1,y<-3?"#6b6386":x>4?"#3a3150":"#4e4466")}
  P(bx-5,by-6,3,2,"#8a82a6");P(18,35,4,2,"#4e4466");P(46,34,3,3,"#3a3150");

const STORY_P=["One morning, strange portals tore open in the ground all over the world. Each one led down a deep, dark staircase, with a low rumble and hungry eyes glaring up from below.", "It took months for the world to agree on a plan, a new world record for agreeing on anything. Finally, a brave soul from every country stepped inside.", "They found monsters of every shape and size, all with an endless, terrible thirst for… knowledge?", "It turns out the portals lead to an interdimensional trivia bar. Twisting passages wind from den to den, where visitors from across the multiverse gather for trivia night. This season, for the very first time, the theme is Earth. Can you guess the bar's name? That's right: <b>the Conungeon</b>, the Dungeon of Conundrums.", "Why do they look so menacing? No idea. They don't judge your face, so don't judge theirs.", "They <i>do</i> judge your answers, though. Life is busy across a dozen dimensions, and trivia night is the one night they get with their friends. So when an actual Earthling sits down and doesn't know things about their own planet, it kind of harshes the vibe. <i>\"Oh, come ON. Do you even live on the surface?!\"</i>", "Answer well and they'll share gifts from beyond. Anger them too much and they'll knock you out cold and send you back up to the surface. On floor 100, the bar's Quizmaster, the Super Computaur, hosts the final round.", "Now curious minds from all over the world gather at the portal's mouth, trading notes and working up their courage. How deep will you dare to go?"];
const RULES_HTML="<li><b>Prepare at base camp.</b> Scholars teach five questions at a time. Get all five right and they become your mentor: ×2 knowledge with their subject. Spend the gold you earn at the merchant.</li>\n        <li><b>No turning back.</b> Once you step through the portal, you stay until you're knocked out. Every floor saves automatically, even mid-question, so you can close the game and pick up right where you left off.</li>\n        <li><b>Fill each visitor's knowledge bar.</b> Pick a subject each turn. Right answers fill the bar, and subjects a visitor craves fill it twice as fast. Answer within 6 seconds for a critical answer. Three right in a row adds a streak bonus.</li>\n        <li><b>Wrong answers make visitors angry,</b> and angry visitors hit. Lose all your health and they knock you out and send you back to the surface.</li>\n        <li><b>Visitors share gifts.</b> Right answers sometimes earn an item, and after a rough patch, your next right answer always brings a potion. Fill a visitor's bar to choose a gift and gain max HP based on how thirsty for knowledge they were.</li>\n        <li><b>Bosses lurk at random.</b> When the walls start to tremble, one is close. Sometimes a boss's lair appears as a passage you can take early for a bonus relic. Beating a boss fully heals you.</li>\n        <li><b>Choose your passage wisely.</b> Every passage takes you one floor deeper. Healing stones restore health, but you skip that floor's visitor and gifts.</li>\n        <li><b>Relics and items.</b> Relics work automatically. Items go in an 4-slot pack, and copies stack up to 10 in a slot. When you're in danger, items that can help start to glow.</li>";

document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a,i=+b.dataset.i;
  if(a==="start")newRun();
  else if(a==="continue")resumeGame();
  else if(a==="table")askTable();
  else if(a==="logsize"){logBig=!logBig;render()}
  else if(a==="tsheet"){titleSheet=b.dataset.v||null;render()}
  else if(a==="list"){S.showList=!S.showList;render()}
  else if(a==="camps"){S.showCamps=!S.showCamps;render()}
  else if(a==="dropmode"){S.showList=false;S.managePack=true;render()}
  else if(a==="rels"){S.showRels=!S.showRels;render()}
  else if(a==="story"){storyOpen=!storyOpen;render()}
  else if(a==="newgame"){confirmNew=true;render()}
  else if(a==="newno"){confirmNew=false;render()}
  else if(a==="newok"){confirmNew=false;clearSave();newRun()}
  else if(a==="leaveok"){confirmNew=false;abandonDescent()}
  else if(a==="door")enterDoor(i);
  else if(a==="cat")chooseCat(b.dataset.c);
  else if(a==="ans")answer(S.q.opts[i]);
  else if(a==="next")nextTurn();
  else if(a==="reward")takeReward(i);
  else if(a==="advance")advance();
  else if(a==="rest"){{const h=Math.ceil(S.maxHp*.4);S.hp=Math.min(S.maxHp,S.hp+h);S.floorEvent="Rested at a healing stone";S.log.unshift(`The healing stone hums. You recover ${h} HP.`)}advance()}
  else if(a==="menu"){stopTimer();if(S)S.showCamps=false;S=null;render();window.scrollTo&&scrollTo({top:0})}
  else if(a==="item")useItem(i);
  else if(a==="hznext")hazardNext();
  else if(a==="manage"){S.managePack=!S.managePack;render()}
  else if(a==="drop")dropItem(i);
  else if(a==="tent")openTent(i);
  else if(a==="lnext")lessonNext();
  else if(a==="camp"){S.screen="camp";if(S.lesson){S.campView="scholars";S.scholar=S.lesson.tent}S.phase=null;render()}
  else if(a==="cview"){S.campView=b.dataset.v;S.confirmDescend=false;if(b.dataset.v==="scholars")S.scholar=null;render()}
  else if(a==="shp"){const n=Math.ceil(WARES.length/4);S.shopPage=((S.shopPage||0)+(+b.dataset.v)+n)%n;render()}
  else if(a==="pick"){S.scholar=S.scholar===i?null:i;render()}
  else if(a==="sch"){const n=S.camp.tents.length;S.scholar=((S.scholar||0)+(+b.dataset.v)+n)%n;render()}
  else if(a==="shop"){S.screen="camp";render()}
  else if(a==="buy")buy(b.dataset.id);
  else if(a==="askdescend"){S.confirmDescend=true;render()}
  else if(a==="notyet"){S.confirmDescend=false;render()}
  else if(a==="descend"){S.confirmDescend=false;descend()}
  else if(a==="onward"){S.screen="map";S.endless=true;S.rewardOpts=offerRewards(3,false);S.rewardTitle="The Computaur's spare parts";S.rewardNote="Take one, then keep descending.";S.screen="reward";saveGame();render()}
});
document.addEventListener("keydown",ev=>{
  if(S&&S.screen==="hazard"&&S.phase==="ask"){const n=+ev.key;if(n>=1&&n<=4)answer(S.q.opts[n-1]);return}
  if(S&&S.screen==="lesson"&&S.phase==="ask"){const n=+ev.key;if(n>=1&&n<=4)answer(S.q.opts[n-1]);return}
  if(!S||S.screen!=="battle")return;
  const n=+ev.key;
  if(S.phase==="ask"&&n>=1&&n<=4){const o=S.q.opts[n-1];if(!S.q.removed.includes(o))answer(o)}
  else if(S.phase==="choose"&&n>=1&&n<=3)chooseCat(S.offer[n-1]);
});
