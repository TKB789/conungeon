<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conungeon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@600;800&family=Alegreya+Sans:wght@400;500;700&family=Martian+Mono:wght@400;600&display=swap">
<style>
/* Layout: one narrow column like a dungeon ledger — HUD strip, then the current room, then the battle log. Single committed dark look (torchlit stone). */
:root{
  --stone:#191d1a; --slab:#232925; --slab-2:#2d342f; --line:#3d463f;
  --parch:#ebe1c8; --dim:#a39c88; --torch:#e3a548; --torch-ink:#2a1b06;
  --blood:#cf5444; --mana:#6cbcae; --gold:#d8c06a;
  --display:"Grenze Gotisch","Palatino Linotype",Georgia,serif;
  --body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --mono:"Martian Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{background:var(--stone);color:var(--parch)}
body{font-family:var(--body);font-size:17px;line-height:1.45;padding-inline:16px;padding-block:20px 48px;
  background-image:radial-gradient(ellipse at 50% -10%,rgba(227,165,72,.14),transparent 60%);background-attachment:fixed;min-height:100%}
*{box-sizing:border-box}
#app{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--display);font-weight:800;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1}
h1{font-size:clamp(52px,14vw,84px);color:var(--torch);text-shadow:0 0 28px rgba(227,165,72,.35)}
h2{font-size:34px}
p{margin:0}
.muted{color:var(--dim)}
.label{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--torch);outline-offset:2px}
.btn{background:var(--torch);color:var(--torch-ink);border:0;border-radius:6px;padding:12px 20px;font-weight:700;font-size:17px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--parch);border:1px solid var(--line)}

/* HUD */
.hud{display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:center;background:var(--slab);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.bar{height:10px;background:var(--slab-2);border-radius:5px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--blood);transition:width .35s}
.hpline{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;gap:8px}
.floor{text-align:right}
.floor b{font-family:var(--display);font-size:30px;color:var(--torch);font-weight:800}
.kit{grid-column:1/-1;display:flex;flex-direction:column;gap:6px}
.kithead{display:flex;justify-content:space-between;gap:8px}
.kithead .full{color:var(--blood)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.slot{min-height:50px;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px 4px 4px;font-size:12.5px;line-height:1.15;border:1px solid var(--mana);color:var(--mana);background:var(--stone);border-radius:6px;min-width:0;overflow-wrap:break-word;hyphens:auto}
button.slot:hover{background:var(--slab-2)}
.slot{position:relative}
.slot b{position:absolute;top:2px;right:4px;font-family:var(--mono);font-size:10px;font-weight:400;color:var(--parch);opacity:.85}
.slot.drop{border-color:var(--blood);color:var(--parch);flex-direction:column;gap:2px}
.slot .x{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--blood)}
.kitright{display:flex;gap:10px;align-items:center}
.linkbtn{background:none;border:0;padding:0;color:var(--torch);font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;cursor:pointer;text-decoration:underline}
.slots{position:relative;z-index:0}
.slot.help{border-color:#ffd25a;color:#ffe9a8;box-shadow:0 0 10px 2px rgba(255,210,90,.45);animation:halo 1.6s ease-in-out infinite}
.slot.help::after{content:"";position:absolute;inset:-10px;border-radius:14px;background:radial-gradient(closest-side,rgba(255,210,90,.35),rgba(255,210,90,0));filter:blur(5px);z-index:-1;pointer-events:none;animation:mist 2.4s ease-in-out infinite}
@keyframes halo{50%{box-shadow:0 0 18px 6px rgba(255,210,90,.6)}}
@keyframes mist{50%{transform:scale(1.15);opacity:.55}}
.danger{font-size:14px;color:#ffd0c8;background:rgba(207,84,68,.18);border:1px solid var(--blood);border-radius:6px;padding:6px 10px}
.slot.empty{border:1px dashed var(--line);color:var(--dim);font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em}
.relics{display:flex;flex-wrap:wrap;gap:6px}
.chip b{font-family:var(--mono);font-size:12px}
.chip.bless{border-color:#2f8fa8;color:#7fe0f0}
.reward:disabled{opacity:.45;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:14px;background:var(--stone)}
.chip.item{border-color:var(--mana);color:var(--mana)}
button.chip.item:hover{background:var(--slab-2)}
.chip.relic{border-color:#6a5a33;color:var(--gold)}

/* Rooms */
.room{background:var(--slab);border:1px solid var(--line);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:14px}
.doors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.doors .door.boss{grid-column:1/-1}
.campscene{display:block;width:100%;height:auto;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges;background:#120e1c;border:4px solid #05040a;box-shadow:0 6px 0 #0008}
.travelers{display:flex;flex-direction:column}
.trav{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.trav:last-child{border-bottom:0}
.trav .mono{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;font-family:var(--display);font-size:20px;color:#fff2d6;box-shadow:inset 0 -3px 0 #0005}
.trav strong{display:block;line-height:1.2}
.trav p{margin:2px 0 0;font-size:14px}
.trav .btn{padding:8px 12px;font-size:15px}
.blessed{color:#7fe0f0}
.row{display:flex;gap:8px;flex-wrap:wrap}
.doors .shopcard{grid-column:1/-1}
.doors .shopcard .tent{max-width:60%;margin-inline:auto}
.door:disabled{opacity:.55;cursor:default;transform:none}
.door:disabled .tent{filter:saturate(.5)}
.tent{display:block;width:100%;max-width:100%;height:auto;aspect-ratio:64/44;image-rendering:pixelated;image-rendering:crisp-edges;border:3px solid #05040a;margin-bottom:4px}
.tent.small{width:96px;flex:none;margin:0}
.door:hover:not(:disabled) .tent{border-color:var(--torch)}
.door strong{line-height:1.2}
.row-end{display:flex;justify-content:flex-end}
.teacher{display:flex;gap:14px;align-items:center}
.speech{position:relative;margin:0;background:var(--stone);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-style:italic;color:var(--parch)}
.dots{display:flex;gap:5px}.dots i{width:9px;height:9px;border-radius:2px;background:var(--line)}.dots i.on{background:var(--torch)}.dots i.now{outline:1px solid var(--torch);outline-offset:1px}
.lessonend{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.wares{display:flex;flex-direction:column}
.ware{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.ware:last-child{border-bottom:0}.ware div{min-width:0}.ware .btn{flex:none;padding:8px 12px;font-size:15px}
.btn:disabled{opacity:.45;cursor:default}
.door small{line-height:1.3}
.door{background:var(--stone);border:1px solid var(--line);border-radius:4px;padding:8px 8px 14px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;transition:border-color .15s,transform .15s}
.door:hover{border-color:var(--torch);transform:translateY(-2px)}
.cave{display:block;width:100%;max-width:100%;height:auto;aspect-ratio:64/44;image-rendering:pixelated;image-rendering:crisp-edges;border:3px solid #05040a;margin-bottom:4px}
.door:hover .cave{border-color:var(--torch)}
.door.elite .glyph{color:var(--blood)} .door.rest .glyph{color:var(--mana)} .door.treasure .glyph{color:var(--gold)}
.door strong{font-size:18px}
.door small{color:var(--dim);font-size:14px}

/* Battle */
.foe{display:flex;gap:16px;align-items:center}
.sigil{flex:none;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:40px;font-weight:600;color:var(--blood);background:radial-gradient(circle,#3a2320,var(--stone) 70%);border:1px solid #5a302a}
.sigil.boss{color:var(--torch);border-color:var(--torch)}
.foe-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.foe-name{font-family:var(--display);font-size:28px;font-weight:600;line-height:1}
.traits{display:flex;flex-wrap:wrap;gap:6px;font-size:13px}
.weak{color:var(--mana)} .resist{color:var(--dim)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cat{background:var(--stone);border:1px solid var(--line);border-radius:6px;padding:12px 8px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center}
.cat:hover{border-color:var(--torch)}
.cat .m{font-family:var(--mono);font-size:12px}
.cat.w{border-color:var(--mana)} .cat.w .m{color:var(--mana)}
.cat.r .m{color:var(--dim)}
.q{font-size:20px;font-weight:500;text-wrap:pretty}
.timer{height:4px;background:var(--slab-2);border-radius:2px;overflow:hidden}
.timer>i{display:block;height:100%;background:var(--torch)}
.answers{display:grid;gap:8px}
.ans{display:flex;gap:12px;align-items:center;text-align:left;background:var(--stone);border:1px solid var(--line);border-radius:6px;padding:12px 14px;font-size:17px}
.ans:hover:not(:disabled){border-color:var(--torch)}
.ans .k{font-family:var(--mono);font-size:12px;color:var(--dim);flex:none;width:18px}
.ans.right{border-color:var(--mana);background:rgba(108,188,174,.12)}
.ans.wrong{border-color:var(--blood);background:rgba(207,84,68,.12)}
.ans.gone{opacity:.25}
.ans:disabled{cursor:default}
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.log{display:flex;flex-direction:column;gap:4px;font-size:15px;color:var(--dim);padding-inline:4px}
.log p:first-child{color:var(--parch)}
.good{color:var(--mana)!important} .bad{color:var(--blood)!important}

/* Rewards */
.rewards{display:grid;gap:10px}
.reward{text-align:left;background:var(--stone);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:2px}
.reward:hover{border-color:var(--gold)}
.reward strong{color:var(--gold)} .reward.it strong{color:var(--mana)}
.title{align-items:flex-start;padding:28px 22px}
.rules{display:grid;gap:8px;margin:0;padding-left:20px;color:var(--dim)}
.rules b{color:var(--parch);font-weight:500}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--stone);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:2px}
.stats .num{font-size:22px}
.review{display:grid;gap:10px}
.review>div{display:grid;gap:2px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.review>div:last-child{border-bottom:0;padding-bottom:0}
@media (max-width:420px){.cats{grid-template-columns:1fr}.cat{flex-direction:row;justify-content:space-between}}
.saved{color:var(--mana)}
.savecard{width:100%;display:flex;flex-direction:column;gap:3px;padding:12px 14px;border:1px solid var(--mana);border-radius:8px;background:var(--stone)}
.savecard strong{font-size:18px}
.confirm{width:100%;display:flex;flex-direction:column;gap:8px;padding:12px 14px;border:1px solid var(--blood);border-radius:8px;background:var(--stone)}
.trophy{width:100%;display:flex;flex-direction:column;gap:4px;padding:14px;border:1px solid #6a5a33;border-radius:8px;background:radial-gradient(circle at 50% 0%,#3a2f12,var(--stone) 70%)}
.trophy strong{font-family:var(--display);font-size:24px;color:var(--gold);line-height:1.1}
.floors{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:2px;font-size:15px}
.floors li{display:grid;grid-template-columns:2.4em 1fr;gap:8px;padding:4px 0;border-bottom:1px dotted var(--line)}
.floors li:last-child{border-bottom:0}
.floors .num{color:var(--torch);text-align:right}
.floors li.end span:last-child{color:var(--blood)}
.floors li.good span:last-child{color:var(--gold)}
.past{width:100%;display:flex;flex-direction:column;gap:6px}
.past details{background:var(--stone);border:1px solid var(--line);border-radius:6px;padding:8px 12px}
.past summary{cursor:pointer;display:flex;gap:10px;flex-wrap:wrap;font-size:15px}
.past summary span:first-child{font-family:var(--mono);font-size:12px;color:var(--dim);align-self:center}
.past summary .muted{margin-left:auto}
.scene{display:block;width:100%;height:auto;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges;background:#0b0911;border:4px solid #05040a;box-shadow:0 6px 0 #0008}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const API="https://opentdb.com/";

const schoolOf=c=>MAP.find(([r])=>r.test(c))[1];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function liveFetch(d){
  const wait=LIVE.last+5200-Date.now();if(wait>0)await sleep(wait); // API allows 1 request per 5s
  LIVE.last=Date.now();
  const dn={e:"easy",m:"medium",h:"hard"}[d];
  const r=await fetch(`${API}api.php?amount=50&type=multiple&difficulty=${dn}&encode=url3986${LIVE.token?"&token="+LIVE.token:""}`);
  const j=await r.json();
  if(j.response_code===4&&LIVE.token){LIVE.exhausted=LIVE.exhausted||{};LIVE.exhausted[d]=1;return}
  if(j.response_code!==0)return;
  const D=decodeURIComponent;
  const have=new Set(LIVE.pool[d].map(q=>q[2]));
  j.results.forEach(x=>{const q=D(x.question);if(!have.has(q))LIVE.pool[d].push([schoolOf(D(x.category)),d,q,D(x.correct_answer),...x.incorrect_answers.map(D)])});
  LIVE.on=true;if(LIVE.state!=="daily")LIVE.state="live";
  try{localStorage.setItem("conungeon-live",JSON.stringify(LIVE.pool))}catch(e){}
}
// questions/index.json lists every saved day; the GitHub Action adds one file per day
async function loadDaily(){
  const r=await fetch("questions/index.json",{cache:"no-cache"});if(!r.ok)return;

}
// Load every saved set at once (about 1 MB when the archive is complete), so every game can draw from all of it.
async function pickDay(){
  if(!LIVE.days||!LIVE.days.length||LIVE.full)return;
  const files=await Promise.all(LIVE.days.map(name=>fetch(`questions/${name}.json`).then(r=>r.ok?r.json():null).catch(()=>null)));
  const pool={e:[],m:[],h:[]};let n=0;
  files.forEach(j=>(j&&j.questions||[]).forEach(x=>{if(pool[x[1]]){pool[x[1]].push([schoolOf(x[0]),...x.slice(1)]);n++}}));
  if(!n)return;
  LIVE.pool=pool;LIVE.on=true;LIVE.state="daily";LIVE.count=n;LIVE.full=true;
}
const rollDay=()=>{if(LIVE.days&&LIVE.days.length&&!LIVE.full)pickDay().catch(()=>{})};
async function liveInit(){
  try{await loadDaily()}catch(e){}

  // fetching new batches in the background, so the question pool grows each visit instead of starting over.
  if(!LIVE.on){
    try{const c=JSON.parse(localStorage.getItem("conungeon-live")||"null");if(c&&c.e&&c.e.length){LIVE.pool=c;LIVE.on=true;LIVE.state="live"}}catch(e){}
    try{
      LIVE.token=localStorage.getItem("conungeon-token");
      if(!LIVE.token){const r=await fetch(API+"api_token.php?command=request");const j=await r.json();LIVE.token=j.token||null;try{localStorage.setItem("conungeon-token",LIVE.token)}catch(e){}}
      LIVE.last=Date.now()-5200;

// Keep pulling new batches in the background (one request every ~6 seconds) until the API runs dry.

function diffFor(){
  const f=S.floor, e=S.enemy;
  let i=f<=4?0:f<=9?1:2;
  if(e&&(e.elite||e.boss))i=Math.min(2,i+1);
  if(Math.random()<.25)i=Math.max(0,i-1);
  return "emh"[i];

// Questions you've already seen are remembered across runs (in this browser), so a new run
// after dying deals new ones. Once a category runs dry, its seen questions are allowed again.
const SEEN_KEY="conungeon-seen";
let SEEN=(()=>{try{return new Set(JSON.parse(localStorage.getItem(SEEN_KEY)||"[]"))}catch(e){return new Set()}})();
function markSeen(t){SEEN.add(t);try{localStorage.setItem(SEEN_KEY,JSON.stringify([...SEEN].slice(-8000)))}catch(e){}}
function getQuestion(cat,dd){
  const d=dd||diffFor();
  const all=allQs(), live=liveQs();
  const unseen=q=>!S.used[q[2]]&&!SEEN.has(q[2]), fresh=q=>!S.used[q[2]];
  let pool=live.filter(q=>q[0]===cat&&q[1]===d&&unseen(q));
  if(!pool.length)pool=all.filter(q=>q[0]===cat&&q[1]===d&&unseen(q));
  if(!pool.length)pool=all.filter(q=>q[0]===cat&&unseen(q));
  if(!pool.length){all.filter(q=>q[0]===cat).forEach(q=>SEEN.delete(q[2]));pool=all.filter(q=>q[0]===cat&&q[1]===d&&fresh(q));}
  if(!pool.length)pool=all.filter(q=>q[0]===cat&&fresh(q));
  if(!pool.length){all.filter(q=>q[0]===cat).forEach(q=>delete S.used[q[2]]);pool=all.filter(q=>q[0]===cat);}
  const q=pick(pool);S.used[q[2]]=1;markSeen(q[2]);
  return {cat,d:q[1],text:q[2],right:q[3],opts:shuffle(q.slice(3)),removed:[]};
}

    S.correct++;S.streak++;S.bestStreak=Math.max(S.bestStreak,S.streak);
    let dmg=S.power+3*cnt("quill"), notes=[];
    if(S.q.cat===e.weak){dmg*=2+.5*cnt("lens");notes.push("weakness")}
    else if(S.q.cat===e.resist){dmg*=.5;notes.push("resisted")}
    if(S.blessings&&S.blessings.includes(S.q.cat)){dmg*=2;notes.push("blessed")}
    if(elapsed<=6+4*cnt("ember")){dmg*=1.5;notes.push("critical")}
    if(S.streak>=3){dmg+=3;notes.push(`streak ${S.streak}`)}
    dmg=Math.round(dmg);e.hp=Math.max(0,e.hp-dmg);
    if(has("ink"))S.hp=Math.min(S.maxHp,S.hp+Math.min(6,2*cnt("ink")));
    S.log.unshift(`<span class="good">Correct.</span> You strike for ${dmg}${notes.length?" ("+notes.join(", ")+")":""}.`);
    S.hitFoe=true;
  }else{
    S.streak=0;S.missed.push({q:S.q.text,a:S.q.right});
    const why=opt===null?"Time runs out.":"Wrong.";
    if(S.ward){S.ward=false;S.log.unshift(`<span class="bad">${why}</span> Your Ward Rune absorbs the blow. The answer was ${esc(S.q.right)}.`)}
    else if((e.coins||0)<Math.min(2,cnt("coin"))){e.coins=(e.coins||0)+1;S.log.unshift(`<span class="bad">${why}</span> The Lucky Coin spins and the blow misses. The answer was ${esc(S.q.right)}.`)}
    else{const dmg=hitFor(e);S.hp=Math.max(0,S.hp-dmg);S.killer=e.n;S.log.unshift(`<span class="bad">${why}</span> ${esc(e.n)} ${esc(e.hit)}. −${dmg} HP. The answer was ${esc(S.q.right)}.`);S.hitMe=true}
  }
  render();
}
function nextTurn(){
  const e=S.enemy;
  if(S.hp<=0){endRun(false);return}
  if(e.hp<=0){
    // Growing tougher: monsters hit harder each floor, so each win raises your max HP too.
    const gain=e.boss?8:e.elite?4:2;S.maxHp+=gain;S.hp=e.boss?S.maxHp:Math.min(S.maxHp,S.hp+gain);S.power++;
    S.log.unshift(`${esc(e.n)} falls. +1 power, +${gain} max HP${e.boss?", and you're fully healed":""}.`);
    if(e.boss&&S.floor===GOAL&&!S.won){S.won=true;S.floorEvent="Defeated The Super Computaur (boss) · won the Trivial Relic of Inconsequence";try{localStorage.setItem("conungeon-trophy",new Date().toISOString().slice(0,10))}catch(x){}endRun(true);return}
    S.floorEvent=`Defeated ${e.n.replace(/^Elite /,"")}${e.boss?" (boss)":e.elite?" (elite)":""}`;
    S.rewardOpts=offerRewards(3,false);S.rewardTitle="Spoils";S.rewardNote="Take one.";S.screen="reward";render();return;
  }
  S.phase="choose";
  let o=shuffle(available()).slice(0,3);
  if(!o.includes(e.weak)&&Math.random()<.4)o[0]=e.weak;
  S.offer=shuffle(o);render();
}
function offerRewards(n,relicOnly){
  const relics=shuffle(RELICS.filter(r=>cnt(r.id)<RELIC_MAX)).map(r=>({...r,kind:"relic",owned:cnt(r.id)}));
  const items=shuffle(ITEMS).map(i=>({...i,kind:"item"}));
  if(relicOnly)return relics.length?relics.slice(0,n):items.slice(0,n);
  const out=[];if(relics.length&&Math.random()<.6)out.push(relics[0]);
  return out.concat(items).slice(0,n);
}
function takeReward(i){
  const r=S.rewardOpts[i];
  if(r.kind==="relic"){if(cnt(r.id)>=RELIC_MAX)return;S.relics.push(r.id);if(r.id==="tome"){S.maxHp+=10;S.hp+=10}const k=cnt(r.id);S.log.unshift(k>1?`You claim another ${r.n}. Now ×${k}.`:`You claim the ${r.n}.`)}
  else{if(!addItem(r.id))return;S.log.unshift(`You pocket a ${r.n}.`)}
  S.floorEvent+=` · took ${r.n}`;
  advance();
}
// ---------- Run log: one line per floor cleared, plus saved history of past runs
function advance(){S.floorLog.push({f:S.floor,t:S.floorEvent||"Passed through"});S.floorEvent="";S.floor++;S.doors=makeDoors();S.screen="map";render()}
function useItem(i){
  const slot=packItems()[i];if(!slot)return;const id=slot.id;
  if(id==="potion"){if(S.hp>=S.maxHp)return;const h=Math.max(12,Math.round(S.maxHp*.3));S.hp=Math.min(S.maxHp,S.hp+h);S.log.unshift(`You drink a Healing Draught. +${h} HP.`)}
  else if(id==="ward"){if(S.ward)return;S.ward=true;S.log.unshift("A Ward Rune glows around you.")}
  else if(id==="halve"){if(S.screen!=="battle"||S.phase!=="ask")return;S.q.removed=S.q.opts.filter(o=>o!==S.q.right).slice(0,2);S.log.unshift("The scroll burns away two lies.")}
  else if(id==="glass"){if(S.screen!=="battle"||S.phase!=="ask")return;S.tMax+=15;S.tLeft+=15;startTimer();S.log.unshift("Sand flows backward. +15 seconds.")}
  slot.n--;if(slot.n<=0)S.items.splice(i,1);render();if(S.phase==="ask"&&S.screen==="battle")startTimer();
}
const RUNS_KEY="conungeon-runs";
function loadRuns(){try{return JSON.parse(localStorage.getItem(RUNS_KEY)||"[]")}catch(e){return []}}
function recordRun(win,left){
  const acc=S.asked?Math.round(S.correct/S.asked*100):0;
  const last=win?{f:S.floor,t:"Defeated The Super Computaur",end:true,good:true}:left?{f:S.floor,t:"Left the Conungeon",end:true}:{f:S.floor,t:`Fell to ${S.killer||"the dark"}`,end:true};
  const run={id:S.runId,date:new Date().toISOString().slice(0,10),floor:S.floor,won:!!S.won,cleared:S.floorLog.length,acc,streak:S.bestStreak,log:[...S.floorLog,last]};
  const runs=loadRuns().filter(r=>r.id!==run.id);runs.unshift(run);
  try{localStorage.setItem(RUNS_KEY,JSON.stringify(runs.slice(0,25)))}catch(e){}
}
function floorList(log){return `<ol class="floors">${log.map(x=>`<li class="${x.good?"good":x.end?"end":""}"><span class="num">${x.f}</span><span>${esc(x.t)}</span></li>`).join("")}</ol>`}
// ---------- Saving: campsites (base camp and every campfire) save your descent in this browser
const SAVE_KEY="conungeon-save";
let confirmNew=false;
function saveGame(label){
  if(!S)return;if(S.inside&&S.screen==="camp")return;
  const where=label||(S.screen==="rest"?`Campfire on floor ${S.floor}`:S.screen==="reward"?`Past the Super Computaur, floor ${S.floor}`:"Base camp");
  try{localStorage.setItem(SAVE_KEY,JSON.stringify({...S,q:null,lesson:null,enemy:null,offer:null,phase:null,managePack:false,picked:null,
    confirmDescend:false,screen:S.screen==="lesson"?"camp":S.screen,log:S.log.slice(0,6),savedAt:Date.now(),savedWhere:where}))}catch(e){}
}
function readSave(){try{const d=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");return d&&d.screen?d:null}catch(e){return null}}
function clearSave(){try{localStorage.removeItem(SAVE_KEY)}catch(e){}}
function abandonDescent(){const d=readSave();if(d&&d.inside){S=d;recordRun(false,true);if(S.floor>loadBest())saveBest(S.floor)}S=null;clearSave();newRun()}
function resumeGame(){const d=readSave();if(!d)return;stopTimer();S=d;S.best=loadBest();
  S.log.unshift(d.inside?`You wake by ${d.savedWhere.toLowerCase().startsWith("the ")?d.savedWhere.toLowerCase():"the "+d.savedWhere.toLowerCase()}. The Conungeon hasn't let you go.`:"You return to base camp. The travelers wave you back over.");render();window.scrollTo&&scrollTo({top:0})}
function endRun(win){
  stopTimer();S.screen=win?"win":"dead";recordRun(win);clearSave();
  const reached=S.floor;if(reached>S.best){S.best=reached;saveBest(reached)}render();
}

const ROOM={fight:["x","Monster","A foe for your wits"],elite:["X","Elite","Harder questions, better spoils"],rest:["~","Campfire","Rest, but skip this floor's spoils"],treasure:["$","Reliquary","Claim a relic"],boss:["&","Boss","Guardian of the floor"]};
function hud(){
  const P=packItems(),full=P.length>=MAX_ITEMS,manage=!!S.managePack;
  // In danger (low health, or the next hit could knock you out), items that can help glow.
  const e=S.screen==="battle"?S.enemy:null,lethal=!!(e&&e.hp>0&&!S.ward&&hitFor(e)>=S.hp),low=S.hp<=S.maxHp*.35,danger=!!e&&(lethal||low)&&!manage;
  const helps=id=>danger&&(id==="potion"?S.hp<S.maxHp:id==="ward"?lethal&&!S.ward:(id==="halve"||id==="glass")?S.phase==="ask":false);
  const slots=Array.from({length:MAX_ITEMS},(_,i)=>{const sl=P[i];if(!sl)return `<span class="slot empty">Empty</span>`;
    const it=ITEMS.find(x=>x.id===sl.id);
    return manage?`<button class="slot drop" data-a="drop" data-i="${i}" aria-label="Drop ${esc(it.n)}">${esc(it.n)}${sl.n>1?`<b>×${sl.n}</b>`:""}<span class="x">Drop</span></button>`
      :`<button class="slot${helps(sl.id)?" help":""}" data-a="item" data-i="${i}" title="${esc(it.d)}">${esc(it.n)}${sl.n>1?`<b>×${sl.n}</b>`:""}</button>`}).join("");
  const relics=RELICS.filter(r=>has(r.id)).map(r=>{const k=cnt(r.id);return `<span class="chip relic" title="${esc(r.d)}${k>1?` (×${k})`:""}">${esc(r.n)}${k>1?` <b>×${k}</b>`:""}</span>`}).join("");
  return `<div class="hud${S.hitMe?" shake":""}">
    <div><div class="hpline"><span class="label">Health${S.ward?" · warded":""}</span><span class="num">${S.hp} / ${S.maxHp}</span></div>
      <div class="bar"><i style="width:${S.hp/S.maxHp*100}%"></i></div>
      <div class="label" style="margin-top:6px">Power ${S.power} · Streak ${S.streak}</div></div>
    ${["camp","lesson","shop"].includes(S.screen)?`<div class="floor"><div class="label">Gold</div><b>${S.gold}</b></div>`:`<div class="floor"><div class="label">Floor</div><b>${S.floor}</b>${S.floor<=GOAL&&!S.won?`<span class="muted num"> /${GOAL}</span>`:""}</div>`}
    <div class="kit">
      <div class="kithead"><span class="label">Pack</span><span class="kitright"><span class="label ${full?"full":""}">${P.length} / ${MAX_ITEMS}${full?" · full":""}</span>${P.length?`<button class="linkbtn" data-a="manage">${manage?"Done":"Drop items"}</button>`:""}</span></div>
      ${danger?`<div class="danger">${lethal?"Danger! The next hit could knock you out.":"Danger! Your health is low."}${P.some(sl=>helps(sl.id))?" Glowing items can help.":""}</div>`:""}
      <div class="slots">${slots}</div>
      ${relics||S.blessings.length||S.won?`<div class="kithead"><span class="label">Relics · passive, stack to 10</span></div><div class="relics">${S.blessings.map(c=>`<span class="chip bless" title="×2 damage with ${esc(c)}">${esc(TITLES[c]||"Sage")}'s Blessing</span>`).join("")}${relics}${S.won?`<span class="chip relic" title="Grants bragging rights. Does nothing else. Congratulations.">Trivial Relic of Inconsequence</span>`:""}</div>`:""}
    </div>
  </div>`;
}

function shade(hex,k){const n=parseInt(hex.slice(1),16),f=v=>Math.max(0,Math.min(255,Math.round(v*k)));return "#"+[(n>>16)&255,(n>>8)&255,n&255].map(f).map(v=>v.toString(16).padStart(2,"0")).join("")}
function drawTent(cv,t){
  if(useArt(cv,cv.dataset.kind))return;
  const c=cv.getContext("2d"),kind=cv.dataset.kind,seed=+cv.dataset.seed||3,r=seeded(seed*31+7);
  const P=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(x|0,y|0,w|0,h|0)};
  const W=64,H=44,GY=35,cx=32,T=still?0:t;
  // night at the cave mouth: rock overhang, a few stars, dark ground
  P(0,0,W,H,"#120e1c");for(let i=0;i<10;i++)P(r()*W,r()*14,1,1,"#4a4266");
  for(let x=0;x<W;x++){const h=3+Math.round(Math.sin(x/6+seed)*2+r()*1.5);P(x,0,1,h,"#2a2238")}
  P(0,GY,W,H-GY,"#1d1826");for(let x=0;x<W;x+=3)P(x+(r()*2|0),GY,1,1,"#2c2440");
  const glow=(gx,gy,rad,col,a)=>{c.fillStyle=col;for(let y=Math.floor(gy-rad);y<=gy+rad;y++)for(let x=Math.floor(gx-rad);x<=gx+rad;x++){const d=Math.hypot(x-gx,y-gy);if(d>rad)continue;
    if(d<rad*.5){c.globalAlpha=a;c.fillRect(x,y,1,1)}else if((x+y)%2===0){c.globalAlpha=a*.6;c.fillRect(x,y,1,1)}}c.globalAlpha=1};
  const shop=kind==="shop", base=shop?"#b8473a":(cv.dataset.color||"#3f7f6a");
  const top=7,half=21;
  // tent body: lit left slope, shaded right slope, stripes for the merchant
  for(let y=top;y<GY;y++){const w=Math.round((y-top)/(GY-top)*half);
    for(let x=cx-w;x<cx+w;x++){let col=x<cx?base:shade(base,.72);if(shop&&((x-cx+40)>>2)%2)col=x<cx?"#e8dcc0":"#b9ad92";P(x,y,1,1,col)}
    P(cx-w-1,y,1,1,shade(base,.5));P(cx+w,y,1,1,shade(base,.45))}
  // open flap with warm light inside
  for(let y=top+9;y<GY;y++){const w=Math.round((y-top-9)/(GY-top-9)*7);P(cx-w,y,w*2,1,"#2a1709")}
  const f=still?0:Math.sin(T/140+seed)+Math.sin(T/53);
  glow(cx,GY-6,8+(f>0?1:0),"#ffb03b",.18);
  P(cx-2,top-4,1,5,"#5a3a24");P(cx-1,top-4,4,2,shop?"#ffd25a":shade(base,1.35)); // pole and pennant
  if(!shop){
    P(cx-1,GY-12,2,1,"#5a3a24");P(cx-1,GY-11,2,3,"#ffd25a");P(cx-1,GY-10,1,1,"#fff2b0"); // lantern
    P(cx-4,GY-3,8,2,"#e8dcc0");P(cx,GY-3,1,2,"#a39a7e");P(cx-4,GY-1,8,1,"#5a3a24"); // open book on a crate
  }else{
    // crate of potions and a stack of tomes out front
    P(cx-14,GY-4,11,4,"#5a3a24");P(cx-14,GY-4,11,1,"#78502f");
    [["#e0473b",cx-13],["#4b7bff",cx-10],["#3fc77a",cx-7]].forEach(([col,x],k)=>{P(x,GY-8,2,4,col);P(x,GY-9,2,1,"#9d93b8");if(!still&&((T/300+k)%4)<1)P(x,GY-8,1,1,"#ffffff")});
    [["#6b3f8c",0],["#2f6f8c",1],["#8c6b2f",2]].forEach(([col,k])=>{P(cx+4,GY-2-k*2,9-k,2,col);P(cx+4,GY-2-k*2,1,2,"#e8dcc0")});
    P(cx+5,GY-8,4,2,"#ffd25a"); // a coin pile
  }
  // small campfire beside teacher tents
  if(!shop){const fx=cx+half+4;P(fx-2,GY-1,5,1,"#5a3a24");P(fx-1,GY-3-(f>0?1:0),3,2,"#ff6a2b");P(fx,GY-4-(f>.8?1:0),1,1,"#ffd25a");glow(fx,GY-3,4,"#ff9a3a",.15)}
}

function titleView(){

      if(d.inside)return confirmNew?`${card}<div class="confirm"><strong>Leave the Conungeon?</strong><span class="muted">Going to base camp ends this descent. Your progress at the ${esc(d.savedWhere.toLowerCase().replace(/^the /,""))} will be lost, and this descent ends at floor ${d.floor}.</span><div class="row"><button class="btn" data-a="newno">Stay in the Conungeon</button><button class="btn ghost" data-a="leaveok">Leave and go to base camp</button></div></div>`
        :`${card}<div class="row"><button class="btn" data-a="continue">Resume at the campfire</button><button class="btn ghost" data-a="newgame">Go to base camp</button></div>`;

        :`${card}<div class="row"><button class="btn" data-a="continue">Return to base camp</button><button class="btn ghost" data-a="newgame">Start over</button></div>`})()}</section>`;
}

document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a,i=+b.dataset.i;
  if(a==="start")newRun();
  else if(a==="continue")resumeGame();
  else if(a==="newgame"){confirmNew=true;render()}
  else if(a==="newno"){confirmNew=false;render()}
  else if(a==="newok"){confirmNew=false;clearSave();newRun()}
  else if(a==="leaveok"){confirmNew=false;abandonDescent()}
  else if(a==="door")enterDoor(i);
  else if(a==="cat")chooseCat(b.dataset.c);
  else if(a==="ans")answer(S.q.opts[i]);
  else if(a==="next")nextTurn();
  else if(a==="reward")takeReward(i);
  else if(a==="advance")advance();
  else if(a==="rest"){{const h=Math.ceil(S.maxHp*.4);S.hp=Math.min(S.maxHp,S.hp+h);S.floorEvent="Rested at a campfire";S.log.unshift(`You rest by the fire and recover ${h} HP.`)}advance()}
  else if(a==="menu"){stopTimer();S=null;render();window.scrollTo&&scrollTo({top:0})}
  else if(a==="item")useItem(i);
  else if(a==="manage"){S.managePack=!S.managePack;render()}
  else if(a==="drop")dropItem(i);
  else if(a==="tent")openTent(i);
  else if(a==="lnext")lessonNext();
  else if(a==="camp"){S.screen="camp";S.phase=null;render()}
  else if(a==="shop"){S.screen="camp";render()}
  else if(a==="buy")buy(b.dataset.id);
  else if(a==="askdescend"){S.confirmDescend=true;render();const c=document.querySelector(".confirm");c&&c.scrollIntoView&&c.scrollIntoView({block:"center"})}
  else if(a==="notyet"){S.confirmDescend=false;render()}
  else if(a==="descend"){S.confirmDescend=false;descend()}
  else if(a==="onward"){S.screen="map";S.endless=true;S.rewardOpts=offerRewards(3,false);S.rewardTitle="The Computaur's spare parts";S.rewardNote="Take one, then keep descending.";S.screen="reward";saveGame();render()}
});
document.addEventListener("keydown",ev=>{
  if(S&&S.screen==="lesson"&&S.phase==="ask"){const n=+ev.key;if(n>=1&&n<=4)answer(S.q.opts[n-1]);return}
  if(!S||S.screen!=="battle")return;
  const n=+ev.key;
  if(S.phase==="ask"&&n>=1&&n<=4){const o=S.q.opts[n-1];if(!S.q.removed.includes(o))answer(o)}
  else if(S.phase==="choose"&&n>=1&&n<=3)chooseCat(S.offer[n-1]);
});
